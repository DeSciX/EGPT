<svg xmlns="http://www.w3.org/2000/svg" style="background:#232A32;color:#EDEEEA" viewBox="0 0 900 420" role="img" aria-label="Three architectures compared. A: observation to VLA to action, with all physics inside the network. B: observation to a world model — learned or hand-written, either way a compression of the past — to predicted futures to a planner to action. C: observation to scene-state inference to a generative process that accepts a candidate intervention and produces future observations the VLA judges before acting.">
        <defs>
          <marker id="a4n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,1 10,5 0,9" fill="currentColor"/></marker>
          <marker id="a4r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,1 10,5 0,9" fill="#84A6DB"/></marker>
          <marker id="a4p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,1 10,5 0,9" fill="#EBA84A"/></marker>
        </defs>

        <text x="40" y="34" font-family="'Courier Prime',monospace" font-size="11" letter-spacing="1.5" fill="currentColor" opacity="0.6">A · TODAY’S VLA — PHYSICS LIVES IN THE WEIGHTS</text>
        <g stroke="currentColor" stroke-width="1.2" fill="none" opacity="0.85">
          <rect x="40" y="48" width="140" height="42"/><rect x="210" y="48" width="140" height="42"/><rect x="380" y="48" width="140" height="42"/>
        </g>
        <g font-family="'Courier Prime',monospace" font-size="12" fill="currentColor" text-anchor="middle">
          <text x="110" y="74">Observation</text><text x="280" y="74">VLA</text><text x="450" y="74">Action</text>
        </g>
        <g stroke="currentColor" stroke-width="1.2" marker-end="url(#a4n)" fill="none" opacity="0.85">
          <line x1="180" y1="69" x2="203" y2="69"/><line x1="350" y1="69" x2="373" y2="69"/>
        </g>

        <text x="40" y="144" font-family="'Courier Prime',monospace" font-size="11" letter-spacing="1.5" fill="#84A6DB" opacity="0.9">B · PLUS A WORLD MODEL — A RECORD OF THE PAST, EVALUATED FORWARD</text>
        <g stroke="#84A6DB" stroke-width="1.2" fill="none">
          <rect x="40" y="158" width="140" height="42"/><rect x="210" y="158" width="140" height="42"/><rect x="380" y="158" width="140" height="42"/>
          <rect x="550" y="158" width="140" height="42"/><rect x="720" y="158" width="140" height="42"/>
        </g>
        <g font-family="'Courier Prime',monospace" font-size="12" fill="currentColor" text-anchor="middle">
          <text x="110" y="184">Observation</text>
          <text x="280" y="176">World model</text><text x="280" y="192">(a record of the past)</text>
          <text x="450" y="176">Predicted</text><text x="450" y="192">futures</text>
          <text x="620" y="184">Planner</text>
          <text x="790" y="184">Action</text>
        </g>
        <g stroke="#84A6DB" stroke-width="1.2" marker-end="url(#a4r)" fill="none">
          <line x1="180" y1="179" x2="203" y2="179"/><line x1="350" y1="179" x2="373" y2="179"/>
          <line x1="520" y1="179" x2="543" y2="179"/><line x1="690" y1="179" x2="713" y2="179"/>
        </g>

        <text x="40" y="254" font-family="'Courier Prime',monospace" font-size="11" letter-spacing="1.5" fill="#EBA84A">C · PLUS A GENERATOR — A PROCESS THAT MAKES THE FUTURE</text>
        <g stroke="#EBA84A" stroke-width="1.2" fill="none" stroke-dasharray="4 3">
          <rect x="380" y="286" width="140" height="38"/>
        </g>
        <text x="450" y="310" font-family="'Courier Prime',monospace" font-size="12" fill="#EBA84A" text-anchor="middle">candidate action</text>
        <line x1="450" y1="324" x2="450" y2="352" stroke="#EBA84A" stroke-width="1.2" marker-end="url(#a4p)"/>
        <g stroke="#EBA84A" stroke-width="1.2" fill="none">
          <rect x="40" y="358" width="140" height="42"/><rect x="210" y="358" width="140" height="42"/><rect x="380" y="358" width="140" height="42"/>
          <rect x="550" y="358" width="140" height="42"/><rect x="720" y="358" width="140" height="42"/>
        </g>
        <rect x="380" y="358" width="140" height="42" fill="#EBA84A" opacity="0.13"/>
        <g font-family="'Courier Prime',monospace" font-size="12" fill="currentColor" text-anchor="middle">
          <text x="110" y="384">Observation</text>
          <text x="280" y="376">Scene-state</text><text x="280" y="392">inference</text>
          <text x="450" y="376">Generative</text><text x="450" y="392">world</text>
          <text x="620" y="376">Future</text><text x="620" y="392">observations</text>
          <text x="790" y="376">VLA judges</text><text x="790" y="392">→ action</text>
        </g>
        <g stroke="#EBA84A" stroke-width="1.2" marker-end="url(#a4p)" fill="none">
          <line x1="180" y1="379" x2="203" y2="379"/><line x1="350" y1="379" x2="373" y2="379"/>
          <line x1="520" y1="379" x2="543" y2="379"/><line x1="690" y1="379" x2="713" y2="379"/>
        </g>
      </svg>
