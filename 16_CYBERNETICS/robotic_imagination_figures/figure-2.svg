<svg xmlns="http://www.w3.org/2000/svg" style="background:#232A32;color:#EDEEEA" viewBox="0 0 820 400" role="img" aria-label="Two vertical flow cartoons side by side. On the left, Knowledge: see, then remember, then answer. On the right, Imagination: see, then imagine, then watch what happens, then answer.">
        <defs>
          <marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <polygon points="0,1 10,5 0,9" fill="currentColor"/>
          </marker>
          <marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <polygon points="0,1 10,5 0,9" fill="#EBA84A"/>
          </marker>
        </defs>

        <g font-family="'Courier Prime',monospace" font-size="11" letter-spacing="1.6" fill="currentColor" opacity="0.6">
          <text x="60" y="30" text-anchor="middle">KNOWLEDGE</text>
          <text x="560" y="30" text-anchor="middle">IMAGINATION</text>
        </g>

        <g font-family="Newsreader, Georgia, serif" font-size="19" fill="currentColor" text-anchor="middle">
          <text x="160" y="96">See</text>
          <text x="160" y="196">Remember</text>
          <text x="160" y="296">Answer</text>
        </g>
        <g stroke="currentColor" stroke-width="1.5" marker-end="url(#ar2)" fill="none">
          <line x1="160" y1="116" x2="160" y2="168"/>
          <line x1="160" y1="216" x2="160" y2="268"/>
        </g>
        <text x="160" y="352" font-family="Newsreader, Georgia, serif" font-size="16" font-style="italic" fill="currentColor" text-anchor="middle" opacity="0.78">Knowledge reconstructs.</text>

        <line x1="410" y1="55" x2="410" y2="330" stroke="currentColor" stroke-width="1" opacity="0.22"/>

        <g font-family="Newsreader, Georgia, serif" font-size="19" fill="currentColor" text-anchor="middle">
          <text x="660" y="76">See</text>
          <text x="660" y="156">Imagine</text>
          <text x="660" y="236">Watch what happens</text>
          <text x="660" y="316">Answer</text>
        </g>
        <g stroke="#EBA84A" stroke-width="1.5" marker-end="url(#ar3)" fill="none">
          <line x1="660" y1="94" x2="660" y2="130"/>
          <line x1="660" y1="174" x2="660" y2="210"/>
          <line x1="660" y1="254" x2="660" y2="290"/>
        </g>
        <text x="660" y="366" font-family="Newsreader, Georgia, serif" font-size="16" font-style="italic" fill="#EBA84A" text-anchor="middle">Imagination generates.</text>
      </svg>
