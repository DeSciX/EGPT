te":"written 1955–56; published posthumously 1958"},"restored":"","themes":["brain-and-machine"],"years":[1955,1958],"embed_text":"John von Neumann | The Computer and the Brain | p. 80 | written 1955–56; published posthumously 1958 | We have seen how this leads to a lower level of arithmetical precision but to a higher level of logical reliability: a deterioration in arithmetics has been traded for an improvement in logics."},{"id":"q-john-von-neumann-the-computer-and-the-c4404ddf","quote":"Now, in talking about codes, the following distinction becomes immediately prominent. A code may be complete—i.e., to use the terminology of nerve pulses, one may have specified the sequence in which these impulses appear and the axons on which they appear. This will then, of course, define completely a specific behavior of the nervous system, or, in the above comparison, of the corresponding artificial automaton involved. In computing machines, such complete codes are sets of orders, given with all necessary specifications. If the machine is to solve a specific problem by calculation, it will have to be controlled by a complete code in this sense. The use of a modern computing machine is based on the user's ability to develop and formulate the necessary complete codes for any given problem that the machine is supposed to solve.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"The Computer and the Brain","locus":"section 'The Concept of a Complete Code,' pp. 70–71","date":"1958","url":"https://archive.org/details/the-computer-and-the-brain-by-john-von-neumann"},"restored":"","themes":["vncodes"],"years":[1958],"embed_text":"John von Neumann | The Computer and the Brain | section 'The Concept of a Complete Code,' pp. 70–71 | 1958 | Now, in talking about codes, the following distinction becomes immediately prominent. A code may be complete—i.e., to use the terminology of nerve pulses, one may have specified the sequence in which these impulses appear and the axons on which they appear. This will then, of course, define completely a specific behavior of the nervous system, or, in the above comparison, of the corresponding artificial automaton involved. In computing machines, such complete codes are sets of orders, given with all necessary specifications. If the machine is to solve a specific problem by calculation, it will have to be controlled by a complete code in this sense. The use of a modern computing machine is based on the user's ability to develop and formulate the necessary complete codes for any given problem that the machine is supposed to solve."},{"id":"q-john-von-neumann-the-computer-and-the-76daacb3","quote":"In contrast to the complete codes, there exists another category of codes best designated as short codes. These are based on the following idea. The English logician A. M. Turing showed in 1937 (and various computing machine experts have put this into practice since then in various particular ways) that it is possible to develop code instruction systems for a computing machine which cause it to behave as if it were another, specified, computing machine. Such systems of instructions which make one machine imitate the behavior of another are known as short codes. Let me go into a little more detail in the typical questions of the use and development of such short codes.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"The Computer and the Brain","locus":"section 'The Concept of a Short Code,' p. 72","date":"1958","url":"https://archive.org/details/the-computer-and-the-brain-by-john-von-neumann"},"restored":"","themes":["vncodes"],"years":[1958],"embed_text":"John von Neumann | The Computer and the Brain | section 'The Concept of a Short Code,' p. 72 | 1958 | In contrast to the complete codes, there exists another category of codes best designated as short codes. These are based on the following idea. The English logician A. M. Turing showed in 1937 (and various computing machine experts have put this into practice since then in various particular ways) that it is possible to develop code instruction systems for a computing machine which cause it to behave as if it were another, specified, computing machine. Such systems of instructions which make one machine imitate the behavior of another are known as short codes. Let me go into a little more detail in the typical questions of the use and development of such short codes."},{"id":"q-john-von-neumann-the-computer-and-the-96464e55","quote":"The reason for calling such a secondary code a short code is, by the way, historical: these short codes were developed as an aid to coding, i.e. they resulted from the desire to be able to code more briefly for a machine than its own natural order system would allow, treating it as if it were a different machine with a more convenient, fuller order system which would allow simpler, less circumstantial and more straightforward coding.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"The Computer and the Brain","locus":"section 'The Function of a Short Code,' p. 73","date":"1958","url":"https://archive.org/details/the-computer-and-the-brain-by-john-von-neumann"},"restored":"","themes":["vncodes"],"years":[1958],"embed_text":"John von Neumann | The Computer and the Brain | section 'The Function of a Short Code,' p. 73 | 1958 | The reason for calling such a secondary code a short code is, by the way, historical: these short codes were developed as an aid to coding, i.e. they resulted from the desire to be able to code more briefly for a machine than its own natural order system would allow, treating it as if it were a different machine with a more convenient, fuller order system which would allow simpler, less circumstantial and more straightforward coding."},{"id":"q-john-von-neumann-the-computer-and-the-41199d9f","quote":"the message-system used in the nervous system … is of an essentially statistical character. In other words, what matters are not the precise positions of definite markers, digits, but the statistical characteristics of their occurrence, i.e. frequencies of periodic or nearly periodic pulse-trains, etc. Thus the nervous system appears to be using a radically different system of notation from the ones we are familiar with in ordinary arithmetics and mathematics: instead of the precise systems of markers where the position—and presence or absence—of every marker counts decisively in determining the meaning of the message, we have here a system of notations in which the meaning is conveyed by the statistical properties of the message.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"The Computer and the Brain","locus":"section “Arithmetical Precision or Logical Reliability, Alternatives,” pp. 79–80; the preceding section is headed “Nature of the System of Notations Employed: Not Digital but Statistical,” p. 77","date":"written 1955–56; published posthumously 1958"},"restored":"","themes":["brain-and-machine"],"years":[1955,1958],"embed_text":"John von Neumann | The Computer and the Brain | section “Arithmetical Precision or Logical Reliability, Alternatives,” pp. 79–80; the preceding section is headed “Nature of the System of Notations Employed: Not Digital but Statistical,” p. 77 | written 1955–56; published posthumously 1958 | the message-system used in the nervous system … is of an essentially statistical character. In other words, what matters are not the precise positions of definite markers, digits, but the statistical characteristics of their occurrence, i.e. frequencies of periodic or nearly periodic pulse-trains, etc. Thus the nervous system appears to be using a radically different system of notation from the ones we are familiar with in ordinary arithmetics and mathematics: instead of the precise systems of markers where the position—and presence or absence—of every marker counts decisively in determining the meaning of the message, we have here a system of notations in which the meaning is conveyed by the statistical properties of the message."},{"id":"q-john-von-neumann-the-computer-and-the-1c4e401e","quote":"First of all, let me introduce a term which is needed in the present context. A system of logical instructions that an automaton can carry out and which causes the automaton to perform some organized task is called a code. By logical orders, I mean things like nerve pulses appearing on the appropriate axons, in fact anything that induces a digital logical system, like the nervous system, to function in a reproducible, purposive manner.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"The Computer and the Brain (Yale University Press, 1958)","locus":"pp. 69–70 (chapter 'Control of the Functioning of a Machine')","date":"1958","url":"https://archive.org/details/the-computer-and-the-brain-by-john-von-neumann"},"restored":"","themes":["vncodes"],"years":[1958],"embed_text":"John von Neumann | The Computer and the Brain (Yale University Press, 1958) | pp. 69–70 (chapter 'Control of the Functioning of a Machine') | 1958 | First of all, let me introduce a term which is needed in the present context. A system of logical instructions that an automaton can carry out and which causes the automaton to perform some organized task is called a code. By logical orders, I mean things like nerve pulses appearing on the appropriate axons, in fact anything that induces a digital logical system, like the nervous system, to function in a reproducible, purposive manner."},{"id":"q-john-von-neumann-the-computer-and-the-c5e04d42","quote":"(A machine that performs an arithmetical operation every 20 microseconds, and works on a single problem 48 hours, represents a rather extreme case. Yet even here only N ~ 10^10!) However, another circumstance supervenes. The operations performed in the course of the calculation may amplify errors that were introduced by earlier operations. This can cover any numerical gulf very quickly. The ratio used above, 1:10^3 to 1:10^12, is 10^9, yet 425 successive operations each of which increases an error by 5 per cent only, will account for it!","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"The Computer and the Brain, 2nd ed., foreword by Ray Kurzweil (New Haven: Yale University Press, 2012; the Silliman Lectures text of 1958), Part 1, \"Reasons for the High (Digital) Precision Requirements\"","locus":"p.28","date":"1955-1956 (written); 1958 (published)"},"restored":"","themes":["cybernetics"],"years":[1955,1956,1958],"embed_text":"John von Neumann | The Computer and the Brain, 2nd ed., foreword by Ray Kurzweil (New Haven: Yale University Press, 2012; the Silliman Lectures text of 1958), Part 1, \"Reasons for the High (Digital) Precision Requirements\" | p.28 | 1955-1956 (written); 1958 (published) | (A machine that performs an arithmetical operation every 20 microseconds, and works on a single problem 48 hours, represents a rather extreme case. Yet even here only N ~ 10^10!) However, another circumstance supervenes. The operations performed in the course of the calculation may amplify errors that were introduced by earlier operations. This can cover any numerical gulf very quickly. The ratio used above, 1:10^3 to 1:10^12, is 10^9, yet 425 successive operations each of which increases an error by 5 per cent only, will account for it!"},{"id":"q-john-von-neumann-the-computer-and-the-34dc857a","quote":"It is only proper to realize that language is largely a historical accident… Just as languages like Greek or Sanskrit are historical facts and not absolute logical necessities, it is only reasonable to assume that logics and mathematics are similarly historical, accidental forms of expression. They may have essential variants, i.e. they may exist in other forms than the ones to which we are accustomed. Indeed, the nature of the central nervous system and of the message systems that it transmits indicate positively that this is so. We have now accumulated sufficient evidence to see that whatever language the central nervous system is using, it is characterized by less logical and arithmetical depth than what we are normally used to. The following is an obvious example of this: the retina of the human eye performs a considerable reorganization of the visual image as perceived by the eye. Now this reorganization is effected on the retina, or to be more precise, at the point of entry of the optic nerve by means of three successive synapses only, i.e. in terms of three consecutive logical steps… Consequently, there exist here different logical structures from the ones we are ordinarily used to in logics and mathematics… Thus logics and mathematics in the central nervous system, when viewed as languages, must structurally be essentially different from those languages to which our common experience refers.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"The Computer and the Brain, closing section “The Language of the Brain Not the Language of Mathematics”","locus":"pp. 81–83","date":"written 1955–56; published posthumously 1958"},"restored":"","themes":["brain-and-machine"],"years":[1955,1958],"embed_text":"John von Neumann | The Computer and the Brain, closing section “The Language of the Brain Not the Language of Mathematics” | pp. 81–83 | written 1955–56; published posthumously 1958 | It is only proper to realize that language is largely a historical accident… Just as languages like Greek or Sanskrit are historical facts and not absolute logical necessities, it is only reasonable to assume that logics and mathematics are similarly historical, accidental forms of expression. They may have essential variants, i.e. they may exist in other forms than the ones to which we are accustomed. Indeed, the nature of the central nervous system and of the message systems that it transmits indicate positively that this is so. We have now accumulated sufficient evidence to see that whatever language the central nervous system is using, it is characterized by less logical and arithmetical depth than what we are normally used to. The following is an obvious example of this: the retina of the human eye performs a considerable reorganization of the visual image as perceived by the eye. Now this reorganization is effected on the retina, or to be more precise, at the point of entry of the optic nerve by means of three successive synapses only, i.e. in terms of three consecutive logical steps… Consequently, there exist here different logical structures from the ones we are ordinarily used to in logics and mathematics… Thus logics and mathematics in the central nervous system, when viewed as languages, must structurally be essentially different from those languages to which our common experience refers."},{"id":"q-john-von-neumann-the-computer-and-the-9cc7e4de","quote":"It also ought to be noted that the language here involved may well correspond to a short code in the sense described earlier, rather than to a complete code: when we talk mathematics, we may be discussing a secondary language, built on the primary language truly used by the central nervous system… However, the above remarks about reliability and logical and arithmetical depth prove that whatever the system is, it cannot fail to differ considerably from what we consciously and explicitly consider as mathematics.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"The Computer and the Brain, closing section “The Language of the Brain Not the Language of Mathematics”","locus":"pp. 81–83 (the book ends here)","date":"written 1955–56; published posthumously 1958"},"restored":"Thus the outward forms of our mathematics are not absolutely relevant from the point of view of evaluating what the mathematical or logical language truly used by the central nervous system is.","themes":["brain-and-machine"],"years":[1955,1958],"embed_text":"John von Neumann | The Computer and the Brain, closing section “The Language of the Brain Not the Language of Mathematics” | pp. 81–83 (the book ends here) | written 1955–56; published posthumously 1958 | It also ought to be noted that the language here involved may well correspond to a short code in the sense described earlier, rather than to a complete code: when we talk mathematics, we may be discussing a secondary language, built on the primary language truly used by the central nervous system… However, the above remarks about reliability and logical and arithmetical depth prove that whatever the system is, it cannot fail to differ considerably from what we consciously and explicitly consider as mathematics. | Thus the outward forms of our mathematics are not absolutely relevant from the point of view of evaluating what the mathematical or logical language truly used by the central nervous system is."},{"id":"q-john-von-neumann-the-computer-and-the-e2265bec","quote":"such memories, most characteristically designated as ‘memories made up from basic active organs,’ are, in every sense that matters, extremely expensive","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"The Computer and the Brain, “The Underlying Componentry of the Memory Need Not Be the Same as That of the Basic Active Organs”","locus":"p. 67","date":"written 1955–56; published posthumously 1958"},"restored":"","themes":["brain-and-machine"],"years":[1955,1958],"embed_text":"John von Neumann | The Computer and the Brain, “The Underlying Componentry of the Memory Need Not Be the Same as That of the Basic Active Organs” | p. 67 | written 1955–56; published posthumously 1958 | such memories, most characteristically designated as ‘memories made up from basic active organs,’ are, in every sense that matters, extremely expensive"},{"id":"q-john-von-neumann-letter-to-r-d-richtm-402bbc7d","quote":"I have been thinking a good deal about the possibility of using statistical methods to solve neutron diffusion and multiplication problems, in accordance with the principle suggested by Stan Ulam. The more I think about this, the more I become convinced that the idea has great merit.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"letter to R. D. Richtmyer, reprinted in Analogies Between Analogies: The Mathematical Reports of S. M. Ulam and His Los Alamos Collaborators","locus":"p. 18","date":"11 March 1947"},"restored":"","themes":["monte-carlo-and-automata"],"years":[1947],"embed_text":"John von Neumann | letter to R. D. Richtmyer, reprinted in Analogies Between Analogies: The Mathematical Reports of S. M. Ulam and His Los Alamos Collaborators | p. 18 | 11 March 1947 | I have been thinking a good deal about the possibility of using statistical methods to solve neutron diffusion and multiplication problems, in accordance with the principle suggested by Stan Ulam. The more I think about this, the more I become convinced that the idea has great merit."},{"id":"q-john-von-neumann-quoted-in-ulam-john--f94a5e68","quote":"The interests of humanity may change, the present curiosities in science may cease, and entirely different things may occupy the human mind in the future.","speaker":{"name":"John von Neumann","role":"reported","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"quoted in Ulam, “John von Neumann, 1903–1957,” Bulletin of the American Mathematical Society 64:3, Part 2","locus":"p. 5","date":"May 1958"},"restored":"","themes":["singularity"],"years":[1958],"embed_text":"John von Neumann | quoted in Ulam, “John von Neumann, 1903–1957,” Bulletin of the American Mathematical Society 64:3, Part 2 | p. 5 | May 1958 | The interests of humanity may change, the present curiosities in science may cease, and entirely different things may occupy the human mind in the future."},{"id":"q-john-von-neumann-the-mathematician-in-abbcfcd5","quote":"I doubt that any mathematician now living has much of a relationship to more than a quarter.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"“The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind","locus":"pp. 180–196 (no page apparatus in the source transcription)","date":"1947"},"restored":"","themes":["brain-and-machine"],"years":[1947],"embed_text":"John von Neumann | “The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind | pp. 180–196 (no page apparatus in the source transcription) | 1947 | I doubt that any mathematician now living has much of a relationship to more than a quarter."},{"id":"q-john-von-neumann-the-mathematician-in-b7e03f05","quote":"A system of mathematics which was free of these undesirable traits, “intuitionism,” was developed by Brouwer. In this system the difficulties and contradiction of set theory did not arise. However, a good fifty per cent of modern mathematics, in its most vital - and up to then unquestioned - parts, especially in analysis, were also affected by this “purge”: they either became invalid or had to be justified by very complicated subsidiary considerations. And in this latter process one usually lost appreciably in generality of validity and elegance of deduction.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"“The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind, Vol. I no. 1 (University of Chicago Press, 1947), pp. 180–196","locus":"MacTutor Part 2","date":"1947","file":"02_VON_NEUMANN/The_Mathematician_JvM.md","url":"https://mathshistory.st-andrews.ac.uk/Extras/Von_Neumann_Part_2/"},"restored":"","themes":["intuitionism"],"years":[1947],"embed_text":"John von Neumann | “The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind, Vol. I no. 1 (University of Chicago Press, 1947), pp. 180–196 | MacTutor Part 2 | 1947 | A system of mathematics which was free of these undesirable traits, “intuitionism,” was developed by Brouwer. In this system the difficulties and contradiction of set theory did not arise. However, a good fifty per cent of modern mathematics, in its most vital - and up to then unquestioned - parts, especially in analysis, were also affected by this “purge”: they either became invalid or had to be justified by very complicated subsidiary considerations. And in this latter process one usually lost appreciably in generality of validity and elegance of deduction."},{"id":"q-john-von-neumann-the-mathematician-in-3cfbdf16","quote":"The main hope of a justification of classical mathematics - in the sense of Hilbert or of Brouwer and Weyl - being gone, most mathematicians decided to use that system anyway. After all, classical mathematics was producing results which were both elegant and useful, and, even though one could never again be absolutely certain of its reliability, it stood on at least as sound a foundation as, for example, the existence of the electron. Hence, if one was willing to accept the sciences, one might as well accept the classical system of mathematics.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"“The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind, Vol. I no. 1 (University of Chicago Press, 1947), pp. 180–196","locus":"MacTutor Part 2","date":"1947","file":"02_VON_NEUMANN/The_Mathematician_JvM.md","url":"https://mathshistory.st-andrews.ac.uk/Extras/Von_Neumann_Part_2/"},"restored":"","themes":["intuitionism"],"years":[1947],"embed_text":"John von Neumann | “The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind, Vol. I no. 1 (University of Chicago Press, 1947), pp. 180–196 | MacTutor Part 2 | 1947 | The main hope of a justification of classical mathematics - in the sense of Hilbert or of Brouwer and Weyl - being gone, most mathematicians decided to use that system anyway. After all, classical mathematics was producing results which were both elegant and useful, and, even though one could never again be absolutely certain of its reliability, it stood on at least as sound a foundation as, for example, the existence of the electron. Hence, if one was willing to accept the sciences, one might as well accept the classical system of mathematics."},{"id":"q-john-von-neumann-the-mathematician-in-9aedde2b","quote":"My personal opinion, which is shared by many others, is, that Gödel has shown that Hilbert’s program is essentially hopeless.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"“The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind, Vol. I no. 1 (University of Chicago Press, 1947), pp. 180–196","locus":"MacTutor Part 2","date":"1947","file":"02_VON_NEUMANN/The_Mathematician_JvM.md","url":"https://mathshistory.st-andrews.ac.uk/Extras/Von_Neumann_Part_2/"},"restored":"","themes":["intuitionism"],"years":[1947],"embed_text":"John von Neumann | “The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind, Vol. I no. 1 (University of Chicago Press, 1947), pp. 180–196 | MacTutor Part 2 | 1947 | My personal opinion, which is shared by many others, is, that Gödel has shown that Hilbert’s program is essentially hopeless."},{"id":"q-john-von-neumann-the-mathematician-in-f7bc9b22","quote":"I have told the story of this controversy in such, detail, because I think that it constitutes the best caution against taking the immovable rigour of mathematics too much for granted. This happened in our own lifetime, and I know myself how humiliatingly easily my own views regarding the absolute mathematical truth changed during this episode, and how they changed three times in succession!","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"“The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind, Vol. I no. 1 (University of Chicago Press, 1947), pp. 180–196","locus":"MacTutor Part 2","date":"1947","file":"02_VON_NEUMANN/The_Mathematician_JvM.md","url":"https://mathshistory.st-andrews.ac.uk/Extras/Von_Neumann_Part_2/"},"restored":"","themes":["intuitionism"],"years":[1947],"embed_text":"John von Neumann | “The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind, Vol. I no. 1 (University of Chicago Press, 1947), pp. 180–196 | MacTutor Part 2 | 1947 | I have told the story of this controversy in such, detail, because I think that it constitutes the best caution against taking the immovable rigour of mathematics too much for granted. This happened in our own lifetime, and I know myself how humiliatingly easily my own views regarding the absolute mathematical truth changed during this episode, and how they changed three times in succession!"},{"id":"q-john-von-neumann-the-mathematician-in-bea12fa8","quote":"As a mathematical discipline travels far from its empirical source, or still more, if it is a second and third generation only indirectly inspired by ideas coming from “reality” it is beset with very grave dangers. It becomes more and more purely aestheticizing, more and more purely l’art pour l’art. This need not be bad, if the field is surrounded by correlated subjects, which still have closer empirical connections, or if the discipline is under the influence of men with an exceptionally well-developed taste. But there is a grave danger that the subject will develop along the line of least resistance, that the stream, so far from its source, will separate into a multitude of insignificant branches, and that the discipline will become a disorganized mass of details and complexities.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"“The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind, Vol. I no. 1 (University of Chicago Press, 1947), pp. 180–196","locus":"MacTutor Part 2","date":"1947","file":"02_VON_NEUMANN/The_Mathematician_JvM.md","url":"https://mathshistory.st-andrews.ac.uk/Extras/Von_Neumann_Part_2/"},"restored":"","themes":["abstraction"],"years":[1947],"embed_text":"John von Neumann | “The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind, Vol. I no. 1 (University of Chicago Press, 1947), pp. 180–196 | MacTutor Part 2 | 1947 | As a mathematical discipline travels far from its empirical source, or still more, if it is a second and third generation only indirectly inspired by ideas coming from “reality” it is beset with very grave dangers. It becomes more and more purely aestheticizing, more and more purely l’art pour l’art. This need not be bad, if the field is surrounded by correlated subjects, which still have closer empirical connections, or if the discipline is under the influence of men with an exceptionally well-developed taste. But there is a grave danger that the subject will develop along the line of least resistance, that the stream, so far from its source, will separate into a multitude of insignificant branches, and that the discipline will become a disorganized mass of details and complexities."},{"id":"q-john-von-neumann-the-mathematician-in-adac7864","quote":"In other words, at a great distance from its empirical source, or after much “abstract” inbreeding, a mathematical subject is in danger of degeneration. At the inception the style is usually classical; when it shows signs of becoming baroque, then the danger signal is up.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"“The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind, Vol. I no. 1 (University of Chicago Press, 1947), pp. 180–196","locus":"MacTutor Part 2","date":"1947","file":"02_VON_NEUMANN/The_Mathematician_JvM.md","url":"https://mathshistory.st-andrews.ac.uk/Extras/Von_Neumann_Part_2/"},"restored":"","themes":["abstraction"],"years":[1947],"embed_text":"John von Neumann | “The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind, Vol. I no. 1 (University of Chicago Press, 1947), pp. 180–196 | MacTutor Part 2 | 1947 | In other words, at a great distance from its empirical source, or after much “abstract” inbreeding, a mathematical subject is in danger of degeneration. At the inception the style is usually classical; when it shows signs of becoming baroque, then the danger signal is up."},{"id":"q-john-von-neumann-the-mathematician-in-70e7f946","quote":"In any event, whenever this stage is reached, the only remedy seems to me to be the rejuvenating return to the source: the re-injection of more or less directly empirical ideas. I am convinced that this was a necessary condition to conserve the freshness and the vitality of the subject and that this will remain equally true in the future","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"“The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind, Vol. I no. 1 (University of Chicago Press, 1947), pp. 180–196","locus":"MacTutor Part 2","date":"1947","file":"02_VON_NEUMANN/The_Mathematician_JvM.md","url":"https://mathshistory.st-andrews.ac.uk/Extras/Von_Neumann_Part_2/"},"restored":"","themes":["abstraction"],"years":[1947],"embed_text":"John von Neumann | “The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind, Vol. I no. 1 (University of Chicago Press, 1947), pp. 180–196 | MacTutor Part 2 | 1947 | In any event, whenever this stage is reached, the only remedy seems to me to be the rejuvenating return to the source: the re-injection of more or less directly empirical ideas. I am convinced that this was a necessary condition to conserve the freshness and the vitality of the subject and that this will remain equally true in the future"},{"id":"q-john-von-neumann-the-mathematician-in-7f92b655","quote":"Thus we are now comparing mathematics with the empirical science that lies closest to it and with which it has, as I hope I have shown, much in common - with theoretical physics. The differences in the actual modus procedendi are nevertheless great and basic. The aims of theoretical physics are in the main given from the “outside,” in most cases by the needs of experimental physics.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"“The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind, Vol. I no. 1 (University of Chicago Press, 1947), pp. 180–196","locus":"MacTutor Part 2","date":"1947","file":"02_VON_NEUMANN/The_Mathematician_JvM.md","url":"https://mathshistory.st-andrews.ac.uk/Extras/Von_Neumann_Part_2/"},"restored":"","themes":["physics"],"years":[1947],"embed_text":"John von Neumann | “The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind, Vol. I no. 1 (University of Chicago Press, 1947), pp. 180–196 | MacTutor Part 2 | 1947 | Thus we are now comparing mathematics with the empirical science that lies closest to it and with which it has, as I hope I have shown, much in common - with theoretical physics. The differences in the actual modus procedendi are nevertheless great and basic. The aims of theoretical physics are in the main given from the “outside,” in most cases by the needs of experimental physics."},{"id":"q-john-von-neumann-the-mathematician-in-37cbc636","quote":"A good theoretical physicist may today still have a working knowledge of more than half of his subject. I doubt that any mathematician now living has much of a relationship to more than a quarter.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"“The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind, Vol. I no. 1 (University of Chicago Press, 1947), pp. 180–196","locus":"MacTutor Part 2","date":"1947","file":"02_VON_NEUMANN/The_Mathematician_JvM.md","url":"https://mathshistory.st-andrews.ac.uk/Extras/Von_Neumann_Part_2/"},"restored":"","themes":["physics"],"years":[1947],"embed_text":"John von Neumann | “The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind, Vol. I no. 1 (University of Chicago Press, 1947), pp. 180–196 | MacTutor Part 2 | 1947 | A good theoretical physicist may today still have a working knowledge of more than half of his subject. I doubt that any mathematician now living has much of a relationship to more than a quarter."},{"id":"q-john-von-neumann-the-mathematician-in-fa0480fc","quote":"Furthermore, the attitude that theoretical physics does not explain phenomena, but only classifies and correlates, is today accepted by most theoretical physicists. This means that the criterion of success for such a theory is simply whether it can, by a simple and elegant classifying and correlating scheme, cover very many phenomena, which without this scheme would seem complicated and heterogeneous, and whether the scheme even covers phenomena which were not considered or even not known at the time when the scheme was evolved.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"“The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind, Vol. I no. 1 (University of Chicago Press, 1947), pp. 180–196","locus":"MacTutor Part 2","date":"1947","file":"02_VON_NEUMANN/The_Mathematician_JvM.md","url":"https://mathshistory.st-andrews.ac.uk/Extras/Von_Neumann_Part_2/"},"restored":"","themes":["physics"],"years":[1947],"embed_text":"John von Neumann | “The Mathematician,” in R. B. Heywood (ed.), The Works of the Mind, Vol. I no. 1 (University of Chicago Press, 1947), pp. 180–196 | MacTutor Part 2 | 1947 | Furthermore, the attitude that theoretical physics does not explain phenomena, but only classifies and correlates, is today accepted by most theoretical physicists. This means that the criterion of success for such a theory is simply whether it can, by a simple and elegant classifying and correlating scheme, cover very many phenomena, which without this scheme would seem complicated and heterogeneous, and whether the scheme even covers phenomena which were not considered or even not known at the time when the scheme was evolved."},{"id":"q-klara-von-neumann-preface-to-the-compu-2367e4a6","quote":"By January 1956 Johnny was confined to a wheelchair, but still he attended meetings, was wheeled into his office, and continued working on the manuscript for the lecture… In spite of many efforts, Johnny could not finish writing his planned lectures in time; as a matter of tragic fate he could never finish writing them at all.","speaker":{"name":"Klara von Neumann","role":"author","sort":"von neumann, klara","as_given":"Klara von Neumann"},"source":{"work":"preface to The Computer and the Brain (Yale)","locus":"pp. xlix–li","date":"dated September 1957"},"restored":"Clearly his strength was waning from day to day; all trips and speaking engagements had to be canceled one by one, with this single exception—the Silliman Lectures.","themes":["brain-and-machine"],"years":[1957],"embed_text":"Klara von Neumann | preface to The Computer and the Brain (Yale) | pp. xlix–li | dated September 1957 | By January 1956 Johnny was confined to a wheelchair, but still he attended meetings, was wheeled into his office, and continued working on the manuscript for the lecture… In spite of many efforts, Johnny could not finish writing his planned lectures in time; as a matter of tragic fate he could never finish writing them at all. | Clearly his strength was waning from day to day; all trips and speaking engagements had to be canceled one by one, with this single exception—the Silliman Lectures."},{"id":"q-klara-von-neumann-preface-to-the-compu-b374e6b5","quote":"The unfinished manuscript of the Silliman Lectures went with him to the hospital, where he made a few more attempts to work on it; but by then the illness had definitely gained the upper hand, and even Johnny’s exceptional mind could not overcome the weariness of the body.","speaker":{"name":"Klara von Neumann","role":"author","sort":"von neumann, klara","as_given":"Klara von Neumann"},"source":{"work":"preface to The Computer and the Brain (Yale)","locus":"pp. xlix–li","date":"dated September 1957"},"restored":"","themes":["brain-and-machine"],"years":[1957],"embed_text":"Klara von Neumann | preface to The Computer and the Brain (Yale) | pp. xlix–li | dated September 1957 | The unfinished manuscript of the Silliman Lectures went with him to the hospital, where he made a few more attempts to work on it; but by then the illness had definitely gained the upper hand, and even Johnny’s exceptional mind could not overcome the weariness of the body."},{"id":"q-w-a-beyer-m-l-stei-the-notion-of-comple-f73e3f46","quote":"The notion of complexity, in our view, is separate from, though associated with the idea of the amount of information or entropy of a system.","speaker":{"name":"W. A. Beyer, M. L. Stein and Stanislaw Ulam","role":"author","sort":"w. a. beyer, m. l. stein and stanislaw ulam","as_given":"W. A. Beyer, M. L. Stein and Stanislaw Ulam"},"source":{"work":"“The Notion of Complexity,” Los Alamos report LA-4822; in Analogies Between Analogies","locus":"p. 446","date":"December 1971"},"restored":"","themes":["monte-carlo-and-automata"],"years":[1971],"embed_text":"W. A. Beyer, M. L. Stein and Stanislaw Ulam | “The Notion of Complexity,” Los Alamos report LA-4822; in Analogies Between Analogies | p. 446 | December 1971 | The notion of complexity, in our view, is separate from, though associated with the idea of the amount of information or entropy of a system."},{"id":"q-warren-s-mcculloch-a-logical-calculus-o-2d7193ad","quote":"...the theory contributes a tool for rigorous symbolic treatment of known nets and an easy method of constructing hypothetical nets of required properties.","speaker":{"name":"Warren S. McCulloch and Walter H. Pitts","role":"author","sort":"warren s. mcculloch and walter h. pitts","as_given":"Warren S. McCulloch and Walter H. Pitts"},"source":{"work":"A Logical Calculus of the Ideas Immanent in Nervous Activity","locus":"p. 133 (final sentence of the paper, before References)","date":"1943","url":"https://jontalle.web.engr.illinois.edu/uploads/410-NS.F22/McCulloch-Pitts-1943-neural-networks-ocr.pdf"},"restored":"","themes":["machines"],"years":[1943],"embed_text":"Warren S. McCulloch and Walter H. Pitts | A Logical Calculus of the Ideas Immanent in Nervous Activity | p. 133 (final sentence of the paper, before References) | 1943 | ...the theory contributes a tool for rigorous symbolic treatment of known nets and an easy method of constructing hypothetical nets of required properties."},{"id":"q-warren-s-mcculloch-a-logical-calculus-o-5917c16c","quote":"Because of the \"all-or-none\" character of nervous activity, neural events and the relations among them can be treated by means of propositional logic. It is found that the behavior of every net can be described in these terms, with the addition of more complicated logical means for nets containing circles; and that for any logical expression satisfying certain conditions, one can find a net behaving in the fashion it describes. It is shown that many particular choices among possible neurophysiological assumptions are equivalent, in the sense that for every net behaving under one assumption, there exists another net which behaves under the other and gives the same results, although perhaps not in the same time. Various applications of the calculus are discussed.","speaker":{"name":"Warren S. McCulloch and Walter H. Pitts","role":"author","sort":"warren s. mcculloch and walter h. pitts","as_given":"Warren S. McCulloch and Walter H. Pitts"},"source":{"work":"A Logical Calculus of the Ideas Immanent in Nervous Activity, Bulletin of Mathematical Biophysics 5 (1943), pp. 115–133","locus":"p. 115 (abstract)","date":"1943","url":"https://www.cse.chalmers.se/~coquand/AUTOMATA/mcp.pdf"},"restored":"","themes":["machines"],"years":[1943],"embed_text":"Warren S. McCulloch and Walter H. Pitts | A Logical Calculus of the Ideas Immanent in Nervous Activity, Bulletin of Mathematical Biophysics 5 (1943), pp. 115–133 | p. 115 (abstract) | 1943 | Because of the \"all-or-none\" character of nervous activity, neural events and the relations among them can be treated by means of propositional logic. It is found that the behavior of every net can be described in these terms, with the addition of more complicated logical means for nets containing circles; and that for any logical expression satisfying certain conditions, one can find a net behaving in the fashion it describes. It is shown that many particular choices among possible neurophysiological assumptions are equivalent, in the sense that for every net behaving under one assumption, there exists another net which behaves under the other and gives the same results, although perhaps not in the same time. Various applications of the calculus are discussed."},{"id":"q-warren-s-mcculloch-a-logical-calculus-o-88d64ad4","quote":"Thus both the formal and the final aspects of that activity which we are wont to call mental are rigorously deducible from present neurophysiology. The psychiatrist may take comfort from the obvious conclusion concerning causality—that, for prognosis, history is never necessary. He can take little from the equally valid conclusion that his observables are explicable only in terms of nervous activities which, until recently, have been beyond his ken. The crux of this ignorance is that inference from any sample of overt behavior to nervous nets is not unique, whereas, of imaginable nets, only one in fact exists, and may, at any moment, exhibit some unpredictable activity. Certainly for the psychiatrist it is more to the point that in such systems \"Mind\" no longer \"goes more ghostly than a ghost.\" Instead, diseased mentality can be understood without loss of scope or rigor, in the scientific terms of neurophysiology.","speaker":{"name":"Warren S. McCulloch and Walter H. Pitts","role":"author","sort":"warren s. mcculloch and walter h. pitts","as_given":"Warren S. McCulloch and Walter H. Pitts"},"source":{"work":"A Logical Calculus of the Ideas Immanent in Nervous Activity, Bulletin of Mathematical Biophysics 5 (1943), pp. 115–133","locus":"p. 132","date":"1943","url":"https://jontalle.web.engr.illinois.edu/uploads/410-NS.F22/McCulloch-Pitts-1943-neural-networks-ocr.pdf"},"restored":"","themes":["machines"],"years":[1943],"embed_text":"Warren S. McCulloch and Walter H. Pitts | A Logical Calculus of the Ideas Immanent in Nervous Activity, Bulletin of Mathematical Biophysics 5 (1943), pp. 115–133 | p. 132 | 1943 | Thus both the formal and the final aspects of that activity which we are wont to call mental are rigorously deducible from present neurophysiology. The psychiatrist may take comfort from the obvious conclusion concerning causality—that, for prognosis, history is never necessary. He can take little from the equally valid conclusion that his observables are explicable only in terms of nervous activities which, until recently, have been beyond his ken. The crux of this ignorance is that inference from any sample of overt behavior to nervous nets is not unique, whereas, of imaginable nets, only one in fact exists, and may, at any moment, exhibit some unpredictable activity. Certainly for the psychiatrist it is more to the point that in such systems \"Mind\" no longer \"goes more ghostly than a ghost.\" Instead, diseased mentality can be understood without loss of scope or rigor, in the scientific terms of neurophysiology."},{"id":"q-robert-w-warren-united-states-v-the--c31416e0","quote":"A mistake in ruling against the United States could pave the way for thermonuclear annihilation for us all. In that event, our right to life is extinguished and the right to publish becomes moot.","speaker":{"name":"Robert W. Warren","role":"author","sort":"warren, robert w.","as_given":"Robert W. Warren"},"source":{"work":"United States v. The Progressive, Inc., 467 F. Supp. 990 (W.D. Wis. 1979)","locus":"467 F. Supp. 990","date":"26 March 1979","url":"https://law.justia.com/cases/federal/district-courts/FSupp/467/990/1376343/"},"restored":"","themes":["secrecy"],"years":[1979],"embed_text":"Robert W. Warren | United States v. The Progressive, Inc., 467 F. Supp. 990 (W.D. Wis. 1979) | 467 F. Supp. 990 | 26 March 1979 | A mistake in ruling against the United States could pave the way for thermonuclear annihilation for us all. In that event, our right to life is extinguished and the right to publish becomes moot."},{"id":"q-robert-w-warren-united-states-v-the--a478a9a0","quote":"not all the data is available in the public realm in the same fashion, if it is available at all … The article provides a more comprehensive, accurate, and detailed analysis of the overall construction and operation of a thermonuclear weapon than any publication to date in the public literature.","speaker":{"name":"Robert W. Warren","role":"author","sort":"warren, robert w.","as_given":"Robert W. Warren"},"source":{"work":"United States v. The Progressive, Inc., 467 F. Supp. 990 (W.D. Wis. 1979)","locus":"467 F. Supp. 990","date":"26 March 1979","url":"https://law.justia.com/cases/federal/district-courts/FSupp/467/990/1376343/"},"restored":"","themes":["secrecy"],"years":[1979],"embed_text":"Robert W. Warren | United States v. The Progressive, Inc., 467 F. Supp. 990 (W.D. Wis. 1979) | 467 F. Supp. 990 | 26 March 1979 | not all the data is available in the public realm in the same fashion, if it is available at all … The article provides a more comprehensive, accurate, and detailed analysis of the overall construction and operation of a thermonuclear weapon than any publication to date in the public literature."},{"id":"q-robert-w-warren-united-states-v-the--b195f06b","quote":"This case is different in several important respects. In the first place, the study involved in the New York Times case contained historical data relating to events that occurred some three to twenty years previously.","speaker":{"name":"Robert W. Warren","role":"author","sort":"warren, robert w.","as_given":"Robert W. Warren"},"source":{"work":"United States v. The Progressive, Inc., 467 F. Supp. 990 (W.D. Wis. 1979)","locus":"467 F. Supp. 990","date":"26 March 1979","url":"https://law.justia.com/cases/federal/district-courts/FSupp/467/990/1376343/"},"restored":"","themes":["secrecy"],"years":[1979],"embed_text":"Robert W. Warren | United States v. The Progressive, Inc., 467 F. Supp. 990 (W.D. Wis. 1979) | 467 F. Supp. 990 | 26 March 1979 | This case is different in several important respects. In the first place, the study involved in the New York Times case contained historical data relating to events that occurred some three to twenty years previously."},{"id":"q-eric-weinstein-eric-weinstein-in-er-605ac0a2","quote":"It is a serious advantage that we can afford to look at ourselves and say, we don’t do everything perfectly, and we want to know the truth… We limit our own ability to use cowboy science to drive the rest of the world. And quite honestly, we’re giving away our biggest advantage, which is the middle finger. The American ability to say, screw you to a supervisor who tells you what is true and what isn’t true, a young person should be able to say, hey, I think my field is going in entirely the wrong direction, and I’m willing to bet my career on it. Don’t interfere.","speaker":{"name":"Eric Weinstein","role":"author","sort":"weinstein, eric","as_given":"Eric Weinstein"},"source":{"work":"Eric Weinstein, in “Eric Weinstein: The State of American Science, Breakthrough Coverups, and the Danger of Physics,” All-In Podcast","date":"26 August 2026","url":"https://podscripts.co/podcasts/all-in-with-chamath-jason-sacks-friedberg/eric-weinstein-the-state-of-american-science-breakthrough-coverups-and-the-danger-of-physics"},"restored":"","themes":["secrecy"],"years":[2026],"embed_text":"Eric Weinstein | Eric Weinstein, in “Eric Weinstein: The State of American Science, Breakthrough Coverups, and the Danger of Physics,” All-In Podcast | 26 August 2026 | It is a serious advantage that we can afford to look at ourselves and say, we don’t do everything perfectly, and we want to know the truth… We limit our own ability to use cowboy science to drive the rest of the world. And quite honestly, we’re giving away our biggest advantage, which is the middle finger. The American ability to say, screw you to a supervisor who tells you what is true and what isn’t true, a young person should be able to say, hey, I think my field is going in entirely the wrong direction, and I’m willing to bet my career on it. Don’t interfere."},{"id":"q-eric-weinstein-eric-weinstein-in-er-1a2a896b","quote":"And I will say in particular, theoretical physics, theoretical physics is the only profession to have lost free speech because of something called restricted data where I am not allowed to put pen to paper to write down a physics equation if in any way it affects nuclear weapons. Well, try doing really good physics in a way that doesn’t affect, you know, hadrons and nucleons. It’s impossible. So you have this threat, right, that somehow the law, I’m not even protected by the First Amendment.","speaker":{"name":"Eric Weinstein","role":"author","sort":"weinstein, eric","as_given":"Eric Weinstein"},"source":{"work":"Eric Weinstein, in “Eric Weinstein: The State of American Science, Breakthrough Coverups, and the Danger of Physics,” All-In Podcast","date":"26 August 2026","url":"https://podscripts.co/podcasts/all-in-with-chamath-jason-sacks-friedberg/eric-weinstein-the-state-of-american-science-breakthrough-coverups-and-the-danger-of-physics"},"restored":"","themes":["secrecy"],"years":[2026],"embed_text":"Eric Weinstein | Eric Weinstein, in “Eric Weinstein: The State of American Science, Breakthrough Coverups, and the Danger of Physics,” All-In Podcast | 26 August 2026 | And I will say in particular, theoretical physics, theoretical physics is the only profession to have lost free speech because of something called restricted data where I am not allowed to put pen to paper to write down a physics equation if in any way it affects nuclear weapons. Well, try doing really good physics in a way that doesn’t affect, you know, hadrons and nucleons. It’s impossible. So you have this threat, right, that somehow the law, I’m not even protected by the First Amendment."},{"id":"q-eric-weinstein-eric-weinstein-in-er-05eb5e24","quote":"So my claim is that if you want to think about Walter White as a paradigm, you have to go back to something called the United States versus Progressive magazine in which the Teller Ulam design for the thermonuclear weapon was put forward by a publication. And the government said, no, no, this is restricted data. We need prior injunction. This is the most dangerous piece of geometry. This is Stan Ulam’s work.","speaker":{"name":"Eric Weinstein","role":"author","sort":"weinstein, eric","as_given":"Eric Weinstein"},"source":{"work":"Eric Weinstein, in “Eric Weinstein: The State of American Science, Breakthrough Coverups, and the Danger of Physics,” All-In Podcast","date":"26 August 2026","url":"https://podscripts.co/podcasts/all-in-with-chamath-jason-sacks-friedberg/eric-weinstein-the-state-of-american-science-breakthrough-coverups-and-the-danger-of-physics"},"restored":"","themes":["secrecy"],"years":[2026],"embed_text":"Eric Weinstein | Eric Weinstein, in “Eric Weinstein: The State of American Science, Breakthrough Coverups, and the Danger of Physics,” All-In Podcast | 26 August 2026 | So my claim is that if you want to think about Walter White as a paradigm, you have to go back to something called the United States versus Progressive magazine in which the Teller Ulam design for the thermonuclear weapon was put forward by a publication. And the government said, no, no, this is restricted data. We need prior injunction. This is the most dangerous piece of geometry. This is Stan Ulam’s work."},{"id":"q-eric-weinstein-eric-weinstein-in-er-278ca2f9","quote":"Now, that secret got published. And the only reason the government didn’t go after, Howard, what is it, Howard Morl[and], is that we stupidly declassified all sorts of pieces and shards of this. And he went to the Los Alamos Library, and he pieced it together.","speaker":{"name":"Eric Weinstein","role":"author","sort":"weinstein, eric","as_given":"Eric Weinstein"},"source":{"work":"Eric Weinstein, in “Eric Weinstein: The State of American Science, Breakthrough Coverups, and the Danger of Physics,” All-In Podcast","date":"26 August 2026","url":"https://podscripts.co/podcasts/all-in-with-chamath-jason-sacks-friedberg/eric-weinstein-the-state-of-american-science-breakthrough-coverups-and-the-danger-of-physics"},"restored":"","themes":["secrecy"],"years":[2026],"embed_text":"Eric Weinstein | Eric Weinstein, in “Eric Weinstein: The State of American Science, Breakthrough Coverups, and the Danger of Physics,” All-In Podcast | 26 August 2026 | Now, that secret got published. And the only reason the government didn’t go after, Howard, what is it, Howard Morl[and], is that we stupidly declassified all sorts of pieces and shards of this. And he went to the Los Alamos Library, and he pieced it together."},{"id":"q-eric-weinstein-eric-weinstein-in-er-5954c7ad","quote":"What happened in 1940 is that something that you’ve never heard of called the reference committee was established inside of the National Research Council… a guy named [Breit], B-R-E-I-T, formed something called the reference committee inside the National Research Council so that if you submitted a paper on chain reaction physics to a journal, it got shunted into the National Research Council, and they would return it to you saying, unfortunately, you know, these results are really preliminary. We don’t see this as being at the level of the journal… This is how people outside of the Manhattan Project, outside of the White Badges, treated their colleagues who weren’t allowed inside the Manhattan Project.","speaker":{"name":"Eric Weinstein","role":"author","sort":"weinstein, eric","as_given":"Eric Weinstein"},"source":{"work":"Eric Weinstein, in “Eric Weinstein: The State of American Science, Breakthrough Coverups, and the Danger of Physics,” All-In Podcast","date":"26 August 2026","url":"https://podscripts.co/podcasts/all-in-with-chamath-jason-sacks-friedberg/eric-weinstein-the-state-of-american-science-breakthrough-coverups-and-the-danger-of-physics"},"restored":"","themes":["secrecy"],"years":[2026],"embed_text":"Eric Weinstein | Eric Weinstein, in “Eric Weinstein: The State of American Science, Breakthrough Coverups, and the Danger of Physics,” All-In Podcast | 26 August 2026 | What happened in 1940 is that something that you’ve never heard of called the reference committee was established inside of the National Research Council… a guy named [Breit], B-R-E-I-T, formed something called the reference committee inside the National Research Council so that if you submitted a paper on chain reaction physics to a journal, it got shunted into the National Research Council, and they would return it to you saying, unfortunately, you know, these results are really preliminary. We don’t see this as being at the level of the journal… This is how people outside of the Manhattan Project, outside of the White Badges, treated their colleagues who weren’t allowed inside the Manhattan Project."},{"id":"q-eric-weinstein-eric-weinstein-in-er-663ffc21","quote":"So my claim is, if you don’t know the story of John Aristotle Phillips, the substandard physicist who in his Princeton PhD thesis is the Princeton mascot, said, look, I’m not very good, Freeman Dyson, I want to use the fact that I’m not very good to do something amazing. Tell me whether or not you will let me come up with the plan for an atomic bomb. And Freeman Dyson said, I will give you no help, but I’ll tell you whether it will work. So the substandard physicists put together this and he submitted his junior thesis. And I forget whether it’s page 24, but that thesis is not in the library and the government removed the page that has the plan.","speaker":{"name":"Eric Weinstein","role":"author","sort":"weinstein, eric","as_given":"Eric Weinstein"},"source":{"work":"Eric Weinstein, in “Eric Weinstein: The State of American Science, Breakthrough Coverups, and the Danger of Physics,” All-In Podcast","date":"26 August 2026","url":"https://podscripts.co/podcasts/all-in-with-chamath-jason-sacks-friedberg/eric-weinstein-the-state-of-american-science-breakthrough-coverups-and-the-danger-of-physics"},"restored":"","themes":["secrecy"],"years":[2026],"embed_text":"Eric Weinstein | Eric Weinstein, in “Eric Weinstein: The State of American Science, Breakthrough Coverups, and the Danger of Physics,” All-In Podcast | 26 August 2026 | So my claim is, if you don’t know the story of John Aristotle Phillips, the substandard physicist who in his Princeton PhD thesis is the Princeton mascot, said, look, I’m not very good, Freeman Dyson, I want to use the fact that I’m not very good to do something amazing. Tell me whether or not you will let me come up with the plan for an atomic bomb. And Freeman Dyson said, I will give you no help, but I’ll tell you whether it will work. So the substandard physicists put together this and he submitted his junior thesis. And I forget whether it’s page 24, but that thesis is not in the library and the government removed the page that has the plan."},{"id":"q-eric-weinstein-eric-weinstein-in-er-e9acbc68","quote":"The question is, did it happen once or more than once? If it happened more than once, the question is, what is the analog of the boys' school in New Mexico? What is the analog of the white badges? What is the analog of the reference committee?","speaker":{"name":"Eric Weinstein","role":"author","sort":"weinstein, eric","as_given":"Eric Weinstein"},"source":{"work":"Eric Weinstein, in “Eric Weinstein: The State of American Science, Breakthrough Coverups, and the Danger of Physics,” All-In Podcast","locus":"c. 47:32","date":"26 August 2026","url":"https://podscripts.co/podcasts/all-in-with-chamath-jason-sacks-friedberg/eric-weinstein-the-state-of-american-science-breakthrough-coverups-and-the-danger-of-physics"},"restored":"","themes":["secrecy"],"years":[2026],"embed_text":"Eric Weinstein | Eric Weinstein, in “Eric Weinstein: The State of American Science, Breakthrough Coverups, and the Danger of Physics,” All-In Podcast | c. 47:32 | 26 August 2026 | The question is, did it happen once or more than once? If it happened more than once, the question is, what is the analog of the boys' school in New Mexico? What is the analog of the white badges? What is the analog of the reference committee?"},{"id":"q-eric-weinstein-eric-weinstein-in-er-229025bc","quote":"If it's happening, I've said that the leading candidate would be Renaissance technologies on Long Island.","speaker":{"name":"Eric Weinstein","role":"author","sort":"weinstein, eric","as_given":"Eric Weinstein"},"source":{"work":"Eric Weinstein, in “Eric Weinstein: The State of American Science, Breakthrough Coverups, and the Danger of Physics,” All-In Podcast","locus":"c. 47:54","date":"26 August 2026","url":"https://podscripts.co/podcasts/all-in-with-chamath-jason-sacks-friedberg/eric-weinstein-the-state-of-american-science-breakthrough-coverups-and-the-danger-of-physics"},"restored":"","themes":["secrecy"],"years":[2026],"embed_text":"Eric Weinstein | Eric Weinstein, in “Eric Weinstein: The State of American Science, Breakthrough Coverups, and the Danger of Physics,” All-In Podcast | c. 47:54 | 26 August 2026 | If it's happening, I've said that the leading candidate would be Renaissance technologies on Long Island."},{"id":"q-eric-weinstein-eric-weinstein-in-er-ef44cc2f","quote":"Let's look at the cover story. Okay. The cover story would be, you know, we are so good at trading that we don't even allow people who know markets into our firm. We only hire people in directly relevant subjects of physics, like particle theorists, like differential geometers, like machine learning experts. And we have a very strange thing that we have a very close relationship with the Brookhaven National Laboratory. And by the way, there's a middling university right next door who happens to be absolutely world class historically in the exact subjects that would be relevant to doing next level physics.","speaker":{"name":"Eric Weinstein","role":"author","sort":"weinstein, eric","as_given":"Eric Weinstein"},"source":{"work":"Eric Weinstein, in “Eric Weinstein: The State of American Science, Breakthrough Coverups, and the Danger of Physics,” All-In Podcast","locus":"c. 48:14; Weinstein is voicing what he calls “the cover story”","date":"26 August 2026","url":"https://podscripts.co/podcasts/all-in-with-chamath-jason-sacks-friedberg/eric-weinstein-the-state-of-american-science-breakthrough-coverups-and-the-danger-of-physics"},"restored":"","themes":["secrecy"],"years":[2026],"embed_text":"Eric Weinstein | Eric Weinstein, in “Eric Weinstein: The State of American Science, Breakthrough Coverups, and the Danger of Physics,” All-In Podcast | c. 48:14; Weinstein is voicing what he calls “the cover story” | 26 August 2026 | Let's look at the cover story. Okay. The cover story would be, you know, we are so good at trading that we don't even allow people who know markets into our firm. We only hire people in directly relevant subjects of physics, like particle theorists, like differential geometers, like machine learning experts. And we have a very strange thing that we have a very close relationship with the Brookhaven National Laboratory. And by the way, there's a middling university right next door who happens to be absolutely world class historically in the exact subjects that would be relevant to doing next level physics."},{"id":"q-eric-weinstein-eric-weinstein-in-er-c1b14dae","quote":"I'm not saying that I know that that's true. My point was, I tried to be careful.","speaker":{"name":"Eric Weinstein","role":"author","sort":"weinstein, eric","as_given":"Eric Weinstein"},"source":{"work":"Eric Weinstein, in “Eric Weinstein: The State of American Science, Breakthrough Coverups, and the Danger of Physics,” All-In Podcast","locus":"c. 49:06, answering David Friedberg","date":"26 August 2026","url":"https://podscripts.co/podcasts/all-in-with-chamath-jason-sacks-friedberg/eric-weinstein-the-state-of-american-science-breakthrough-coverups-and-the-danger-of-physics"},"restored":"","themes":["secrecy"],"years":[2026],"embed_text":"Eric Weinstein | Eric Weinstein, in “Eric Weinstein: The State of American Science, Breakthrough Coverups, and the Danger of Physics,” All-In Podcast | c. 49:06, answering David Friedberg | 26 August 2026 | I'm not saying that I know that that's true. My point was, I tried to be careful."},{"id":"q-norbert-wiener-cybernetics-or-contr-292a1877","quote":"This idea occurred at about the same time to several writers, among them the statistician R. A. Fisher, Dr. Shannon of the Bell Telephone Laboratories, and the author. Fisher's motive in studying this subject is to be found in classical statistical theory; that of Shannon in the problem of coding information; and that of the author in the problem of noise and message in electrical filters.","speaker":{"name":"Norbert Wiener","role":"author","sort":"wiener, norbert","as_given":"Norbert Wiener"},"source":{"work":"Cybernetics: or Control and Communication in the Animal and the Machine (1948), Introduction; text layer of the thirteenth printing (April 1957), archive.org","locus":"pp.17-18","date":"1948","url":"https://archive.org/details/cybernetics-norbert-wiener"},"restored":"","themes":["cybernetics"],"years":[1948],"embed_text":"Norbert Wiener | Cybernetics: or Control and Communication in the Animal and the Machine (1948), Introduction; text layer of the thirteenth printing (April 1957), archive.org | pp.17-18 | 1948 | This idea occurred at about the same time to several writers, among them the statistician R. A. Fisher, Dr. Shannon of the Bell Telephone Laboratories, and the author. Fisher's motive in studying this subject is to be found in classical statistical theory; that of Shannon in the problem of coding information; and that of the author in the problem of noise and message in electrical filters."},{"id":"q-norbert-wiener-cybernetics-or-contr-21d6c1b9","quote":"Information is information, not matter or energy. No materialism which does not admit this can survive at the present day.","speaker":{"name":"Norbert Wiener","role":"author","sort":"wiener, norbert","as_given":"Norbert Wiener"},"source":{"work":"Cybernetics: or Control and Communication in the Animal and the Machine (New York: John Wiley & Sons; Paris: Hermann et Cie; Cambridge, Mass.: The Technology Press, 1948), ch. V, \"Computing Machines and the Nervous System\"; text layer of the thirteenth printing (April 1957), archive.org","locus":"p.155","date":"1948","url":"https://archive.org/details/cybernetics-norbert-wiener"},"restored":"","themes":["cybernetics"],"years":[1948],"embed_text":"Norbert Wiener | Cybernetics: or Control and Communication in the Animal and the Machine (New York: John Wiley & Sons; Paris: Hermann et Cie; Cambridge, Mass.: The Technology Press, 1948), ch. V, \"Computing Machines and the Nervous System\"; text layer of the thirteenth printing (April 1957), archive.org | p.155 | 1948 | Information is information, not matter or energy. No materialism which does not admit this can survive at the present day."},{"id":"q-norbert-wiener-discussion-following-837cd0a5","quote":"This is very interesting to me. In my prediction theory I start from a series with a correlation and I build a series which is equivalent; each is the past linear function of the past of the other. In addition, however, in my new series the choices are completely independent, whereas in my earlier series the series are partially dependent. In fact, the way I built the linear prediction theory was by the reduction of my dependent choices to independent choices. My method has some parallelisms to this. Excuse me for interrupting.","speaker":{"name":"Norbert Wiener","role":"author","sort":"wiener, norbert","as_given":"Norbert Wiener"},"source":{"work":"Discussion following Claude E. Shannon, \"The Redundancy of English,\" in Cybernetics: Circular Causal and Feedback Mechanisms in Biological and Social Systems: Transactions of the Seventh Conference, March 23-24, 1950, ed. Heinz von Foerster (New York: Josiah Macy, Jr. Foundation, 1951); text as reprinted in Claus Pias (ed.), Cybernetics: The Macy Conferences 1946-1953: The Complete Transactions (Zurich-Berlin: diaphanes, 2003/2016)","locus":"original Transactions pagination p.129; Pias Complete Transactions p.252","date":"1950-03-23","url":"https://hostb.org/116X/Cybernetics.%20The%20Macy%20Conferences%201946-1953.%20The%20Complete%20Transactions%202016.pdf"},"restored":"","themes":["macy"],"years":[1950],"embed_text":"Norbert Wiener | Discussion following Claude E. Shannon, \"The Redundancy of English,\" in Cybernetics: Circular Causal and Feedback Mechanisms in Biological and Social Systems: Transactions of the Seventh Conference, March 23-24, 1950, ed. Heinz von Foerster (New York: Josiah Macy, Jr. Foundation, 1951); text as reprinted in Claus Pias (ed.), Cybernetics: The Macy Conferences 1946-1953: The Complete Transactions (Zurich-Berlin: diaphanes, 2003/2016) | original Transactions pagination p.129; Pias Complete Transactions p.252 | 1950-03-23 | This is very interesting to me. In my prediction theory I start from a series with a correlation and I build a series which is equivalent; each is the past linear function of the past of the other. In addition, however, in my new series the choices are completely independent, whereas in my earlier series the series are partially dependent. In fact, the way I built the linear prediction theory was by the reduction of my dependent choices to independent choices. My method has some parallelisms to this. Excuse me for interrupting."},{"id":"q-norbert-wiener-discussion-following-9ae5b5fc","quote":"There should be ways, I think, of sorting this out. That would be more absolute, like codings. I think there would be a reduction of the choices to completely independent choices. That could be worked out.","speaker":{"name":"Norbert Wiener","role":"author","sort":"wiener, norbert","as_given":"Norbert Wiener"},"source":{"work":"Discussion following Claude E. Shannon, \"The Redundancy of English,\" in Cybernetics: Circular Causal and Feedback Mechanisms in Biological and Social Systems: Transactions of the Seventh Conference, March 23-24, 1950, ed. Heinz von Foerster (New York: Josiah Macy, Jr. Foundation, 1951); text as reprinted in Claus Pias (ed.), Cybernetics: The Macy Conferences 1946-1953: The Complete Transactions (Zurich-Berlin: diaphanes, 2003/2016)","locus":"original Transactions pagination p.131; Pias Complete Transactions p.253","date":"1950-03-23","url":"https://hostb.org/116X/Cybernetics.%20The%20Macy%20Conferences%201946-1953.%20The%20Complete%20Transactions%202016.pdf"},"restored":"","themes":["macy"],"years":[1950],"embed_text":"Norbert Wiener | Discussion following Claude E. Shannon, \"The Redundancy of English,\" in Cybernetics: Circular Causal and Feedback Mechanisms in Biological and Social Systems: Transactions of the Seventh Conference, March 23-24, 1950, ed. Heinz von Foerster (New York: Josiah Macy, Jr. Foundation, 1951); text as reprinted in Claus Pias (ed.), Cybernetics: The Macy Conferences 1946-1953: The Complete Transactions (Zurich-Berlin: diaphanes, 2003/2016) | original Transactions pagination p.131; Pias Complete Transactions p.253 | 1950-03-23 | There should be ways, I think, of sorting this out. That would be more absolute, like codings. I think there would be a reduction of the choices to completely independent choices. That could be worked out."},{"id":"q-norbert-wiener-discussion-following-7430d50b","quote":"To do it is difficult, because you would need more complete tables.","speaker":{"name":"Norbert Wiener","role":"author","sort":"wiener, norbert","as_given":"Norbert Wiener"},"source":{"work":"Discussion following Claude E. Shannon, \"The Redundancy of English,\" in Cybernetics: Circular Causal and Feedback Mechanisms in Biological and Social Systems: Transactions of the Seventh Conference, March 23-24, 1950, ed. Heinz von Foerster (New York: Josiah Macy, Jr. Foundation, 1951); text as reprinted in Claus Pias (ed.), Cybernetics: The Macy Conferences 1946-1953: The Complete Transactions (Zurich-Berlin: diaphanes, 2003/2016)","locus":"original Transactions pagination p.131; Pias Complete Transactions p.253","date":"1950-03-23","url":"https://hostb.org/116X/Cybernetics.%20The%20Macy%20Conferences%201946-1953.%20The%20Complete%20Transactions%202016.pdf"},"restored":"","themes":["macy"],"years":[1950],"embed_text":"Norbert Wiener | Discussion following Claude E. Shannon, \"The Redundancy of English,\" in Cybernetics: Circular Causal and Feedback Mechanisms in Biological and Social Systems: Transactions of the Seventh Conference, March 23-24, 1950, ed. Heinz von Foerster (New York: Josiah Macy, Jr. Foundation, 1951); text as reprinted in Claus Pias (ed.), Cybernetics: The Macy Conferences 1946-1953: The Complete Transactions (Zurich-Berlin: diaphanes, 2003/2016) | original Transactions pagination p.131; Pias Complete Transactions p.253 | 1950-03-23 | To do it is difficult, because you would need more complete tables."},{"id":"q-norbert-wiener-discussion-following-7c56754d","quote":"Very extensive tables.","speaker":{"name":"Norbert Wiener","role":"author","sort":"wiener, norbert","as_given":"Norbert Wiener"},"source":{"work":"Discussion following Claude E. Shannon, \"The Redundancy of English,\" in Cybernetics: Circular Causal and Feedback Mechanisms in Biological and Social Systems: Transactions of the Seventh Conference, March 23-24, 1950, ed. Heinz von Foerster (New York: Josiah Macy, Jr. Foundation, 1951); text as reprinted in Claus Pias (ed.), Cybernetics: The Macy Conferences 1946-1953: The Complete Transactions (Zurich-Berlin: diaphanes, 2003/2016)","locus":"original Transactions pagination p.131; Pias Complete Transactions p.253","date":"1950-03-23","url":"https://hostb.org/116X/Cybernetics.%20The%20Macy%20Conferences%201946-1953.%20The%20Complete%20Transactions%202016.pdf"},"restored":"","themes":["macy"],"years":[1950],"embed_text":"Norbert Wiener | Discussion following Claude E. Shannon, \"The Redundancy of English,\" in Cybernetics: Circular Causal and Feedback Mechanisms in Biological and Social Systems: Transactions of the Seventh Conference, March 23-24, 1950, ed. Heinz von Foerster (New York: Josiah Macy, Jr. Foundation, 1951); text as reprinted in Claus Pias (ed.), Cybernetics: The Macy Conferences 1946-1953: The Complete Transactions (Zurich-Berlin: diaphanes, 2003/2016) | original Transactions pagination p.131; Pias Complete Transactions p.253 | 1950-03-23 | Very extensive tables."},{"id":"q-norbert-wiener-discussion-following-57ee9c79","quote":"In other words, it is only an analogue that is preserved from each region. Everything else is mutilated terribly; you figured out how much of the information should be in from the frequency range, and the amplitude range preserved by this is less than one-tenth in many cases.","speaker":{"name":"Norbert Wiener","role":"author","sort":"wiener, norbert","as_given":"Norbert Wiener"},"source":{"work":"Discussion following J. C. R. Licklider, \"The Manner in Which and Extent to Which Speech Can Be Distorted and Remain Intelligible,\" in Cybernetics: Circular Causal and Feedback Mechanisms in Biological and Social Systems: Transactions of the Seventh Conference, March 23-24, 1950, ed. Heinz von Foerster (New York: Josiah Macy, Jr. Foundation, 1951); text as reprinted in Claus Pias (ed.), Cybernetics: The Macy Conferences 1946-1953: The Complete Transactions (Zurich-Berlin: diaphanes, 2003/2016)","locus":"original Transactions pagination p.90; Pias Complete Transactions p.226","date":"March 23-24, 1950","url":"https://hostb.org/116X/Cybernetics.%20The%20Macy%20Conferences%201946-1953.%20The%20Complete%20Transactions%202016.pdf"},"restored":"","themes":["macy"],"years":[1950],"embed_text":"Norbert Wiener | Discussion following J. C. R. Licklider, \"The Manner in Which and Extent to Which Speech Can Be Distorted and Remain Intelligible,\" in Cybernetics: Circular Causal and Feedback Mechanisms in Biological and Social Systems: Transactions of the Seventh Conference, March 23-24, 1950, ed. Heinz von Foerster (New York: Josiah Macy, Jr. Foundation, 1951); text as reprinted in Claus Pias (ed.), Cybernetics: The Macy Conferences 1946-1953: The Complete Transactions (Zurich-Berlin: diaphanes, 2003/2016) | original Transactions pagination p.90; Pias Complete Transactions p.226 | March 23-24, 1950 | In other words, it is only an analogue that is preserved from each region. Everything else is mutilated terribly; you figured out how much of the information should be in from the frequency range, and the amplitude range preserved by this is less than one-tenth in many cases."},{"id":"q-norbert-wiener-discussion-following-acf1191c","quote":"The best thing we have done with that was a vocabulary of 12 words, a run of 80 with six errors. That is obviously not enough. But that simply shows there is enough basis for discrimination to warrant going much further. There is one thing that I want to say about this from the general point of view of communication engineering, and that is that the measurements that Mr. Shannon and I have of an amount of information going over a line really need a certain comment. In view of this we have been measuring the maximum amount of information going over the line which is recoverable by any sort of terminal apparatus. Now that is very relevant if we have our terminal apparatus at our disposal. In the kind of situation we have here, concerning error with the skin receiver or anything else of the sort, the relevant amount of information is the amount that will get through both the transmission line and through what we may call the phonetic translation, translating oscillation into phonemes or their equivalent for the skin or any other sense. This information will give us no more information than we had in the beginning. There is still the maximum amount of information recoverable from this. In general, from the second law of dynamics, it would give us less information that we put in.","speaker":{"name":"Norbert Wiener","role":"author","sort":"wiener, norbert","as_given":"Norbert Wiener"},"source":{"work":"Discussion following J. C. R. Licklider, \"The Manner in Which and Extent to Which Speech Can Be Distorted and Remain Intelligible,\" in Cybernetics: Circular Causal and Feedback Mechanisms in Biological and Social Systems: Transactions of the Seventh Conference, March 23-24, 1950, ed. Heinz von Foerster (New York: Josiah Macy, Jr. Foundation, 1951); text as reprinted in Claus Pias (ed.), Cybernetics: The Macy Conferences 1946-1953: The Complete Transa
