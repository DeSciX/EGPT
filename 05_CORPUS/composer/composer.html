":"§1-1","date":"1965"},"restored":"","themes":["physics-and-continuum"],"years":[1965],"embed_text":"Richard Feynman | The Feynman Lectures on Physics, Vol. III | §1-1 | 1965 | has in it the heart of quantum mechanics. In reality, it contains the only mystery"},{"id":"q-richard-feynman-the-feynman-lectures-055b694c","quote":"None of them can get the right curve for P₁₂ in terms of P₁ and P₂.","speaker":{"name":"Richard Feynman","role":"author","sort":"feynman, richard","as_given":"Richard Feynman"},"source":{"work":"The Feynman Lectures on Physics, Vol. III","locus":"§1-5","date":"1965"},"restored":"","themes":["physics-and-continuum"],"years":[1965],"embed_text":"Richard Feynman | The Feynman Lectures on Physics, Vol. III | §1-5 | 1965 | None of them can get the right curve for P₁₂ in terms of P₁ and P₂."},{"id":"q-richard-feynman-the-feynman-lectures-374a5b75","quote":"What do we mean by “understanding” something? We can imagine that this complicated array of moving things which constitutes “the world” is something like a great chess game being played by the gods, and we are observers of the game. We do not know what the rules of the game are; all we are allowed to do is to _watch_ the playing. Of course, if we watch long enough, we may eventually catch on to a few of the rules. _The rules of the game_ are what we mean by _fundamental physics_. Even if we knew every rule, however, we might not be able to understand why a particular move is made in the game, merely because it is too complicated and our minds are limited. If you play chess you must know that it is easy to learn all the rules, and yet it is often very hard to select the best move or to understand why a player moves as he does. So it is in nature, only much more so; but we may be able at least to find all the rules. Actually, we do not have all the rules now. (Every once in a while something like castling is going on that we still do not understand.) Aside from not knowing all of the rules, what we really can explain in terms of those rules is very limited, because almost all situations are so enormously complicated that we cannot follow the plays of the game using the rules, much less tell what is going to happen next. We must, therefore, limit ourselves to the more basic question of the rules of the game. If we know the rules, we consider that we “understand” the world.","speaker":{"name":"Richard Feynman","role":"author","sort":"feynman, richard","as_given":"Richard Feynman"},"source":{"work":"The Feynman Lectures on Physics, Volume I","locus":"Chapter 2, §2-1 \"Physics before 1920\" (paragraph 5 of the section, per the site's own paragraph numbering)","date":"1963","url":"https://www.feynmanlectures.caltech.edu/I_02.html"},"restored":"","themes":[],"years":[1963],"embed_text":"Richard Feynman | The Feynman Lectures on Physics, Volume I | Chapter 2, §2-1 \"Physics before 1920\" (paragraph 5 of the section, per the site's own paragraph numbering) | 1963 | What do we mean by “understanding” something? We can imagine that this complicated array of moving things which constitutes “the world” is something like a great chess game being played by the gods, and we are observers of the game. We do not know what the rules of the game are; all we are allowed to do is to _watch_ the playing. Of course, if we watch long enough, we may eventually catch on to a few of the rules. _The rules of the game_ are what we mean by _fundamental physics_. Even if we knew every rule, however, we might not be able to understand why a particular move is made in the game, merely because it is too complicated and our minds are limited. If you play chess you must know that it is easy to learn all the rules, and yet it is often very hard to select the best move or to understand why a player moves as he does. So it is in nature, only much more so; but we may be able at least to find all the rules. Actually, we do not have all the rules now. (Every once in a while something like castling is going on that we still do not understand.) Aside from not knowing all of the rules, what we really can explain in terms of those rules is very limited, because almost all situations are so enormously complicated that we cannot follow the plays of the game using the rules, much less tell what is going to happen next. We must, therefore, limit ourselves to the more basic question of the rules of the game. If we know the rules, we consider that we “understand” the world."},{"id":"q-richard-feynman-the-feynman-lectures-edae435c","quote":"In this chapter we shall tackle immediately the basic element of the mysterious behavior in its most strange form. We choose to examine a phenomenon which is impossible, _absolutely_ impossible, to explain in any classical way, and which has in it the heart of quantum mechanics. In reality, it contains the _only_ mystery. We cannot make the mystery go away by “explaining” how it works. We will just _tell_ you how it works. In telling you how it works we will have told you about the basic peculiarities of all quantum mechanics.","speaker":{"name":"Richard Feynman","role":"author","sort":"feynman, richard","as_given":"Richard Feynman"},"source":{"work":"The Feynman Lectures on Physics, Volume III","locus":"Chapter 1, §1-1 \"Atomic mechanics\" (opening paragraph of the chapter)","date":"1965","url":"https://www.feynmanlectures.caltech.edu/III_01.html"},"restored":"","themes":[],"years":[1965],"embed_text":"Richard Feynman | The Feynman Lectures on Physics, Volume III | Chapter 1, §1-1 \"Atomic mechanics\" (opening paragraph of the chapter) | 1965 | In this chapter we shall tackle immediately the basic element of the mysterious behavior in its most strange form. We choose to examine a phenomenon which is impossible, _absolutely_ impossible, to explain in any classical way, and which has in it the heart of quantum mechanics. In reality, it contains the _only_ mystery. We cannot make the mystery go away by “explaining” how it works. We will just _tell_ you how it works. In telling you how it works we will have told you about the basic peculiarities of all quantum mechanics."},{"id":"q-richard-feynman-the-feynman-lectures-425d4b85","quote":"It is all quite mysterious. And the more you look at it the more mysterious it seems. Many ideas have been concocted to try to explain the curve for P 12 in terms of individual electrons going around in complicated ways through the holes. None of them has succeeded. None of them can get the right curve for P 12 in terms of P 1 and P 2.","speaker":{"name":"Richard Feynman","role":"author","sort":"feynman, richard","as_given":"Richard Feynman"},"source":{"work":"The Feynman Lectures on Physics, Volume III","locus":"Chapter 1, §1-5 \"The interference of electron waves\"","date":"1965","url":"https://www.feynmanlectures.caltech.edu/III_01.html"},"restored":"","themes":[],"years":[1965],"embed_text":"Richard Feynman | The Feynman Lectures on Physics, Volume III | Chapter 1, §1-5 \"The interference of electron waves\" | 1965 | It is all quite mysterious. And the more you look at it the more mysterious it seems. Many ideas have been concocted to try to explain the curve for P 12 in terms of individual electrons going around in complicated ways through the holes. None of them has succeeded. None of them can get the right curve for P 12 in terms of P 1 and P 2."},{"id":"q-richard-feynman-what-do-you-care-wha-f8ff3f68","quote":"The next Monday, when the fathers were all back at work, we kids were playing in a field. One kid says to me, “See that bird? What kind of bird is that?” I said, “I haven't the slightest idea what kind of a bird it is.” He says, “It's a brown-throated thrush. Your father doesn't teach you anything!” But it was the opposite. He had already taught me: “See that bird?” he says. “It's a Spencer's warbler.” (I knew he didn't know the real name.) “Well, in Italian, it's a Chutto Lapittida. In Portuguese, it's a Bom da Peida. In Chinese, it's a Chung-long-tah, and in Japanese, it's a Katano Tekeda. You can know the name of that bird in all the languages of the world, but when you're finished, you'll know absolutely nothing whatever about the bird. You'll only know about humans in different places, and what they call the bird. So let's look at the bird and see what it's doing — that's what counts.” (I learned very early the difference between knowing the name of something and knowing something.)","speaker":{"name":"Richard Feynman","role":"author","sort":"feynman, richard","as_given":"Richard Feynman (as recounted by Feynman, quoting his father)"},"source":{"work":"What Do You Care What Other People Think? — Part 1, \"A Curious Character\": \"The Making of a Scientist\" (1988)","locus":"Part 1, \"The Making of a Scientist\", page marker {3}-{4} in this online transcription","date":"1988","url":"https://scilib-physics.narod.ru/Feynman/WDYC/en/What_Do_You_Care.html"},"restored":"","themes":[],"years":[1988],"embed_text":"Richard Feynman | What Do You Care What Other People Think? — Part 1, \"A Curious Character\": \"The Making of a Scientist\" (1988) | Part 1, \"The Making of a Scientist\", page marker {3}-{4} in this online transcription | 1988 | The next Monday, when the fathers were all back at work, we kids were playing in a field. One kid says to me, “See that bird? What kind of bird is that?” I said, “I haven't the slightest idea what kind of a bird it is.” He says, “It's a brown-throated thrush. Your father doesn't teach you anything!” But it was the opposite. He had already taught me: “See that bird?” he says. “It's a Spencer's warbler.” (I knew he didn't know the real name.) “Well, in Italian, it's a Chutto Lapittida. In Portuguese, it's a Bom da Peida. In Chinese, it's a Chung-long-tah, and in Japanese, it's a Katano Tekeda. You can know the name of that bird in all the languages of the world, but when you're finished, you'll know absolutely nothing whatever about the bird. You'll only know about humans in different places, and what they call the bird. So let's look at the bird and see what it's doing — that's what counts.” (I learned very early the difference between knowing the name of something and knowing something.)"},{"id":"q-richard-feynman-fs-blog-richard-feyn-d451b6b3","quote":"See that bird? It's a brown-throated thrush, but in Germany it's called a halzenfugel, and in Chinese they call it a chung ling and even if you know all those names for it, you still know nothing about the bird. You only know something about people; what they call the bird. Now that thrush sings, and teaches its young to fly, and flies so many miles away during the summer across the country, and nobody knows how it finds its way.","speaker":{"name":"Richard Feynman","role":"author","sort":"feynman, richard","as_given":"Richard Feynman"},"source":{"work":"fs.blog, \"Richard Feynman: The Difference Between Knowing the Name of Something and Knowing Something\" (transcript of a short video clip, sourced by fs.blog to a recorded talk of Feynman's, not independently dated on the page)","locus":"single block quote, mid-article, following the sentence \"In this short clip (below), Feynman articulates the difference between knowing the name of something and understanding it.\"","url":"https://fs.blog/richard-feynman-knowing-something/"},"restored":"","themes":[],"years":[],"embed_text":"Richard Feynman | fs.blog, \"Richard Feynman: The Difference Between Knowing the Name of Something and Knowing Something\" (transcript of a short video clip, sourced by fs.blog to a recorded talk of Feynman's, not independently dated on the page) | single block quote, mid-article, following the sentence \"In this short clip (below), Feynman articulates the difference between knowing the name of something and understanding it.\" | See that bird? It's a brown-throated thrush, but in Germany it's called a halzenfugel, and in Chinese they call it a chung ling and even if you know all those names for it, you still know nothing about the bird. You only know something about people; what they call the bird. Now that thrush sings, and teaches its young to fly, and flies so many miles away during the summer across the country, and nobody knows how it finds its way."},{"id":"q-the-nobel-foundati-naguib-mahfouz-bibli-8d539226","quote":"God’s World : an Anthology of Short Stories / transl. with an introd. by Akef Abadir and Roger Allen. – Minneapolis : Bibl. Islamica, 1973","speaker":{"name":"The Nobel Foundation","role":"author","sort":"foundation, the nobel","as_given":"The Nobel Foundation"},"source":{"work":"Naguib Mahfouz — Bibliography, nobelprize.org","locus":"works in English translation","date":"1988","url":"https://www.nobelprize.org/prizes/literature/1988/mahfouz/bibliography/"},"restored":"","themes":["understanding-and-meaning"],"years":[1988],"embed_text":"The Nobel Foundation | Naguib Mahfouz — Bibliography, nobelprize.org | works in English translation | 1988 | God’s World : an Anthology of Short Stories / transl. with an introd. by Akef Abadir and Roger Allen. – Minneapolis : Bibl. Islamica, 1973"},{"id":"q-martin-gardner-preface-to-stanislaw-5bb40637","quote":"To mention only three: Cellular automata theory, which he proposed to von Neumann; the Monte Carlo method of solving intractable problems, not only in probability theory but in areas such as number theory where the method would not have been thought applicable; and his work on nonlinear processes that anticipated today’s interest in solitons and “chaos.”","speaker":{"name":"Martin Gardner","role":"author","sort":"gardner, martin","as_given":"Martin Gardner"},"source":{"work":"Preface to Stanislaw Ulam, Science, Computers, and People: From the Tree of Mathematics (Birkhäuser, 1986)","locus":"p. viii","date":"1986"},"restored":"","themes":["monte-carlo-and-automata"],"years":[1986],"embed_text":"Martin Gardner | Preface to Stanislaw Ulam, Science, Computers, and People: From the Tree of Mathematics (Birkhäuser, 1986) | p. viii | 1986 | To mention only three: Cellular automata theory, which he proposed to von Neumann; the Monte Carlo method of solving intractable problems, not only in probability theory but in areas such as number theory where the method would not have been thought applicable; and his work on nonlinear processes that anticipated today’s interest in solitons and “chaos.”"},{"id":"q-martin-gardner-preface-to-stanislaw-9d931b66","quote":"We still do not know—it remains a government secret—what jumped into Ulam’s head that made it possible for Edward Teller to build an H-bomb.","speaker":{"name":"Martin Gardner","role":"author","sort":"gardner, martin","as_given":"Martin Gardner"},"source":{"work":"Preface to Stanislaw Ulam, Science, Computers, and People: From the Tree of Mathematics (Birkhäuser, 1986)","locus":"p. viii","date":"1986"},"restored":"","themes":["monte-carlo-and-automata"],"years":[1986],"embed_text":"Martin Gardner | Preface to Stanislaw Ulam, Science, Computers, and People: From the Tree of Mathematics (Birkhäuser, 1986) | p. viii | 1986 | We still do not know—it remains a government secret—what jumped into Ulam’s head that made it possible for Edward Teller to build an H-bomb."},{"id":"q-ken-goldberg-interview-berkeley-n-c31c5b55","quote":"I’m not saying it’s not going to happen, but I’m saying it’s not going to happen in the next two years, or five years or even 10 years.","speaker":{"name":"Ken Goldberg","role":"author","sort":"goldberg, ken","as_given":"Ken Goldberg"},"source":{"work":"interview, Berkeley News","date":"27 August 2025"},"restored":"","themes":["robotics-data"],"years":[2025],"embed_text":"Ken Goldberg | interview, Berkeley News | 27 August 2025 | I’m not saying it’s not going to happen, but I’m saying it’s not going to happen in the next two years, or five years or even 10 years."},{"id":"q-goldstine-von-neum-planning-and-coding--b780d6e7","quote":"7.0 GENERAL PRINCIPLES OF CODING AND FLOW-DIAGRAMMING.","speaker":{"name":"Goldstine & von Neumann","role":"author","sort":"goldstine & von neumann","as_given":"Goldstine & von Neumann"},"source":{"work":"Planning and Coding of Problems for an Electronic Computing Instrument, Part II, Vol. I","locus":"section 7.0 (chapter heading)","date":"1947","url":"https://archive.org/details/planningcodingof0103inst"},"restored":"","themes":["machines"],"years":[1947],"embed_text":"Goldstine & von Neumann | Planning and Coding of Problems for an Electronic Computing Instrument, Part II, Vol. I | section 7.0 (chapter heading) | 1947 | 7.0 GENERAL PRINCIPLES OF CODING AND FLOW-DIAGRAMMING."},{"id":"q-goldstine-von-neum-planning-and-coding--29385f12","quote":"The actual code for a problem is that sequence of coded symbols (expressing a sequence of words, or rather of half-words and words) that has to be placed into the selectron memory in order to cause the machine to perform the desired and planned sequence of operations, which amount to solving the problem in question.","speaker":{"name":"Goldstine & von Neumann","role":"author","sort":"goldstine & von neumann","as_given":"Goldstine & von Neumann"},"source":{"work":"Planning and Coding of Problems for an Electronic Computing Instrument, Part II, Vol. I","locus":"section 7.1","date":"1947","url":"https://archive.org/details/planningcodingof0103inst"},"restored":"","themes":["machines"],"years":[1947],"embed_text":"Goldstine & von Neumann | Planning and Coding of Problems for an Electronic Computing Instrument, Part II, Vol. I | section 7.1 | 1947 | The actual code for a problem is that sequence of coded symbols (expressing a sequence of words, or rather of half-words and words) that has to be placed into the selectron memory in order to cause the machine to perform the desired and planned sequence of operations, which amount to solving the problem in question."},{"id":"q-goldstine-von-neum-planning-and-coding--5e150d8d","quote":"We therefore propose to begin the planning of a coded sequence by laying out a schematic of the course of C through that sequence, i.e. through the required region of the selectron memory. This schematic is the flow diagram of C.","speaker":{"name":"Goldstine & von Neumann","role":"author","sort":"goldstine & von neumann","as_given":"Goldstine & von Neumann"},"source":{"work":"Planning and Coding of Problems for an Electronic Computing Instrument, Part II, Vol. I","locus":"section 7.1 (immediately preceding section 7.3 'The flow diagram')","date":"1947","url":"https://archive.org/details/planningcodingof0103inst"},"restored":"","themes":["machines"],"years":[1947],"embed_text":"Goldstine & von Neumann | Planning and Coding of Problems for an Electronic Computing Instrument, Part II, Vol. I | section 7.1 (immediately preceding section 7.3 'The flow diagram') | 1947 | We therefore propose to begin the planning of a coded sequence by laying out a schematic of the course of C through that sequence, i.e. through the required region of the selectron memory. This schematic is the flow diagram of C."},{"id":"q-google-deepmind-genie-3-launch-post--be4c3ffb","quote":"AI systems that can use their understanding of the world to simulate aspects of it, enabling agents to predict both how an environment will evolve and how their actions will affect it.","speaker":{"name":"Google DeepMind","role":"institution","sort":"google deepmind","as_given":"Google DeepMind"},"source":{"work":"Genie 3 launch post, deepmind.google","date":"August 2025"},"restored":"","themes":["world-models-industry"],"years":[2025],"embed_text":"Google DeepMind | Genie 3 launch post, deepmind.google | August 2025 | AI systems that can use their understanding of the world to simulate aspects of it, enabling agents to predict both how an environment will evolve and how their actions will affect it."},{"id":"q-google-deepmind-dr-dreamerv3-arxiv-2301-8c75991e","quote":"Dreamer learns a model of the environment and improves its behavior by imagining future scenarios","speaker":{"name":"Google DeepMind (DreamerV3)","role":"institution","sort":"google deepmind (dreamerv3)","as_given":"Google DeepMind (DreamerV3)"},"source":{"work":"DreamerV3, arXiv:2301.04104","date":"2023 (Nature version 2025)"},"restored":"","themes":["world-models-industry"],"years":[2023,2025],"embed_text":"Google DeepMind (DreamerV3) | DreamerV3, arXiv:2301.04104 | 2023 (Nature version 2025) | Dreamer learns a model of the environment and improves its behavior by imagining future scenarios"},{"id":"q-john-n-guidi-probability-lecture--7e24908f","quote":"These Lecture Notes originated from the lectures presented by Gian-Carlo Rota, Professor of Applied Mathematics, for course 18.313 - Probability, which he taught at MIT, during the Spring 1998 semester. The Lecture Notes were produced from notes I made during class, audio recordings I made of lectures, as well as clarifications and expansions I made of the material presented, after the fact.","speaker":{"name":"John N. Guidi","role":"author","sort":"guidi, john n.","as_given":"John N. Guidi"},"source":{"work":"Probability: Lecture Notes, MIT Course 18.313, Professor Gian-Carlo Rota, Volume 1 of 2 (Lectures 1–21), preface","locus":"p. iii, dated October 15, 1998","date":"15 October 1998","url":"https://www.ellerman.org/wp-content/uploads/2016/06/Guidi-Notes-Rota-Probability-Vol-1-2.pdf"},"restored":"","themes":["rota-thought"],"years":[1998],"embed_text":"John N. Guidi | Probability: Lecture Notes, MIT Course 18.313, Professor Gian-Carlo Rota, Volume 1 of 2 (Lectures 1–21), preface | p. iii, dated October 15, 1998 | 15 October 1998 | These Lecture Notes originated from the lectures presented by Gian-Carlo Rota, Professor of Applied Mathematics, for course 18.313 - Probability, which he taught at MIT, during the Spring 1998 semester. The Lecture Notes were produced from notes I made during class, audio recordings I made of lectures, as well as clarifications and expansions I made of the material presented, after the fact."},{"id":"q-john-n-guidi-probability-lecture--5fae32bc","quote":"Sara Billey, Assistant Professor of Applied Mathematics, who was the course director and whose recitations I attended, presented lectures 20, 21, and 27.","speaker":{"name":"John N. Guidi","role":"author","sort":"guidi, john n.","as_given":"John N. Guidi"},"source":{"work":"Probability: Lecture Notes, MIT Course 18.313, Professor Gian-Carlo Rota, Volume 1 of 2, preface","locus":"p. iii","date":"15 October 1998","url":"https://www.ellerman.org/wp-content/uploads/2016/06/Guidi-Notes-Rota-Probability-Vol-1-2.pdf"},"restored":"","themes":["rota-thought"],"years":[1998],"embed_text":"John N. Guidi | Probability: Lecture Notes, MIT Course 18.313, Professor Gian-Carlo Rota, Volume 1 of 2, preface | p. iii | 15 October 1998 | Sara Billey, Assistant Professor of Applied Mathematics, who was the course director and whose recitations I attended, presented lectures 20, 21, and 27."},{"id":"q-kurt-godel-letter-to-john-von-n-5ccbe70d","quote":"I would be very happy to hear something from you personally. Please let me know if there is something that I can do for you.","speaker":{"name":"Kurt Gödel","role":"author","sort":"gödel, kurt","as_given":"Kurt Gödel"},"source":{"work":"Letter to John von Neumann, trans. Peter Clote and Jan Krajíček (first published in their Arithmetic, Proof Theory and Computational Complexity, Oxford, 1993; revised 11 September 2006)","locus":"closing","date":"20 March 1956","file":"02_VON_NEUMANN/letters_to_godel/Godel_Letter_to_Von_Neumann.md","url":"https://www.karlin.mff.cuni.cz/~krajicek/goedel-letter.pdf"},"restored":"","themes":["letters"],"years":[1956],"embed_text":"Kurt Gödel | Letter to John von Neumann, trans. Peter Clote and Jan Krajíček (first published in their Arithmetic, Proof Theory and Computational Complexity, Oxford, 1993; revised 11 September 2006) | closing | 20 March 1956 | I would be very happy to hear something from you personally. Please let me know if there is something that I can do for you."},{"id":"q-kurt-godel-letter-to-john-von-n-b5fe03d8","quote":"With the greatest sorrow I have learned of your illness. The news came to me as quite unexpected. Morgenstern already last summer told me of a bout of weakness you once had, but at that time he thought that this was not of any greater significance. As I hear, in the last months you have undergone a radical treatment and I am happy that this treatment was successful as desired, and that you are now doing better. I hope and wish for you that your condition will soon improve even more and that the newest medical discoveries, if possible, will lead to a complete recovery.","speaker":{"name":"Kurt Gödel","role":"author","sort":"gödel, kurt","as_given":"Kurt Gödel"},"source":{"work":"Letter to John von Neumann, trans. Peter Clote and Jan Krajíček (first published in their Arithmetic, Proof Theory and Computational Complexity, Oxford, 1993; revised 11 September 2006)","locus":"opening paragraph","date":"20 March 1956","file":"02_VON_NEUMANN/letters_to_godel/Godel_Letter_to_Von_Neumann.md","url":"https://www.karlin.mff.cuni.cz/~krajicek/goedel-letter.pdf"},"restored":"","themes":["letters"],"years":[1956],"embed_text":"Kurt Gödel | Letter to John von Neumann, trans. Peter Clote and Jan Krajíček (first published in their Arithmetic, Proof Theory and Computational Complexity, Oxford, 1993; revised 11 September 2006) | opening paragraph | 20 March 1956 | With the greatest sorrow I have learned of your illness. The news came to me as quite unexpected. Morgenstern already last summer told me of a bout of weakness you once had, but at that time he thought that this was not of any greater significance. As I hear, in the last months you have undergone a radical treatment and I am happy that this treatment was successful as desired, and that you are now doing better. I hope and wish for you that your condition will soon improve even more and that the newest medical discoveries, if possible, will lead to a complete recovery."},{"id":"q-kurt-godel-letter-to-john-von-n-f8ccf507","quote":"If there really were a machine with φ(n) ∼ k · n (or even ∼ k · n²), this would have consequences of the greatest importance [Tragweite]. Namely, it would obviously mean that in spite of the undecidability of the Entscheidungsproblem, the mental work of a mathematician concerning Yes-or-No questions could be completely replaced by a machine. After all, one would simply have to choose the natural number n so large that when the machine does not deliver a result, it makes no sense to think more about the problem.","speaker":{"name":"Kurt Gödel","role":"author","sort":"gödel, kurt","as_given":"Kurt Gödel"},"source":{"work":"Letter to John von Neumann, trans. Peter Clote and Jan Krajíček (first published in their Arithmetic, Proof Theory and Computational Complexity, Oxford, 1993; revised 11 September 2006)","locus":"second paragraph","date":"20 March 1956","file":"02_VON_NEUMANN/letters_to_godel/Godel_Letter_to_Von_Neumann.md","url":"https://www.karlin.mff.cuni.cz/~krajicek/goedel-letter.pdf"},"restored":"","themes":["letters"],"years":[1956],"embed_text":"Kurt Gödel | Letter to John von Neumann, trans. Peter Clote and Jan Krajíček (first published in their Arithmetic, Proof Theory and Computational Complexity, Oxford, 1993; revised 11 September 2006) | second paragraph | 20 March 1956 | If there really were a machine with φ(n) ∼ k · n (or even ∼ k · n²), this would have consequences of the greatest importance [Tragweite]. Namely, it would obviously mean that in spite of the undecidability of the Entscheidungsproblem, the mental work of a mathematician concerning Yes-or-No questions could be completely replaced by a machine. After all, one would simply have to choose the natural number n so large that when the machine does not deliver a result, it makes no sense to think more about the problem."},{"id":"q-kurt-godel-letter-to-john-von-n-0a1c7a13","quote":"Now it seems to me, however, to be completely within the realm of possibility that φ(n) grows that slowly. Since (1) it seems that φ(n) ≥ k · n is the only estimation which one can obtain by a generalization of the proof of the undecidability of the Entscheidungsproblem; and (2) after all φ(n) ∼ k · n (or ∼ k · n²) only means that the number of steps as opposed to trial and error can be reduced from N to log N (or (log N)²).","speaker":{"name":"Kurt Gödel","role":"author","sort":"gödel, kurt","as_given":"Kurt Gödel"},"source":{"work":"Letter to John von Neumann, trans. Peter Clote and Jan Krajíček (first published in their Arithmetic, Proof Theory and Computational Complexity, Oxford, 1993; revised 11 September 2006)","locus":"second paragraph","date":"20 March 1956","file":"02_VON_NEUMANN/letters_to_godel/Godel_Letter_to_Von_Neumann.md","url":"https://www.karlin.mff.cuni.cz/~krajicek/goedel-letter.pdf"},"restored":"","themes":["letters"],"years":[1956],"embed_text":"Kurt Gödel | Letter to John von Neumann, trans. Peter Clote and Jan Krajíček (first published in their Arithmetic, Proof Theory and Computational Complexity, Oxford, 1993; revised 11 September 2006) | second paragraph | 20 March 1956 | Now it seems to me, however, to be completely within the realm of possibility that φ(n) grows that slowly. Since (1) it seems that φ(n) ≥ k · n is the only estimation which one can obtain by a generalization of the proof of the undecidability of the Entscheidungsproblem; and (2) after all φ(n) ∼ k · n (or ∼ k · n²) only means that the number of steps as opposed to trial and error can be reduced from N to log N (or (log N)²)."},{"id":"q-kurt-godel-letter-to-john-von-n-1f7796f1","quote":"However, such strong reductions appear in other finite problems, for example in the computation of the quadratic residue symbol using repeated application of the law of reciprocity. It would be interesting to know, for instance, the situation concerning the determination of primality of a number and how strongly in general the number of steps in finite combinatorial problems can be reduced with respect to simple exhaustive search.","speaker":{"name":"Kurt Gödel","role":"author","sort":"gödel, kurt","as_given":"Kurt Gödel"},"source":{"work":"Letter to John von Neumann, trans. Peter Clote and Jan Krajíček (first published in their Arithmetic, Proof Theory and Computational Complexity, Oxford, 1993; revised 11 September 2006)","locus":"second paragraph, close","date":"20 March 1956","file":"02_VON_NEUMANN/letters_to_godel/Godel_Letter_to_Von_Neumann.md","url":"https://www.karlin.mff.cuni.cz/~krajicek/goedel-letter.pdf"},"restored":"","themes":["letters"],"years":[1956],"embed_text":"Kurt Gödel | Letter to John von Neumann, trans. Peter Clote and Jan Krajíček (first published in their Arithmetic, Proof Theory and Computational Complexity, Oxford, 1993; revised 11 September 2006) | second paragraph, close | 20 March 1956 | However, such strong reductions appear in other finite problems, for example in the computation of the quadratic residue symbol using repeated application of the law of reciprocity. It would be interesting to know, for instance, the situation concerning the determination of primality of a number and how strongly in general the number of steps in finite combinatorial problems can be reduced with respect to simple exhaustive search."},{"id":"q-kurt-godel-letter-to-john-von-n-779f7f55","quote":"Since you now, as I hear, are feeling stronger, I would like to allow myself to write you about a mathematical problem, of which your opinion would very much interest me: One can obviously easily construct a Turing machine, which for every formula F in first order predicate logic and every natural number n, allows one to decide if there is a proof of F of length n (length = number of symbols). Let ψ(F, n) be the number of steps the machine requires for this and let φ(n) = maxF ψ(F, n). The question is how fast φ(n) grows for an optimal machine. One can show that φ(n) ≥ k · n.","speaker":{"name":"Kurt Gödel","role":"author","sort":"gödel, kurt","as_given":"Kurt Gödel"},"source":{"work":"Letter to John von Neumann, trans. Peter Clote and Jan Krajíček (first published in their Arithmetic, Proof Theory and Computational Complexity, Oxford, 1993; revised 11 September 2006)","locus":"second paragraph, opening","date":"20 March 1956","file":"02_VON_NEUMANN/letters_to_godel/Godel_Letter_to_Von_Neumann.md","url":"https://www.karlin.mff.cuni.cz/~krajicek/goedel-letter.pdf"},"restored":"","themes":["letters"],"years":[1956],"embed_text":"Kurt Gödel | Letter to John von Neumann, trans. Peter Clote and Jan Krajíček (first published in their Arithmetic, Proof Theory and Computational Complexity, Oxford, 1993; revised 11 September 2006) | second paragraph, opening | 20 March 1956 | Since you now, as I hear, are feeling stronger, I would like to allow myself to write you about a mathematical problem, of which your opinion would very much interest me: One can obviously easily construct a Turing machine, which for every formula F in first order predicate logic and every natural number n, allows one to decide if there is a proof of F of length n (length = number of symbols). Let ψ(F, n) be the number of steps the machine requires for this and let φ(n) = maxF ψ(F, n). The question is how fast φ(n) grows for an optimal machine. One can show that φ(n) ≥ k · n."},{"id":"q-steve-j-heims-the-cybernetics-grou-4341d01b","quote":"At the Macy conferences the distinction between a probability space with fixed options and the alternative consideration of the possibility of enlarging the space of possible occurrences had arisen as a source of controversy in another connection, namely, with two different definitions of \"information,\" one favored by the American engineer Claude Shannon, a frequent guest at the meetings, and the other championed by a visitor from the British Isles, Donald MacKay. Both were at the eighth conference, and in the lively debate that followed MacKay's presentation Savage was an active participant.","speaker":{"name":"Steve J. Heims","role":"author","sort":"heims, steve j.","as_given":"Steve J. Heims (historian)"},"source":{"work":"The Cybernetics Group (Cambridge, MA: MIT Press, 1991)","locus":"p.112","date":"1991 (book); describing the 1951 Eighth Conference session","url":"https://archive.org/details/cyberneticsgroups"},"restored":"","themes":["macy"],"years":[1951,1991],"embed_text":"Steve J. Heims | The Cybernetics Group (Cambridge, MA: MIT Press, 1991) | p.112 | 1991 (book); describing the 1951 Eighth Conference session | At the Macy conferences the distinction between a probability space with fixed options and the alternative consideration of the possibility of enlarging the space of possible occurrences had arisen as a source of controversy in another connection, namely, with two different definitions of \"information,\" one favored by the American engineer Claude Shannon, a frequent guest at the meetings, and the other championed by a visitor from the British Isles, Donald MacKay. Both were at the eighth conference, and in the lively debate that followed MacKay's presentation Savage was an active participant."},{"id":"q-steve-j-heims-the-cybernetics-grou-437c4e44","quote":"The succeeding paper, a report by communication engineer Claude Shannon, on a \"recently developed method of estimating the amount of redundancy in printed English,\" neatly avoided all consideration of human characteristics, just as his famous definition of \"information\" had. In Shannon's analysis of printed English the statistical frequency of letter combinations is fundamental, but the \"meaning\" of a message is taken to be irrelevant.","speaker":{"name":"Steve J. Heims","role":"author","sort":"heims, steve j.","as_given":"Steve J. Heims (historian)"},"source":{"work":"The Cybernetics Group (Cambridge, MA: MIT Press, 1991)","locus":"pp.76-77","date":"1991 (book); describing the 1950 Seventh Conference session","url":"https://archive.org/details/cyberneticsgroups"},"restored":"","themes":["macy"],"years":[1950,1991],"embed_text":"Steve J. Heims | The Cybernetics Group (Cambridge, MA: MIT Press, 1991) | pp.76-77 | 1991 (book); describing the 1950 Seventh Conference session | The succeeding paper, a report by communication engineer Claude Shannon, on a \"recently developed method of estimating the amount of redundancy in printed English,\" neatly avoided all consideration of human characteristics, just as his famous definition of \"information\" had. In Shannon's analysis of printed English the statistical frequency of letter combinations is fundamental, but the \"meaning\" of a message is taken to be irrelevant."},{"id":"q-j-j-o-connor-and-e-gian-carlo-rota-1932-c83f517c","quote":"Rota was also a consultant with the Rand Corporation from 1966 to 1971 and with the Brookhaven National Laboratory from 1969 to 1973.","speaker":{"name":"J. J. O'Connor and E. F. Robertson","role":"author","sort":"j. j. o'connor and e. f. robertson","as_given":"J. J. O'Connor and E. F. Robertson"},"source":{"work":"“Gian-Carlo Rota (1932 - 1999),” biography, MacTutor History of Mathematics, University of St Andrews","date":"May 2000","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Rota/"},"restored":"","themes":["rota"],"years":[2000],"embed_text":"J. J. O'Connor and E. F. Robertson | “Gian-Carlo Rota (1932 - 1999),” biography, MacTutor History of Mathematics, University of St Andrews | May 2000 | Rota was also a consultant with the Rand Corporation from 1966 to 1971 and with the Brookhaven National Laboratory from 1969 to 1973."},{"id":"q-clay-blair-jr-clay-blair-jr-passin-30b7a89e","quote":"For more than a year Von Neumann had known he was going to die. But until the illness was far advanced he continued to devote himself to serving the government as a member of the Atomic Energy Commission, to which he was appointed in 1954. A telephone by his bed connected directly with his AEC office. On several occasions he was taken downtown in a limousine to attend commission meetings in a wheelchair. At Walter Reed, where he was moved early last spring, an Air Force officer, Lieut. Colonel Vincent Ford, worked full time assisting him. Eight airmen, all cleared for top secret material, were assigned to help on a 24-hour basis. His work for the Air Force and other government departments continued. Cabinet members and military officials continually came for his advice, and on one occasion Secretary of Defense Charles Wilson, Air Force Secretary Donald Quarles and most of the top Air Force brass gathered in Von Neumann's suite to consult his judgment while there was still time. So relentlessly did Von Neumann pursue his official duties that he risked neglecting the treatise which was to form the capstone of his work on the scientific specialty, computing machines, to which he had devoted many recent years.","speaker":{"name":"Clay Blair Jr.","role":"author","sort":"jr., clay blair","as_given":"Clay Blair Jr."},"source":{"work":"Clay Blair Jr., \"Passing of a Great Mind,\" Life, 25 February 1957","locus":"p.89","date":"25 February 1957","url":"https://pdf.stafforini.com/blair-1957-passing-of-great.pdf"},"restored":"","themes":["von neumann"],"years":[1957],"embed_text":"Clay Blair Jr. | Clay Blair Jr., \"Passing of a Great Mind,\" Life, 25 February 1957 | p.89 | 25 February 1957 | For more than a year Von Neumann had known he was going to die. But until the illness was far advanced he continued to devote himself to serving the government as a member of the Atomic Energy Commission, to which he was appointed in 1954. A telephone by his bed connected directly with his AEC office. On several occasions he was taken downtown in a limousine to attend commission meetings in a wheelchair. At Walter Reed, where he was moved early last spring, an Air Force officer, Lieut. Colonel Vincent Ford, worked full time assisting him. Eight airmen, all cleared for top secret material, were assigned to help on a 24-hour basis. His work for the Air Force and other government departments continued. Cabinet members and military officials continually came for his advice, and on one occasion Secretary of Defense Charles Wilson, Air Force Secretary Donald Quarles and most of the top Air Force brass gathered in Von Neumann's suite to consult his judgment while there was still time. So relentlessly did Von Neumann pursue his official duties that he risked neglecting the treatise which was to form the capstone of his work on the scientific specialty, computing machines, to which he had devoted many recent years."},{"id":"q-clay-blair-jr-clay-blair-jr-passin-55dba9a4","quote":"A hard-boiled strategist, he was one of the few scientists to advocate preventive war, and in 1950 he was remarking, \"If you say why not bomb them tomorrow, I say why not today? If you say today at 5 o'clock, I say why not 1 o'clock?\"","speaker":{"name":"Clay Blair Jr.","role":"author","sort":"jr., clay blair","as_given":"Clay Blair Jr."},"source":{"work":"Clay Blair Jr., \"Passing of a Great Mind,\" Life, 25 February 1957","locus":"p.96","date":"25 February 1957","url":"https://pdf.stafforini.com/blair-1957-passing-of-great.pdf"},"restored":"","themes":["von neumann"],"years":[1957],"embed_text":"Clay Blair Jr. | Clay Blair Jr., \"Passing of a Great Mind,\" Life, 25 February 1957 | p.96 | 25 February 1957 | A hard-boiled strategist, he was one of the few scientists to advocate preventive war, and in 1950 he was remarking, \"If you say why not bomb them tomorrow, I say why not today? If you say today at 5 o'clock, I say why not 1 o'clock?\""},{"id":"q-karcini-mehrban-ng-robots-need-more-tha-6a0d80f8","quote":"Human motion, internet video, simulation rollouts, and interactive demonstrations contain rich information about tasks, goals, contacts, failures, and physical constraints, yet most of this information is not directly usable by robot policies because it lacks embodiment-specific action labels, task semantics, and reward structure.","speaker":{"name":"Karcini, Mehrban, Nguyen, Schwager, Ajoundani, Cadena, Peters, Hutter and Bou-Ammar","role":"author","sort":"karcini, mehrban, nguyen, schwager, ajoundani, cadena, peters, hutter and bou-ammar","as_given":"Karcini, Mehrban, Nguyen, Schwager, Ajoundani, Cadena, Peters, Hutter and Bou-Ammar"},"source":{"work":"“Robots Need More than VLA and World Models,” arXiv:2606.06556","date":"4 June 2026"},"restored":"","themes":["robotics-data"],"years":[2026],"embed_text":"Karcini, Mehrban, Nguyen, Schwager, Ajoundani, Cadena, Peters, Hutter and Bou-Ammar | “Robots Need More than VLA and World Models,” arXiv:2606.06556 | 4 June 2026 | Human motion, internet video, simulation rollouts, and interactive demonstrations contain rich information about tasks, goals, contacts, failures, and physical constraints, yet most of this information is not directly usable by robot policies because it lacks embodiment-specific action labels, task semantics, and reward structure."},{"id":"q-kenneth-baclawski--an-introduction-to-p-2afb4ffc","quote":"Copyright © 1979 by Kenneth Baclawski and Gian-Carlo Rota. All rights reserved.","speaker":{"name":"Kenneth Baclawski and Gian-Carlo Rota","role":"author","sort":"kenneth baclawski and gian-carlo rota","as_given":"Kenneth Baclawski and Gian-Carlo Rota"},"source":{"work":"An Introduction to Probability and Random Processes, typescript, copyright page","locus":"verso of title page; table of contents p. iv lists Chapter VII “Entropy and Information” with “Uniqueness of Entropy” at 7.14","date":"1979","url":"https://archive.org/details/GianCarlo_Rota_and_Kenneth_Baclawski__An_Introduction_to_Probability_and_Random_Processes"},"restored":"","themes":["rota-thought"],"years":[1979],"embed_text":"Kenneth Baclawski and Gian-Carlo Rota | An Introduction to Probability and Random Processes, typescript, copyright page | verso of title page; table of contents p. iv lists Chapter VII “Entropy and Information” with “Uniqueness of Entropy” at 7.14 | 1979 | Copyright © 1979 by Kenneth Baclawski and Gian-Carlo Rota. All rights reserved."},{"id":"q-kenneth-baclawski--introduction-to-prob-d4d3fc57","quote":"That probability is closely connected with information should come as no surprise… What entropy does is to make this connection precise.","speaker":{"name":"Kenneth Baclawski, Gian-Carlo Rota and Sara Billey","role":"author","sort":"kenneth baclawski, gian-carlo rota and sara billey","as_given":"Kenneth Baclawski, Gian-Carlo Rota and Sara Billey"},"source":{"work":"Introduction to Probability Theory, ch. VIII, “Entropy and Information”","locus":"ch. VIII opening","date":"unpublished lecture notes, preliminary edition, c. 1992–93"},"restored":"","themes":["monte-carlo-and-automata"],"years":[1992],"embed_text":"Kenneth Baclawski, Gian-Carlo Rota and Sara Billey | Introduction to Probability Theory, ch. VIII, “Entropy and Information” | ch. VIII opening | unpublished lecture notes, preliminary edition, c. 1992–93 | That probability is closely connected with information should come as no surprise… What entropy does is to make this connection precise."},{"id":"q-kenneth-baclawski--introduction-to-prob-413ba930","quote":"The four principal processes of probability theory are all determined by maximum entropy properties.","speaker":{"name":"Kenneth Baclawski, Gian-Carlo Rota and Sara Billey","role":"author","sort":"kenneth baclawski, gian-carlo rota and sara billey","as_given":"Kenneth Baclawski, Gian-Carlo Rota and Sara Billey"},"source":{"work":"Introduction to Probability Theory, ch. VIII, “Entropy and Information”","locus":"§3, summary","date":"unpublished lecture notes, preliminary edition, c. 1992–93"},"restored":"","themes":["monte-carlo-and-automata"],"years":[1992],"embed_text":"Kenneth Baclawski, Gian-Carlo Rota and Sara Billey | Introduction to Probability Theory, ch. VIII, “Entropy and Information” | §3, summary | unpublished lecture notes, preliminary edition, c. 1992–93 | The four principal processes of probability theory are all determined by maximum entropy properties."},{"id":"q-joseph-p-s-kung-joseph-p-s-kung-gian-9c8ec7f5","quote":"There Rota joined the group of graduate students in functional analysis laboring on what would become the field’s canonical work, often referred to as “Dunford-Schwartz.”","speaker":{"name":"Joseph P. S. Kung","role":"author","sort":"kung, joseph p. s.","as_given":"Joseph P. S. Kung"},"source":{"work":"Joseph P. S. Kung, “Gian-Carlo Rota, 1932–1999,” Biographical Memoirs, National Academy of Sciences, 2016","locus":"p. 3","date":"2016","url":"https://www.nasonline.org/wp-content/uploads/2024/06/rota-gian-carlo.pdf"},"restored":"","themes":["rota"],"years":[2016],"embed_text":"Joseph P. S. Kung | Joseph P. S. Kung, “Gian-Carlo Rota, 1932–1999,” Biographical Memoirs, National Academy of Sciences, 2016 | p. 3 | 2016 | There Rota joined the group of graduate students in functional analysis laboring on what would become the field’s canonical work, often referred to as “Dunford-Schwartz.”"},{"id":"q-joseph-p-s-kung-joseph-p-s-kung-gian-0dc9b617","quote":"Rota did his doctoral research under the direction of Jacob T. Schwartz and defended his thesis, “Extension Theory of Differential Operators,” in 1956.","speaker":{"name":"Joseph P. S. Kung","role":"author","sort":"kung, joseph p. s.","as_given":"Joseph P. S. Kung"},"source":{"work":"Joseph P. S. Kung, “Gian-Carlo Rota, 1932–1999,” Biographical Memoirs, National Academy of Sciences, 2016","locus":"p. 3","date":"2016","url":"https://www.nasonline.org/wp-content/uploads/2024/06/rota-gian-carlo.pdf"},"restored":"","themes":["rota"],"years":[2016],"embed_text":"Joseph P. S. Kung | Joseph P. S. Kung, “Gian-Carlo Rota, 1932–1999,” Biographical Memoirs, National Academy of Sciences, 2016 | p. 3 | 2016 | Rota did his doctoral research under the direction of Jacob T. Schwartz and defended his thesis, “Extension Theory of Differential Operators,” in 1956."},{"id":"q-joseph-p-s-kung-joseph-p-s-kung-gian-c61a46d2","quote":"After Yale, Rota was a temporary member of the Courant Institute of Mathematical Sciences (1956–1957) and a Benjamin Pierce Instructor at Harvard University (1957–59).","speaker":{"name":"Joseph P. S. Kung","role":"author","sort":"kung, joseph p. s.","as_given":"Joseph P. S. Kung"},"source":{"work":"Joseph P. S. Kung, “Gian-Carlo Rota, 1932–1999,” Biographical Memoirs, National Academy of Sciences, 2016","locus":"p. 4","date":"2016","url":"https://www.nasonline.org/wp-content/uploads/2024/06/rota-gian-carlo.pdf"},"restored":"","themes":["rota"],"years":[2016],"embed_text":"Joseph P. S. Kung | Joseph P. S. Kung, “Gian-Carlo Rota, 1932–1999,” Biographical Memoirs, National Academy of Sciences, 2016 | p. 4 | 2016 | After Yale, Rota was a temporary member of the Courant Institute of Mathematical Sciences (1956–1957) and a Benjamin Pierce Instructor at Harvard University (1957–59)."},{"id":"q-joseph-p-s-kung-joseph-p-s-kung-gian-0d633eba","quote":"Among his numerous honors, Rota was a senior fellow at the Los Alamos National Laboratory from 1971 on, spending several weeks there every year.","speaker":{"name":"Joseph P. S. Kung","role":"author","sort":"kung, joseph p. s.","as_given":"Joseph P. S. Kung"},"source":{"work":"Joseph P. S. Kung, “Gian-Carlo Rota, 1932–1999,” Biographical Memoirs, National Academy of Sciences, 2016","locus":"p. 5","date":"2016","url":"https://www.nasonline.org/wp-content/uploads/2024/06/rota-gian-carlo.pdf"},"restored":"","themes":["rota"],"years":[2016],"embed_text":"Joseph P. S. Kung | Joseph P. S. Kung, “Gian-Carlo Rota, 1932–1999,” Biographical Memoirs, National Academy of Sciences, 2016 | p. 5 | 2016 | Among his numerous honors, Rota was a senior fellow at the Los Alamos National Laboratory from 1971 on, spending several weeks there every year."},{"id":"q-joseph-p-s-kung-joseph-p-s-kung-gian-47b872b5","quote":"The National Security Agency awarded him the Medal for Distinguished Service in 1992, though what he did to deserve the honor was classified.","speaker":{"name":"Joseph P. S. Kung","role":"author","sort":"kung, joseph p. s.","as_given":"Joseph P. S. Kung"},"source":{"work":"Joseph P. S. Kung, “Gian-Carlo Rota, 1932–1999,” Biographical Memoirs, National Academy of Sciences, 2016","locus":"p. 6","date":"2016","url":"https://www.nasonline.org/wp-content/uploads/2024/06/rota-gian-carlo.pdf"},"restored":"","themes":["secrecy"],"years":[2016],"embed_text":"Joseph P. S. Kung | Joseph P. S. Kung, “Gian-Carlo Rota, 1932–1999,” Biographical Memoirs, National Academy of Sciences, 2016 | p. 6 | 2016 | The National Security Agency awarded him the Medal for Distinguished Service in 1992, though what he did to deserve the honor was classified."},{"id":"q-ray-kurzweil-the-computer-and-the-13be85da","quote":"The original rationale for that organization is here briskly and lucidly outlined in von Neumann's own words, although he speaks of \"code\" where we now speak of \"programs,\" and he speaks of \"complete codes\" versus \"short codes\" where we now speak of \"machine-language programs\" versus \"high-level programming languages.\"","speaker":{"name":"Ray Kurzweil","role":"author","sort":"kurzweil, ray","as_given":"Ray Kurzweil (Foreword)"},"source":{"work":"The Computer and the Brain (2000 Yale Nota Bene edition, Foreword by Ray Kurzweil)","locus":"Foreword, unnumbered page (early front matter)","date":"2000 (foreword; book originally 1958)","url":"https://archive.org/details/the-computer-and-the-brain-by-john-von-neumann"},"restored":"","themes":["vncodes"],"years":[1958,2000],"embed_text":"Ray Kurzweil | The Computer and the Brain (2000 Yale Nota Bene edition, Foreword by Ray Kurzweil) | Foreword, unnumbered page (early front matter) | 2000 (foreword; book originally 1958) | The original rationale for that organization is here briskly and lucidly outlined in von Neumann's own words, although he speaks of \"code\" where we now speak of \"programs,\" and he speaks of \"complete codes\" versus \"short codes\" where we now speak of \"machine-language programs\" versus \"high-level programming languages.\""},{"id":"q-brookhaven-nationa-beginnings-brookhave-bb715d22","quote":"The U.S. War Department transferred Camp Upton to the Atomic Energy Commission, DOE's predecessor, for the founding of Brookhaven Lab in 1947 and our history of discovery began.","speaker":{"name":"Brookhaven National Laboratory","role":"author","sort":"laboratory, brookhaven national","as_given":"Brookhaven National Laboratory"},"source":{"work":"“Beginnings,” Brookhaven National Laboratory 75th Anniversary website","locus":"paragraph beginning “In 1946, representatives from nine major universities”","date":"current at 2026-09-28","url":"https://www.bnl.gov/75/beginnings.php"},"restored":"","themes":["brookhaven-lattice-qcd"],"years":[2026],"embed_text":"Brookhaven National Laboratory | “Beginnings,” Brookhaven National Laboratory 75th Anniversary website | paragraph beginning “In 1946, representatives from nine major universities” | current at 2026-09-28 | The U.S. War Department transferred Camp Upton to the Atomic Energy Commission, DOE's predecessor, for the founding of Brookhaven Lab in 1947 and our history of discovery began."},{"id":"q-brookhaven-nationa-lab-celebrates-new-s-e950654a","quote":"UPTON, NY - In honor of the 25th anniversary of a scientific paper describing the first use of Monte Carlo methods and lattice gauge calculations in the study of quantum chromodynamics (QCD) - the theory that describes the interactions of subatomic particles - scientists gathered at the U.S. Department of Energy's Brookhaven National Laboratory for a morning of talks to dedicate the newest supercomputer devoted to these studies.","speaker":{"name":"Brookhaven National Laboratory","role":"author","sort":"laboratory, brookhaven national","as_given":"Brookhaven National Laboratory"},"source":{"work":"“Lab Celebrates New Supercomputer,” Brookhaven National Laboratory newsroom","locus":"first paragraph","date":"1 December 2005","url":"https://www.bnl.gov/newsroom/news.php?a=110400"},"restored":"","themes":["brookhaven-lattice-qcd"],"years":[2005],"embed_text":"Brookhaven National Laboratory | “Lab Celebrates New Supercomputer,” Brookhaven National Laboratory newsroom | first paragraph | 1 December 2005 | UPTON, NY - In honor of the 25th anniversary of a scientific paper describing the first use of Monte Carlo methods and lattice gauge calculations in the study of quantum chromodynamics (QCD) - the theory that describes the interactions of subatomic particles - scientists gathered at the U.S. Department of Energy's Brookhaven National Laboratory for a morning of talks to dedicate the newest supercomputer devoted to these studies."},{"id":"q-brookhaven-nationa-timeline-of-discover-9dea8bac","quote":"The U.S. War Department transfers Camp Upton to the Atomic Energy Commission, the U.S. Department of Energy's predecessor, on March 21 for the founding of Brookhaven National Laboratory.","speaker":{"name":"Brookhaven National Laboratory","role":"author","sort":"laboratory, brookhaven national","as_given":"Brookhaven National Laboratory"},"source":{"work":"“Timeline of Discovery,” Brookhaven National Laboratory 75th Anniversary website","locus":"1947 entry, “Transfer to the Atomic Energy Commission”","date":"current at 2026-09-28","url":"https://www.bnl.gov/75/timeline.php"},"restored":"","themes":["brookhaven-lattice-qcd"],"years":[2026],"embed_text":"Brookhaven National Laboratory | “Timeline of Discovery,” Brookhaven National Laboratory 75th Anniversary website | 1947 entry, “Transfer to the Atomic Energy Commission” | current at 2026-09-28 | The U.S. War Department transfers Camp Upton to the Atomic Energy Commission, the U.S. Department of Energy's predecessor, on March 21 for the founding of Brookhaven National Laboratory."},{"id":"q-alexandre-lebrun-quoted-in-techcrunch-15c4b0cd","quote":"My prediction is that ‘world models’ will be the next buzzword. In six months, every company will call itself a world model to raise funding.","speaker":{"name":"Alexandre LeBrun","role":"reported","sort":"lebrun, alexandre","as_given":"Alexandre LeBrun"},"source":{"work":"quoted in TechCrunch, on AMI Labs’ $1.03bn raise","date":"March 2026"},"restored":"","themes":["world-models-industry"],"years":[2026],"embed_text":"Alexandre LeBrun | quoted in TechCrunch, on AMI Labs’ $1.03bn raise | March 2026 | My prediction is that ‘world models’ will be the next buzzword. In six months, every company will call itself a world model to raise funding."},{"id":"q-sergey-levine-sporks-of-agi-sergey-3c8adbf2","quote":"will try to predict how a human will approach this problem, rather than predicting an effective strategy for a robot","speaker":{"name":"Sergey Levine","role":"author","sort":"levine, sergey","as_given":"Sergey Levine"},"source":{"work":"“Sporks of AGI” (sergeylevine.substack.com)","date":"21 July 2025"},"restored":"","themes":["robotics-data"],"years":[2025],"embed_text":"Sergey Levine | “Sporks of AGI” (sergeylevine.substack.com) | 21 July 2025 | will try to predict how a human will approach this problem, rather than predicting an effective strategy for a robot"},{"id":"q-sergey-levine-sporks-of-agi-sergey-0036be01","quote":"the robot won’t master the real world unless it gets to see itself doing stuff in the real world","speaker":{"name":"Sergey Levine","role":"author","sort":"levine, sergey","as_given":"Sergey Levine"},"source":{"work":"“Sporks of AGI” (sergeylevine.substack.com)","date":"21 July 2025"},"restored":"","themes":["robotics-data"],"years":[2025],"embed_text":"Sergey Levine | “Sporks of AGI” (sergeylevine.substack.com) | 21 July 2025 | the robot won’t master the real world unless it gets to see itself doing stuff in the real world"},{"id":"q-fei-fei-li-from-words-to-worlds-bf6352fb","quote":"AI-generated videos—nascent and yes, very cool—often lose coherence after a few seconds.","speaker":{"name":"Fei-Fei Li","role":"author","sort":"li, fei-fei","as_given":"Fei-Fei Li"},"source":{"work":"“From Words to Worlds: Spatial Intelligence” (drfeifei.substack.com)","date":"2025"},"restored":"","themes":["world-models-industry"],"years":[2025],"embed_text":"Fei-Fei Li | “From Words to Worlds: Spatial Intelligence” (drfeifei.substack.com) | 2025 | AI-generated videos—nascent and yes, very cool—often lose coherence after a few seconds."},{"id":"q-fei-fei-li-from-words-to-worlds-0d8b052f","quote":"Spatial Intelligence is the scaffolding upon which our cognition is built.","speaker":{"name":"Fei-Fei Li","role":"author","sort":"li, fei-fei","as_given":"Fei-Fei Li"},"source":{"work":"“From Words to Worlds: Spatial Intelligence” (drfeifei.substack.com)","date":"2025"},"restored":"","themes":["world-models-industry"],"years":[2025],"embed_text":"Fei-Fei Li | “From Words to Worlds: Spatial Intelligence” (drfeifei.substack.com) | 2025 | Spatial Intelligence is the scaffolding upon which our cognition is built."},{"id":"q-libero-plus-libero-plus-cvpr-202-3378b1a6","quote":"even without any valid language input, the performance of some models remained largely unchanged.","speaker":{"name":"LIBERO-Plus","role":"institution","sort":"libero-plus","as_given":"LIBERO-Plus"},"source":{"work":"LIBERO-Plus, CVPR 2026","date":"2026"},"restored":"","themes":["benchmarks"],"years":[2026],"embed_text":"LIBERO-Plus | LIBERO-Plus, CVPR 2026 | 2026 | even without any valid language input, the performance of some models remained largely unchanged."},{"id":"q-libero-pro-arxiv-2510-03827-db370543","quote":"although existing models achieve over 90% accuracy under the standard LIBERO evaluation, their performance collapses to 0.0% under our generalized setting.","speaker":{"name":"LIBERO-PRO","role":"institution","sort":"libero-pro","as_given":"LIBERO-PRO"},"source":{"work":"arXiv:2510.03827","date":"October 2025"},"restored":"","themes":["benchmarks"],"years":[2025],"embed_text":"LIBERO-PRO | arXiv:2510.03827 | October 2025 | although existing models achieve over 90% accuracy under the standard LIBERO evaluation, their performance collapses to 0.0% under our generalized setting."},{"id":"q-martin-davis-and-e-martin-davis-and-edm-37751427","quote":"He remained at Yale for several years after receiving the doctorate and moved to New York University in 1957, where he continued at the Courant Institute of Mathematical Sciences until his retirement in 2005.","speaker":{"name":"Martin Davis and Edmond Schonberg","role":"author","sort":"martin davis and edmond schonberg","as_given":"Martin Davis and Edmond Schonberg"},"source":{"work":"Martin Davis and Edmond Schonberg, “Jacob Theodore Schwartz, 1930–2009,” Biographical Memoir, National Academy of Sciences, 2011","locus":"p. 4","date":"2011","url":"https://www.nasonline.org/wp-content/uploads/2024/06/schwartz-jacob-t.pdf"},"restored":"","themes":["rota"],"years":[2011],"embed_text":"Martin Davis and Edmond Schonberg | Martin Davis and Edmond Schonberg, “Jacob Theodore Schwartz, 1930–2009,” Biographical Memoir, National Academy of Sciences, 2011 | p. 4 | 2011 | He remained at Yale for several years after receiving the doctorate and moved to New York University in 1957, where he continued at the Courant Institute of Mathematical Sciences until his retirement in 2005."},{"id":"q-martin-davis-and-e-martin-davis-and-edm-24110453","quote":"In 1969 he founded the Computer Science Department at New York University under the umbrella of the Courant Institute of Mathematical Sciences. He served as chair of the department until 1977. Jack’s directorship of the Information Science and Technology Office at the Defense Advanced Research Projects Agency during his two-year leave (1987-1989) from NYU enabled him to seriously influence the direction of research in computer science in the United States.","speaker":{"name":"Martin Davis and Edmond Schonberg","role":"author","sort":"martin davis and edmond schonberg","as_given":"Martin Davis and Edmond Schonberg"},"source":{"work":"Martin Davis and Edmond Schonberg, “Jacob Theodore Schwartz, 1930–2009,” Biographical Memoir, National Academy of Sciences, 2011","locus":"pp. 8–9","date":"2011","url":"https://www.nasonline.org/wp-content/uploads/2024/06/schwartz-jacob-t.pdf"},"restored":"","themes":["rota"],"years":[2011],"embed_text":"Martin Davis and Edmond Schonberg | Martin Davis and Edmond Schonberg, “Jacob Theodore Schwartz, 1930–2009,” Biographical Memoir, National Academy of Sciences, 2011 | pp. 8–9 | 2011 | In 1969 he founded the Computer Science Department at New York University under the umbrella of the Courant Institute of Mathematical Sciences. He served as chair of the department until 1977. Jack’s directorship of the Information Science and Technology Office at the Defense Advanced Research Projects Agency during his two-year leave (1987-1989) from NYU enabled him to seriously influence the direction of research in computer science in the United States."},{"id":"q-warren-mcculloch-cybernetics-circular-e0ab041b","quote":"May I interject some remarks that may help Von Neumann? In this case the motor neuron is the place on which you get the greatest convergence of dissimilar signals, that is, signals from dissimilar sources. It is the point at which it matters least which neuron fires, because the muscle will add tensions. Consequently, if it is motor neuron A rather than motor neuron B in a given pool, you are all right. All you need to do is to determine roughly the number, and you will determine roughly the amplitude of that contraction of the muscle or the force of the contraction.","speaker":{"name":"Warren McCulloch","role":"author","sort":"mcculloch, warren","as_given":"Warren McCulloch"},"source":{"work":"Cybernetics: Circular Causal and Feedback Mechanisms in Biological and Social Systems, Transactions of the Seventh Conference (discussion following Ralph Gerard's paper, session 'Digital Notions in the Central Nervous System')","locus":"p. 178 (bracketed reprint pagination [22]–[23])","date":"23–24 March 1950 (Seventh Macy Conference on Cybernetics)","url":"https://hostb.org/5Z8/Pias,%20Claus%20ed.%20-%20Cybernetics%20The%20Macy%20Conferences%201946-1953%20I%202003.pdf"},"restored":"","themes":["machines"],"years":[1950],"embed_text":"Warren McCulloch | Cybernetics: Circular Causal and Feedback Mechanisms in Biological and Social Systems, Transactions of the Seventh Conference (discussion following Ralph Gerard's paper, session 'Digital Notions in the Central Nervous System') | p. 178 (bracketed reprint pagination [22]–[23]) | 23–24 March 1950 (Seventh Macy Conference on Cybernetics) | May I interject some remarks that may help Von Neumann? In this case the motor neuron is the place on which you get the greatest convergence of dissimilar signals, that is, signals from dissimilar sources. It is the point at which it matters least which neuron fires, because the muscle will add tensions. Consequently, if it is motor neuron A rather than motor neuron B in a given pool, you are all right. All you need to do is to determine roughly the number, and you will determine roughly the amplitude of that contraction of the muscle or the force of the contraction."},{"id":"q-meta-ai-v-jepa-2-launch-blog-76d5a15a","quote":"Before taking action, we use our world model to imagine the potential consequences.","speaker":{"name":"Meta AI","role":"institution","sort":"meta ai","as_given":"Meta AI"},"source":{"work":"V-JEPA 2 launch blog post, ai.meta.com","date":"June 2025"},"restored":"","themes":["world-models-industry"],"years":[2025],"embed_text":"Meta AI | V-JEPA 2 launch blog post, ai.meta.com | June 2025 | Before taking action, we use our world model to imagine the potential consequences."},{"id":"q-meta-ai-v-jepa-2-launch-blog-e2bb69f9","quote":"Our internal model of the world provides us with this intuition and also acts as an internal simulator, allowing us to predict the outcome of a hypothetical action.","speaker":{"name":"Meta AI","role":"institution","sort":"meta ai","as_given":"Meta AI"},"source":{"work":"V-JEPA 2 launch blog post, ai.meta.com","date":"June 2025"},"restored":"","themes":["world-models-industry"],"years":[2025],"embed_text":"Meta AI | V-JEPA 2 launch blog post, ai.meta.com | June 2025 | Our internal model of the world provides us with this intuition and also acts as an internal simulator, allowing us to predict the outcome of a hypothetical action."},{"id":"q-meta-ai-v-jepa-2-arxiv-2506--cd8f6b1f","quote":"the JEPA approach focuses on learning representations for predictable aspects of a scene (e.g., the trajectory of an object in motion) while ignoring unpredictable details that generative objectives emphasize, since they make pixel-level predictions.","speaker":{"name":"Meta AI","role":"institution","sort":"meta ai","as_given":"Meta AI (V-JEPA 2)"},"source":{"work":"V-JEPA 2, arXiv:2506.09985","date":"June 2025"},"restored":"","themes":["world-models-industry"],"years":[2025],"embed_text":"Meta AI | V-JEPA 2, arXiv:2506.09985 | June 2025 | the JEPA approach focuses on learning representations for predictable aspects of a scene (e.g., the trajectory of an object in motion) while ignoring unpredictable details that generative objectives emphasize, since they make pixel-level predictions."},{"id":"q-nicholas-metropoli-nicholas-metropolis--043431db","quote":"Johnny von Neumann who was very, very quick—I mean, you have no idea how quickly he would infer things and extrapolate them. Well, he was fantastic. Stan Ulam was here during the war, but he didn't do very much during the war. I mean, mathematicians were not as prevalent as they are today. Although Johnny von Neumann was very, very good and very quick and very sharp. He just was a universalist. He was not a mathematician.","speaker":{"name":"Nicholas Metropolis","role":"author","sort":"metropolis, nicholas","as_given":"Nicholas Metropolis"},"source":{"work":"Nicholas Metropolis, oral history interview conducted by Richard Rhodes; transcript published by the Atomic Heritage Foundation / National Museum of Nuclear Science & History, Voices of the Manhattan Project","locus":"transcript, unpaginated","date":"12 September 1993","url":"https://ahf.nuclearmuseum.org/voices/oral-histories/nicholas-metropolis-interview/"},"restored":"","themes":["machines"],"years":[1993],"embed_text":"Nicholas Metropolis | Nicholas Metropolis, oral history interview conducted by Richard Rhodes; transcript published by the Atomic Heritage Foundation / National Museum of Nuclear Science & History, Voices of the Manhattan Project | transcript, unpaginated | 12 September 1993 | Johnny von Neumann who was very, very quick—I mean, you have no idea how quickly he would infer things and extrapolate them. Well, he was fantastic. Stan Ulam was here during the war, but he didn't do very much during the war. I mean, mathematicians were not as prevalent as they are today. Although Johnny von Neumann was very, very good and very quick and very sharp. He just was a universalist. He was not a mathematician."},{"id":"q-nicholas-metropoli-nicholas-metropolis--2234d652","quote":"He suggested that Stan Frankel and I look after the ENIAC and see if we can set up the problems there.","speaker":{"name":"Nicholas Metropolis","role":"author","sort":"metropolis, nicholas","as_given":"Nicholas Metropolis"},"source":{"work":"Nicholas Metropolis, oral history interview conducted by Richard Rhodes; transcript published by the Atomic Heritage Foundation / National Museum of Nuclear Science & History, Voices of the Manhattan Project","locus":"transcript, unpaginated","date":"12 September 1993","url":"https://ahf.nuclearmuseum.org/voices/oral-histories/nicholas-metropolis-interview/"},"restored":"","themes":["machines"],"years":[1993],"embed_text":"Nicholas Metropolis | Nicholas Metropolis, oral history interview conducted by Richard Rhodes; transcript published by the Atomic Heritage Foundation / National Museum of Nuclear Science & History, Voices of the Manhattan Project | transcript, unpaginated | 12 September 1993 | He suggested that Stan Frankel and I look after the ENIAC and see if we can set up the problems there."},{"id":"q-nicholas-metropoli-nicholas-metropolis--8f2a3359","quote":"Johnny had a very good argument for letting us do the shakedown cruise, as it was called, because we could test out about 95% of the control units, whereas the problems that the Ballistics Research Laboratory had were about 25%.","speaker":{"name":"Nicholas Metropolis","role":"author","sort":"metropolis, nicholas","as_given":"Nicholas Metropolis"},"source":{"work":"Nicholas Metropolis, oral history interview conducted by Richard Rhodes; transcript published by the Atomic Heritage Foundation / National Museum of Nuclear Science & History, Voices of the Manhattan Project","locus":"transcript, unpaginated","date":"12 September 1993","url":"https://ahf.nuclearmuseum.org/voices/oral-histories/nicholas-metropolis-interview/"},"restored":"","themes":["machines"],"years":[1993],"embed_text":"Nicholas Metropolis | Nicholas Metropolis, oral history interview conducted by Richard Rhodes; transcript published by the Atomic Heritage Foundation / National Museum of Nuclear Science & History, Voices of the Manhattan Project | transcript, unpaginated | 12 September 1993 | Johnny had a very good argument for letting us do the shakedown cruise, as it was called, because we could test out about 95% of the control units, whereas the problems that the Ballistics Research Laboratory had were about 25%."},{"id":"q-nicholas-metropoli-nicholas-metropolis--75b38c03","quote":"I went twice to Chicago, once in '46 and then another time in late '57. I arrived in Chicago when Sputnik was——October 4, 1957 is the date of Sputnik. I arrived in Chicago on that date and I went there and stayed there for about eight years.","speaker":{"name":"Nicholas Metropolis","role":"author","sort":"metropolis, nicholas","as_given":"Nicholas Metropolis"},"source":{"work":"Nicholas Metropolis, oral history interview conducted by Richard Rhodes; transcript published by the Atomic Heritage Foundation / National Museum of Nuclear Science & History, Voices of the Manhattan Project","locus":"transcript, unpaginated","date":"12 September 1993","url":"https://ahf.nuclearmuseum.org/voices/oral-histories/nicholas-metropolis-interview/"},"restored":"","themes":["machines"],"years":[1993],"embed_text":"Nicholas Metropolis | Nicholas Metropolis, oral history interview conducted by Richard Rhodes; transcript published by the Atomic Heritage Foundation / National Museum of Nuclear Science & History, Voices of the Manhattan Project | transcript, unpaginated | 12 September 1993 | I went twice to Chicago, once in '46 and then another time in late '57. I arrived in Chicago when Sputnik was——October 4, 1957 is the date of Sputnik. I arrived in Chicago on that date and I went there and stayed there for about eight years."},{"id":"q-nicholas-metropoli-nicholas-metropolis--42a210d2","quote":"I was in charge of the research on computers and designed a computer. We thought we would try to develop computer engineering as opposed to electronic engineering, thereby training people who were electronic engineers to learn about computer engineering.","speaker":{"name":"Nicholas Metropolis","role":"author","sort":"metropolis, nicholas","as_given":"Nicholas Metropolis"},"source":{"work":"Nicholas Metropolis, oral history interview conducted by Richard Rhodes; transcript published by the Atomic Heritage Foundation / National Museum of Nuclear Science & History, Voices of the Manhattan Project","locus":"transcript, unpaginated","date":"12 September 1993","url":"https://ahf.nuclearmuseum.org/voices/oral-histories/nicholas-metropolis-interview/"},"restored":"","themes":["machines"],"years":[1993],"embed_text":"Nicholas Metropolis | Nicholas Metropolis, oral history interview conducted by Richard Rhodes; transcript published by the Atomic Heritage Foundation / National Museum of Nuclear Science & History, Voices of the Manhattan Project | transcript, unpaginated | 12 September 1993 | I was in charge of the research on computers and designed a computer. We thought we would try to develop computer engineering as opposed to electronic engineering, thereby training people who were electronic engineers to learn about computer engineering."},{"id":"q-nicholas-metropoli-the-beginning-of-the-13ebe7e4","quote":"It was at that time that I suggested an obvious name for the statistical method—a suggestion not unrelated to the fact that Stan had an uncle who would borrow money from relatives because he \"just had to go to Monte Carlo.\" The name seems to have endured.","speaker":{"name":"Nicholas Metropolis","role":"author","sort":"metropolis, nicholas","as_given":"Nicholas Metropolis"},"source":{"work":"The Beginning of the Monte Carlo Method","locus":"p. 127","date":"1987 (Los Alamos Science, Special Issue No. 15)","url":"https://pitp.phas.ubc.ca/confs/sherbrooke2012/archives/1987_Metropolis.pdf"},"restored":"","themes":["machines"],"years":[1987],"embed_text":"Nicholas Metropolis | The Beginning of the Monte Carlo Method | p. 127 | 1987 (Los Alamos Science, Special Issue No. 15) | It was at that time that I suggested an obvious name for the statistical method—a suggestion not unrelated to the fact that Stan had an uncle who would borrow money from relatives because he \"just had to go to Monte Carlo.\" The name seems to have endured."},{"id":"q-nicholas-metropoli-the-beginning-of-the-e626f4a0","quote":"John von Neumann saw the relevance of Ulam's suggestion and, on March 11, 1947, sent a handwritten letter to Robert Richtmyer, the Theoretical Division leader (see \"Stan Ulam, John von Neumann, and the Monte Carlo Method\"). His letter included a detailed outline of a possible statistical approach to solving the problem of neutron diffusion in fissionable material.","speaker":{"name":"Nicholas Metropolis","role":"author","sort":"metropolis, nicholas","as_given":"Nicholas Metropolis"},"source":{"work":"The Beginning of the Monte Carlo Method","locus":"p. 127","date":"account published 1987, describing a letter dated 11 March 1947","url":"https://pitp.phas.ubc.ca/confs/sherbrooke2012/archives/1987_Metropolis.pdf"},"restored":"","themes":["machines"],"years":[1947,1987],"embed_text":"Nicholas Metropolis | The Beginning of the Monte Carlo Method | p. 127 | account published 1987, describing a letter dated 11 March 1947 | John von Neumann saw the relevance of Ulam's suggestion and, on March 11, 1947, sent a handwritten letter to Robert Richtmyer, the Theoretical Division leader (see \"Stan Ulam, John von Neumann, and the Monte Carlo Method\"). His letter included a detailed outline of a possible statistical approach to solving the problem of neutron diffusion in fissionable material."},{"id":"q-nicholas-metropoli-the-beginning-of-the-669b3b85","quote":"We then had the opportunity of using the ENIAC for the first ambitious test of the Monte Carlo method—a variety of problems in neutron transport done in collaboration with Johnny. Nine problems were computed corresponding to various configurations of materials, initial distributions of neutrons, and running times. These problems, as yet, did not include hydrodynamic or radiative effects, but complex geometries and realistic neutron-velocity spectra were handled easily. The neutron histories were subjected to a variety of statistical analyses and comparisons with other approaches. Conclusions about the efficacy of the method were quite favorable. It seemed as though Monte Carlo was here to stay. Not long afterward, other Laboratory staff members made their pilgrimages to ENIAC to run Monte Carlo problems.","speaker":{"name":"Nicholas Metropolis","role":"author","sort":"metropolis, nicholas","as_given":"Nicholas Metropolis"},"source":{"work":"The Beginning of the Monte Carlo Method","locus":"p. 128","date":"1987 (Los Alamos Science, Special Issue No. 15, pp. 125–130)","url":"https://pitp.phas.ubc.ca/confs/sherbrooke2012/archives/1987_Metropolis.pdf"},"restored":"","themes":["machines"],"years":[1987],"embed_text":"Nicholas Metropolis | The Beginning of the Monte Carlo Method | p. 128 | 1987 (Los Alamos Science, Special Issue No. 15, pp. 125–130) | We then had the opportunity of using the ENIAC for the first ambitious test of the Monte Carlo method—a variety of problems in neutron transport done in collaboration with Johnny. Nine problems were computed corresponding to various configurations of materials, initial distributions of neutrons, and running times. These problems, as yet, did not include hydrodynamic or radiative effects, but complex geometries and realistic neutron-velocity spectra were handled easily. The neutron histories were subjected to a variety of statistical analyses and comparisons with other approaches. Conclusions about the efficacy of the method were quite favorable. It seemed as though Monte Carlo was here to stay. Not long afterward, other Laboratory staff members made their pilgrimages to ENIAC to run Monte Carlo problems."},{"id":"q-nicholas-metropoli-the-beginning-of-the-f151c7e0","quote":"Stan’s extensive mathematical background made him aware that statistical sampling techniques had fallen into desuetude because of the length and tediousness of the calculations. But with this miraculous development of the ENIAC—along with the applications Stan must have been pondering—it occurred to him that statistical techniques should be resuscitated, and he discussed this idea with von Neumann. Thus was triggered the spark that led to the Monte Carlo method.","speaker":{"name":"Nicholas Metropolis","role":"author","sort":"metropolis, nicholas","as_given":"Nicholas Metropolis"},"source":{"work":"“The Beginning of the Monte Carlo Method,” Los Alamos Science, Special Issue No. 15","locus":"p. 126","date":"1987"},"restored":"","themes":["monte-ca
