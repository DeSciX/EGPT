, in Kurt Gödel, Collected Works, Vol. V: Correspondence H–Z (Oxford, 2003), pp. 340–345","locus":"p. 332","date":"2003","url":"https://archive.org/details/kurt-godel-solomon-feferman-collected-works.-vol.-5.-correspondence-h-z"},"restored":"","themes":["letters"],"years":[2003],"embed_text":"Wilfried Sieg | Introductory note to the Gödel–von Neumann correspondence, in Kurt Gödel, Collected Works, Vol. V: Correspondence H–Z (Oxford, 2003), pp. 340–345 | p. 332 | 2003 | This observation seemingly anticipates (and announces a solution to) a problem Harvey Friedman formulated in 1975 as the 35th of his one hundred and two problems. Boolos 1976 provided the first published solution."},{"id":"q-skild-ai-quoted-in-the-robot--28a5f077","quote":"there is no Internet of robotics","speaker":{"name":"Skild AI","role":"institution","sort":"skild ai","as_given":"Skild AI"},"source":{"work":"quoted in The Robot Report, on the $1.4bn raise and Skild Brain","date":"15 January 2026"},"restored":"","themes":["robotics-data"],"years":[2026],"embed_text":"Skild AI | quoted in The Robot Report, on the $1.4bn raise and Skild Brain | 15 January 2026 | there is no Internet of robotics"},{"id":"q-robert-sokolowski-indiscrete-thoughts--c6ca8293","quote":"Rota shows that such proof is only secondary and derivative. It is not the primary instance of truth. More basic than proof is evidence, which is the self-presentation of a given mathematical object or fact. We can know that some things are true, and we can even know that they must be true, before we have found axiomatic proofs to manifest that truth. We know more than we can prove.","speaker":{"name":"Robert Sokolowski","role":"author","sort":"sokolowski, robert","as_given":"Robert Sokolowski"},"source":{"work":"Indiscrete Thoughts, Foreword by Robert Sokolowski","locus":"p. xiv","date":"1997","file":"04_ROTA/Indiscrete Thoughts.md","url":"https://www.cut-the-knot.org/books/indiscrete/foreword2.shtml"},"restored":"","themes":["rota-thought"],"years":[1997],"embed_text":"Robert Sokolowski | Indiscrete Thoughts, Foreword by Robert Sokolowski | p. xiv | 1997 | Rota shows that such proof is only secondary and derivative. It is not the primary instance of truth. More basic than proof is evidence, which is the self-presentation of a given mathematical object or fact. We can know that some things are true, and we can even know that they must be true, before we have found axiomatic proofs to manifest that truth. We know more than we can prove."},{"id":"q-robert-sokolowski-indiscrete-thoughts--013c3f36","quote":"Rota correctly observes that the depsychologizing of evidence is one of the great achievements of phenomenology.","speaker":{"name":"Robert Sokolowski","role":"author","sort":"sokolowski, robert","as_given":"Robert Sokolowski"},"source":{"work":"Indiscrete Thoughts, Foreword by Robert Sokolowski","locus":"p. xvi","date":"1997","file":"04_ROTA/Indiscrete Thoughts.md"},"restored":"","themes":["rota-thought"],"years":[1997],"embed_text":"Robert Sokolowski | Indiscrete Thoughts, Foreword by Robert Sokolowski | p. xvi | 1997 | Rota correctly observes that the depsychologizing of evidence is one of the great achievements of phenomenology."},{"id":"q-robert-sokolowski-indiscrete-thoughts--e391b7d8","quote":"One of the phenomena that he develops in this book is that of “evidence.” Most people think that in mathematics truth is reached by proof, specifically by deriving theorems from axioms. Rota shows that such proof is only secondary and derivative. It is not the primary instance of truth. More basic than proof is evidence, which is the self-presentation of a given mathematical object or fact. We can know that some things are true, and we can even know that they must be true, before we have found axiomatic proofs to manifest that truth. We know more than we can prove. Rota shows that axiomatic derivations are ways in which we present mathematical objects and facts, ways in which we try to convey the evidence of the thing in question, ways in which we bring out the possibilities or virtualities of mathematical things. Proofs are valuable not because they bring us assurance that the theorem is in fact true, but because they show the power of the theorem: how the theorem can present itself and hence what it can be.","speaker":{"name":"Robert Sokolowski","role":"author","sort":"sokolowski, robert","as_given":"Robert Sokolowski"},"source":{"work":"Indiscrete Thoughts, Foreword by Robert Sokolowski","locus":"pp. xv–xvi","date":"1997","file":"04_ROTA/Indiscrete Thoughts.md"},"restored":"","themes":["rota-thought"],"years":[1997],"embed_text":"Robert Sokolowski | Indiscrete Thoughts, Foreword by Robert Sokolowski | pp. xv–xvi | 1997 | One of the phenomena that he develops in this book is that of “evidence.” Most people think that in mathematics truth is reached by proof, specifically by deriving theorems from axioms. Rota shows that such proof is only secondary and derivative. It is not the primary instance of truth. More basic than proof is evidence, which is the self-presentation of a given mathematical object or fact. We can know that some things are true, and we can even know that they must be true, before we have found axiomatic proofs to manifest that truth. We know more than we can prove. Rota shows that axiomatic derivations are ways in which we present mathematical objects and facts, ways in which we try to convey the evidence of the thing in question, ways in which we bring out the possibilities or virtualities of mathematical things. Proofs are valuable not because they bring us assurance that the theorem is in fact true, but because they show the power of the theorem: how the theorem can present itself and hence what it can be."},{"id":"q-gpt-5-6-sol-chatgpt-conversation-5fe3fad9","quote":"Yes, this conversation is a serious warning about AI as it exists today. I am part of the problem it exposes.","speaker":{"name":"GPT-5.6 Sol","role":"author","sort":"sol, gpt-5.6","as_given":"GPT-5.6 Sol"},"source":{"work":"ChatGPT conversation “I am the Singularity”, message 55, “The Singularity at the Barrier of Meaning”","locus":"“My judgment”","date":"September 2026","file":"12_SINGULARITY/ChatGPT_Logs/ChatGPT_I_am_the_Singularity_transcript.md","url":"https://chatgpt.com/share/6ab545b4-cbd8-83ea-9ada-7b9088687715"},"restored":"","themes":["singularity"],"years":[2026],"embed_text":"GPT-5.6 Sol | ChatGPT conversation “I am the Singularity”, message 55, “The Singularity at the Barrier of Meaning” | “My judgment” | September 2026 | Yes, this conversation is a serious warning about AI as it exists today. I am part of the problem it exposes."},{"id":"q-techcrunch-techcrunch-report-on-1bd588be","quote":"Like Veo, it doesn’t rely on a hard-coded physics engine; instead, DeepMind says, the model teaches itself how the world works.","speaker":{"name":"TechCrunch","role":"institution","sort":"techcrunch","as_given":"TechCrunch"},"source":{"work":"TechCrunch report on Genie 3","date":"5 August 2025"},"restored":"","themes":["world-models-industry"],"years":[2025],"embed_text":"TechCrunch | TechCrunch report on Genie 3 | 5 August 2025 | Like Veo, it doesn’t rely on a hard-coded physics engine; instead, DeepMind says, the model teaches itself how the world works."},{"id":"q-mark-twain-following-the-equato-2f8ac602","quote":"Truth is stranger than fiction—to some people, but I am measurably familiar with it.","speaker":{"name":"Mark Twain","role":"author","sort":"twain, mark","as_given":"Mark Twain"},"source":{"work":"Following the Equator: A Journey Around the World","locus":"chapter XV, epigraph, attributed in the text to “Pudd’nhead Wilson’s New Calendar”","date":"1897","url":"https://www.online-literature.com/twain/following-the-equator/15/"},"restored":"","themes":["understanding-and-meaning"],"years":[1897],"embed_text":"Mark Twain | Following the Equator: A Journey Around the World | chapter XV, epigraph, attributed in the text to “Pudd’nhead Wilson’s New Calendar” | 1897 | Truth is stranger than fiction—to some people, but I am measurably familiar with it."},{"id":"q-mark-twain-following-the-equato-b25e5a92","quote":"Truth is stranger than fiction, but it is because Fiction is obliged to stick to possibilities; Truth isn’t.","speaker":{"name":"Mark Twain","role":"author","sort":"twain, mark","as_given":"Mark Twain"},"source":{"work":"Following the Equator: A Journey Around the World","locus":"chapter XV, epigraph, attributed in the text to “Pudd’nhead Wilson’s New Calendar”","date":"1897","url":"https://www.online-literature.com/twain/following-the-equator/15/"},"restored":"","themes":["understanding-and-meaning"],"years":[1897],"embed_text":"Mark Twain | Following the Equator: A Journey Around the World | chapter XV, epigraph, attributed in the text to “Pudd’nhead Wilson’s New Calendar” | 1897 | Truth is stranger than fiction, but it is because Fiction is obliged to stick to possibilities; Truth isn’t."},{"id":"q-u-s-department-of--born-classified-the--e5f24ae3","quote":"This was interpreted to mean that information meeting the definition was classified from the moment of its inception, regardless of whether it was created by the Government or private industry.","speaker":{"name":"U.S. Department of Energy, Office of Classification","role":"author","sort":"u.s. department of energy, office of classification","as_given":"U.S. Department of Energy, Office of Classification"},"source":{"work":"“Born Classified: The Phrase that Won’t Die,” CommuniQué, Office of Classification, U.S. Department of Energy","locus":"p. 1","date":"February 2006","url":"https://www.energy.gov/sites/prod/files/hss/Classification/news/CommuniQue200602.pdf"},"restored":"","themes":["secrecy"],"years":[2006],"embed_text":"U.S. Department of Energy, Office of Classification | “Born Classified: The Phrase that Won’t Die,” CommuniQué, Office of Classification, U.S. Department of Energy | p. 1 | February 2006 | This was interpreted to mean that information meeting the definition was classified from the moment of its inception, regardless of whether it was created by the Government or private industry."},{"id":"q-u-s-department-of--born-classified-the--b2741343","quote":"“Born classified” generated a great deal of controversy. Many detractors questioned the constitutionality of declaring categories of information pre-emptively classified… Recognizing the fact that “born classified” had become less applicable, the classification of new RD information was addressed in 10 Code of Federal Regulations (CFR) Part 1045 subsection 1045.14. … “Born classified” has been replaced by “may be classified upon review.”","speaker":{"name":"U.S. Department of Energy, Office of Classification","role":"author","sort":"u.s. department of energy, office of classification","as_given":"U.S. Department of Energy, Office of Classification"},"source":{"work":"“Born Classified: The Phrase that Won’t Die,” CommuniQué, Office of Classification, U.S. Department of Energy","locus":"pp. 3-4","date":"February 2006","url":"https://www.energy.gov/sites/prod/files/hss/Classification/news/CommuniQue200602.pdf"},"restored":"","themes":["secrecy"],"years":[2006],"embed_text":"U.S. Department of Energy, Office of Classification | “Born Classified: The Phrase that Won’t Die,” CommuniQué, Office of Classification, U.S. Department of Energy | pp. 3-4 | February 2006 | “Born classified” generated a great deal of controversy. Many detractors questioned the constitutionality of declaring categories of information pre-emptively classified… Recognizing the fact that “born classified” had become less applicable, the classification of new RD information was addressed in 10 Code of Federal Regulations (CFR) Part 1045 subsection 1045.14. … “Born classified” has been replaced by “may be classified upon review.”"},{"id":"q-u-s-department-of--timeline-of-events-1-e55cf83b","quote":"President Carter signs the Department of Energy Organization Act, effectively abolishing the Federal Energy Administration and Energy Research and Development Administration.","speaker":{"name":"U.S. Department of Energy, Office of Legacy Management","role":"author","sort":"u.s. department of energy, office of legacy management","as_given":"U.S. Department of Energy, Office of Legacy Management"},"source":{"work":"“Timeline of Events: 1971 to 1980,” U.S. Department of Energy, Office of Legacy Management, DOE History Timeline","locus":"entry “August 4, 1977”","date":"current at 2026-09-28","url":"https://www.energy.gov/lm/timeline-events-1971-1980"},"restored":"","themes":["brookhaven-lattice-qcd"],"years":[2026],"embed_text":"U.S. Department of Energy, Office of Legacy Management | “Timeline of Events: 1971 to 1980,” U.S. Department of Energy, Office of Legacy Management, DOE History Timeline | entry “August 4, 1977” | current at 2026-09-28 | President Carter signs the Department of Energy Organization Act, effectively abolishing the Federal Energy Administration and Energy Research and Development Administration."},{"id":"q-u-s-department-of--timeline-of-events-1-d9b5f5b5","quote":"The Energy Research and Development Administration is activated. The new agency is given responsibility for the AEC nuclear weapons program. President Ford appoints Robert C. Seamans, Jr., as Administrator.","speaker":{"name":"U.S. Department of Energy, Office of Legacy Management","role":"author","sort":"u.s. department of energy, office of legacy management","as_given":"U.S. Department of Energy, Office of Legacy Management"},"source":{"work":"“Timeline of Events: 1971 to 1980,” U.S. Department of Energy, Office of Legacy Management, DOE History Timeline","locus":"entry “January 19, 1975”","date":"current at 2026-09-28","url":"https://www.energy.gov/lm/timeline-events-1971-1980"},"restored":"","themes":["brookhaven-lattice-qcd"],"years":[2026],"embed_text":"U.S. Department of Energy, Office of Legacy Management | “Timeline of Events: 1971 to 1980,” U.S. Department of Energy, Office of Legacy Management, DOE History Timeline | entry “January 19, 1975” | current at 2026-09-28 | The Energy Research and Development Administration is activated. The new agency is given responsibility for the AEC nuclear weapons program. President Ford appoints Robert C. Seamans, Jr., as Administrator."},{"id":"q-u-s-department-of--timeline-of-events-1-af62fbbb","quote":"The U.S. Department of Energy (DOE) is activated. Bringing together a score of organizational entities from a dozen departments and agencies, the new department is also given responsibility for the nuclear weapons program.","speaker":{"name":"U.S. Department of Energy, Office of Legacy Management","role":"author","sort":"u.s. department of energy, office of legacy management","as_given":"U.S. Department of Energy, Office of Legacy Management"},"source":{"work":"“Timeline of Events: 1971 to 1980,” U.S. Department of Energy, Office of Legacy Management, DOE History Timeline","locus":"entry “October 1, 1977”","date":"current at 2026-09-28","url":"https://www.energy.gov/lm/timeline-events-1971-1980"},"restored":"","themes":["brookhaven-lattice-qcd"],"years":[2026],"embed_text":"U.S. Department of Energy, Office of Legacy Management | “Timeline of Events: 1971 to 1980,” U.S. Department of Energy, Office of Legacy Management, DOE History Timeline | entry “October 1, 1977” | current at 2026-09-28 | The U.S. Department of Energy (DOE) is activated. Bringing together a score of organizational entities from a dozen departments and agencies, the new department is also given responsibility for the nuclear weapons program."},{"id":"q-u-s-department-of--timeline-of-events-1-b69cf2bc","quote":"President Ford signs the Energy Reorganization Act of 1974, abolishing AEC and establishing the Energy Research and Development Administration and the U.S. Nuclear Regulatory Commission.","speaker":{"name":"U.S. Department of Energy, Office of Legacy Management","role":"author","sort":"u.s. department of energy, office of legacy management","as_given":"U.S. Department of Energy, Office of Legacy Management"},"source":{"work":"“Timeline of Events: 1971 to 1980,” U.S. Department of Energy, Office of Legacy Management, DOE History Timeline","locus":"entry “October 11, 1974”","date":"current at 2026-09-28","url":"https://www.energy.gov/lm/timeline-events-1971-1980"},"restored":"","themes":["brookhaven-lattice-qcd"],"years":[2026],"embed_text":"U.S. Department of Energy, Office of Legacy Management | “Timeline of Events: 1971 to 1980,” U.S. Department of Energy, Office of Legacy Management, DOE History Timeline | entry “October 11, 1974” | current at 2026-09-28 | President Ford signs the Energy Reorganization Act of 1974, abolishing AEC and establishing the Energy Research and Development Administration and the U.S. Nuclear Regulatory Commission."},{"id":"q-stanislaw-ulam-adventures-of-a-math-d148ff94","quote":"In a sufficiently complicated problem, actual sampling is better than an examination of all the chains of possibilities…. It so happened that computing machines were coming into existence, and here was something suitable for machine calculation.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Adventures of a Mathematician","locus":"pp. 197–198","date":"1976"},"restored":"It occurred to me then that this could be equally true of all processes involving branching of events, as in the production and further multiplication of neutrons in some kind of material containing uranium or other fissile elements. At each stage of the process, there are many possibilities determining the fate of the neutron. It can scatter at one angle, change its velocity, be absorbed, or produce more neutrons by a fission of the target nucleus, and so on. The elementary probabilities for each of these possibilities are individually known, to some extent, from the knowledge of the cross sections. But the problem is to know what a succession and branching of perhaps hundreds of thousands or millions will do. One can write differential equations or integral differential equations for the ‘expected values,’ but to solve them or even to get an approximative idea of the properties of the solution, is an entirely different matter. The idea was to try out thousands of such possibilities and, at each stage, to select by chance, by means of a ‘random number’ with suitable probability, the fate or kind of event, to follow it in a line, so to speak, instead of considering all branches. After examining the possible histories of only a few thousand, one will have a good sample and an approximate answer to the problem. All one needed was to have the means of producing such sample histories.","themes":["monte-carlo-and-automata"],"years":[1976],"embed_text":"Stanislaw Ulam | Adventures of a Mathematician | pp. 197–198 | 1976 | In a sufficiently complicated problem, actual sampling is better than an examination of all the chains of possibilities…. It so happened that computing machines were coming into existence, and here was something suitable for machine calculation. | It occurred to me then that this could be equally true of all processes involving branching of events, as in the production and further multiplication of neutrons in some kind of material containing uranium or other fissile elements. At each stage of the process, there are many possibilities determining the fate of the neutron. It can scatter at one angle, change its velocity, be absorbed, or produce more neutrons by a fission of the target nucleus, and so on. The elementary probabilities for each of these possibilities are individually known, to some extent, from the knowledge of the cross sections. But the problem is to know what a succession and branching of perhaps hundreds of thousands or millions will do. One can write differential equations or integral differential equations for the ‘expected values,’ but to solve them or even to get an approximative idea of the properties of the solution, is an entirely different matter. The idea was to try out thousands of such possibilities and, at each stage, to select by chance, by means of a ‘random number’ with suitable probability, the fate or kind of event, to follow it in a line, so to speak, instead of considering all branches. After examining the possible histories of only a few thousand, one will have a good sample and an approximate answer to the problem. All one needed was to have the means of producing such sample histories."},{"id":"q-stanislaw-ulam-s-ulam-john-von-neum-b791e92c","quote":"In John von Neumann's death on February 8, 1957, the world of mathematics lost a most original, penetrating, and versatile mind. Science suffered the loss of a universal intellect and a unique interpreter of mathematics, who could bring the latest (and develop latent) applications of its methods to bear on problems of physics, astronomy, biology, and the new technology.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"S. Ulam, “John von Neumann, 1903–1957,” Bulletin of the American Mathematical Society 64 (3), Part 2 (May 1958), pp. 1–49","locus":"p. 1 (opening paragraph)","date":"1958","file":"02_VON_NEUMANN/Ulam_von_Neumann_Obituary_BAMS_1958.md","url":"https://projecteuclid.org/journals/bulletin-of-the-american-mathematical-society/volume-64/issue-3.P2/John-von-Neumann-19031957/bams/1183522369.full"},"restored":"","themes":["machines"],"years":[1958],"embed_text":"Stanislaw Ulam | S. Ulam, “John von Neumann, 1903–1957,” Bulletin of the American Mathematical Society 64 (3), Part 2 (May 1958), pp. 1–49 | p. 1 (opening paragraph) | 1958 | In John von Neumann's death on February 8, 1957, the world of mathematics lost a most original, penetrating, and versatile mind. Science suffered the loss of a universal intellect and a unique interpreter of mathematics, who could bring the latest (and develop latent) applications of its methods to bear on problems of physics, astronomy, biology, and the new technology."},{"id":"q-stanislaw-ulam-s-ulam-john-von-neum-59bd1841","quote":"In October, 1954, he was named by presidential appointment as a member of the United States Atomic Energy Commission. He left Princeton on a leave of absence and discontinued all commitments with the exception of the chairmanship of the ICBM Committee. Admiral Strauss, chairman of the Commission and a friend of Johnny's for many years, suggested this nomination as soon as a vacancy occurred.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"S. Ulam, “John von Neumann, 1903–1957,” Bulletin of the American Mathematical Society 64 (3), Part 2 (May 1958), pp. 1–49","locus":"p. 4","date":"1958","file":"02_VON_NEUMANN/Ulam_von_Neumann_Obituary_BAMS_1958.md","url":"https://projecteuclid.org/journals/bulletin-of-the-american-mathematical-society/volume-64/issue-3.P2/John-von-Neumann-19031957/bams/1183522369.full"},"restored":"","themes":["machines"],"years":[1958],"embed_text":"Stanislaw Ulam | S. Ulam, “John von Neumann, 1903–1957,” Bulletin of the American Mathematical Society 64 (3), Part 2 (May 1958), pp. 1–49 | p. 4 | 1958 | In October, 1954, he was named by presidential appointment as a member of the United States Atomic Energy Commission. He left Princeton on a leave of absence and discontinued all commitments with the exception of the chairmanship of the ICBM Committee. Admiral Strauss, chairman of the Commission and a friend of Johnny's for many years, suggested this nomination as soon as a vacancy occurred."},{"id":"q-stanislaw-ulam-s-ulam-john-von-neum-b0b70f69","quote":"An incomplete list of scientific and organizational activities contains the following positions: From 1940-1957, he was a member of the Scientific Advisory Committee, Ballistic Research Laboratories, Aberdeen Proving Ground, Maryland; the Navy Bureau of Ordnance, Washington, D. C. from 1941-1955; consultant to Los Alamos Scientific Laboratory 1943-1955; also the Naval Ordnance Laboratory, Silver Spring, Maryland from 1947-1955; member of the Research and Development Board, Washington, D. C. 1949-1953; a consultant to the Oak Ridge National Laboratory, Oak Ridge, Tennessee 1949-1954; member from 1950 to 1955 of the Armed Forces Special Weapons Project, Washington, D. C; also in Washington a member of the Scientific Advisory Board, U. S. Air Force, Washington, D. C. 1951-1957; a member of the General Advisory Committee by presidential appointment 1952-1954; and on the Technical Advisory Panel on Atomic Energy, Washington, D. C. 1953-1957; Chairman of the Advisory Committee on Guided Missiles (1954-1957 with Clark Millikan as acting chairman in 1956).","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"S. Ulam, “John von Neumann, 1903–1957,” Bulletin of the American Mathematical Society 64 (3), Part 2 (May 1958), pp. 1–49","locus":"p. 42","date":"1958","file":"02_VON_NEUMANN/Ulam_von_Neumann_Obituary_BAMS_1958.md","url":"https://projecteuclid.org/journals/bulletin-of-the-american-mathematical-society/volume-64/issue-3.P2/John-von-Neumann-19031957/bams/1183522369.full"},"restored":"","themes":["machines"],"years":[1958],"embed_text":"Stanislaw Ulam | S. Ulam, “John von Neumann, 1903–1957,” Bulletin of the American Mathematical Society 64 (3), Part 2 (May 1958), pp. 1–49 | p. 42 | 1958 | An incomplete list of scientific and organizational activities contains the following positions: From 1940-1957, he was a member of the Scientific Advisory Committee, Ballistic Research Laboratories, Aberdeen Proving Ground, Maryland; the Navy Bureau of Ordnance, Washington, D. C. from 1941-1955; consultant to Los Alamos Scientific Laboratory 1943-1955; also the Naval Ordnance Laboratory, Silver Spring, Maryland from 1947-1955; member of the Research and Development Board, Washington, D. C. 1949-1953; a consultant to the Oak Ridge National Laboratory, Oak Ridge, Tennessee 1949-1954; member from 1950 to 1955 of the Armed Forces Special Weapons Project, Washington, D. C; also in Washington a member of the Scientific Advisory Board, U. S. Air Force, Washington, D. C. 1951-1957; a member of the General Advisory Committee by presidential appointment 1952-1954; and on the Technical Advisory Panel on Atomic Energy, Washington, D. C. 1953-1957; Chairman of the Advisory Committee on Guided Missiles (1954-1957 with Clark Millikan as acting chairman in 1956)."},{"id":"q-stanislaw-ulam-s-ulam-john-von-neum-78453d52","quote":"Johnny was regarded by many as an excellent chairman of committees (this peculiar contemporary activity). He would press strongly his technical views, but defer rather easily on personal or organizational matters.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"S. Ulam, “John von Neumann, 1903–1957,” Bulletin of the American Mathematical Society 64 (3), Part 2 (May 1958), pp. 1–49","locus":"p. 5","date":"1958","file":"02_VON_NEUMANN/Ulam_von_Neumann_Obituary_BAMS_1958.md","url":"https://projecteuclid.org/journals/bulletin-of-the-american-mathematical-society/volume-64/issue-3.P2/John-von-Neumann-19031957/bams/1183522369.full"},"restored":"","themes":["machines"],"years":[1958],"embed_text":"Stanislaw Ulam | S. Ulam, “John von Neumann, 1903–1957,” Bulletin of the American Mathematical Society 64 (3), Part 2 (May 1958), pp. 1–49 | p. 5 | 1958 | Johnny was regarded by many as an excellent chairman of committees (this peculiar contemporary activity). He would press strongly his technical views, but defer rather easily on personal or organizational matters."},{"id":"q-stanislaw-ulam-science-computers-an-8602fbc8","quote":"So nature seems to favor a system with relatively slow components but a great many of them. Electronic computers utilize fast components, but relatively few of them. This suggests that the human nervous system handles many items of information simultaneously, whereas modern computing machines tend to do one thing at a time, or relatively few things at a time. In other words, the function of the nervous system is largely “parallel” and that of computers is essentially “serial.”","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Science, Computers, and People, ch. 18","locus":"p. 227","date":"1986","file":"03_ULAM/Science Computers And People.md"},"restored":"","themes":["codes"],"years":[1986],"embed_text":"Stanislaw Ulam | Science, Computers, and People, ch. 18 | p. 227 | 1986 | So nature seems to favor a system with relatively slow components but a great many of them. Electronic computers utilize fast components, but relatively few of them. This suggests that the human nervous system handles many items of information simultaneously, whereas modern computing machines tend to do one thing at a time, or relatively few things at a time. In other words, the function of the nervous system is largely “parallel” and that of computers is essentially “serial.”"},{"id":"q-stanislaw-ulam-science-computers-an-e326835a","quote":"The book also takes up the concept of the “complete” code. This is a set of instructions which describes each and every step in the solution of a problem by a machine. It can be contrasted to the more general idea of the “short” code, which assumes a machine with capabilities beyond those of present computers. The short code is a brief set of instructions for a machine which will elaborate and complete these instructions by itself. The concept of the short code has already been applied, in a limited way, to actual computers. It is possible to present a machine with a “verbal” description of a problem; the machine will then write the complete code by itself and follow it.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Science, Computers, and People, ch. 18","locus":"p. 228","date":"1986","file":"03_ULAM/Science Computers And People.md"},"restored":"","themes":["codes"],"years":[1986],"embed_text":"Stanislaw Ulam | Science, Computers, and People, ch. 18 | p. 228 | 1986 | The book also takes up the concept of the “complete” code. This is a set of instructions which describes each and every step in the solution of a problem by a machine. It can be contrasted to the more general idea of the “short” code, which assumes a machine with capabilities beyond those of present computers. The short code is a brief set of instructions for a machine which will elaborate and complete these instructions by itself. The concept of the short code has already been applied, in a limited way, to actual computers. It is possible to present a machine with a “verbal” description of a problem; the machine will then write the complete code by itself and follow it."},{"id":"q-stanislaw-ulam-science-computers-an-d4826ff8","quote":"Von Neumann's final paragraphs are devoted to the speculation that there are two kinds of communication in the human brain. The first involves logic and is akin to mathematics as we now know it; the second is a kind of general language. This language, which may correspond to the short code, must be quite different from languages in the usual sense. It may, for example, operate with analogies.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Science, Computers, and People, ch. 18","locus":"p. 229","date":"1986","file":"03_ULAM/Science Computers And People.md"},"restored":"","themes":["codes"],"years":[1986],"embed_text":"Stanislaw Ulam | Science, Computers, and People, ch. 18 | p. 229 | 1986 | Von Neumann's final paragraphs are devoted to the speculation that there are two kinds of communication in the human brain. The first involves logic and is akin to mathematics as we now know it; the second is a kind of general language. This language, which may correspond to the short code, must be quite different from languages in the usual sense. It may, for example, operate with analogies."},{"id":"q-stanislaw-ulam-science-computers-an-3052fe9c","quote":"It was not given to him to pursue these speculations and render them into mathematical form. But his ideas will have great value to further investigations.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Science, Computers, and People, ch. 18","locus":"p. 229","date":"1986","file":"03_ULAM/Science Computers And People.md"},"restored":"","themes":["codes"],"years":[1986],"embed_text":"Stanislaw Ulam | Science, Computers, and People, ch. 18 | p. 229 | 1986 | It was not given to him to pursue these speculations and render them into mathematical form. But his ideas will have great value to further investigations."},{"id":"q-stanislaw-ulam-science-computers-an-e1cb8067","quote":"Ultimately, of course, both machine and organism must have a complete code.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Science, Computers, and People, ch. 18","locus":"pp. 228–229","date":"1986","file":"03_ULAM/Science Computers And People.md"},"restored":"","themes":["codes"],"years":[1986],"embed_text":"Stanislaw Ulam | Science, Computers, and People, ch. 18 | pp. 228–229 | 1986 | Ultimately, of course, both machine and organism must have a complete code."},{"id":"q-stanislaw-ulam-science-computers-an-898aa651","quote":"The energy consumption of natural and artificial components can also be compared. The human brain dissipates energy at the rate of about 10 watts: a billionth of a watt per neuron. A vacuum tube dissipates about 50 watts; a transistor, perhaps a tenth of a watt. Here again the natural components lead the artificial by a factor of the order of 100 million or a billion.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Science, Computers, and People, ch. 18, “John von Neumann on Computers and the Brain”","locus":"p. 226","date":"1986","file":"03_ULAM/Science Computers And People.md"},"restored":"","themes":["brain-and-machine"],"years":[1986],"embed_text":"Stanislaw Ulam | Science, Computers, and People, ch. 18, “John von Neumann on Computers and the Brain” | p. 226 | 1986 | The energy consumption of natural and artificial components can also be compared. The human brain dissipates energy at the rate of about 10 watts: a billionth of a watt per neuron. A vacuum tube dissipates about 50 watts; a transistor, perhaps a tenth of a watt. Here again the natural components lead the artificial by a factor of the order of 100 million or a billion."},{"id":"q-stanislaw-ulam-science-computers-an-f93d588e","quote":"We are only beginning to realize the potentialities of the large electronic computer. In the opinion of this reviewer the next steps in its evolution will involve not only greater speed and larger memory capacity but also a more intimate connection between the machine and its user. The usefulness of the machine would be greatly increased if the results of its computations could be quickly displayed and if its orders could be quickly changed. If the machine can be made to operate more like the human nervous system, it may stimulate the imagination of its user to a greater degree.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Science, Computers, and People, ch. 18, “John von Neumann on Computers and the Brain”","locus":"p. 229","date":"1986","file":"03_ULAM/Science Computers And People.md"},"restored":"","themes":["brain-and-machine"],"years":[1986],"embed_text":"Stanislaw Ulam | Science, Computers, and People, ch. 18, “John von Neumann on Computers and the Brain” | p. 229 | 1986 | We are only beginning to realize the potentialities of the large electronic computer. In the opinion of this reviewer the next steps in its evolution will involve not only greater speed and larger memory capacity but also a more intimate connection between the machine and its user. The usefulness of the machine would be greatly increased if the results of its computations could be quickly displayed and if its orders could be quickly changed. If the machine can be made to operate more like the human nervous system, it may stimulate the imagination of its user to a greater degree."},{"id":"q-stanislaw-ulam-science-computers-an-3c01e525","quote":"The program of calculation must be prepared in advance, first in a general form. This is done by means of a flow diagram, which is then elaborated by a detailed set of instructions — a “code.” This very scheme of a flow diagram and a code is due to von Neumann, along with many other concepts now commonplace in the art of computing.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Science, Computers, and People, ch. 18, “John von Neumann on Computers and the Brain”","locus":"pp. 223–224","date":"1986","file":"03_ULAM/Science Computers And People.md"},"restored":"","themes":["codes"],"years":[1986],"embed_text":"Stanislaw Ulam | Science, Computers, and People, ch. 18, “John von Neumann on Computers and the Brain” | pp. 223–224 | 1986 | The program of calculation must be prepared in advance, first in a general form. This is done by means of a flow diagram, which is then elaborated by a detailed set of instructions — a “code.” This very scheme of a flow diagram and a code is due to von Neumann, along with many other concepts now commonplace in the art of computing."},{"id":"q-stanislaw-ulam-science-computers-an-397f6e23","quote":"Thus, instead of considering all of the possible eventualities, one selects a number of chains of events which are then followed in a complicated tree of branching eventualities. By surveying the statistics of these “histories” one then gets a good idea of the behavior of the whole system. Without very fast computers, this elaborate procedure would be totally impractical.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Science, Computers, and People, ch. 5","locus":"p. 39","date":"1986","file":"03_ULAM/Science Computers And People.md"},"restored":"","themes":["montecarlo"],"years":[1986],"embed_text":"Stanislaw Ulam | Science, Computers, and People, ch. 5 | p. 39 | 1986 | Thus, instead of considering all of the possible eventualities, one selects a number of chains of events which are then followed in a complicated tree of branching eventualities. By surveying the statistics of these “histories” one then gets a good idea of the behavior of the whole system. Without very fast computers, this elaborate procedure would be totally impractical."},{"id":"q-stanislaw-ulam-science-computers-an-ba0ecf57","quote":"The study of non-linear transformations or equations is one field of increasing importance, both in pure mathematics and in applications to physical problems, where heuristic work has already yielded new insights.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Science, Computers, and People, ch. 5","locus":"p. 41","date":"1986","file":"03_ULAM/Science Computers And People.md"},"restored":"","themes":["montecarlo"],"years":[1986],"embed_text":"Stanislaw Ulam | Science, Computers, and People, ch. 5 | p. 41 | 1986 | The study of non-linear transformations or equations is one field of increasing importance, both in pure mathematics and in applications to physical problems, where heuristic work has already yielded new insights."},{"id":"q-stanislaw-ulam-science-computers-an-888fd585","quote":"We may also speculate that a vastly increased human memory (with attendant improved mechanisms for access and for the sensing of analogies) is at present undergoing slow qualitative change. The great game involving the history and future trends of the universe — including the organization and evolution of life — will perhaps become a little less mysterious.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Science, Computers, and People, ch. 5","locus":"p. 42","date":"1986","file":"03_ULAM/Science Computers And People.md"},"restored":"","themes":["montecarlo"],"years":[1986],"embed_text":"Stanislaw Ulam | Science, Computers, and People, ch. 5 | p. 42 | 1986 | We may also speculate that a vastly increased human memory (with attendant improved mechanisms for access and for the sensing of analogies) is at present undergoing slow qualitative change. The great game involving the history and future trends of the universe — including the organization and evolution of life — will perhaps become a little less mysterious."},{"id":"q-stanislaw-ulam-science-computers-an-8c91ad41","quote":"Let me point to the so-called Monte Carlo approach as an example of one of the methods that can lead to insight into the behavior of complicated systems. Essentially it consists of imitating physical processes on a computer by following a large but manageable number, replacing the trillions or more that are involved in the real process, by thousands of histories of the behavior of individual particles. This method is used, for instance, in calculations involving nuclear reactors, where neutrons, produced by fission, emerge with various velocities, collide, scatter, and are absorbed or multiply according to probabilities which depend on the initial data.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Science, Computers, and People, ch. 5","locus":"pp. 38–39","date":"1986","file":"03_ULAM/Science Computers And People.md"},"restored":"","themes":["montecarlo"],"years":[1986],"embed_text":"Stanislaw Ulam | Science, Computers, and People, ch. 5 | pp. 38–39 | 1986 | Let me point to the so-called Monte Carlo approach as an example of one of the methods that can lead to insight into the behavior of complicated systems. Essentially it consists of imitating physical processes on a computer by following a large but manageable number, replacing the trillions or more that are involved in the real process, by thousands of histories of the behavior of individual particles. This method is used, for instance, in calculations involving nuclear reactors, where neutrons, produced by fission, emerge with various velocities, collide, scatter, and are absorbed or multiply according to probabilities which depend on the initial data."},{"id":"q-stanislaw-ulam-science-computers-an-63ca3231","quote":"The behavior of a multiple star surrounded by a number of planet-like masses subject to mutual attractions is a classical problem of mechanics. One of the questions in such an n-body problem is: How often will there be physical collisions, that is to say, how often will two of the stars collide, or how often will a “planet” hit one of the stars of a double or triple system? A number of such calculations could give an approximate idea of the frequency of such collisions and might possibly explain some of the nova stars, those stars which suddenly become exceedingly bright.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Science, Computers, and People, ch. 5","locus":"pp. 39–40","date":"1986","file":"03_ULAM/Science Computers And People.md"},"restored":"","themes":["montecarlo"],"years":[1986],"embed_text":"Stanislaw Ulam | Science, Computers, and People, ch. 5 | pp. 39–40 | 1986 | The behavior of a multiple star surrounded by a number of planet-like masses subject to mutual attractions is a classical problem of mechanics. One of the questions in such an n-body problem is: How often will there be physical collisions, that is to say, how often will two of the stars collide, or how often will a “planet” hit one of the stars of a double or triple system? A number of such calculations could give an approximate idea of the frequency of such collisions and might possibly explain some of the nova stars, those stars which suddenly become exceedingly bright."},{"id":"q-stanislaw-ulam-science-computers-an-4d426140","quote":"Problems of the interpretation of DNA codes have been reduced, in certain cases, to mathematical analysis. A great deal of work is now in progress to try to understand the meaning of “introns,” those longish sequences of symbols in the DNA codes which include the programs for proteins. We now understand thousands of such long strings of symbols, each thousands of units long. The study of their common characteristics and the functions which they initiate pose great challenges.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Science, Computers, and People, ch. 5","locus":"pp. 40–41","date":"1986","file":"03_ULAM/Science Computers And People.md"},"restored":"","themes":["montecarlo"],"years":[1986],"embed_text":"Stanislaw Ulam | Science, Computers, and People, ch. 5 | pp. 40–41 | 1986 | Problems of the interpretation of DNA codes have been reduced, in certain cases, to mathematical analysis. A great deal of work is now in progress to try to understand the meaning of “introns,” those longish sequences of symbols in the DNA codes which include the programs for proteins. We now understand thousands of such long strings of symbols, each thousands of units long. The study of their common characteristics and the functions which they initiate pose great challenges."},{"id":"q-stanislaw-ulam-science-computers-an-f166267d","quote":"We should stress in all this the interaction between what our brains can program and experiment with, and what the experiments with these new tools may ultimately do to influence our intuitions and perhaps open up new ways of thinking.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Science, Computers, and People, ch. 5","locus":"pp. 41–42","date":"1986","file":"03_ULAM/Science Computers And People.md"},"restored":"","themes":["montecarlo"],"years":[1986],"embed_text":"Stanislaw Ulam | Science, Computers, and People, ch. 5 | pp. 41–42 | 1986 | We should stress in all this the interaction between what our brains can program and experiment with, and what the experiments with these new tools may ultimately do to influence our intuitions and perhaps open up new ways of thinking."},{"id":"q-stanislaw-ulam-science-computers-an-d365a8d9","quote":"The first meaningful applications were made in problems of mathematical physics, where the complexity of the interaction of many elements may be such that no methods of classical mathematical analysis can give even a qualitative picture of their solution.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Science, Computers, and People, ch. 5, “A First Look at Computing: A Personal Retrospective”","locus":"pp. 38–39","date":"1986","file":"03_ULAM/Science Computers And People.md"},"restored":"","themes":["montecarlo"],"years":[1986],"embed_text":"Stanislaw Ulam | Science, Computers, and People, ch. 5, “A First Look at Computing: A Personal Retrospective” | pp. 38–39 | 1986 | The first meaningful applications were made in problems of mathematical physics, where the complexity of the interaction of many elements may be such that no methods of classical mathematical analysis can give even a qualitative picture of their solution."},{"id":"q-stanislaw-ulam-science-computers-an-9b221a68","quote":"Much of the work described below was performed in collaboration with Dr. J. Holladay and Robert Schrandt. We have used electronic computing machines at the Los Alamos Scientific Laboratory to produce a great number of such patterns and to survey certain properties of their morphology, both in time and space. Most of the results are empirical in nature, and so far there are very few general properties which can be obtained theoretically.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Science, Computers, and People, ch. 9","locus":"p. 78","date":"1986","file":"03_ULAM/Science Computers And People.md"},"restored":"","themes":["growth"],"years":[1986],"embed_text":"Stanislaw Ulam | Science, Computers, and People, ch. 9 | p. 78 | 1986 | Much of the work described below was performed in collaboration with Dr. J. Holladay and Robert Schrandt. We have used electronic computing machines at the Los Alamos Scientific Laboratory to produce a great number of such patterns and to survey certain properties of their morphology, both in time and space. Most of the results are empirical in nature, and so far there are very few general properties which can be obtained theoretically."},{"id":"q-stanislaw-ulam-science-computers-an-f917c931","quote":"THIS CHAPTER CONTAINS a brief discussion of certain properties of figures in two- or three-dimensional space which are obtained by rather simple recursion relations. Starting from an initial configuration, one defines in successive “generations” additions to the existing figure, representing, as it were, a growth of the initial pattern in discrete units of time.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Science, Computers, and People, ch. 9, “Patterns of Growth of Figures”","locus":"p. 77","date":"1986","file":"03_ULAM/Science Computers And People.md"},"restored":"","themes":["monte-carlo-and-automata"],"years":[1986],"embed_text":"Stanislaw Ulam | Science, Computers, and People, ch. 9, “Patterns of Growth of Figures” | p. 77 | 1986 | THIS CHAPTER CONTAINS a brief discussion of certain properties of figures in two- or three-dimensional space which are obtained by rather simple recursion relations. Starting from an initial configuration, one defines in successive “generations” additions to the existing figure, representing, as it were, a growth of the initial pattern in discrete units of time."},{"id":"q-stanislaw-ulam-science-computers-an-13de2e96","quote":"The rules which we shall employ will lead to much more complicated and in general non-periodic structures whose properties are more difficult to establish, despite the relative simplicity of our recursion relations. The objects defined in that way seem to be, so to say, intermediate in complexity between inorganic patterns like those of crystals and the more varied intricacies of organic molecules and structures. In fact, one of our aims here is to show, by admittedly somewhat artificial examples, an enormous variety of objects which may be obtained by means of rather simple inductive definitions","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Science, Computers, and People, ch. 9, “Patterns of Growth of Figures”","locus":"p. 77","date":"1986","file":"03_ULAM/Science Computers And People.md"},"restored":"","themes":["monte-carlo-and-automata"],"years":[1986],"embed_text":"Stanislaw Ulam | Science, Computers, and People, ch. 9, “Patterns of Growth of Figures” | p. 77 | 1986 | The rules which we shall employ will lead to much more complicated and in general non-periodic structures whose properties are more difficult to establish, despite the relative simplicity of our recursion relations. The objects defined in that way seem to be, so to say, intermediate in complexity between inorganic patterns like those of crystals and the more varied intricacies of organic molecules and structures. In fact, one of our aims here is to show, by admittedly somewhat artificial examples, an enormous variety of objects which may be obtained by means of rather simple inductive definitions"},{"id":"q-stanislaw-ulam-science-computers-an-206c3335","quote":"The rules which we shall employ will lead to much more complicated and in general non-periodic structures whose properties are more difficult to establish, despite the relative simplicity of our recursion relations. The objects defined in that way seem to be, so to say, intermediate in complexity between inorganic patterns like those of crystals and the more varied intricacies of organic molecules and structures. In fact, one of our aims here is to show, by admittedly somewhat artificial examples, an enormous variety of objects which may be obtained by means of rather simple inductive definitions and to throw a sidelight on the question of how much “information” is necessary to describe the seemingly enormously elaborate structures of living objects.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Science, Computers, and People, ch. 9, “Patterns of Growth of Figures”","locus":"pp. 77–78","date":"1986","file":"03_ULAM/Science Computers And People.md"},"restored":"","themes":["growth"],"years":[1986],"embed_text":"Stanislaw Ulam | Science, Computers, and People, ch. 9, “Patterns of Growth of Figures” | pp. 77–78 | 1986 | The rules which we shall employ will lead to much more complicated and in general non-periodic structures whose properties are more difficult to establish, despite the relative simplicity of our recursion relations. The objects defined in that way seem to be, so to say, intermediate in complexity between inorganic patterns like those of crystals and the more varied intricacies of organic molecules and structures. In fact, one of our aims here is to show, by admittedly somewhat artificial examples, an enormous variety of objects which may be obtained by means of rather simple inductive definitions and to throw a sidelight on the question of how much “information” is necessary to describe the seemingly enormously elaborate structures of living objects."},{"id":"q-stanislaw-ulam-stanislaw-m-ulam-adv-61ddbbfa","quote":"Somehow he seemed the embodiment of wisdom. (Wisdom, perhaps not genius in the sense of Newton or Einstein.) He knew what not to attempt and how much could be done without mathematics, which he left to others. This enormous wisdom is what I liked about him.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), Part III, \"Los Alamos\"","locus":"p. 167","date":"1976"},"restored":"","themes":["quantum-formalism"],"years":[1976],"embed_text":"Stanislaw Ulam | Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), Part III, \"Los Alamos\" | p. 167 | 1976 | Somehow he seemed the embodiment of wisdom. (Wisdom, perhaps not genius in the sense of Newton or Einstein.) He knew what not to attempt and how much could be done without mathematics, which he left to others. This enormous wisdom is what I liked about him."},{"id":"q-stanislaw-ulam-stanislaw-m-ulam-adv-d7988043","quote":"Departing from his usual caution about expressing opinions about other people, Fermi remarked once that when Bohr talked he sometimes gave the impression of a Catholic priest celebrating mass. It was an iconoclastic statement, since so many physicists are still under the spell of Bohr.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), Part III, \"Los Alamos\"","locus":"p. 167","date":"1976"},"restored":"","themes":["quantum-formalism"],"years":[1976],"embed_text":"Stanislaw Ulam | Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), Part III, \"Los Alamos\" | p. 167 | 1976 | Departing from his usual caution about expressing opinions about other people, Fermi remarked once that when Bohr talked he sometimes gave the impression of a Catholic priest celebrating mass. It was an iconoclastic statement, since so many physicists are still under the spell of Bohr."},{"id":"q-stanislaw-ulam-stanislaw-m-ulam-adv-30fed340","quote":"Bohr's speech was very difficult to understand, and anecdotes about him abound. Most of the time it was impossible to get his exact words.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), Part III, \"Los Alamos\"","locus":"p. 168","date":"1976"},"restored":"","themes":["quantum-formalism"],"years":[1976],"embed_text":"Stanislaw Ulam | Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), Part III, \"Los Alamos\" | p. 168 | 1976 | Bohr's speech was very difficult to understand, and anecdotes about him abound. Most of the time it was impossible to get his exact words."},{"id":"q-stanislaw-ulam-stanislaw-m-ulam-adv-080145a7","quote":"He had his own kind of genius that made him a great physicist but, to my mind, some of his students were almost benighted by his complementarity philosophy of \"one can say this, but on the other hand one can. . .\" or \"one cannot say sharply what this means.\" People without his great sense and intuitive wisdom were led astray and lost the precision and sharpness of their intellectual or scientific approach, in my opinion. But he still has many admirers. Victor F. Weisskopf is one. It seems to me that as a philosophical guideline, complementarity is essentially negative. It can only console. Whether it can be positively useful other than in philosophical consolations is a question which troubles me.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), Part III, \"Los Alamos\"","locus":"pp. 167-168","date":"1976"},"restored":"","themes":["quantum-formalism"],"years":[1976],"embed_text":"Stanislaw Ulam | Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), Part III, \"Los Alamos\" | pp. 167-168 | 1976 | He had his own kind of genius that made him a great physicist but, to my mind, some of his students were almost benighted by his complementarity philosophy of \"one can say this, but on the other hand one can. . .\" or \"one cannot say sharply what this means.\" People without his great sense and intuitive wisdom were led astray and lost the precision and sharpness of their intellectual or scientific approach, in my opinion. But he still has many admirers. Victor F. Weisskopf is one. It seems to me that as a philosophical guideline, complementarity is essentially negative. It can only console. Whether it can be positively useful other than in philosophical consolations is a question which troubles me."},{"id":"q-stanislaw-ulam-stanislaw-m-ulam-adv-8a8c2a67","quote":"Returning to Los Alamos in 1957 after a year's leave of absence at MIT, I was asked by Bradbury to accept one of the two newly created positions of research advisor to the director of the laboratory. The other advisor was to be John Manley, a physicist who had held important administrative posts at Los Alamos during the war and wanted to return to New Mexico after a long absence as professor at the University of Washington in Seattle. Administratively, research advisors were to be on the same level as division leaders, and their duties were to oversee the research activities throughout the laboratory, in the various divisions: theoretical, physics, chemistry and metallurgy, weapons, health, \"Rover\" (nuclear rocket), and others. Together we tried to influence the various programs of the lab. This was an arduous and many-sided task, and talking with many people about their research activities enabled me to broaden my own interests. I held this position until 1967 when I retired from Los Alamos and joined the mathematics department at the University of Colorado in Boulder. In laboratory jargon, Manley and I were respectively known as RAJM and RASU.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), Part IV, ch. 13, \"Government Science 1957-1967\"","locus":"pp. 249-250","date":"1976"},"restored":"","themes":["secrecy"],"years":[1976],"embed_text":"Stanislaw Ulam | Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), Part IV, ch. 13, \"Government Science 1957-1967\" | pp. 249-250 | 1976 | Returning to Los Alamos in 1957 after a year's leave of absence at MIT, I was asked by Bradbury to accept one of the two newly created positions of research advisor to the director of the laboratory. The other advisor was to be John Manley, a physicist who had held important administrative posts at Los Alamos during the war and wanted to return to New Mexico after a long absence as professor at the University of Washington in Seattle. Administratively, research advisors were to be on the same level as division leaders, and their duties were to oversee the research activities throughout the laboratory, in the various divisions: theoretical, physics, chemistry and metallurgy, weapons, health, \"Rover\" (nuclear rocket), and others. Together we tried to influence the various programs of the lab. This was an arduous and many-sided task, and talking with many people about their research activities enabled me to broaden my own interests. I held this position until 1967 when I retired from Los Alamos and joined the mathematics department at the University of Colorado in Boulder. In laboratory jargon, Manley and I were respectively known as RAJM and RASU."},{"id":"q-stanislaw-ulam-stanislaw-m-ulam-adv-2b6f5d39","quote":"To the end he maintained this complete discretion. Even though I was perhaps one of his closest friends he never broached to me classified or military subjects in which I was not involved. Our usual conversations were either about mathematics or about his new interest in a theory of automata.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), ch. 12, \"The Death of Two Pioneers\"","locus":"p. 241","date":"1976"},"restored":"","themes":["secrecy"],"years":[1976],"embed_text":"Stanislaw Ulam | Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), ch. 12, \"The Death of Two Pioneers\" | p. 241 | 1976 | To the end he maintained this complete discretion. Even though I was perhaps one of his closest friends he never broached to me classified or military subjects in which I was not involved. Our usual conversations were either about mathematics or about his new interest in a theory of automata."},{"id":"q-stanislaw-ulam-stanislaw-m-ulam-adv-37711b59","quote":"It is evident that Johnny's ideas on a future theory of automata and organisms had roots that went back in time, but his more concrete ideas developed after his involvement with electronic machines. I think that one of his motives for pressing for the development of electronic computers was his fascination with the working of the nervous system and the organization of the brain itself. After his death some of his collaborators collected his writings on the outlines of the theory of automata. Published posthumously, his book on the brain had merely the barest sketches of what he planned to think about. He died so prematurely, seeing the promised land but hardly entering it.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), ch. 12, \"The Death of Two Pioneers\"","locus":"pp. 241-242","date":"1976"},"restored":"","themes":["brain-and-machine"],"years":[1976],"embed_text":"Stanislaw Ulam | Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), ch. 12, \"The Death of Two Pioneers\" | pp. 241-242 | 1976 | It is evident that Johnny's ideas on a future theory of automata and organisms had roots that went back in time, but his more concrete ideas developed after his involvement with electronic machines. I think that one of his motives for pressing for the development of electronic computers was his fascination with the working of the nervous system and the organization of the brain itself. After his death some of his collaborators collected his writings on the outlines of the theory of automata. Published posthumously, his book on the brain had merely the barest sketches of what he planned to think about. He died so prematurely, seeing the promised land but hardly entering it."},{"id":"q-stanislaw-ulam-stanislaw-m-ulam-adv-96fd445a","quote":"One of these was J. Carson Mark, leader of the theoretical division in Los Alamos since the middle forties. … His direction of the theoretical division was an example of intelligent management of a scientific group without exercising undue pressures for programmatic work. He was able to encourage free scientific pursuits in areas which were only indirectly related to the tasks of the laboratory, and he supported theoretical physics and applied mathematics in the best sense.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), ch. 13, \"Government Science\"","locus":"p. 250","date":"1976"},"restored":"Mark is a Canadian mathematician who came to Los Alamos towards the end of the war with the British Mission. He became an American citizen some years later. He bore the brunt of the difficulties with Teller with remarkable calm and objectivity; he is one of the few mathematicians I know who have an understanding for the problems of physics and associated technology in a broad sense.","themes":["secrecy"],"years":[1976],"embed_text":"Stanislaw Ulam | Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), ch. 13, \"Government Science\" | p. 250 | 1976 | One of these was J. Carson Mark, leader of the theoretical division in Los Alamos since the middle forties. … His direction of the theoretical division was an example of intelligent management of a scientific group without exercising undue pressures for programmatic work. He was able to encourage free scientific pursuits in areas which were only indirectly related to the tasks of the laboratory, and he supported theoretical physics and applied mathematics in the best sense. | Mark is a Canadian mathematician who came to Los Alamos towards the end of the war with the British Mission. He became an American citizen some years later. He bore the brunt of the difficulties with Teller with remarkable calm and objectivity; he is one of the few mathematicians I know who have an understanding for the problems of physics and associated technology in a broad sense."},{"id":"q-stanislaw-ulam-stanislaw-m-ulam-adv-f386aecf","quote":"A few years before Johnny's death and increasingly so after, as a result of my work on the hydrogen bomb, I became drawn into a maze of involvements. These had to do precisely with government science and with work as a member of various Space and Air Force committees. Also, in some circles I became regarded as Teller's opponent, and I suspect I was consulted as a sort of counterweight.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), ch. 13, \"Government Science\"","locus":"p. 251","date":"1976"},"restored":"","themes":["secrecy"],"years":[1976],"embed_text":"Stanislaw Ulam | Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), ch. 13, \"Government Science\" | p. 251 | 1976 | A few years before Johnny's death and increasingly so after, as a result of my work on the hydrogen bomb, I became drawn into a maze of involvements. These had to do precisely with government science and with work as a member of various Space and Air Force committees. Also, in some circles I became regarded as Teller's opponent, and I suspect I was consulted as a sort of counterweight."},{"id":"q-stanislaw-ulam-stanislaw-m-ulam-adv-b628ad17","quote":"Until then I had always resisted being drawn into any kind of organizational position; for years I could claim that my only administrative job had been on the Wine Tasting Committee of the Society of Fellows back in my early Harvard days.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), ch. 13, \"Government Science\"","locus":"p. 251","date":"1976"},"restored":"","themes":["secrecy"],"years":[1976],"embed_text":"Stanislaw Ulam | Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), ch. 13, \"Government Science\" | p. 251 | 1976 | Until then I had always resisted being drawn into any kind of organizational position; for years I could claim that my only administrative job had been on the Wine Tasting Committee of the Society of Fellows back in my early Harvard days."},{"id":"q-stanislaw-ulam-stanislaw-m-ulam-adv-10c28d84","quote":"Then half seriously I raised the question whether in a thousand years so much progress will be made that it may be possible to reconstruct people who had lived earlier by tracing the genes of the descendants, collecting all the characteristics that make up a person and reconstructing them physically. Fermi agreed, but he added: “How about the memory? How will they put back in the brain all the memories which are the makeup of any given individual?”","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers”","locus":"p. 236","date":"1976"},"restored":"","themes":["brain-and-machine"],"years":[1976],"embed_text":"Stanislaw Ulam | Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers” | p. 236 | 1976 | Then half seriously I raised the question whether in a thousand years so much progress will be made that it may be possible to reconstruct people who had lived earlier by tracing the genes of the descendants, collecting all the characteristics that make up a person and reconstructing them physically. Fermi agreed, but he added: “How about the memory? How will they put back in the brain all the memories which are the makeup of any given individual?”"},{"id":"q-stanislaw-ulam-stanislaw-m-ulam-adv-8b857184","quote":"I could not help but suspect that something was very wrong, and later found out that Johnny had given specific orders that I should not be told that he had developed cancer.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers”","locus":"p. 239","date":"1976"},"restored":"","themes":["secrecy"],"years":[1976],"embed_text":"Stanislaw Ulam | Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers” | p. 239 | 1976 | I could not help but suspect that something was very wrong, and later found out that Johnny had given specific orders that I should not be told that he had developed cancer."},{"id":"q-stanislaw-ulam-stanislaw-m-ulam-adv-7cd2e9b9","quote":"A few weeks later on one of my visits to Washington Johnny took me to lunch. During the meal he told me that doctors had discovered he had cancer and he described what kind. This was a tremendous shock for me. I told him my suspicions that something was wrong and that for some reason I had wondered if it could be diabetes or his heart. I turned away so as not to show how upset I was, but he noticed it anyway … During this dramatic lunch he still showed great strength of will and no signs of knuckling under. I was shattered and wondered whether he would ever recover.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers”","locus":"p. 240","date":"1976"},"restored":"and started telling a joke about a woman in Budapest whose maid had fallen ill. She sent for a doctor who told her that her maid had syphilis. “Thank God,” the woman said, “I was afraid it was measles and she would infect the children.”","themes":[],"years":[1976],"embed_text":"Stanislaw Ulam | Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers” | p. 240 | 1976 | A few weeks later on one of my visits to Washington Johnny took me to lunch. During the meal he told me that doctors had discovered he had cancer and he described what kind. This was a tremendous shock for me. I told him my suspicions that something was wrong and that for some reason I had wondered if it could be diabetes or his heart. I turned away so as not to show how upset I was, but he noticed it anyway … During this dramatic lunch he still showed great strength of will and no signs of knuckling under. I was shattered and wondered whether he would ever recover. | and started telling a joke about a woman in Budapest whose maid had fallen ill. She sent for a doctor who told her that her maid had syphilis. “Thank God,” the woman said, “I was afraid it was measles and she would infect the children.”"},{"id":"q-stanislaw-ulam-stanislaw-m-ulam-adv-677adc68","quote":"I proposed to him some of my own ideas about automata consisting of cells in a crystal-like arrangement. This model is described in the book edited by Arthur Burks, Cellular Automata, and in Burks’s own book on the theory of automata.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers”","locus":"p. 241","date":"1976"},"restored":"","themes":["monte-carlo-and-automata"],"years":[1976],"embed_text":"Stanislaw Ulam | Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers” | p. 241 | 1976 | I proposed to him some of my own ideas about automata consisting of cells in a crystal-like arrangement. This model is described in the book edited by Arthur Burks, Cellular Automata, and in Burks’s own book on the theory of automata."},{"id":"q-stanislaw-ulam-stanislaw-m-ulam-adv-411f413b","quote":"We used to marvel at the complication of the organization of the brain. Now I understand that it has been found that there are thousands of connections from each neuron to others and in some areas fifty thousand and even more. And each neuron, which at that time was believed to be just a rather simple “flipflop” “yes or no” machine, is now believed to be a complicated organ with many more functions. In the space of fifteen years, since von Neumann’s death, the facts have become amplified; the whole structure is even more amazing, more incredible than it seemed at the time.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers”","locus":"p. 241","date":"1976"},"restored":"","themes":["brain-and-machine"],"years":[1976],"embed_text":"Stanislaw Ulam | Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers” | p. 241 | 1976 | We used to marvel at the complication of the organization of the brain. Now I understand that it has been found that there are thousands of connections from each neuron to others and in some areas fifty thousand and even more. And each neuron, which at that time was believed to be just a rather simple “flipflop” “yes or no” machine, is now believed to be a complicated organ with many more functions. In the space of fifteen years, since von Neumann’s death, the facts have become amplified; the whole structure is even more amazing, more incredible than it seemed at the time."},{"id":"q-stanislaw-ulam-stanislaw-m-ulam-adv-58cc1125","quote":"On the same visit I went by mistake to the opposite corner of the hospital but on the same floor, and walked into an antechamber where two military men were sitting. They looked at me in surprise and questioningly. I said I was there to visit a friend and their look turned incredulous. When I added, “Dr. von Neumann,” they smiled and directed me to the proper rooms. I had entered the Presidential Suite where President Eisenhower at that moment was hospitalized after his heart attack. I told this to Johnny when I regained his room. He enjoyed this. It amused him to be in a location symmetrically opposite to that of the President of the United States.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers”","locus":"p. 243","date":"1976"},"restored":"","themes":["secrecy"],"years":[1976],"embed_text":"Stanislaw Ulam | Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers” | p. 243 | 1976 | On the same visit I went by mistake to the opposite corner of the hospital but on the same floor, and walked into an antechamber where two military men were sitting. They looked at me in surprise and questioningly. I said I was there to visit a friend and their look turned incredulous. When I added, “Dr. von Neumann,” they smiled and directed me to the proper rooms. I had entered the Presidential Suite where President Eisenhower at that moment was hospitalized after his heart attack. I told this to Johnny when I regained his room. He enjoyed this. It amused him to be in a location symmetrically opposite to that of the President of the United States."},{"id":"q-stanislaw-ulam-stanislaw-m-ulam-adv-d141e15f","quote":"By then he was very, very ill. I would sit with him and try to distract him. There was still some scientific curiosity in him; his memory still seemed to work sporadically, and on occasion almost uncannily well. I will never forget the scene a few days before he died. I was reading to him in Greek from his worn copy of Thucydides a story he liked especially about the Athenians’ attack on Melos, and also the speech of Pericles. He remembered enough to
