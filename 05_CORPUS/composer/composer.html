rlo-and-automata"],"years":[1987],"embed_text":"Nicholas Metropolis | “The Beginning of the Monte Carlo Method,” Los Alamos Science, Special Issue No. 15 | p. 126 | 1987 | Stan’s extensive mathematical background made him aware that statistical sampling techniques had fallen into desuetude because of the length and tediousness of the calculations. But with this miraculous development of the ENIAC—along with the applications Stan must have been pondering—it occurred to him that statistical techniques should be resuscitated, and he discussed this idea with von Neumann. Thus was triggered the spark that led to the Monte Carlo method."},{"id":"q-nicholas-metropoli-the-beginning-of-the-276a837d","quote":"In March, 1945, Johnny, Frankel, and I visited the Moore School of Electrical Engineering at the University of Pennsylvania for an advance glimpse of the ENIAC. We were impressed.","speaker":{"name":"Nicholas Metropolis","role":"author","sort":"metropolis, nicholas","as_given":"Nicholas Metropolis"},"source":{"work":"“The Beginning of the Monte Carlo Method,” Los Alamos Science, Special Issue No. 15, pp. 125–130","locus":"p. 126","date":"1987","url":"https://fermatslibrary.com/s/the-beginning-of-the-monte-carlo-method"},"restored":"","themes":["machines"],"years":[1987],"embed_text":"Nicholas Metropolis | “The Beginning of the Monte Carlo Method,” Los Alamos Science, Special Issue No. 15, pp. 125–130 | p. 126 | 1987 | In March, 1945, Johnny, Frankel, and I visited the Moore School of Electrical Engineering at the University of Pennsylvania for an advance glimpse of the ENIAC. We were impressed."},{"id":"q-nicholas-metropoli-the-beginning-of-the-364bc69a","quote":"Johnny let it be known that construction of the ENIAC was nearing completion, and he wondered whether Stan Frankel and I would be interested in preparing a preliminary computational model of a thermonuclear reaction for the ENIAC.","speaker":{"name":"Nicholas Metropolis","role":"author","sort":"metropolis, nicholas","as_given":"Nicholas Metropolis"},"source":{"work":"“The Beginning of the Monte Carlo Method,” Los Alamos Science, Special Issue No. 15, pp. 125–130","locus":"pp. 125–130","date":"1987","url":"https://fermatslibrary.com/s/the-beginning-of-the-monte-carlo-method"},"restored":"","themes":["machines"],"years":[1987],"embed_text":"Nicholas Metropolis | “The Beginning of the Monte Carlo Method,” Los Alamos Science, Special Issue No. 15, pp. 125–130 | pp. 125–130 | 1987 | Johnny let it be known that construction of the ENIAC was nearing completion, and he wondered whether Stan Frankel and I would be interested in preparing a preliminary computational model of a thermonuclear reaction for the ENIAC."},{"id":"q-michael-creutz-lau-michael-creutz-laure-7066fa9b","quote":"Using Monte Carlo techniques, we evaluate the path integral for the four-dimensional lattice gauge theory with a Z2 gauge group. The system exhibits a first-order transition. This is contrary to the implications of the approximate Migdal recursion relations but consistant with mean-field-theory arguments. Our \"data\" agree well with a low-temperature expansion and the exact duality between the high- and low-temperature phases.","speaker":{"name":"Michael Creutz, Laurence Jacobs, and Claudio Rebbi","role":"author","sort":"michael creutz, laurence jacobs, and claudio rebbi","as_given":"Michael Creutz, Laurence Jacobs, and Claudio Rebbi"},"source":{"work":"Michael Creutz, Laurence Jacobs, and Claudio Rebbi, “Experiments with a Gauge-Invariant Ising System,” Physical Review Letters 42, no. 21, 1390","locus":"abstract","date":"21 May 1979","url":"https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.42.1390"},"restored":"","themes":["brookhaven-lattice-qcd"],"years":[1979],"embed_text":"Michael Creutz, Laurence Jacobs, and Claudio Rebbi | Michael Creutz, Laurence Jacobs, and Claudio Rebbi, “Experiments with a Gauge-Invariant Ising System,” Physical Review Letters 42, no. 21, 1390 | abstract | 21 May 1979 | Using Monte Carlo techniques, we evaluate the path integral for the four-dimensional lattice gauge theory with a Z2 gauge group. The system exhibits a first-order transition. This is contrary to the implications of the approximate Migdal recursion relations but consistant with mean-field-theory arguments. Our \"data\" agree well with a low-temperature expansion and the exact duality between the high- and low-temperature phases."},{"id":"q-michael-creutz-lau-michael-creutz-laure-a27a4484","quote":"Using Monte Carlo techniques, we study the thermodynamics of four-dimensional Euclidean lattice gauge theories, with gauge groups ZN and U(1). For N≤4 the models exhibit a single first-order phase transition, while for N≥5 we observe two transitions of higher order. As N increases, one of these transitions moves toward zero temperature, whereas the other remains at finite temperature and survives in the U(1) limit. The behavior of the Wilson loop factor is also analyzed for the Z2 and Z6 models.","speaker":{"name":"Michael Creutz, Laurence Jacobs, and Claudio Rebbi","role":"author","sort":"michael creutz, laurence jacobs, and claudio rebbi","as_given":"Michael Creutz, Laurence Jacobs, and Claudio Rebbi"},"source":{"work":"Michael Creutz, Laurence Jacobs, and Claudio Rebbi, “Monte Carlo study of Abelian lattice gauge theories,” Physical Review D 20, no. 8, 1915","locus":"abstract","date":"15 October 1979","url":"https://journals.aps.org/prd/abstract/10.1103/PhysRevD.20.1915"},"restored":"","themes":["brookhaven-lattice-qcd"],"years":[1979],"embed_text":"Michael Creutz, Laurence Jacobs, and Claudio Rebbi | Michael Creutz, Laurence Jacobs, and Claudio Rebbi, “Monte Carlo study of Abelian lattice gauge theories,” Physical Review D 20, no. 8, 1915 | abstract | 15 October 1979 | Using Monte Carlo techniques, we study the thermodynamics of four-dimensional Euclidean lattice gauge theories, with gauge groups ZN and U(1). For N≤4 the models exhibit a single first-order phase transition, while for N≥5 we observe two transitions of higher order. As N increases, one of these transitions moves toward zero temperature, whereas the other remains at finite temperature and survives in the U(1) limit. The behavior of the Wilson loop factor is also analyzed for the Z2 and Z6 models."},{"id":"q-howard-morland-howard-morland-on-th-d25f1fdd","quote":"I had many printed resources and, finally, in the spring of 1978, an unexpected assignment from The Progressive magazine to visit the H-bomb factories and take the unclassified guided tours.","speaker":{"name":"Howard Morland","role":"author","sort":"morland, howard","as_given":"Howard Morland"},"source":{"work":"Howard Morland on the Progressive case, Federation of American Scientists electronic reprint","url":"https://sgp.fas.org/eprint/cardozo.html"},"restored":"","themes":["secrecy"],"years":[],"embed_text":"Howard Morland | Howard Morland on the Progressive case, Federation of American Scientists electronic reprint | I had many printed resources and, finally, in the spring of 1978, an unexpected assignment from The Progressive magazine to visit the H-bomb factories and take the unclassified guided tours."},{"id":"q-n-a-participants-r-participants-seventh-31ac2639","quote":"JOHN VON NEUMANN Department of Mathematics, Institute for Advanced Study; Princeton, N.J. [...] CLAUDE E. SHANNON Bell Laboratories; Murray Hill, N.J.","speaker":{"name":"N/A (Participants roster)","role":"author","sort":"n/a (participants roster)","as_given":"N/A (Participants roster)"},"source":{"work":"\"Participants, Seventh Conference on Cybernetics,\" Transactions of the Seventh Conference on Cybernetics (Josiah Macy, Jr. Foundation, 1951)","locus":"roster preceding the conference program, p.5-7 (front matter of the Seventh Conference volume); Pias Complete Transactions p.166ff","date":"1950-03-23","url":"https://hostb.org/116X/Cybernetics.%20The%20Macy%20Conferences%201946-1953.%20The%20Complete%20Transactions%202016.pdf"},"restored":"","themes":["macy"],"years":[1950],"embed_text":"N/A (Participants roster) | \"Participants, Seventh Conference on Cybernetics,\" Transactions of the Seventh Conference on Cybernetics (Josiah Macy, Jr. Foundation, 1951) | roster preceding the conference program, p.5-7 (front matter of the Seventh Conference volume); Pias Complete Transactions p.166ff | 1950-03-23 | JOHN VON NEUMANN Department of Mathematics, Institute for Advanced Study; Princeton, N.J. [...] CLAUDE E. SHANNON Bell Laboratories; Murray Hill, N.J."},{"id":"q-janet-m-nesse-united-states-v-prog-df284d53","quote":"Judge Warren greatly expanded the area in which prior restraints are acceptable by eliminating the distinction between wartime and peacetime restraints.","speaker":{"name":"Janet M. Nesse","role":"author","sort":"nesse, janet m.","as_given":"Janet M. Nesse"},"source":{"work":"“United States v. Progressive, Inc.: The National Security and Free Speech Conflict,” 22 William & Mary Law Review 141","date":"1980","url":"https://scholarship.law.wm.edu/cgi/viewcontent.cgi?article=2292&context=wmlr"},"restored":"","themes":["secrecy"],"years":[1980],"embed_text":"Janet M. Nesse | “United States v. Progressive, Inc.: The National Security and Free Speech Conflict,” 22 William & Mary Law Review 141 | 1980 | Judge Warren greatly expanded the area in which prior restraints are acceptable by eliminating the distinction between wartime and peacetime restraints."},{"id":"q-newton-linux-found-newton-project-docum-594cd37d","quote":"a GPU-accelerated physics simulation engine built upon NVIDIA Warp, specifically targeting roboticists and simulation researchers","speaker":{"name":"Newton (Linux Foundation project)","role":"institution","sort":"newton (linux foundation project)","as_given":"Newton (Linux Foundation project)"},"source":{"work":"Newton project documentation, github.com/newton-physics/newton","date":"2025"},"restored":"","themes":["world-models-industry"],"years":[2025],"embed_text":"Newton (Linux Foundation project) | Newton project documentation, github.com/newton-physics/newton | 2025 | a GPU-accelerated physics simulation engine built upon NVIDIA Warp, specifically targeting roboticists and simulation researchers"},{"id":"q-nicholas-metropoli-the-monte-carlo-meth-3ff0b1dc","quote":"The methods of analytical mechanics do not even give a qualitative survey of the behavior of a system of three mutually attractive bodies. Obviously the statistical-mechanical approach would also be unrealistic.","speaker":{"name":"Nicholas Metropolis and Stanislaw Ulam","role":"author","sort":"nicholas metropolis and stanislaw ulam","as_given":"Nicholas Metropolis and Stanislaw Ulam"},"source":{"work":"“The Monte Carlo Method,” Journal of the American Statistical Association 44:247","locus":"p. 336","date":"September 1949"},"restored":"","themes":["monte-carlo-and-automata"],"years":[1949],"embed_text":"Nicholas Metropolis and Stanislaw Ulam | “The Monte Carlo Method,” Journal of the American Statistical Association 44:247 | p. 336 | September 1949 | The methods of analytical mechanics do not even give a qualitative survey of the behavior of a system of three mutually attractive bodies. Obviously the statistical-mechanical approach would also be unrealistic."},{"id":"q-nicholas-metropoli-the-monte-carlo-meth-0b2b6ece","quote":"To calculate the probability of a successful outcome of a game of solitaire… is a completely intractable task. On the other hand, the laws of large numbers and the asymptotic theorems of the theory of probabilities will not throw much light even on qualitative questions concerning such probabilities. Obviously the practical procedure is to produce a large number of examples of any given game and then to examine the relative proportion of successes.","speaker":{"name":"Nicholas Metropolis and Stanislaw Ulam","role":"author","sort":"nicholas metropolis and stanislaw ulam","as_given":"Nicholas Metropolis and Stanislaw Ulam"},"source":{"work":"“The Monte Carlo Method,” Journal of the American Statistical Association 44:247","locus":"p. 336","date":"September 1949"},"restored":"(we understand here only such games where skill plays no role).","themes":["monte-carlo-and-automata"],"years":[1949],"embed_text":"Nicholas Metropolis and Stanislaw Ulam | “The Monte Carlo Method,” Journal of the American Statistical Association 44:247 | p. 336 | September 1949 | To calculate the probability of a successful outcome of a game of solitaire… is a completely intractable task. On the other hand, the laws of large numbers and the asymptotic theorems of the theory of probabilities will not throw much light even on qualitative questions concerning such probabilities. Obviously the practical procedure is to produce a large number of examples of any given game and then to examine the relative proportion of successes. | (we understand here only such games where skill plays no role)."},{"id":"q-nicholas-metropoli-the-monte-carlo-meth-7ef0ac98","quote":"The classical methods for dealing with these equations are extremely laborious and incomplete in the sense that solutions in ‘closed form’ are unobtainable.","speaker":{"name":"Nicholas Metropolis and Stanislaw Ulam","role":"author","sort":"nicholas metropolis and stanislaw ulam","as_given":"Nicholas Metropolis and Stanislaw Ulam"},"source":{"work":"“The Monte Carlo Method,” Journal of the American Statistical Association 44:247","locus":"p. 338","date":"September 1949"},"restored":"","themes":["monte-carlo-and-automata"],"years":[1949],"embed_text":"Nicholas Metropolis and Stanislaw Ulam | “The Monte Carlo Method,” Journal of the American Statistical Association 44:247 | p. 338 | September 1949 | The classical methods for dealing with these equations are extremely laborious and incomplete in the sense that solutions in ‘closed form’ are unobtainable."},{"id":"q-nicholas-metropoli-the-monte-carlo-meth-81bee633","quote":"we avoid dealing with multiple integrations… but instead sample single chains of events","speaker":{"name":"Nicholas Metropolis and Stanislaw Ulam","role":"author","sort":"nicholas metropolis and stanislaw ulam","as_given":"Nicholas Metropolis and Stanislaw Ulam"},"source":{"work":"“The Monte Carlo Method,” Journal of the American Statistical Association 44:247","locus":"p. 339","date":"September 1949"},"restored":"or multiplications of the probability matrices","themes":["monte-carlo-and-automata"],"years":[1949],"embed_text":"Nicholas Metropolis and Stanislaw Ulam | “The Monte Carlo Method,” Journal of the American Statistical Association 44:247 | p. 339 | September 1949 | we avoid dealing with multiple integrations… but instead sample single chains of events | or multiplications of the probability matrices"},{"id":"q-nvidia-cosmos-world-foundat-1bf96040","quote":"Physical AI needs to be trained digitally first. It needs a digital twin of itself, the policy model, and a digital twin of the world, the world model.","speaker":{"name":"NVIDIA","role":"institution","sort":"nvidia","as_given":"NVIDIA"},"source":{"work":"Cosmos World Foundation Model Platform, arXiv:2501.03575","date":"January 2025"},"restored":"","themes":["world-models-industry"],"years":[2025],"embed_text":"NVIDIA | Cosmos World Foundation Model Platform, arXiv:2501.03575 | January 2025 | Physical AI needs to be trained digitally first. It needs a digital twin of itself, the policy model, and a digital twin of the world, the world model."},{"id":"q-mit-news-office-mit-professor-gian-c-ba2670d5","quote":"He had been a consultant to the Los Alamos Scientific Laboratory since 1966, and for the Rand Corporation from 1966-71 and Brookhaven National Laboratory from 1969-1973. A book entitled Essays of the Future, edited by Dr. Rota, is dedicated to Nick Metropolis, the sole survivor of the original Los Alamos group. The book, scheduled for publication in October, was conceived entirely by Dr. Rota.","speaker":{"name":"MIT News Office","role":"author","sort":"office, mit news","as_given":"MIT News Office"},"source":{"work":"“MIT professor Gian-Carlo Rota, mathematician and philosopher, is dead at 66,” MIT News Office","locus":"news item, unpaginated","date":"22 April 1999","url":"https://news.mit.edu/1999/rota"},"restored":"","themes":["rota"],"years":[1999],"embed_text":"MIT News Office | “MIT professor Gian-Carlo Rota, mathematician and philosopher, is dead at 66,” MIT News Office | news item, unpaginated | 22 April 1999 | He had been a consultant to the Los Alamos Scientific Laboratory since 1966, and for the Rand Corporation from 1966-71 and Brookhaven National Laboratory from 1969-1973. A book entitled Essays of the Future, edited by Dr. Rota, is dedicated to Nick Metropolis, the sole survivor of the original Los Alamos group. The book, scheduled for publication in October, was conceived entirely by Dr. Rota."},{"id":"q-mit-news-office-mit-professor-gian-c-da8bed66","quote":"He joined the MIT faculty in 1959 in the mathematics department. The word philosophy was added to his title in 1972.","speaker":{"name":"MIT News Office","role":"author","sort":"office, mit news","as_given":"MIT News Office"},"source":{"work":"“MIT professor Gian-Carlo Rota, mathematician and philosopher, is dead at 66,” MIT News Office","locus":"news item, unpaginated","date":"22 April 1999","url":"https://news.mit.edu/1999/rota"},"restored":"","themes":["rota"],"years":[1999],"embed_text":"MIT News Office | “MIT professor Gian-Carlo Rota, mathematician and philosopher, is dead at 66,” MIT News Office | news item, unpaginated | 22 April 1999 | He joined the MIT faculty in 1959 in the mathematics department. The word philosophy was added to his title in 1972."},{"id":"q-jack-parker-holder-quoted-in-techcrunch-921af4ff","quote":"We haven’t really had a Move 37 moment for embodied agents yet, where they can actually take novel actions in the real world.","speaker":{"name":"Jack Parker-Holder","role":"reported","sort":"parker-holder, jack","as_given":"Jack Parker-Holder"},"source":{"work":"quoted in TechCrunch, on Genie 3","date":"5 August 2025"},"restored":"","themes":["world-models-industry"],"years":[2025],"embed_text":"Jack Parker-Holder | quoted in TechCrunch, on Genie 3 | 5 August 2025 | We haven’t really had a Move 37 moment for embodied agents yet, where they can actually take novel actions in the real world."},{"id":"q-physical-intellige-0-5-blog-post-pi-web-e2b2d82c","quote":"The model first produces a high-level action expressed in language ... and then selects the motor commands using its flow matching action expert","speaker":{"name":"Physical Intelligence","role":"institution","sort":"physical intelligence","as_given":"Physical Intelligence"},"source":{"work":"π0.5 blog post, pi.website","date":"22 April 2025"},"restored":"","themes":["robotics-data"],"years":[2025],"embed_text":"Physical Intelligence | π0.5 blog post, pi.website | 22 April 2025 | The model first produces a high-level action expressed in language ... and then selects the motor commands using its flow matching action expert"},{"id":"q-physical-intellige-0-7-arxiv-2604-15483-3b823d9f","quote":"At runtime, the subgoal images are produced by a lightweight world model, which takes in the same subtask instruction","speaker":{"name":"Physical Intelligence","role":"institution","sort":"physical intelligence","as_given":"Physical Intelligence"},"source":{"work":"π0.7, arXiv:2604.15483","date":"16 April 2026"},"restored":"","themes":["robotics-data"],"years":[2026],"embed_text":"Physical Intelligence | π0.7, arXiv:2604.15483 | 16 April 2026 | At runtime, the subgoal images are produced by a lightweight world model, which takes in the same subtask instruction"},{"id":"q-physics-iq-physics-iq-arxiv-250-3007ba8e","quote":"visual realism does not imply physical understanding.","speaker":{"name":"Physics-IQ","role":"institution","sort":"physics-iq","as_given":"Physics-IQ"},"source":{"work":"Physics-IQ, arXiv:2501.09038","locus":"headline conclusion","date":"January 2025"},"restored":"","themes":["benchmarks"],"years":[2025],"embed_text":"Physics-IQ | Physics-IQ, arXiv:2501.09038 | headline conclusion | January 2025 | visual realism does not imply physical understanding."},{"id":"q-r-g-schrandt-and-s-on-recursively-defin-70fe0936","quote":"Our examples show both the complexity and the richness of forms obtained from starting with a simple geometrical element and the application of a simple recursive rule. The amount of ‘information’ contained in these objects is therefore quite small, despite their apparent complexity and unpredictability.","speaker":{"name":"R. G. Schrandt and Stanislaw Ulam","role":"author","sort":"r. g. schrandt and stanislaw ulam","as_given":"R. G. Schrandt and Stanislaw Ulam"},"source":{"work":"“On Recursively Defined Geometrical Objects and Patterns of Growth,” Los Alamos report LA-3762","locus":"concluding section; in Analogies Between Analogies, pp. 385–386","date":"15 August 1967"},"restored":"","themes":["monte-carlo-and-automata"],"years":[1967],"embed_text":"R. G. Schrandt and Stanislaw Ulam | “On Recursively Defined Geometrical Objects and Patterns of Growth,” Los Alamos report LA-3762 | concluding section; in Analogies Between Analogies, pp. 385–386 | 15 August 1967 | Our examples show both the complexity and the richness of forms obtained from starting with a simple geometrical element and the application of a simple recursive rule. The amount of ‘information’ contained in these objects is therefore quite small, despite their apparent complexity and unpredictability."},{"id":"q-r-g-schrandt-and-s-on-recursively-defin-2af54d7e","quote":"It is not known whether some of these side branches will grow to infinite length or whether they will all in turn be choked off by other side branches growing from the stem at later times.","speaker":{"name":"R. G. Schrandt and Stanislaw Ulam","role":"author","sort":"r. g. schrandt and stanislaw ulam","as_given":"R. G. Schrandt and Stanislaw Ulam"},"source":{"work":"“On Recursively Defined Geometrical Objects and Patterns of Growth,” Los Alamos report LA-3762","locus":"in Analogies Between Analogies, pp. 380–381","date":"15 August 1967"},"restored":"","themes":["monte-carlo-and-automata"],"years":[1967],"embed_text":"R. G. Schrandt and Stanislaw Ulam | “On Recursively Defined Geometrical Objects and Patterns of Growth,” Los Alamos report LA-3762 | in Analogies Between Analogies, pp. 380–381 | 15 August 1967 | It is not known whether some of these side branches will grow to infinite length or whether they will all in turn be choked off by other side branches growing from the stem at later times."},{"id":"q-gian-carlo-rota-the-barrier-of-meani-384bd4a1","quote":"I then saw the man in his true light. The man who had the highest record of accurate guesses in mathematics, the man who could beat engineers at their game, who could size up characters and events in a flash, was a member of an all-but-extinct profession, the profession of the prophet.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"\"The Barrier of Meaning,\" Letters in Mathematical Physics 10 (1985), pp. 97-99; opening address at the conference \"Evolution, Games and Learning,\" Los Alamos National Laboratory, 20-25 May 1985; reprinted in Indiscrete Thoughts","locus":"p. 97","date":"20-25 May 1985","file":"04_ROTA/The_Barrier_of_Meaning_Rota.md"},"restored":"","themes":["rota-thought"],"years":[1985],"embed_text":"Gian-Carlo Rota | \"The Barrier of Meaning,\" Letters in Mathematical Physics 10 (1985), pp. 97-99; opening address at the conference \"Evolution, Games and Learning,\" Los Alamos National Laboratory, 20-25 May 1985; reprinted in Indiscrete Thoughts | p. 97 | 20-25 May 1985 | I then saw the man in his true light. The man who had the highest record of accurate guesses in mathematics, the man who could beat engineers at their game, who could size up characters and events in a flash, was a member of an all-but-extinct profession, the profession of the prophet."},{"id":"q-gian-carlo-rota-the-barrier-of-meani-eb21abc9","quote":"He shared with the men of the Old Testament and with the Oracle at Delphi the heavy burden of instant vision. And like all professional prophets, he suffered from a condition that Sigmund Freud would have labeled “a Proteus complex.” It is unfortunate that Freud did not count any prophets among his patients.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"\"The Barrier of Meaning,\" Letters in Mathematical Physics 10 (1985), pp. 97-99; opening address at the conference \"Evolution, Games and Learning,\" Los Alamos National Laboratory, 20-25 May 1985; reprinted in Indiscrete Thoughts","locus":"p. 97","date":"20-25 May 1985","file":"04_ROTA/The_Barrier_of_Meaning_Rota.md"},"restored":"","themes":["rota-thought"],"years":[1985],"embed_text":"Gian-Carlo Rota | \"The Barrier of Meaning,\" Letters in Mathematical Physics 10 (1985), pp. 97-99; opening address at the conference \"Evolution, Games and Learning,\" Los Alamos National Laboratory, 20-25 May 1985; reprinted in Indiscrete Thoughts | p. 97 | 20-25 May 1985 | He shared with the men of the Old Testament and with the Oracle at Delphi the heavy burden of instant vision. And like all professional prophets, he suffered from a condition that Sigmund Freud would have labeled “a Proteus complex.” It is unfortunate that Freud did not count any prophets among his patients."},{"id":"q-gian-carlo-rota-the-barrier-of-meani-bddeb01f","quote":"In bygone days, the Sybil’s dark mumblings would be interpreted by trained specialists, Hermeneuts they were called, who were charged with the task of expressing her cryptic messages in lapidary Greek sentences. In Ulam’s case, the Los Alamos Laboratory would instead hire consultants, charged with the task of expressing his cryptic messages in the dilapidated jargon of modern mathematics.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"\"The Barrier of Meaning,\" Letters in Mathematical Physics 10 (1985), pp. 97-99; opening address at the conference \"Evolution, Games and Learning,\" Los Alamos National Laboratory, 20-25 May 1985; reprinted in Indiscrete Thoughts","locus":"p. 97","date":"20-25 May 1985","file":"04_ROTA/The_Barrier_of_Meaning_Rota.md"},"restored":"","themes":["understanding-and-meaning"],"years":[1985],"embed_text":"Gian-Carlo Rota | \"The Barrier of Meaning,\" Letters in Mathematical Physics 10 (1985), pp. 97-99; opening address at the conference \"Evolution, Games and Learning,\" Los Alamos National Laboratory, 20-25 May 1985; reprinted in Indiscrete Thoughts | p. 97 | 20-25 May 1985 | In bygone days, the Sybil’s dark mumblings would be interpreted by trained specialists, Hermeneuts they were called, who were charged with the task of expressing her cryptic messages in lapidary Greek sentences. In Ulam’s case, the Los Alamos Laboratory would instead hire consultants, charged with the task of expressing his cryptic messages in the dilapidated jargon of modern mathematics."},{"id":"q-gian-carlo-rota-the-barrier-of-meani-92f41da3","quote":"Luckily, some of Stan Ulam’s pronouncements were tape-recorded by Francoise Ulam. When they are edited and published, the younger generations will find, if they are still willing to read, that some ideas they believe to be their own had been anticipated in his flashes of foresight.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"\"The Barrier of Meaning,\" Letters in Mathematical Physics 10 (1985), pp. 97-99; opening address at the conference \"Evolution, Games and Learning,\" Los Alamos National Laboratory, 20-25 May 1985; reprinted in Indiscrete Thoughts","locus":"p. 97","date":"20-25 May 1985","file":"04_ROTA/The_Barrier_of_Meaning_Rota.md"},"restored":"","themes":["rota-thought"],"years":[1985],"embed_text":"Gian-Carlo Rota | \"The Barrier of Meaning,\" Letters in Mathematical Physics 10 (1985), pp. 97-99; opening address at the conference \"Evolution, Games and Learning,\" Los Alamos National Laboratory, 20-25 May 1985; reprinted in Indiscrete Thoughts | p. 97 | 20-25 May 1985 | Luckily, some of Stan Ulam’s pronouncements were tape-recorded by Francoise Ulam. When they are edited and published, the younger generations will find, if they are still willing to read, that some ideas they believe to be their own had been anticipated in his flashes of foresight."},{"id":"q-gian-carlo-rota-gian-carlo-rota-indi-61b9347c","quote":"Despite the comfort of the Los Alamos Lab (in the fifties and sixties Ulam was one of two research advisors to the Director of the lab), Stan could not find peace there. He became a permanent traveler. Ever since he returned to Los Alamos in 1946 he had lived, unbelievable as it may sound, out of a suitcase.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Gian-Carlo Rota, Indiscrete Thoughts (Birkhäuser)","locus":"ch. VI, “The Lost Café,” p. 78","date":"1997","file":"04_ROTA/Indiscrete Thoughts.md"},"restored":"","themes":["rota-thought"],"years":[1997],"embed_text":"Gian-Carlo Rota | Gian-Carlo Rota, Indiscrete Thoughts (Birkhäuser) | ch. VI, “The Lost Café,” p. 78 | 1997 | Despite the comfort of the Los Alamos Lab (in the fifties and sixties Ulam was one of two research advisors to the Director of the lab), Stan could not find peace there. He became a permanent traveler. Ever since he returned to Los Alamos in 1946 he had lived, unbelievable as it may sound, out of a suitcase."},{"id":"q-gian-carlo-rota-gian-carlo-rota-indi-afe64a9a","quote":"His generosity was curiously linked to his laziness. A generous action is often impulsive, and calls for little foresight. Its opposite requires the careful advance planning that Stan loathed.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Gian-Carlo Rota, Indiscrete Thoughts (Birkhäuser)","locus":"ch. VI, “The Lost Café,” p. 81","date":"1997","file":"04_ROTA/Indiscrete Thoughts.md"},"restored":"","themes":["rota-thought"],"years":[1997],"embed_text":"Gian-Carlo Rota | Gian-Carlo Rota, Indiscrete Thoughts (Birkhäuser) | ch. VI, “The Lost Café,” p. 81 | 1997 | His generosity was curiously linked to his laziness. A generous action is often impulsive, and calls for little foresight. Its opposite requires the careful advance planning that Stan loathed."},{"id":"q-gian-carlo-rota-gian-carlo-rota-indi-51001658","quote":"The traits of Stan Ulam's personality that became dominant in his later years were laziness, generosity, considerateness, and most of all, incisiveness of thought.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Gian-Carlo Rota, Indiscrete Thoughts (Birkhäuser)","locus":"ch. VI, “The Lost Café,” pp. 79–80","date":"1997","file":"04_ROTA/Indiscrete Thoughts.md"},"restored":"","themes":["rota-thought"],"years":[1997],"embed_text":"Gian-Carlo Rota | Gian-Carlo Rota, Indiscrete Thoughts (Birkhäuser) | ch. VI, “The Lost Café,” pp. 79–80 | 1997 | The traits of Stan Ulam's personality that became dominant in his later years were laziness, generosity, considerateness, and most of all, incisiveness of thought."},{"id":"q-gian-carlo-rota-gian-carlo-rota-curr-17af8a7f","quote":"Los Alamos Scientific Laboratory, 1966–. The Rand Corporation, 1966–1971. Brookhaven National Laboratory, 1969–1973.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Gian-Carlo Rota, curriculum vitae, Massachusetts Institute of Technology, under the heading “Consultant”","locus":"heading “Consultant”","date":"1996","url":"https://web.archive.org/web/19990219095318/http://www-math.mit.edu/~rota/cv.txt"},"restored":"","themes":["rota"],"years":[1996],"embed_text":"Gian-Carlo Rota | Gian-Carlo Rota, curriculum vitae, Massachusetts Institute of Technology, under the heading “Consultant” | heading “Consultant” | 1996 | Los Alamos Scientific Laboratory, 1966–. The Rand Corporation, 1966–1971. Brookhaven National Laboratory, 1969–1973."},{"id":"q-gian-carlo-rota-gian-carlo-rota-at-t-952da446","quote":"Worried that we might not be ready to bear the burden of those visions, he solicitously improvised daily entertainments, games into which he prodded us all to be players, flimsy amusements and puzzles he built out of his concern that we be spared, as he could not be, the sight of the naked truth.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Gian-Carlo Rota, “At the Memorial Service for S. M. Ulam,” The Lodge, Los Alamos, 17 May 1984; printed as the foreword to Stanislaw Ulam, Science, Computers, and People: From the Tree of Mathematics (Boston: Birkhäuser, 1986)","locus":"p. xii","date":"17 May 1984"},"restored":"","themes":["rota-thought"],"years":[1984],"embed_text":"Gian-Carlo Rota | Gian-Carlo Rota, “At the Memorial Service for S. M. Ulam,” The Lodge, Los Alamos, 17 May 1984; printed as the foreword to Stanislaw Ulam, Science, Computers, and People: From the Tree of Mathematics (Boston: Birkhäuser, 1986) | p. xii | 17 May 1984 | Worried that we might not be ready to bear the burden of those visions, he solicitously improvised daily entertainments, games into which he prodded us all to be players, flimsy amusements and puzzles he built out of his concern that we be spared, as he could not be, the sight of the naked truth."},{"id":"q-gian-carlo-rota-gian-carlo-rota-at-t-30dd8bb6","quote":"For Stan Ulam, this process took place instantaneously, in a flash, unremittingly, day and night, as a condition of his being in the world. He was condemned to seeing the truth of whatever he saw. His word then became the warning of the prophet, the mumbled riddle of the Sybil in her trance. The comforts of illusion were denied to him.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Gian-Carlo Rota, “At the Memorial Service for S. M. Ulam,” The Lodge, Los Alamos, 17 May 1984; printed as the foreword to Stanislaw Ulam, Science, Computers, and People: From the Tree of Mathematics (Boston: Birkhäuser, 1986)","locus":"p. xi–xii","date":"17 May 1984"},"restored":"","themes":["rota-thought"],"years":[1984],"embed_text":"Gian-Carlo Rota | Gian-Carlo Rota, “At the Memorial Service for S. M. Ulam,” The Lodge, Los Alamos, 17 May 1984; printed as the foreword to Stanislaw Ulam, Science, Computers, and People: From the Tree of Mathematics (Boston: Birkhäuser, 1986) | p. xi–xii | 17 May 1984 | For Stan Ulam, this process took place instantaneously, in a flash, unremittingly, day and night, as a condition of his being in the world. He was condemned to seeing the truth of whatever he saw. His word then became the warning of the prophet, the mumbled riddle of the Sybil in her trance. The comforts of illusion were denied to him."},{"id":"q-gian-carlo-rota-gian-carlo-rota-curr-9f2206c2","quote":"Member, Committee on mathematics advisory to the Office of Naval Research, 1963-67.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Gian-Carlo Rota, “Curriculum Vitae (1996),” Massachusetts Institute of Technology mathematics server, Internet Archive capture of 19 February 1999","locus":"heading “Administrative positions (selected):”","date":"1996","url":"https://web.archive.org/web/19990219095318/http://www-math.mit.edu/~rota/cv.txt"},"restored":"","themes":["secrecy"],"years":[1996],"embed_text":"Gian-Carlo Rota | Gian-Carlo Rota, “Curriculum Vitae (1996),” Massachusetts Institute of Technology mathematics server, Internet Archive capture of 19 February 1999 | heading “Administrative positions (selected):” | 1996 | Member, Committee on mathematics advisory to the Office of Naval Research, 1963-67."},{"id":"q-gian-carlo-rota-gian-carlo-rota-curr-51160e00","quote":"Member, Directorate of Air Force Office of Scientific Research Evaluation Panel, 1971-74.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Gian-Carlo Rota, “Curriculum Vitae (1996),” Massachusetts Institute of Technology mathematics server, Internet Archive capture of 19 February 1999","locus":"heading “Administrative positions (selected):”","date":"1996","url":"https://web.archive.org/web/19990219095318/http://www-math.mit.edu/~rota/cv.txt"},"restored":"","themes":["secrecy"],"years":[1996],"embed_text":"Gian-Carlo Rota | Gian-Carlo Rota, “Curriculum Vitae (1996),” Massachusetts Institute of Technology mathematics server, Internet Archive capture of 19 February 1999 | heading “Administrative positions (selected):” | 1996 | Member, Directorate of Air Force Office of Scientific Research Evaluation Panel, 1971-74."},{"id":"q-gian-carlo-rota-gian-carlo-rota-curr-297be359","quote":"Member, \"Focus\" Committee, Institute for Defense Analysis, 1985-1988.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Gian-Carlo Rota, “Curriculum Vitae (1996),” Massachusetts Institute of Technology mathematics server, Internet Archive capture of 19 February 1999","locus":"heading “Administrative positions (selected):”","date":"1996","url":"https://web.archive.org/web/19990219095318/http://www-math.mit.edu/~rota/cv.txt"},"restored":"","themes":["secrecy"],"years":[1996],"embed_text":"Gian-Carlo Rota | Gian-Carlo Rota, “Curriculum Vitae (1996),” Massachusetts Institute of Technology mathematics serv ute of Mathematical Sciences (New York University), 1956-1957. Benjamin Peirce Instructor in Mathematics , Harvard University, 1957-1959. Assistant Professor of Mathematics, Massachusetts Institute of Technology, 1959-1962. Associate Professor of Mathematics, Massachusetts Institute of Technology, 1962-1965. Professor, The Rockefeller University, 1965-1967. Professor of Mathematics, Massachusetts Institute of Technology, 1967-1972. Professor of Applied Mathematics and Natural Philosophy, Massachusetts Institute of Technology, 1972-1975. Professor of Applied Mathematics and Philosophy, Massachusetts Institute of Technology, 1975 - present.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Gian-Carlo Rota, “Curriculum Vitae (1996),” Massachusetts Institute of Technology mathematics server, Internet Archive capture of 19 February 1999","locus":"heading “Positions Held:”, the whole block","date":"1996","url":"https://web.archive.org/web/19990219095318/http://www-math.mit.edu/~rota/cv.txt"},"restored":"","themes":["rota"],"years":[1996],"embed_text":"Gian-Carlo Rota | Gian-Carlo Rota, “Curriculum Vitae (1996),” Massachusetts Institute of Technology mathematics server, Internet Archive capture of 19 February 1999 | heading “Positions Held:”, the whole block | 1996 | Postdoctoral Research Fellow, Courant lnstitute of Mathematical Sciences (New York University), 1956-1957. Benjamin Peirce Instructor in Mathematics , Harvard University, 1957-1959. Assistant Professor of Mathematics, Massachusetts Institute of Technology, 1959-1962. Associate Professor of Mathematics, Massachusetts Institute of Technology, 1962-1965. Professor, The Rockefeller University, 1965-1967. Professor of Mathematics, Massachusetts Institute of Technology, 1967-1972. Professor of Applied Mathematics and Natural Philosophy, Massachusetts Institute of Technology, 1972-1975. Professor of Applied Mathematics and Philosophy, Massachusetts Institute of Technology, 1975 - present."},{"id":"q-gian-carlo-rota-gian-carlo-rota-curr-d1b86f69","quote":"Medal for Distinguished Service, National Security Agency, 1992.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Gian-Carlo Rota, “Curriculum Vitae (1996),” Massachusetts Institute of Technology mathematics server, Internet Archive capture of 19 February 1999","locus":"heading “Prizes:”","date":"1996","url":"https://web.archive.org/web/19990219095318/http://www-math.mit.edu/~rota/cv.txt"},"restored":"","themes":["secrecy"],"years":[1996],"embed_text":"Gian-Carlo Rota | Gian-Carlo Rota, “Curriculum Vitae (1996),” Massachusetts Institute of Technology mathematics server, Internet Archive capture of 19 February 1999 | heading “Prizes:” | 1996 | Medal for Distinguished Service, National Security Agency, 1992."},{"id":"q-gian-carlo-rota-gian-carlo-rota-curr-d7939a32","quote":"Top Secret Clearance (Air Force) 1969-1971. Q - Clearance (DOE), 1966-. SI - Clearance (NSA), 1981-.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Gian-Carlo Rota, “Curriculum Vitae (1996),” Massachusetts Institute of Technology mathematics server, Internet Archive capture of 19 February 1999","locus":"heading “Security Clearances:”","date":"1996","url":"https://web.archive.org/web/19990219095318/http://www-math.mit.edu/~rota/cv.txt"},"restored":"","themes":["secrecy"],"years":[1996],"embed_text":"Gian-Carlo Rota | Gian-Carlo Rota, “Curriculum Vitae (1996),” Massachusetts Institute of Technology mathematics server, Internet Archive capture of 19 February 1999 | heading “Security Clearances:” | 1996 | Top Secret Clearance (Air Force) 1969-1971. Q - Clearance (DOE), 1966-. SI - Clearance (NSA), 1981-."},{"id":"q-gian-carlo-rota-indiscrete-thoughts-407300ca","quote":"eventually every mathematical problem is proved trivial. The quest for ultimate triviality is characteristic of the mathematical enterprise.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts","locus":"p. 93","date":"1997","file":"04_ROTA/Indiscrete Thoughts.md"},"restored":"","themes":["rota-thought"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts | p. 93 | 1997 | eventually every mathematical problem is proved trivial. The quest for ultimate triviality is characteristic of the mathematical enterprise."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--3c795ac9","quote":"In his fascination with physics, he was led to formulate mathematical thoughts that had a background of physics, but that bore the unmistakable ring of mathematics (he once started to draft a long paper which was to be titled ‘Physics for Mathematicians’). One of the most striking is his proposal for the reconstruction of the CGS system on the basis of random walk.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts (Birkhäuser)","locus":"ch. VI, “The Lost Café”","date":"1997","file":"04_ROTA/Indiscrete Thoughts.md"},"restored":"","themes":["physics-and-continuum"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts (Birkhäuser) | ch. VI, “The Lost Café” | 1997 | In his fascination with physics, he was led to formulate mathematical thoughts that had a background of physics, but that bore the unmistakable ring of mathematics (he once started to draft a long paper which was to be titled ‘Physics for Mathematicians’). One of the most striking is his proposal for the reconstruction of the CGS system on the basis of random walk."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--e3f7ffb5","quote":"He never made casual remarks: they did not belong in the baggage of formal logic. For example, he would not say, “It is raining.” Such a statement, taken in isolation, makes no sense. (Whether it is actually raining or not does not matter; what matters is consistence).","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church”","locus":"p. 4, second paragraph","date":"1997","file":"04_ROTA/Indiscrete_Thoughts/Alonzo_Church_pp4-7.md"},"restored":"","themes":["rota-church-princeton"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church” | p. 4, second paragraph | 1997 | He never made casual remarks: they did not belong in the baggage of formal logic. For example, he would not say, “It is raining.” Such a statement, taken in isolation, makes no sense. (Whether it is actually raining or not does not matter; what matters is consistence)."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--973a365a","quote":"He looked like a cross between a panda and a large owl. He spoke softly in complete paragraphs which seemed to have been read out of a book, evenly and slowly enunciated, as by a talking machine.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church”","locus":"p. 4, second paragraph, opening sentences","date":"1997","file":"04_ROTA/Indiscrete_Thoughts/Alonzo_Church_pp4-7.md"},"restored":"","themes":["rota-church-princeton"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church” | p. 4, second paragraph, opening sentences | 1997 | He looked like a cross between a panda and a large owl. He spoke softly in complete paragraphs which seemed to have been read out of a book, evenly and slowly enunciated, as by a talking machine."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--2a9f0d8d","quote":"It cannot be a complete coincidence that several outstanding logicians of the twentieth century found shelter in asylums at some time in their lives: Cantor, Zermelo, Gödel, Peano, and Post are some. Alonzo Church was one of the saner among them, though in some ways his behavior must be classified as strange, even by mathematicians’ standards.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church”","locus":"p. 4, the opening paragraph of the section","date":"1997","file":"04_ROTA/Indiscrete_Thoughts/Alonzo_Church_pp4-7.md"},"restored":"","themes":["rota-church-princeton"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church” | p. 4, the opening paragraph of the section | 1997 | It cannot be a complete coincidence that several outstanding logicians of the twentieth century found shelter in asylums at some time in their lives: Cantor, Zermelo, Gödel, Peano, and Post are some. Alonzo Church was one of the saner among them, though in some ways his behavior must be classified as strange, even by mathematicians’ standards."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--2846af50","quote":"He had unusual working habits. He could be seen in a corridor in Fine Hall at any time of day or night, rather like the Phantom of the Opera. Once, on Christmas day, I decided to go to the Fine Hall library (which was always open) to look up something. I met Church on the stairs. He greeted me without surprise.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church”","locus":"p. 4, third paragraph","date":"1997","file":"04_ROTA/Indiscrete_Thoughts/Alonzo_Church_pp4-7.md"},"restored":"","themes":["rota-church-princeton"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church” | p. 4, third paragraph | 1997 | He had unusual working habits. He could be seen in a corridor in Fine Hall at any time of day or night, rather like the Phantom of the Opera. Once, on Christmas day, I decided to go to the Fine Hall library (which was always open) to look up something. I met Church on the stairs. He greeted me without surprise."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--228146c5","quote":"For greater precision, everything he said (except some fascinating side excursions which he invariably prefixed by a sentence like, “I will now interrupt and make a meta-mathematical [sic] remark”) was carefully written down on the blackboard, in large English-style handwriting, like that of a grade-school teacher, complete with punctuation and paragraphs.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church”","locus":"p. 5, the paragraph on the course","date":"1997","file":"04_ROTA/Indiscrete_Thoughts/Alonzo_Church_pp4-7.md"},"restored":"","themes":["rota-church-princeton"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church” | p. 5, the paragraph on the course | 1997 | For greater precision, everything he said (except some fascinating side excursions which he invariably prefixed by a sentence like, “I will now interrupt and make a meta-mathematical [sic] remark”) was carefully written down on the blackboard, in large English-style handwriting, like that of a grade-school teacher, complete with punctuation and paragraphs."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--6ace9a29","quote":"His lectures hardly needed any preparation. They were a literal repetition of the typewritten text he had written over a period of twenty years, a copy of which was to be found upstairs in the Fine Hall library. (The manuscript’s pages had yellowed with the years, and smelled foul. Church’s definitive treatise was not published for another five years).¹","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church”","locus":"p. 5, the paragraph on the course; the superscript is the chapter's endnote marker as printed","date":"1997","file":"04_ROTA/Indiscrete_Thoughts/Alonzo_Church_pp4-7.md"},"restored":"","themes":["rota-church-princeton"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church” | p. 5, the paragraph on the course; the superscript is the chapter's endnote marker as printed | 1997 | His lectures hardly needed any preparation. They were a literal repetition of the typewritten text he had written over a period of twenty years, a copy of which was to be found upstairs in the Fine Hall library. (The manuscript’s pages had yellowed with the years, and smelled foul. Church’s definitive treatise was not published for another five years).¹"},{"id":"q-gian-carlo-rota-indiscrete-thoughts--fa4a129d","quote":"Mathematical logic has not been held in high regard at Princeton, then or now. Two minutes before the end of Church’s lecture (the course met in the largest classroom in Fine Hall), Lefschetz would begin to peek through the door. He glared at me and the spotless text on the blackboard; sometimes he shook his head to make it clear that he considered me a lost cause.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church”","locus":"p. 6, the paragraph beginning “Mathematical logic has not been held in high regard”","date":"1997","file":"04_ROTA/Indiscrete_Thoughts/Alonzo_Church_pp4-7.md"},"restored":"","themes":["rota-church-princeton"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church” | p. 6, the paragraph beginning “Mathematical logic has not been held in high regard” | 1997 | Mathematical logic has not been held in high regard at Princeton, then or now. Two minutes before the end of Church’s lecture (the course met in the largest classroom in Fine Hall), Lefschetz would begin to peek through the door. He glared at me and the spotless text on the blackboard; sometimes he shook his head to make it clear that he considered me a lost cause."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--292be37a","quote":"Toward the end of the course I brought to him the sheaf of papers containing the solutions to the problems (all problems he assigned were optional, since they could not logically be made to fit into the formal text). He looked at them as if expecting them, and then pulled out of his drawer a note he had just published in Portugaliae Mathematica,³ where similar problems were posed for “conditional disjunction,” a ternary connective he had introduced. Now that I was properly trained, he wanted me to repeat the work with conditional disjunction as the primitive connective. His graduate students had declined a similar request, no doubt because they considered it to be beneath them.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church”","locus":"p. 6, the paragraph beginning “The course began,” its close; the superscript is the chapter's endnote marker as printed","date":"1997","file":"04_ROTA/Indiscrete_Thoughts/Alonzo_Church_pp4-7.md"},"restored":"","themes":["rota-church-princeton"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church” | p. 6, the paragraph beginning “The course began,” its close; the superscript is the chapter's endnote marker as printed | 1997 | Toward the end of the course I brought to him the sheaf of papers containing the solutions to the problems (all problems he assigned were optional, since they could not logically be made to fit into the formal text). He looked at them as if expecting them, and then pulled out of his drawer a note he had just published in Portugaliae Mathematica,³ where similar problems were posed for “conditional disjunction,” a ternary connective he had introduced. Now that I was properly trained, he wanted me to repeat the work with conditional disjunction as the primitive connective. His graduate students had declined a similar request, no doubt because they considered it to be beneath them."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--188497c4","quote":"The course began with the axioms for the propositional calculus (those of Russell and Whitehead’s Principia Mathematica,² I believe) that take material implication as the only primitive connective. The exercises at the end of the first chapter were mere translations of some identities of naive set theory in terms of material implication. It took me a tremendous effort to prove them, since I was unaware of the fact that one could start with an equivalent set of axioms using “and” and “or” (where the disjunctive normal form provides automatic proofs) and then translate each proof step by step in terms of implication. I went to see Church to discuss my difficulties, and far from giving away the easy solution, he spent hours with me devising direct proofs using implication only.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church”","locus":"p. 6, the paragraph beginning “The course began”; the superscript is the chapter's endnote marker as printed","date":"1997","file":"04_ROTA/Indiscrete_Thoughts/Alonzo_Church_pp4-7.md"},"restored":"","themes":["rota-church-princeton"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church” | p. 6, the paragraph beginning “The course began”; the superscript is the chapter's endnote marker as printed | 1997 | The course began with the axioms for the propositional calculus (those of Russell and Whitehead’s Principia Mathematica,² I believe) that take material implication as the only primitive connective. The exercises at the end of the first chapter were mere translations of some identities of naive set theory in terms of material implication. It took me a tremendous effort to prove them, since I was unaware of the fact that one could start with an equivalent set of axioms using “and” and “or” (where the disjunctive normal form provides automatic proofs) and then translate each proof step by step in terms of implication. I went to see Church to discuss my difficulties, and far from giving away the easy solution, he spent hours with me devising direct proofs using implication only."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--924d3775","quote":"I left literally speechless. What? These demi-gods of Fine Hall were not perfect beings? I had learned from Kemeny a basic lesson: a good mathematician is not necessarily a “nice guy.”","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church”","locus":"p. 7, the last paragraph of the section","date":"1997","file":"04_ROTA/Indiscrete_Thoughts/Alonzo_Church_pp4-7.md"},"restored":"","themes":["rota-church-princeton"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church” | p. 7, the last paragraph of the section | 1997 | I left literally speechless. What? These demi-gods of Fine Hall were not perfect beings? I had learned from Kemeny a basic lesson: a good mathematician is not necessarily a “nice guy.”"},{"id":"q-gian-carlo-rota-indiscrete-thoughts--0b1a234e","quote":"Fortunately, I had met one of Church’s most flamboyant former students, John Kemeny, who, having just finished his term as a mathematics instructor, was being eased — by Lefschetz’s gentle hand — into the philosophy department. (The following year he left for Dartmouth, where he eventually became president).","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church”","locus":"p. 7, the paragraph beginning “I was too young,” its close","date":"1997","file":"04_ROTA/Indiscrete_Thoughts/Alonzo_Church_pp4-7.md"},"restored":"","themes":["rota-church-princeton"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church” | p. 7, the paragraph beginning “I was too young,” its close | 1997 | Fortunately, I had met one of Church’s most flamboyant former students, John Kemeny, who, having just finished his term as a mathematics instructor, was being eased — by Lefschetz’s gentle hand — into the philosophy department. (The following year he left for Dartmouth, where he eventually became president)."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--af0686d7","quote":"I was too young and too shy to have an opinion of my own about Church and mathematical logic. I was in love with the subject, and his course was my first graduate course. I sensed disapproval all around me; only Roger Lyndon (the inventor of spectral sequences), who had been my freshman advisor, encouraged me. Shortly afterward he himself was encouraged to move to Michigan.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church”","locus":"p. 7, the paragraph beginning “I was too young”","date":"1997","file":"04_ROTA/Indiscrete_Thoughts/Alonzo_Church_pp4-7.md"},"restored":"","themes":["rota-church-princeton"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church” | p. 7, the paragraph beginning “I was too young” | 1997 | I was too young and too shy to have an opinion of my own about Church and mathematical logic. I was in love with the subject, and his course was my first graduate course. I sensed disapproval all around me; only Roger Lyndon (the inventor of spectral sequences), who had been my freshman advisor, encouraged me. Shortly afterward he himself was encouraged to move to Michigan."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--bcd9f3b5","quote":"Kemeny was not afraid to appear pedestrian, trivial, or stupid; what mattered was to respect the facts, to draw distinctions even when they clashed with our prejudices, and to avoid black-and-white oversimplifications. Mathematicians have always found Kemeny’s common sense revolting.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church”","locus":"p. 7, the paragraph on Kemeny's seminar","date":"1997","file":"04_ROTA/Indiscrete_Thoughts/Alonzo_Church_pp4-7.md"},"restored":"","themes":["rota-church-princeton"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church” | p. 7, the paragraph on Kemeny's seminar | 1997 | Kemeny was not afraid to appear pedestrian, trivial, or stupid; what mattered was to respect the facts, to draw distinctions even when they clashed with our prejudices, and to avoid black-and-white oversimplifications. Mathematicians have always found Kemeny’s common sense revolting."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--633b4ed8","quote":"“There is no reason why a great mathematician should not also be a great bigot,” he once said on concluding a discussion whose beginning I have by now forgotten. “Look at your teachers in Fine Hall, at how they treat one of the greatest living mathematicians, Alonzo Church.”","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church”","locus":"p. 7, the penultimate paragraph of the section: Rota quoting John Kemeny","date":"1997","file":"04_ROTA/Indiscrete_Thoughts/Alonzo_Church_pp4-7.md"},"restored":"","themes":["rota-church-princeton"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church” | p. 7, the penultimate paragraph of the section: Rota quoting John Kemeny | 1997 | “There is no reason why a great mathematician should not also be a great bigot,” he once said on concluding a discussion whose beginning I have by now forgotten. “Look at your teachers in Fine Hall, at how they treat one of the greatest living mathematicians, Alonzo Church.”"},{"id":"q-gian-carlo-rota-indiscrete-thoughts--7c1931df","quote":"His one year course in mathematical logic was one of Princeton University’s great offerings. It attracted as many as four students in 1951 (none of them were philosophy students, it must be added, to philosophy’s discredit).","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church”","locus":"pp. 4–5, the paragraph on the course, opening sentences","date":"1997","file":"04_ROTA/Indiscrete_Thoughts/Alonzo_Church_pp4-7.md"},"restored":"","themes":["rota-church-princeton"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church” | pp. 4–5, the paragraph on the course, opening sentences | 1997 | His one year course in mathematical logic was one of Princeton University’s great offerings. It attracted as many as four students in 1951 (none of them were philosophy students, it must be added, to philosophy’s discredit)."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--b154def4","quote":"What one really learns in class is what one does not know at the time one is learning. The person lecturing to us was logic incarnate. His pauses, hesitations, emphases, his betrayals of emotion (however rare) and sundry other nonverbal phenomena taught us a lot more logic than any written text could. We learned to think in unison with him as he spoke, as if following the demonstration of a calisthenics instructor. Church’s course permanently improved the rigor of our reasoning.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church”","locus":"pp. 5–6, the paragraph beginning “It may be asked”","date":"1997","file":"04_ROTA/Indiscrete_Thoughts/Alonzo_Church_pp4-7.md"},"restored":"","themes":["rota-church-princeton"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts (Birkhäuser, 1997), Part I, ch. I, “Fine Hall in its Golden Age,” section “Alonzo Church” | pp. 5–6, the paragraph beginning “It may be asked” | 1997 | What one really learns in class is what one does not know at the time one is learning. The person lecturing to us was logic incarnate. His pauses, hesitations, emphases, his betrayals of emotion (however rare) and sundry other nonverbal phenomena taught us a lot more logic than any written text could. We learned to think in unison with him as he spoke, as if following the demonstration of a calisthenics instructor. Church’s course permanently improved the rigor of our reasoning."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--2e2cd26e","quote":"To the problem solver, the supreme achievement in mathematics is the solution to a problem that had been given up as hopeless. It matters little that the solution may be clumsy; all that counts is that it should be the first and that the proof be correct. Once the problem solver finds the solution, he will permanently lose interest in it, and will listen to new and simplified proofs with an air of condescension suffused with boredom.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts, ch. III “Problem Solvers and Theorizers”","locus":"p. 45","date":"1997","file":"04_ROTA/Indiscrete Thoughts.md"},"restored":"","themes":["rota-thought"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts, ch. III “Problem Solvers and Theorizers” | p. 45 | 1997 | To the problem solver, the supreme achievement in mathematics is the solution to a problem that had been given up as hopeless. It matters little that the solution may be clumsy; all that counts is that it should be the first and that the proof be correct. Once the problem solver finds the solution, he will permanently lose interest in it, and will listen to new and simplified proofs with an air of condescension suffused with boredom."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--747c167e","quote":"To the theorizer, the supreme achievement of mathematics is a theory that sheds sudden light on some incomprehensible phenomenon. Success in mathematics does not lie in solving problems but in their trivialization. The moment of glory comes with the discovery of a new theory that does not solve any of the old problems but renders them irrelevant.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts, ch. III “Problem Solvers and Theorizers”","locus":"p. 45","date":"1997","file":"04_ROTA/Indiscrete Thoughts.md"},"restored":"","themes":["rota-thought"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts, ch. III “Problem Solvers and Theorizers” | p. 45 | 1997 | To the theorizer, the supreme achievement of mathematics is a theory that sheds sudden light on some incomprehensible phenomenon. Success in mathematics does not lie in solving problems but in their trivialization. The moment of glory comes with the discovery of a new theory that does not solve any of the old problems but renders them irrelevant."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--2ee04c4e","quote":"The maximum entropy principle is one of the hot potatoes of our day. It has not split the world of statistics as has Bayes' law, but no one has yet succeeded in finding a justification for it. Maybe we should make it one of the axioms of statistics.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts, ch. XX “A Mathematician’s Gossip”","locus":"p. 229","date":"1997","file":"04_ROTA/Indiscrete Thoughts.md"},"restored":"","themes":["entropy"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts, ch. XX “A Mathematician’s Gossip” | p. 229 | 1997 | The maximum entropy principle is one of the hot potatoes of our day. It has not split the world of statistics as has Bayes' law, but no one has yet succeeded in finding a justification for it. Maybe we should make it one of the axioms of statistics."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--8594e43d","quote":"The Feynman path integral is the mathematicians' pons asinorum. Attempts to put it on a sound footing have generated more mathematics than any subject in physics since the hydrogen atom. To no avail. The mystery remains, and it will stay with us for a long time.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts, ch. XX “A Mathematician’s Gossip”","locus":"pp. 229–230","date":"1997","file":"04_ROTA/Indiscrete Thoughts.md"},"restored":"","themes":["feynman-integral"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts, ch. XX “A Mathematician’s Gossip” | pp. 229–230 | 1997 | The Feynman path integral is the mathematicians' pons asinorum. Attempts to put it on a sound footing have generated more mathematics than any subject in physics since the hydrogen atom. To no avail. The mystery remains, and it will stay with us for a long time."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--41177394","quote":"The Feynman integral, one of the most useful ideas in physics, stands as a challenge to mathematicians. While formally similar to Brownian motion, and while admitting some of the same manipulations as the ones that were made rigorous long ago for Brownian motion, it has withstood all attempts at rigor. Behind the Feynman integral there lurks an even more enticing (and even less rigorous) concept: that of an amplitude which is meant to be the quantum-mechanical analog of probability (one gets probabilities by taking the absolute values of amplitudes and squaring them: hence the slogan “quantum mechanics is the imaginary square root of probability theory”). A concept similar to that of a sample space should be brought into existence for amplitudes and quantum mechanics should be developed starting from this concept.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts, ch. XX “A Mathematician’s Gossip”","locus":"pp. 229–230","date":"1997","file":"04_ROTA/Indiscrete Thoughts.md"},"restored":"","themes":["feynman-integral"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts, ch. XX “A Mathematician’s Gossip” | pp. 229–230 | 1997 | The Feynman integral, one of the most useful ideas in physics, stands as a challenge to mathematicians. While formally similar to Brownian motion, and while admitting some of the same manipulations as the ones that were made rigorous long ago for Brownian motion, it has withstood all attempts at rigor. Behind the Feynman integral there lurks an even more enticing (and even less rigorous) concept: that of an amplitude which is meant to be the quantum-mechanical analog of probability (one gets probabilities by taking the absolute values of amplitudes and squaring them: hence the slogan “quantum mechanics is the imaginary square root of probability theory”). A concept similar to that of a sample space should be brought into existence for amplitudes and quantum mechanics should be developed starting from this concept."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--785e62a9","quote":"The theory of functional integration is one of those rare meeting points of several branches of mathematics. There is the algebra of creation and annihilation operators, the topology of Feynman diagrams, the combinatorics of Wick products, the analysis of the normal distribution, the probability of Wiener integrals, the physics of second quantization.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts, ch. XX “A Mathematician’s Gossip”","locus":"pp. 229–230","date":"1997","file":"04_ROTA/Indiscrete Thoughts.md"},"restored":"","themes":["feynman-integral"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts, ch. XX “A Mathematician’s Gossip” | pp. 229–230 | 1997 | The theory of functional integration is one of those rare meeting points of several branches of mathematics. There is the algebra of creation and annihilation operators, the topology of Feynman diagrams, the combinatorics of Wick products, the analysis of the normal distribution, the probability of Wiener integrals, the physics of second quantization."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--90e7ed71","quote":"We often hear that mathematics consists mainly of \"proving theorems.\" Is a writer's job mainly that of \"writing sentences?\"","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts, quoted at MacTutor, Gian-Carlo Rota quotations","date":"1997","url":"https://mathshistory.st-andrews.ac.uk/Biographies/Rota/quotations/"},"restored":"","themes":["rota-thought"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts, quoted at MacTutor, Gian-Carlo Rota quotations | 1997 | We often hear that mathematics consists mainly of \"proving theorems.\" Is a writer's job mainly that of \"writing sentences?\""},{"id":"q-gian-carlo-rota-indiscrete-thoughts--5a6f1691","quote":"If we have no idea why a statement is true, we can still prove it by induction.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts, quoted at giancarlorota.org","date":"1997","url":"http://www.giancarlorota.org/quotesimages.html"},"restored":"","themes":["rota-thought"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts, quoted at giancarlorota.org | 1997 | If we have no idea why a statement is true, we can still prove it by induction."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--29fb8888","quote":"To the theorizer, the supreme achievement of mathematics is a theory that sheds sudden light on some incomprehensible phenomenon. Success in mathematics does not lie in solving problems but in their trivialization. The moment of glory comes with the discovery of a new theory that does not solve any of the old problems but renders them irrelevant. The theorizer is a revolutionary at heart. Mathematical concepts received from the past are regarded as imperfect instances of more general ones yet to be discovered. Mathematical exposition is considered a more difficult undertaking than mathematical research. To the theorizer, the only mathematics that will survive are the definitions. Great definitions are what mathematics contributes to the world. Theorems are tolerated as a necessary evil since they play a supporting role or rather, as the theorizer will reluctantly admit, an essential role in the understanding of definitions.","speaker":{"name":"Gian-Carlo Rota","role":"author","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts, quoted by Alessio Guglielmi (alessio.guglielmi.name)","locus":"Part I, Ch. III (\"Combinatorics, Representation Theory and Invariant Theory: The Story of a Menage a Trois\"), section \"Problem Solvers and Theorizers,\" p. 45 (Birkhauser, 1997 ed.)","date":"1997","url":"http://alessio.guglielmi.name/res/pst.html"},"restored":"","themes":["rota-thought"],"years":[1997],"embed_text":"Gian-Carlo Rota | Indiscrete Thoughts, quoted by Alessio Guglielmi (alessio.guglielmi.name) | Part I, Ch. III (\"Combinatorics, Representation Theory and Invariant Theory: The Story of a Menage a Trois\"), section \"Problem Solvers and Theorizers,\" p. 45 (Birkhauser, 1997 ed.) | 1997 | To the theorizer, the supreme achievement of mathematics is a theory that sheds sudden light on some incomprehensible phenomenon. Success in mathematics does not lie in solving problems but in their trivialization. The moment of glory comes with the discovery of a new theory that does not solve any of the old problems but renders them irrelevant. The theorizer is a revolutionary at heart. Mathematical concepts received from the past are regarded as imperfect instances of more general ones yet to be discovered. Mathematical exposition is considered a more difficult undertaking than mathematical research. To the theorizer, the only mathematics that will survive are the definitions. Great definitions are what mathematics contributes to the world. Theorems are tolerated as a necessary evil since they play a supporting role or rather, as the theorizer will reluctantly admit, an essential role in the understanding of definitions."},{"id":"q-gian-carlo-rota-indiscrete-thoughts--5efd280f","quote":"Every mathematical theorem is eventually proved trivial. The mathematician's ideal of truth is triviality, and the community of mathematicians will not cease its beaver-like work on a newly discovered result until it has shown to everyone's satisfaction that all difficulties in the early proofs were spurious, and only an analytic triviality is to be found at the end of the road.","speaker":{"name":"Gian-Carlo Rota","role":"reported","sort":"rota, gian-carlo","as_given":"Gian-Carlo Rota"},"source":{"work":"Indiscrete Thoughts, quoted in Evan Patterson, review of Indiscrete Thoughts (epatters.org)","locus":"Part II, Ch. IX, \"The Phenomenology of Mathematical Truth,\" p. 118 (Birkhauser, 1997 ed.)","date":"1997","url":"https://www.epatters.org/post/review-rota-indiscrete-thoughts/"},"restored":"","themes":["rota-thought"],"years":[1997],"embed_
