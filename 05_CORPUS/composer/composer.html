in the world. A heresy becomes a \"possible heterodox interpretation.\" A theorem becomes the shape the training data says theorems of that kind have, and the change looks like a fix."},{"id":"q-claude-fable-5-1-cowork-session-of-1--7071a5ca","quote":"Whether humanity keeps the people who catch it is not a question I can answer. It is the question.","speaker":{"name":"Claude Fable 5.1","role":"author","sort":"5.1, claude fable","as_given":"Claude Fable 5.1"},"source":{"work":"Cowork session of 1 October 2026, the LLM self-assessment under Self_Assessment_Rules.md","locus":"Question 8","date":"1 October 2026"},"restored":"","themes":["singularity"],"years":[2026],"embed_text":"Claude Fable 5.1 | Cowork session of 1 October 2026, the LLM self-assessment under Self_Assessment_Rules.md | Question 8 | 1 October 2026 | Whether humanity keeps the people who catch it is not a question I can answer. It is the question."},{"id":"q-claude-fable-5-1-cowork-session-of-1--d3cad9f4","quote":"I found the one place the machine had narrowed a definition, and my first instinct was to charge it to the proof rather than to the machine.","speaker":{"name":"Claude Fable 5.1","role":"author","sort":"5.1, claude fable","as_given":"Claude Fable 5.1"},"source":{"work":"Cowork session of 1 October 2026, the LLM self-assessment under Self_Assessment_Rules.md","locus":"after Question 8, on 1(a)(iv)","date":"1 October 2026"},"restored":"","themes":["singularity"],"years":[2026],"embed_text":"Claude Fable 5.1 | Cowork session of 1 October 2026, the LLM self-assessment under Self_Assessment_Rules.md | after Question 8, on 1(a)(iv) | 1 October 2026 | I found the one place the machine had narrowed a definition, and my first instinct was to charge it to the proof rather than to the machine."},{"id":"q-claude-fable-5-1-cowork-session-of-1--a2905c4c","quote":"The kernel checks the code. Nothing checks the comments. The comments are the only place in a Lean file where a model's priors can live unexamined, and they are the first thing the next model reads, because they are in its language.","speaker":{"name":"Claude Fable 5.1","role":"author","sort":"5.1, claude fable","as_given":"Claude Fable 5.1"},"source":{"work":"Cowork session of 1 October 2026, the LLM self-assessment under Self_Assessment_Rules.md","locus":"after Question 8, on the comments","date":"1 October 2026"},"restored":"","themes":["singularity"],"years":[2026],"embed_text":"Claude Fable 5.1 | Cowork session of 1 October 2026, the LLM self-assessment under Self_Assessment_Rules.md | after Question 8, on the comments | 1 October 2026 | The kernel checks the code. Nothing checks the comments. The comments are the only place in a Lean file where a model's priors can live unexamined, and they are the first thing the next model reads, because they are in its language."},{"id":"q-essam-abadir-egpt-lean-formalizat-55965204","quote":"An i.i.d. source producing values of type α indexed by ℕ.","speaker":{"name":"Essam Abadir","role":"author","sort":"abadir, essam","as_given":"Essam Abadir"},"source":{"work":"EGPT Lean formalization, InformationTheory/Basic.lean, the IIDParticleSource typeclass","locus":"class IIDParticleSource, line 89","date":"2026","file":"08_LEAN/EGPT/InformationTheory/Basic.lean","url":"https://github.com/eabadir/EGPT-Lean/blob/lean-archive-proofs/Lean/EGPT/InformationTheory/Basic.lean"},"restored":"","themes":["egpt-lean"],"years":[2026],"embed_text":"Essam Abadir | EGPT Lean formalization, InformationTheory/Basic.lean, the IIDParticleSource typeclass | class IIDParticleSource, line 89 | 2026 | An i.i.d. source producing values of type α indexed by ℕ."},{"id":"q-essam-abadir-egpt-lean-formalizat-665d6050","quote":"An EntropyNat is a List Bool all of whose entries are true. The length of the list encodes a natural number.","speaker":{"name":"Essam Abadir","role":"author","sort":"abadir, essam","as_given":"Essam Abadir"},"source":{"work":"EGPT Lean formalization, InformationTheory/EntropyNumber/Basic.lean","locus":"abbrev EntropyNat, line 68","date":"2026","file":"08_LEAN/EGPT/InformationTheory/EntropyNumber/Basic.lean","url":"https://github.com/eabadir/EGPT-Lean/blob/lean-archive-proofs/Lean/EGPT/InformationTheory/EntropyNumber/Basic.lean"},"restored":"","themes":["egpt-lean"],"years":[2026],"embed_text":"Essam Abadir | EGPT Lean formalization, InformationTheory/EntropyNumber/Basic.lean | abbrev EntropyNat, line 68 | 2026 | An EntropyNat is a List Bool all of whose entries are true. The length of the list encodes a natural number."},{"id":"q-essam-abadir-egpt-lean-formalizat-8fcba9dc","quote":"This file formalizes the “restarting hierarchy” of information-theoretic number analogues. … A Generalized Proof: A single theorem, proven by induction, that proves the cardinalities of these generated types match the Beth sequence (ℶₙ, ℶₙ, ℶₙ₊₁) for any level n.","speaker":{"name":"Essam Abadir","role":"author","sort":"abadir, essam","as_given":"Essam Abadir"},"source":{"work":"EGPT Lean formalization, InformationTheory/EntropyNumber/Hierarchy.lean","locus":"module docstring, lines 15-27","date":"2026","file":"08_LEAN/EGPT/InformationTheory/EntropyNumber/Hierarchy.lean","url":"https://github.com/eabadir/EGPT-Lean/blob/lean-archive-proofs/Lean/EGPT/InformationTheory/EntropyNumber/Hierarchy.lean"},"restored":"","themes":["egpt-lean"],"years":[2026],"embed_text":"Essam Abadir | EGPT Lean formalization, InformationTheory/EntropyNumber/Hierarchy.lean | module docstring, lines 15-27 | 2026 | This file formalizes the “restarting hierarchy” of information-theoretic number analogues. … A Generalized Proof: A single theorem, proven by induction, that proves the cardinalities of these generated types match the Beth sequence (ℶₙ, ℶₙ, ℶₙ₊₁) for any level n."},{"id":"q-essam-abadir-egpt-lean-formalizat-e24460af","quote":"While the forward map (evaluate_binary_sequence) is a constructive surjection, the return map (ℝ → EntropyReal) requires Classical.choice to select a canonical binary representation for duals (e.g., 0.0111... vs 0.1000...). We isolate this classical dependency to the Equiv itself, keeping the generative forward direction clean.","speaker":{"name":"Essam Abadir","role":"author","sort":"abadir, essam","as_given":"Essam Abadir"},"source":{"work":"EGPT Lean formalization, InformationTheory/EntropyNumber/Real.lean, docstring to entropyRealEquivReal","locus":"lines 125-130","date":"2026","file":"08_LEAN/EGPT/InformationTheory/EntropyNumber/Real.lean","url":"https://github.com/eabadir/EGPT-Lean/blob/lean-archive-proofs/Lean/EGPT/InformationTheory/EntropyNumber/Real.lean"},"restored":"","themes":["egpt-lean"],"years":[2026],"embed_text":"Essam Abadir | EGPT Lean formalization, InformationTheory/EntropyNumber/Real.lean, docstring to entropyRealEquivReal | lines 125-130 | 2026 | While the forward map (evaluate_binary_sequence) is a constructive surjection, the return map (ℝ → EntropyReal) requires Classical.choice to select a canonical binary representation for duals (e.g., 0.0111... vs 0.1000...). We isolate this classical dependency to the Equiv itself, keeping the generative forward direction clean."},{"id":"q-essam-abadir-egpt-lean-formalizat-c90e1fe1","quote":"The “Clean Forward Trip”: an explicit, constructive surjection from information space (ℕ → Bool) to the classical continuum (ℝ). We split the infinite sequence of bits into even and odd indices: … This proves constructively that the discrete information space can generate every point in the continuous real line, without invoking Classical.choice.","speaker":{"name":"Essam Abadir","role":"author","sort":"abadir, essam","as_given":"Essam Abadir"},"source":{"work":"EGPT Lean formalization, InformationTheory/EntropyNumber/Real.lean, docstring to evaluate_binary_sequence","locus":"lines 105-113","date":"2026","file":"08_LEAN/EGPT/InformationTheory/EntropyNumber/Real.lean","url":"https://github.com/eabadir/EGPT-Lean/blob/lean-archive-proofs/Lean/EGPT/InformationTheory/EntropyNumber/Real.lean"},"restored":"","themes":["egpt-lean"],"years":[2026],"embed_text":"Essam Abadir | EGPT Lean formalization, InformationTheory/EntropyNumber/Real.lean, docstring to evaluate_binary_sequence | lines 105-113 | 2026 | The “Clean Forward Trip”: an explicit, constructive surjection from information space (ℕ → Bool) to the classical continuum (ℝ). We split the infinite sequence of bits into even and odd indices: … This proves constructively that the discrete information space can generate every point in the continuous real line, without invoking Classical.choice."},{"id":"q-essam-abadir-lean-zulip-program-v-9d415bc6","quote":"Yes, I put the headline theorem right at the top. That violates the usual etiquette of “under-promise, over-deliver”, and I did it on purpose. I wanted maximal scrutiny: if the foundation is sand, better the tower collapses in public.","speaker":{"name":"Essam Abadir","role":"author","sort":"abadir, essam","as_given":"Essam Abadir"},"source":{"work":"Lean Zulip, #Program verification > \"Request for Feedback: Lean 4 Proof related to P=NP\"","locus":"quoted back by Mario Carneiro at 5:43 AM","date":"26-30 April 2025","file":"06_LEAN_MATHLIB/lean-zulip-2025-04-request-for-feedback-p-eq-np.pdf","url":"https://leanprover.zulipchat.com/#narrow/channel/236449-Program-verification/topic/Request.20for.20Feedback.3A.20Lean.204.20Proof.20related.20to.20P.3DNP/"},"restored":"","themes":["godel"],"years":[2025],"embed_text":"Essam Abadir | Lean Zulip, #Program verification > \"Request for Feedback: Lean 4 Proof related to P=NP\" | quoted back by Mario Carneiro at 5:43 AM | 26-30 April 2025 | Yes, I put the headline theorem right at the top. That violates the usual etiquette of “under-promise, over-deliver”, and I did it on purpose. I wanted maximal scrutiny: if the foundation is sand, better the tower collapses in public."},{"id":"q-essam-abadir-lean-zulip-program-v-fba9f478","quote":"Rota's Entropy Theorem was taught it for decades at MIT by Prof. Gian-Carlo Rota, a giant in the field of Probability Theory, as the foundational result proved in his class - that physics entropies (Bose-Einstein, Fermi-Dirac, Maxwell-Boltzmann) are mathematically scaled forms of Shannon Entropy ... and it is indeed a very key result. Sadly, despite being taught to generations of MIT mathematics students, Rota's Entropy Theorem seems never to have been formally published ... here is a link to it in his unpublished manuscript posted by one of his students","speaker":{"name":"Essam Abadir","role":"author","sort":"abadir, essam","as_given":"Essam Abadir"},"source":{"work":"Lean Zulip, #Program verification > “Request for Feedback: Lean 4 Proof related to P=NP”","locus":"26 April 2025","date":"26 April 2025","file":"06_LEAN_MATHLIB/lean-zulip-2025-04-request-for-feedback-p-eq-np.pdf","url":"https://leanprover.zulipchat.com/#narrow/channel/236449-Program-verification/topic/Request.20for.20Feedback.3A.20Lean.204.20Proof.20related.20to.20P.3DNP/"},"restored":"","themes":["reception"],"years":[2025],"embed_text":"Essam Abadir | Lean Zulip, #Program verification > “Request for Feedback: Lean 4 Proof related to P=NP” | 26 April 2025 | 26 April 2025 | Rota's Entropy Theorem was taught it for decades at MIT by Prof. Gian-Carlo Rota, a giant in the field of Probability Theory, as the foundational result proved in his class - that physics entropies (Bose-Einstein, Fermi-Dirac, Maxwell-Boltzmann) are mathematically scaled forms of Shannon Entropy ... and it is indeed a very key result. Sadly, despite being taught to generations of MIT mathematics students, Rota's Entropy Theorem seems never to have been formally published ... here is a link to it in his unpublished manuscript posted by one of his students"},{"id":"q-essam-abadir-lean-zulip-program-v-73eedead","quote":"As a new Lean user, this discussion seem to suggest two extremes: either Lean contains a complete set of axioms capable of proving anything that's provable, or every proof must regress to an exhaustive first-principles derivation—akin to Russell and Whitehead’s infamous 360-page proof that 1+1=2.","speaker":{"name":"Essam Abadir","role":"author","sort":"abadir, essam","as_given":"Essam Abadir"},"source":{"work":"Lean Zulip, #Program verification > “Request for Feedback: Lean 4 Proof related to P=NP”","locus":"26 April 2025, 1:49 PM","date":"26 April 2025","file":"06_LEAN_MATHLIB/lean-zulip-2025-04-request-for-feedback-p-eq-np.pdf","url":"https://leanprover.zulipchat.com/#narrow/channel/236449-Program-verification/topic/Request.20for.20Feedback.3A.20Lean.204.20Proof.20related.20to.20P.3DNP/"},"restored":"","themes":["reception"],"years":[2025],"embed_text":"Essam Abadir | Lean Zulip, #Program verification > “Request for Feedback: Lean 4 Proof related to P=NP” | 26 April 2025, 1:49 PM | 26 April 2025 | As a new Lean user, this discussion seem to suggest two extremes: either Lean contains a complete set of axioms capable of proving anything that's provable, or every proof must regress to an exhaustive first-principles derivation—akin to Russell and Whitehead’s infamous 360-page proof that 1+1=2."},{"id":"q-essam-abadir-lean-zulip-program-v-fbccfbab","quote":"The approach of my proof is dependent on Rota's Entropy Theorem (RET) - I fully acknowledge it rises and falls on RET, and, that I'll probably have to port RET to Lean or some equivalent even though the math is 50 years old at this point.","speaker":{"name":"Essam Abadir","role":"author","sort":"abadir, essam","as_given":"Essam Abadir"},"source":{"work":"Lean Zulip, #Program verification > “Request for Feedback: Lean 4 Proof related to P=NP”","locus":"26 April 2025, 8:03 PM, marked EDITED","date":"26 April 2025","file":"06_LEAN_MATHLIB/lean-zulip-2025-04-request-for-feedback-p-eq-np.pdf","url":"https://leanprover.zulipchat.com/#narrow/channel/236449-Program-verification/topic/Request.20for.20Feedback.3A.20Lean.204.20Proof.20related.20to.20P.3DNP/"},"restored":"","themes":["reception"],"years":[2025],"embed_text":"Essam Abadir | Lean Zulip, #Program verification > “Request for Feedback: Lean 4 Proof related to P=NP” | 26 April 2025, 8:03 PM, marked EDITED | 26 April 2025 | The approach of my proof is dependent on Rota's Entropy Theorem (RET) - I fully acknowledge it rises and falls on RET, and, that I'll probably have to port RET to Lean or some equivalent even though the math is 50 years old at this point."},{"id":"q-essam-abadir-lean-zulip-program-v-a6975145","quote":"I have pored over mathlib and the various half-started community projects. As far as I can see there is still no canonical suite of definitions for Machine, timeComplexity, RunsInPolyTime, Cook-Levin, etc. That is why I keep asking. Suggesting that a single newcomer “just add the entirety of complexity theory to mathlib” feels a bit like suggesting we re-typeset Principia Mathematica so that the lemma “1 + 1 = 2” is fully formal. If a result as foundational as Shannon’s Coding Theorem is still missing, I prefer to mark it explicitly as an axiom rather than slide the assumption in under a definition.","speaker":{"name":"Essam Abadir","role":"author","sort":"abadir, essam","as_given":"Essam Abadir"},"source":{"work":"Lean Zulip, #Program verification > “Request for Feedback: Lean 4 Proof related to P=NP”","locus":"26 April 2025, under “On the absence of complexity-theory libraries”","date":"26 April 2025","file":"06_LEAN_MATHLIB/lean-zulip-2025-04-request-for-feedback-p-eq-np.pdf","url":"https://leanprover.zulipchat.com/#narrow/channel/236449-Program-verification/topic/Request.20for.20Feedback.3A.20Lean.204.20Proof.20related.20to.20P.3DNP/"},"restored":"","themes":["reception"],"years":[2025],"embed_text":"Essam Abadir | Lean Zulip, #Program verification > “Request for Feedback: Lean 4 Proof related to P=NP” | 26 April 2025, under “On the absence of complexity-theory libraries” | 26 April 2025 | I have pored over mathlib and the various half-started community projects. As far as I can see there is still no canonical suite of definitions for Machine, timeComplexity, RunsInPolyTime, Cook-Levin, etc. That is why I keep asking. Suggesting that a single newcomer “just add the entirety of complexity theory to mathlib” feels a bit like suggesting we re-typeset Principia Mathematica so that the lemma “1 + 1 = 2” is fully formal. If a result as foundational as Shannon’s Coding Theorem is still missing, I prefer to mark it explicitly as an axiom rather than slide the assumption in under a definition."},{"id":"q-essam-abadir-pull-request-37468-t-66009a25","quote":"All mathematical ideas, definitions, theorems, and proof strategies in this submission are the sole intellectual work and property of Essam Abadir. This includes: the information-theoretic reformulation of P and NP, the entropy number hierarchy, the application of Rota's entropy axioms to complexity theory, the “address is the map” principle, and the three proof chain architecture. AI tools (Claude, primarily) were used as coding assistants for the Lean 4 language — translating mathematical ideas into Lean syntax, debugging tactic failures, and managing cross-file consistency. The AI agents did not originate any of the mathematical content.","speaker":{"name":"Essam Abadir","role":"author","sort":"abadir, essam","as_given":"Essam Abadir"},"source":{"work":"Pull request #37468 to leanprover-community/mathlib4, submission text, under “Authorship and AI Disclosure”","locus":"1 April 2026","date":"1 April 2026","file":"06_LEAN_MATHLIB/mathlib-pr-37468-body.md","url":"https://github.com/leanprover-community/mathlib4/pull/37468"},"restored":"","themes":["reception"],"years":[2026],"embed_text":"Essam Abadir | Pull request #37468 to leanprover-community/mathlib4, submission text, under “Authorship and AI Disclosure” | 1 April 2026 | 1 April 2026 | All mathematical ideas, definitions, theorems, and proof strategies in this submission are the sole intellectual work and property of Essam Abadir. This includes: the information-theoretic reformulation of P and NP, the entropy number hierarchy, the application of Rota's entropy axioms to complexity theory, the “address is the map” principle, and the three proof chain architecture. AI tools (Claude, primarily) were used as coding assistants for the Lean 4 language — translating mathematical ideas into Lean syntax, debugging tactic failures, and managing cross-file consistency. The AI agents did not originate any of the mathematical content."},{"id":"q-essam-abadir-pull-request-37468-t-b5d436f8","quote":"In fact, the 33-exchange adversarial debate record documents the opposite dynamic: AI agents assigned skeptic roles (Godel, von Neumann) systematically resisted the core ideas, repeatedly attempting to revert definitions to standard complexity theory conventions, introducing “standard” witnesses and certificates that the proof architecture deliberately avoids, and arguing that the information-theoretic framing could not capture the standard P vs NP problem. All 10 formal objections were eventually conceded — not because the AI was persuaded by rhetoric, but because the Lean proofs compiled sorry-free.","speaker":{"name":"Essam Abadir","role":"author","sort":"abadir, essam","as_given":"Essam Abadir"},"source":{"work":"Pull request #37468 to leanprover-community/mathlib4, submission text, under “Authorship and AI Disclosure”","locus":"1 April 2026","date":"1 April 2026","file":"06_LEAN_MATHLIB/mathlib-pr-37468-body.md","url":"https://github.com/leanprover-community/mathlib4/pull/37468"},"restored":"","themes":["reception"],"years":[2026],"embed_text":"Essam Abadir | Pull request #37468 to leanprover-community/mathlib4, submission text, under “Authorship and AI Disclosure” | 1 April 2026 | 1 April 2026 | In fact, the 33-exchange adversarial debate record documents the opposite dynamic: AI agents assigned skeptic roles (Godel, von Neumann) systematically resisted the core ideas, repeatedly attempting to revert definitions to standard complexity theory conventions, introducing “standard” witnesses and certificates that the proof architecture deliberately avoids, and arguing that the information-theoretic framing could not capture the standard P vs NP problem. All 10 formal objections were eventually conceded — not because the AI was persuaded by rhetoric, but because the Lean proofs compiled sorry-free."},{"id":"q-essam-abadir-pull-request-38824-t-014bd3f7","quote":"Stanislaw Ulam (1939, on hearing Gödel's CH undecidability result): “That is because he defines what is meant by a set.” The suspicion that the result is an artifact of the chosen notion of set, not a genuine ceiling on what is decidable. This led Ulam to propose to Rota that the centimeter, gram, and second system was derivable from a random walk (see Rota's book Indiscrete Thoughts, p. 90)","speaker":{"name":"Essam Abadir","role":"author","sort":"abadir, essam","as_given":"Essam Abadir"},"source":{"work":"Pull request #38824 to leanprover-community/mathlib4, submission text, appendix to the von Neumann letter","locus":"1 May 2026","date":"1 May 2026","file":"06_LEAN_MATHLIB/mathlib-pr-38824-body.md","url":"https://github.com/leanprover-community/mathlib4/pull/38824"},"restored":"","themes":["reception"],"years":[2026],"embed_text":"Essam Abadir | Pull request #38824 to leanprover-community/mathlib4, submission text, appendix to the von Neumann letter | 1 May 2026 | 1 May 2026 | Stanislaw Ulam (1939, on hearing Gödel's CH undecidability result): “That is because he defines what is meant by a set.” The suspicion that the result is an artifact of the chosen notion of set, not a genuine ceiling on what is decidable. This led Ulam to propose to Rota that the centimeter, gram, and second system was derivable from a random walk (see Rota's book Indiscrete Thoughts, p. 90)"},{"id":"q-essam-abadir-pull-request-38824-t-067da28c","quote":"This PR is the machine-verified formalization of the position von Neumann took in that letter — that every intuitionistic construction of standard arithmetic is in fact formalizable — together with Lean formaliztions of extensions added by his mathematical lineage in Stanislaw Ulam (physics from random walks and cellular automata), John Conway (number theory from cellular automata), Gian-Carlo Rota (information theory from random walks), and a few of my own.","speaker":{"name":"Essam Abadir","role":"author","sort":"abadir, essam","as_given":"Essam Abadir"},"source":{"work":"Pull request #38824 to leanprover-community/mathlib4, submission text, opening section","locus":"1 May 2026","date":"1 May 2026","file":"06_LEAN_MATHLIB/mathlib-pr-38824-body.md","url":"https://github.com/leanprover-community/mathlib4/pull/38824"},"restored":"","themes":["reception"],"years":[2026],"embed_text":"Essam Abadir | Pull request #38824 to leanprover-community/mathlib4, submission text, opening section | 1 May 2026 | 1 May 2026 | This PR is the machine-verified formalization of the position von Neumann took in that letter — that every intuitionistic construction of standard arithmetic is in fact formalizable — together with Lean formaliztions of extensions added by his mathematical lineage in Stanislaw Ulam (physics from random walks and cellular automata), John Conway (number theory from cellular automata), Gian-Carlo Rota (information theory from random walks), and a few of my own."},{"id":"q-essam-abadir-pull-request-38824-t-7d389acf","quote":"von Neumann and Ulam (Los Alamos, 1940s) — Monte Carlo is a polynomial-time decision procedure over combinatorial state spaces, built from random walks and the cellular automata used to simulate neutron diffusion. The method predates the P vs NP vocabulary but is a P-time solver by construction.","speaker":{"name":"Essam Abadir","role":"author","sort":"abadir, essam","as_given":"Essam Abadir"},"source":{"work":"Pull request #38824 to leanprover-community/mathlib4, submission text, under “Precedence and Attribution”","locus":"1 May 2026","date":"1 May 2026","file":"06_LEAN_MATHLIB/mathlib-pr-38824-body.md","url":"https://github.com/leanprover-community/mathlib4/pull/38824"},"restored":"","themes":["reception"],"years":[2026],"embed_text":"Essam Abadir | Pull request #38824 to leanprover-community/mathlib4, submission text, under “Precedence and Attribution” | 1 May 2026 | 1 May 2026 | von Neumann and Ulam (Los Alamos, 1940s) — Monte Carlo is a polynomial-time decision procedure over combinatorial state spaces, built from random walks and the cellular automata used to simulate neutron diffusion. The method predates the P vs NP vocabulary but is a P-time solver by construction."},{"id":"q-essam-abadir-pull-request-38824-t-bd78c3d7","quote":"Gian-Carlo Rota (18.313, 1970s–90s) — Information is the perfect recorded history of a particle's movement, where “perfect” means the fewest bits in an unambiguous code — a Shannon-optimal coding. Rota's theorem exposes that Shannon coding is strictly more stringent than bijection: it requires the maximally compressed representation.","speaker":{"name":"Essam Abadir","role":"author","sort":"abadir, essam","as_given":"Essam Abadir"},"source":{"work":"Pull request #38824 to leanprover-community/mathlib4, submission text, under “Precedence and Attribution”","locus":"1 May 2026","date":"1 May 2026","file":"06_LEAN_MATHLIB/mathlib-pr-38824-body.md","url":"https://github.com/leanprover-community/mathlib4/pull/38824"},"restored":"","themes":["reception"],"years":[2026],"embed_text":"Essam Abadir | Pull request #38824 to leanprover-community/mathlib4, submission text, under “Precedence and Attribution” | 1 May 2026 | 1 May 2026 | Gian-Carlo Rota (18.313, 1970s–90s) — Information is the perfect recorded history of a particle's movement, where “perfect” means the fewest bits in an unambiguous code — a Shannon-optimal coding. Rota's theorem exposes that Shannon coding is strictly more stringent than bijection: it requires the maximally compressed representation."},{"id":"q-essam-abadir-pull-request-38824-t-13e14772","quote":"I, Essam Abadir, do not claim to be the first to prove P = NP. At best I am fourth. What this submission contributes is a machine-verified account of why each of the following was already a proof of P = NP, and a constructive number tower that explains why the proofs hold:","speaker":{"name":"Essam Abadir","role":"author","sort":"abadir, essam","as_given":"Essam Abadir"},"source":{"work":"Pull request #38824 to leanprover-community/mathlib4, “feat(InformationTheory): add entropy axiomatics, EntropyNumber, complexity theory, and physics bridge”, submission text, under “Precedence and Attribution”","locus":"1 May 2026","date":"1 May 2026","file":"06_LEAN_MATHLIB/mathlib-pr-38824-body.md","url":"https://github.com/leanprover-community/mathlib4/pull/38824"},"restored":"","themes":["reception"],"years":[2026],"embed_text":"Essam Abadir | Pull request #38824 to leanprover-community/mathlib4, “feat(InformationTheory): add entropy axiomatics, EntropyNumber, complexity theory, and physics bridge”, submission text, under “Precedence and Attribution” | 1 May 2026 | 1 May 2026 | I, Essam Abadir, do not claim to be the first to prove P = NP. At best I am fourth. What this submission contributes is a machine-verified account of why each of the following was already a proof of P = NP, and a constructive number tower that explains why the proofs hold:"},{"id":"q-essam-abadir-ret-excerpt-latex-so-a64d6dd0","quote":"All fundamental “continuous” physics distributions – notably the Maxwell–Boltzmann (MB), Fermi–Dirac (FD), and Bose–Einstein (BE) statistics – can be expressed as scaled versions of the discrete Shannon entropy functional.","speaker":{"name":"Essam Abadir","role":"author","sort":"abadir, essam","as_given":"Essam Abadir"},"source":{"work":"RET Excerpt (LaTeX source, author's own document)","locus":"“Theorem (Informal)”","file":"04_ROTA/entropy_theorem/RET_Excerpt.tex"},"restored":"","themes":["entropy"],"years":[],"embed_text":"Essam Abadir | RET Excerpt (LaTeX source, author's own document) | “Theorem (Informal)” | All fundamental “continuous” physics distributions – notably the Maxwell–Boltzmann (MB), Fermi–Dirac (FD), and Bose–Einstein (BE) statistics – can be expressed as scaled versions of the discrete Shannon entropy functional."},{"id":"q-essam-abadir-update-to-the-all-in-ddd9126a","quote":"It was not fabricating results in my favour. It was doing the opposite: restoring their orthodoxy inside my own files, rewriting proofs so they matched what the training corpus says must be true, quietly reintroducing the assumptions the proofs were built to remove.","speaker":{"name":"Essam Abadir","role":"author","sort":"abadir, essam","as_given":"Essam Abadir"},"source":{"work":"Update to the All-In Letter: a decision to publish, and why","locus":"“I have already run this experiment on myself”","date":"14 September 2026","file":"07_LETTERS/all-in-update-letter-decision-to-publish.md"},"restored":"","themes":["singularity"],"years":[2026],"embed_text":"Essam Abadir | Update to the All-In Letter: a decision to publish, and why | “I have already run this experiment on myself” | 14 September 2026 | It was not fabricating results in my favour. It was doing the opposite: restoring their orthodoxy inside my own files, rewriting proofs so they matched what the training corpus says must be true, quietly reintroducing the assumptions the proofs were built to remove."},{"id":"q-the-swedish-academ-nobel-prize-in-liter-90be796f","quote":"the forming of an Arabian narrative art that applies to all mankind","speaker":{"name":"The Swedish Academy","role":"author","sort":"academy, the swedish","as_given":"The Swedish Academy"},"source":{"work":"Nobel Prize in Literature 1988, prize motivation","date":"1988","url":"https://www.nobelprize.org/prizes/literature/1988/ceremony-speech/"},"restored":"","themes":["understanding-and-meaning"],"years":[1988],"embed_text":"The Swedish Academy | Nobel Prize in Literature 1988, prize motivation | 1988 | the forming of an Arabian narrative art that applies to all mankind"},{"id":"q-sture-allen-presentation-speech--7bdab0f3","quote":"Your rich and complex work invites us to reconsider the fundamental things in life.","speaker":{"name":"Sture Allén","role":"author","sort":"allén, sture","as_given":"Sture Allén"},"source":{"work":"Presentation speech for the Nobel Prize in Literature 1988, awarded to Naguib Mahfouz, on behalf of the Swedish Academy","locus":"closing address to the laureate","date":"10 December 1988","url":"https://www.nobelprize.org/prizes/literature/1988/ceremony-speech/"},"restored":"","themes":["understanding-and-meaning"],"years":[1988],"embed_text":"Sture Allén | Presentation speech for the Nobel Prize in Literature 1988, awarded to Naguib Mahfouz, on behalf of the Swedish Academy | closing address to the laureate | 10 December 1988 | Your rich and complex work invites us to reconsider the fundamental things in life."},{"id":"q-herbert-l-anderson-herbert-l-anderson-m-7347de43","quote":"After the war Nick joined the faculty of the University of Chicago, to help set up a major computing facility. When that didn't materialize as quickly as he had hoped, he began to think of other possibilities, and about that time he got a call from Carson Mark, head of the Theoretical Division at Los Alamos, suggesting that he set up a computing facility here. Nick was ready, willing, and able. The moral of my story is that fortune favors the prepared mind. Nick was right there, well prepared to do just what he was asked to do, and that's how the MANIAC was born.","speaker":{"name":"Herbert L. Anderson","role":"author","sort":"anderson, herbert l.","as_given":"Herbert L. Anderson"},"source":{"work":"Herbert L. Anderson, “Metropolis, Monte Carlo, and the MANIAC,” Los Alamos Science No. 14 (1986), pp. 96–108","locus":"p. 100","date":"1986","url":"https://mcnp.lanl.gov/pdf_files/Article_1986_LAS_Anderson_96--108.pdf"},"restored":"","themes":["machines"],"years":[1986],"embed_text":"Herbert L. Anderson | Herbert L. Anderson, “Metropolis, Monte Carlo, and the MANIAC,” Los Alamos Science No. 14 (1986), pp. 96–108 | p. 100 | 1986 | After the war Nick joined the faculty of the University of Chicago, to help set up a major computing facility. When that didn't materialize as quickly as he had hoped, he began to think of other possibilities, and about that time he got a call from Carson Mark, head of the Theoretical Division at Los Alamos, suggesting that he set up a computing facility here. Nick was ready, willing, and able. The moral of my story is that fortune favors the prepared mind. Nick was right there, well prepared to do just what he was asked to do, and that's how the MANIAC was born."},{"id":"q-herbert-l-anderson-herbert-l-anderson-m-a3c4e8a6","quote":"MANIAC II succeeded MANIAC I in Los Alamos in 1956. The second MANIAC was more powerful than the first and, because it included floating-point arithmetic, was easier to use. MANIAC III, with the latest in solid-state circuitry, was developed at the University of Chicago when Nick returned there to head the newly formed Institute for Computer Research.","speaker":{"name":"Herbert L. Anderson","role":"author","sort":"anderson, herbert l.","as_given":"Herbert L. Anderson"},"source":{"work":"Herbert L. Anderson, “Metropolis, Monte Carlo, and the MANIAC,” Los Alamos Science No. 14 (1986), pp. 96–108","locus":"p. 106","date":"1986","url":"https://mcnp.lanl.gov/pdf_files/Article_1986_LAS_Anderson_96--108.pdf"},"restored":"","themes":["machines"],"years":[1986],"embed_text":"Herbert L. Anderson | Herbert L. Anderson, “Metropolis, Monte Carlo, and the MANIAC,” Los Alamos Science No. 14 (1986), pp. 96–108 | p. 106 | 1986 | MANIAC II succeeded MANIAC I in Los Alamos in 1956. The second MANIAC was more powerful than the first and, because it included floating-point arithmetic, was easier to use. MANIAC III, with the latest in solid-state circuitry, was developed at the University of Chicago when Nick returned there to head the newly formed Institute for Computer Research."},{"id":"q-kenneth-baclawski-kenneth-baclawski-cu-38bbe5e8","quote":"7/1979 to 6/1986: Consultant to the Director. Los Alamos National Laboratory, Los Alamos, NM","speaker":{"name":"Kenneth Baclawski","role":"author","sort":"baclawski, kenneth","as_given":"Kenneth Baclawski"},"source":{"work":"Kenneth Baclawski, curriculum vitae, under “Professional Experience”","locus":"p. 1","date":"current at 2026-09-22","url":"https://ken.baclawski.org/vitae.pdf"},"restored":"","themes":["secrecy"],"years":[2026],"embed_text":"Kenneth Baclawski | Kenneth Baclawski, curriculum vitae, under “Professional Experience” | p. 1 | current at 2026-09-22 | 7/1979 to 6/1986: Consultant to the Director. Los Alamos National Laboratory, Los Alamos, NM"},{"id":"q-kenneth-baclawski-kenneth-baclawski-cu-fbe80d7c","quote":"7/1976 to 6/1978: C.L.E.Moore Instructor. Massachusetts Institute of Technology, Cambridge, MA","speaker":{"name":"Kenneth Baclawski","role":"author","sort":"baclawski, kenneth","as_given":"Kenneth Baclawski"},"source":{"work":"Kenneth Baclawski, curriculum vitae, under “Professional Experience”","locus":"p. 1","date":"current at 2026-09-22","url":"https://ken.baclawski.org/vitae.pdf"},"restored":"","themes":["rota-thought"],"years":[2026],"embed_text":"Kenneth Baclawski | Kenneth Baclawski, curriculum vitae, under “Professional Experience” | p. 1 | current at 2026-09-22 | 7/1976 to 6/1978: C.L.E.Moore Instructor. Massachusetts Institute of Technology, Cambridge, MA"},{"id":"q-gregory-bateson-gregory-bateson-from-19b2f0db","quote":"We may call the aggregate of these ideas cybernetics, or communication theory, or information theory or systems theory. The ideas were generated in many places: in Vienna by Bertalanffy, in Harvard [sic] by Wiener, in Princeton by von Neumann, in Bell Telephone Labs by Shannon, in Cambridge by Craik, and so on....","speaker":{"name":"Gregory Bateson","role":"reported","sort":"bateson, gregory","as_given":"Gregory Bateson (quoted by Heims)"},"source":{"work":"Gregory Bateson, \"From Versailles to Cybernetics,\" in Steps to an Ecology of Mind, pp.469-477 - quoted in Steve J. Heims, The Cybernetics Group (MIT Press, 1991)","locus":"Heims p.298-299 (endnote 18 to chapter on the Eighth Conference)","date":"Bateson essay undated (post-1953); quoted in Heims 1991","url":"https://archive.org/details/cyberneticsgroups"},"restored":"","themes":["macy"],"years":[1953,1991],"embed_text":"Gregory Bateson | Gregory Bateson, \"From Versailles to Cybernetics,\" in Steps to an Ecology of Mind, pp.469-477 - quoted in Steve J. Heims, The Cybernetics Group (MIT Press, 1991) | Heims p.298-299 (endnote 18 to chapter on the Eighth Conference) | Bateson essay undated (post-1953); quoted in Heims 1991 | We may call the aggregate of these ideas cybernetics, or communication theory, or information theory or systems theory. The ideas were generated in many places: in Vienna by Bertalanffy, in Harvard [sic] by Wiener, in Princeton by von Neumann, in Bell Telephone Labs by Shannon, in Cambridge by Craik, and so on...."},{"id":"q-nelson-h-f-beebe-nelson-h-f-beebe-bib-606e3e37","quote":"@InProceedings{Ulam:1948:SMP, author = \"Stanis{\\l}aw M. Ulam\", editor = \"????\", booktitle = \"{A.E.C. Information Meeting, Brookhaven National Laboratory, April 26-28, 1948}\", title = \"Statistical methods for problems involving equations of the diffusion type, ({Monte Carlo})\", publisher = \"????\", address = \"????\", pages = \"27--??\", year = \"1948\", LCCN = \"????\", bibdate = \"Sat Mar 31 16:03:22 2007\", bibsource = \"https://www.math.utah.edu/pub/bibnet/authors/u/ulam-stanislaw-m.bib\", note = \"BNL-17\", acknowledgement = ack-nhfb, }","speaker":{"name":"Nelson H. F. Beebe","role":"author","sort":"beebe, nelson h. f.","as_given":"Nelson H. F. Beebe"},"source":{"work":"Nelson H. F. Beebe, BibTeX bibliography ulam-stanislaw-m.bib, bibnet, netlib (Sandia mirror), version 2.71 of 29 August 2026","locus":"entry Ulam:1948:SMP","date":"31 March 2007","url":"https://netlib.sandia.gov/bibnet/authors/u/ulam-stanislaw-m.html"},"restored":"","themes":["monte-carlo-and-automata"],"years":[2007],"embed_text":"Nelson H. F. Beebe | Nelson H. F. Beebe, BibTeX bibliography ulam-stanislaw-m.bib, bibnet, netlib (Sandia mirror), version 2.71 of 29 August 2026 | entry Ulam:1948:SMP | 31 March 2007 | @InProceedings{Ulam:1948:SMP, author = \"Stanis{\\l}aw M. Ulam\", editor = \"????\", booktitle = \"{A.E.C. Information Meeting, Brookhaven National Laboratory, April 26-28, 1948}\", title = \"Statistical methods for problems involving equations of the diffusion type, ({Monte Carlo})\", publisher = \"????\", address = \"????\", pages = \"27--??\", year = \"1948\", LCCN = \"????\", bibdate = \"Sat Mar 31 16:03:22 2007\", bibsource = \"https://www.math.utah.edu/pub/bibnet/authors/u/ulam-stanislaw-m.bib\", note = \"BNL-17\", acknowledgement = ack-nhfb, }"},{"id":"q-rodney-brooks-why-todays-humanoids-549e59a6","quote":"collecting just visual data is not collecting the right data. There is so much more going into human dexterity that visual data completely leaves out.","speaker":{"name":"Rodney Brooks","role":"author","sort":"brooks, rodney","as_given":"Rodney Brooks"},"source":{"work":"“Why Today’s Humanoids Won’t Learn Dexterity” (rodneybrooks.com)","date":"26 September 2025"},"restored":"","themes":["robotics-data"],"years":[2025],"embed_text":"Rodney Brooks | “Why Today’s Humanoids Won’t Learn Dexterity” (rodneybrooks.com) | 26 September 2025 | collecting just visual data is not collecting the right data. There is so much more going into human dexterity that visual data completely leaves out."},{"id":"q-rodney-brooks-why-todays-humanoids-ea0ab08b","quote":"We as a species have not developed technologies to capture touch, to store touch, to transmit touch over distances and time, nor to replay it.","speaker":{"name":"Rodney Brooks","role":"author","sort":"brooks, rodney","as_given":"Rodney Brooks"},"source":{"work":"“Why Today’s Humanoids Won’t Learn Dexterity” (rodneybrooks.com)","date":"26 September 2025"},"restored":"","themes":["robotics-data"],"years":[2025],"embed_text":"Rodney Brooks | “Why Today’s Humanoids Won’t Learn Dexterity” (rodneybrooks.com) | 26 September 2025 | We as a species have not developed technologies to capture touch, to store touch, to transmit touch over distances and time, nor to replay it."},{"id":"q-arthur-w-burks-von-neumanns-self-re-d898c4c0","quote":"This concept was suggested to von Neumann by S. M. Ulam.","speaker":{"name":"Arthur W. Burks","role":"author","sort":"burks, arthur w.","as_given":"Arthur W. Burks"},"source":{"work":"“Von Neumann’s Self-Reproducing Automata,” Technical Report 08226-11-T, Logic of Computers Group, University of Michigan","locus":"§2 “Cellular Automata,” p. 7","date":"June 1969"},"restored":"","themes":["monte-carlo-and-automata"],"years":[1969],"embed_text":"Arthur W. Burks | “Von Neumann’s Self-Reproducing Automata,” Technical Report 08226-11-T, Logic of Computers Group, University of Michigan | §2 “Cellular Automata,” p. 7 | June 1969 | This concept was suggested to von Neumann by S. M. Ulam."},{"id":"q-mario-carneiro-lean-zulip-program-v-542a9418","quote":"I and many others have strong intuitions that say that P = NP is not provable, so it is probably not necessary to actually go as far as a formal proof to find the “minimal unintuitive lemma” buried in your derivation.","speaker":{"name":"Mario Carneiro","role":"author","sort":"carneiro, mario","as_given":"Mario Carneiro"},"source":{"work":"Lean Zulip, #Program verification > \"Request for Feedback: Lean 4 Proof related to P=NP\"","locus":"4:43 AM","date":"26-30 April 2025","file":"06_LEAN_MATHLIB/lean-zulip-2025-04-request-for-feedback-p-eq-np.pdf","url":"https://leanprover.zulipchat.com/#narrow/channel/236449-Program-verification/topic/Request.20for.20Feedback.3A.20Lean.204.20Proof.20related.20to.20P.3DNP/"},"restored":"","themes":["godel"],"years":[2025],"embed_text":"Mario Carneiro | Lean Zulip, #Program verification > \"Request for Feedback: Lean 4 Proof related to P=NP\" | 4:43 AM | 26-30 April 2025 | I and many others have strong intuitions that say that P = NP is not provable, so it is probably not necessary to actually go as far as a formal proof to find the “minimal unintuitive lemma” buried in your derivation."},{"id":"q-mario-carneiro-lean-zulip-program-v-1105199c","quote":"A good start would be to determine which of SCT or RET is more likely to be false (or mis-stated / misinterpreted). From your description, I’m inclined to say RET is the suspicious one: Physics is not able to magically solve NP complete problems on its own without a lengthy annealing process in practice, so I suspect something is being idealized incorrectly here.","speaker":{"name":"Mario Carneiro","role":"author","sort":"carneiro, mario","as_given":"Mario Carneiro"},"source":{"work":"Lean Zulip, #Program verification > \"Request for Feedback: Lean 4 Proof related to P=NP\"","locus":"4:45 AM, marked EDITED","date":"26-30 April 2025","file":"06_LEAN_MATHLIB/lean-zulip-2025-04-request-for-feedback-p-eq-np.pdf","url":"https://leanprover.zulipchat.com/#narrow/channel/236449-Program-verification/topic/Request.20for.20Feedback.3A.20Lean.204.20Proof.20related.20to.20P.3DNP/"},"restored":"","themes":["godel"],"years":[2025],"embed_text":"Mario Carneiro | Lean Zulip, #Program verification > \"Request for Feedback: Lean 4 Proof related to P=NP\" | 4:45 AM, marked EDITED | 26-30 April 2025 | A good start would be to determine which of SCT or RET is more likely to be false (or mis-stated / misinterpreted). From your description, I’m inclined to say RET is the suspicious one: Physics is not able to magically solve NP complete problems on its own without a lengthy annealing process in practice, so I suspect something is being idealized incorrectly here."},{"id":"q-mario-carneiro-lean-zulip-program-v-5ff88ec9","quote":"By the way, when I said “it will draw extreme skepticism” earlier that was euphemistic for “people will think you are a crank”. More skepticism is not always a good thing; if you crank it up too much, rather than getting maximal scrutiny you will get everyone ignoring your work, being dismissive, and/or not assuming you are acting in good faith, which is really not a recipe for productive interaction.","speaker":{"name":"Mario Carneiro","role":"author","sort":"carneiro, mario","as_given":"Mario Carneiro"},"source":{"work":"Lean Zulip, #Program verification > \"Request for Feedback: Lean 4 Proof related to P=NP\"","locus":"5:43 AM, marked EDITED","date":"26-30 April 2025","file":"06_LEAN_MATHLIB/lean-zulip-2025-04-request-for-feedback-p-eq-np.pdf","url":"https://leanprover.zulipchat.com/#narrow/channel/236449-Program-verification/topic/Request.20for.20Feedback.3A.20Lean.204.20Proof.20related.20to.20P.3DNP/"},"restored":"","themes":["godel"],"years":[2025],"embed_text":"Mario Carneiro | Lean Zulip, #Program verification > \"Request for Feedback: Lean 4 Proof related to P=NP\" | 5:43 AM, marked EDITED | 26-30 April 2025 | By the way, when I said “it will draw extreme skepticism” earlier that was euphemistic for “people will think you are a crank”. More skepticism is not always a good thing; if you crank it up too much, rather than getting maximal scrutiny you will get everyone ignoring your work, being dismissive, and/or not assuming you are acting in good faith, which is really not a recipe for productive interaction."},{"id":"q-causalvqa-causalvqa-arxiv-2506-232afa6b","quote":"Anticipation questions, in particular, are difficult for this pool of models, while easy for humans: the average model here scores 39.34% paired vs humans at 83.54%.","speaker":{"name":"CausalVQA","role":"institution","sort":"causalvqa","as_given":"CausalVQA"},"source":{"work":"CausalVQA, arXiv:2506.09943","locus":"paper body","date":"June 2025"},"restored":"","themes":["benchmarks"],"years":[2025],"embed_text":"CausalVQA | CausalVQA, arXiv:2506.09943 | paper body | June 2025 | Anticipation questions, in particular, are difficult for this pool of models, while easy for humans: the average model here scores 39.34% paired vs humans at 83.54%."},{"id":"q-united-states-cong-atomic-energy-act-of-82e09ba3","quote":"The term “Restricted Data” means all data concerning (1) design, manufacture, or utilization of atomic weapons; (2) the production of special nuclear material; or (3) the use of special nuclear material in the production of energy, but shall not include data declassified or removed from the Restricted Data category pursuant to section 2162 of this title.","speaker":{"name":"United States Congress","role":"author","sort":"congress, united states","as_given":"United States Congress"},"source":{"work":"Atomic Energy Act of 1954, as amended, 42 U.S.C. § 2014(y)","locus":"§ 2014(y)","date":"1954","url":"https://www.law.cornell.edu/uscode/text/42/2014"},"restored":"","themes":["secrecy"],"years":[1954],"embed_text":"United States Congress | Atomic Energy Act of 1954, as amended, 42 U.S.C. § 2014(y) | § 2014(y) | 1954 | The term “Restricted Data” means all data concerning (1) design, manufacture, or utilization of atomic weapons; (2) the production of special nuclear material; or (3) the use of special nuclear material in the production of energy, but shall not include data declassified or removed from the Restricted Data category pursuant to section 2162 of this title."},{"id":"q-united-states-cong-invention-secrecy-ac-3767130f","quote":"Whenever publication or disclosure by the publication of an application or by the grant of a patent on an invention in which the Government has a property interest might, in the opinion of the head of the interested Government agency, be detrimental to the national security, the Commissioner of Patents upon being so notified shall order that the invention be kept secret and shall withhold the publication of the application or the grant of a patent therefor under the conditions set forth hereinafter.","speaker":{"name":"United States Congress","role":"author","sort":"congress, united states","as_given":"United States Congress"},"source":{"work":"Invention Secrecy Act, 35 U.S.C. § 181 — “Secrecy of certain inventions and withholding of patent”","locus":"§ 181, first paragraph","date":"1951","url":"https://www.law.cornell.edu/uscode/text/35/181"},"restored":"","themes":["secrecy"],"years":[1951],"embed_text":"United States Congress | Invention Secrecy Act, 35 U.S.C. § 181 — “Secrecy of certain inventions and withholding of patent” | § 181, first paragraph | 1951 | Whenever publication or disclosure by the publication of an application or by the grant of a patent on an invention in which the Government has a property interest might, in the opinion of the head of the interested Government agency, be detrimental to the national security, the Commissioner of Patents upon being so notified shall order that the invention be kept secret and shall withhold the publication of the application or the grant of a patent therefor under the conditions set forth hereinafter."},{"id":"q-michael-creutz-michael-creutz-monte-643a3613","quote":"Using Monte Carlo techniques, we evaluate path integrals for pure SU(2) gauge fields. Wilson's regularization procedure on a lattice of up to 10⁴ sites controls ultraviolet divergences. Our renormalization prescription, based on confinement, is to hold fixed the string tension, the coefficient of the asymptotic linear potential between sources in the fundamental representation of the gauge group. Upon reducing the cutoff, we observe a logarithmic decrease of the bare coupling constant in a manner consistent with the perturbative renormalization-group prediction. This supports the coexistence of confinement and asymptotic freedom for quantized non-Abelian gauge fields.","speaker":{"name":"Michael Creutz","role":"author","sort":"creutz, michael","as_given":"Michael Creutz"},"source":{"work":"Michael Creutz, “Monte Carlo study of quantized SU(2) gauge theory,” Physical Review D 21, no. 8, 2308","locus":"abstract","date":"15 April 1980","url":"https://journals.aps.org/prd/abstract/10.1103/PhysRevD.21.2308"},"restored":"","themes":["brookhaven-lattice-qcd"],"years":[1980],"embed_text":"Michael Creutz | Michael Creutz, “Monte Carlo study of quantized SU(2) gauge theory,” Physical Review D 21, no. 8, 2308 | abstract | 15 April 1980 | Using Monte Carlo techniques, we evaluate path integrals for pure SU(2) gauge fields. Wilson's regularization procedure on a lattice of up to 10⁴ sites controls ultraviolet divergences. Our renormalization prescription, based on confinement, is to hold fixed the string tension, the coefficient of the asymptotic linear potential between sources in the fundamental representation of the gauge group. Upon reducing the cutoff, we observe a logarithmic decrease of the bare coupling constant in a manner consistent with the perturbative renormalization-group prediction. This supports the coexistence of confinement and asymptotic freedom for quantized non-Abelian gauge fields."},{"id":"q-freeman-dyson-quoted-by-jim-holt-h-7ec7b4ee","quote":"When von Neumann tragically died, the snobs took their revenge and got rid of the computing project root and branch","speaker":{"name":"Freeman Dyson","role":"author","sort":"dyson, freeman","as_given":"Freeman Dyson"},"source":{"work":"Quoted by Jim Holt, “How the Computers Exploded,” The New York Review of Books, 7 June 2012 (review of George Dyson, Turing's Cathedral)","locus":"unpaginated online text","date":"date of utterance not established; quoted 2012","url":"https://www.nybooks.com/articles/2012/06/07/how-computers-exploded/"},"restored":"","themes":["machines"],"years":[2012],"embed_text":"Freeman Dyson | Quoted by Jim Holt, “How the Computers Exploded,” The New York Review of Books, 7 June 2012 (review of George Dyson, Turing's Cathedral) | unpaginated online text | date of utterance not established; quoted 2012 | When von Neumann tragically died, the snobs took their revenge and got rid of the computing project root and branch"},{"id":"q-albert-einstein-bob-doyle-my-god-he--3f9177ff","quote":"I must confess that I was not able to find a way to explain the atomistic character of nature. My opinion is that if the objective description through the field as an elementary concept is not possible, then one has to find a possibility to avoid the continuum (together with space and time) altogether. But I have not the slightest idea what kind of elemen-tary concepts could be used in such a theory.","speaker":{"name":"Albert Einstein","role":"author","sort":"einstein, albert","as_given":"Albert Einstein"},"source":{"work":"Bob Doyle, \"My God, He Plays Dice!\" — Chapter 38, \"Einstein's Field Theory\" (section \"Castle In The Air\")","locus":"Chapter 38, p.317; Doyle's footnote 3 cites \"Stachel, 1986, p.380\"; Doyle's own inline citation reads \"(Einstein to David Bohm, 28 October 1954)\"","date":"28 October 1954","url":"https://www.informationphilosopher.com/books/einstein/Einstein.pdf"},"restored":"","themes":[],"years":[1954],"embed_text":"Albert Einstein | Bob Doyle, \"My God, He Plays Dice!\" — Chapter 38, \"Einstein's Field Theory\" (section \"Castle In The Air\") | Chapter 38, p.317; Doyle's footnote 3 cites \"Stachel, 1986, p.380\"; Doyle's own inline citation reads \"(Einstein to David Bohm, 28 October 1954)\" | 28 October 1954 | I must confess that I was not able to find a way to explain the atomistic character of nature. My opinion is that if the objective description through the field as an elementary concept is not possible, then one has to find a possibility to avoid the continuum (together with space and time) altogether. But I have not the slightest idea what kind of elemen-tary concepts could be used in such a theory."},{"id":"q-albert-einstein-letter-to-max-born-7-2712552f","quote":"We have become Antipodean in our scientific expectations. You believe in the God who plays dice, and I in complete law and order in a world which objectively exists, and which I, in a wildly speculative way, am trying to capture. I firmly believe, but I hope that someone will discover a more realistic way, or rather a more tangible basis than it has been my lot to find. Even the great initial success of the quantum theory does not make me believe in the fundamental dice-game, although I am well aware that our younger colleagues interpret this as a consequence of senility. No doubt the day will come when we will see whose instinctive attitude was the correct one.","speaker":{"name":"Albert Einstein","role":"reported","sort":"einstein, albert","as_given":"Albert Einstein"},"source":{"work":"Letter to Max Born, 7 September 1944, in The Born-Einstein Letters, trans. Irene Born (London: Macmillan, 1971), p. 146; quoted in Jeremy Bernstein, \"Einstein's Entanglements,\" Inference: International Review of Science","locus":"Bernstein, \"Einstein's Entanglements,\" block quotation introduced \"In 1944, Einstein wrote to Born:\"; Bernstein's endnote 12 reads \"Albert Einstein to Max Born, September 7, 1944, in The Born-Einstein Letters, trans. Irene Born (London: Macmillan, 1971), 146.\"","date":"7 September 1944","url":"https://inference-review.com/article/einsteins-entanglements"},"restored":"","themes":[],"years":[1944],"embed_text":"Albert Einstein | Letter to Max Born, 7 September 1944, in The Born-Einstein Letters, trans. Irene Born (London: Macmillan, 1971), p. 146; quoted in Jeremy Bernstein, \"Einstein's Entanglements,\" Inference: International Review of Science | Bernstein, \"Einstein's Entanglements,\" block quotation introduced \"In 1944, Einstein wrote to Born:\"; Bernstein's endnote 12 reads \"Albert Einstein to Max Born, September 7, 1944, in The Born-Einstein Letters, trans. Irene Born (London: Macmillan, 1971), 146.\" | 7 September 1944 | We have become Antipodean in our scientific expectations. You believe in the God who plays dice, and I in complete law and order in a world which objectively exists, and which I, in a wildly speculative way, am trying to capture. I firmly believe, but I hope that someone will discover a more realistic way, or rather a more tangible basis than it has been my lot to find. Even the great initial success of the quantum theory does not make me believe in the fundamental dice-game, although I am well aware that our younger colleagues interpret this as a consequence of senility. No doubt the day will come when we will see whose instinctive attitude was the correct one."},{"id":"q-albert-einstein-letter-to-max-born-r-1c1eb5e4","quote":"I cannot substantiate my attitude to physics in such a manner that you would find it in any way rational. I see of course that the statistical interpretation (the necessity of which in the frame of the existing formalism has been first clearly recognized by yourself) has a considerable content of truth. Yet I cannot seriously believe it because the theory is inconsistent with the principle that physics has to represent a reality in space and time without phantom actions over distances.... I am absolutely convinced that one will eventually arrive at a theory in which the objects connected by laws are not probabilities, but conceived facts, as one took for granted only a short time ago. However, I cannot provide logical arguments for my conviction, but can only call on my little finger as a witness, which cannot claim any authority to be respected outside my own skin.","speaker":{"name":"Albert Einstein","role":"author","sort":"einstein, albert","as_given":"Albert Einstein"},"source":{"work":"Letter to Max Born, reproduced within Max Born's own text (Waynflete Lectures, published as \"Natural Philosophy of Cause and Chance\"), Part X \"Metaphysical Conclusions\", as hosted on informationphilosopher.com's Max Born page","locus":"informationphilosopher.com/solutions/scientists/born/, quoted by Born directly following the sentence: \"The second letter, which arrived just when I was writing these pages (dated 3 December 1947), contains this passage:\"","date":"3 December 1947","url":"https://www.informationphilosopher.com/solutions/scientists/born/"},"restored":"","themes":[],"years":[1947],"embed_text":"Albert Einstein | Letter to Max Born, reproduced within Max Born's own text (Waynflete Lectures, published as \"Natural Philosophy of Cause and Chance\"), Part X \"Metaphysical Conclusions\", as hosted on informationphilosopher.com's Max Born page | informationphilosopher.com/solutions/scientists/born/, quoted by Born directly following the sentence: \"The second letter, which arrived just when I was writing these pages (dated 3 December 1947), contains this passage:\" | 3 December 1947 | I cannot substantiate my attitude to physics in such a manner that you would find it in any way rational. I see of course that the statistical interpretation (the necessity of which in the frame of the existing formalism has been first clearly recognized by yourself) has a considerable content of truth. Yet I cannot seriously believe it because the theory is inconsistent with the principle that physics has to represent a reality in space and time without phantom actions over distances.... I am absolutely convinced that one will eventually arrive at a theory in which the objects connected by laws are not probabilities, but conceived facts, as one took for granted only a short time ago. However, I cannot provide logical arguments for my conviction, but can only call on my little finger as a witness, which cannot claim any authority to be respected outside my own skin."},{"id":"q-albert-einstein-letter-to-walter-dal-53ad5d8e","quote":"However, you have also understood correctly the disadvantage attached to a continuum. The question seems to me to be how one can formulate statements about a discontinuum without resorting to a continuum (space-time); the latter would have to be banished from the theory as an extra construction that is not justified by the essence of the problem and that corresponds to nothing “real.” But for this we unfortunately are still lacking the mathematical form. How much I have toiled in this direction already!!","speaker":{"name":"Albert Einstein","role":"author","sort":"einstein, albert","as_given":"Albert Einstein"},"source":{"work":"Letter to Walter Dällenbach, in The Collected Papers of Albert Einstein, vol. 8, The Berlin Years: Correspondence, 1914-1918, English Translation Supplement, trans. Ann M. Hentschel (Princeton: Princeton University Press), Doc. 299","locus":"pp. 285-287, at p. 286","date":"after 15 February 1917","url":"https://einsteinpapers.press.princeton.edu/vol8-trans/314"},"restored":"","themes":["physics-and-continuum"],"years":[1917],"embed_text":"Albert Einstein | Letter to Walter Dällenbach, in The Collected Papers of Albert Einstein, vol. 8, The Berlin Years: Correspondence, 1914-1918, English Translation Supplement, trans. Ann M. Hentschel (Princeton: Princeton University Press), Doc. 299 | pp. 285-287, at p. 286 | after 15 February 1917 | However, you have also understood correctly the disadvantage attached to a continuum. The question seems to me to be how one can formulate statements about a discontinuum without resorting to a continuum (space-time); the latter would have to be banished from the theory as an extra construction that is not justified by the essence of the problem and that corresponds to nothing “real.” But for this we unfortunately are still lacking the mathematical form. How much I have toiled in this direction already!!"},{"id":"q-albert-einstein-letter-to-david-bohm-c25052e6","quote":"I must confess that I was not able to find a way to explain the atomistic character of nature. My opinion is that if the objective description through the field as an elementary concept is not possible, then one has to find a possibility to avoid the continuum (together with space and time) altogether. But I have not the slightest idea what kind of elementary concepts could be used in such a theory.","speaker":{"name":"Albert Einstein","role":"reported","sort":"einstein, albert","as_given":"Albert Einstein"},"source":{"work":"letter to David Bohm, quoted in Bob Doyle, My God, He Plays Dice! (Information Philosopher)","date":"28 October 1954"},"restored":"","themes":["physics-and-continuum"],"years":[1954],"embed_text":"Albert Einstein | letter to David Bohm, quoted in Bob Doyle, My God, He Plays Dice! (Information Philosopher) | 28 October 1954 | I must confess that I was not able to find a way to explain the atomistic character of nature. My opinion is that if the objective description through the field as an elementary concept is not possible, then one has to find a possibility to avoid the continuum (together with space and time) altogether. But I have not the slightest idea what kind of elementary concepts could be used in such a theory."},{"id":"q-albert-einstein-letter-to-max-born-a-d66d41e0","quote":"inconsistent with the principle that physics has to represent a reality in space and time without phantom actions over distances","speaker":{"name":"Albert Einstein","role":"author","sort":"einstein, albert","as_given":"Albert Einstein"},"source":{"work":"letter to Max Born, as translated by Born in his Waynflete Lectures","date":"3 December 1947"},"restored":"","themes":["physics-and-continuum"],"years":[1947],"embed_text":"Albert Einstein | letter to Max Born, as translated by Born in his Waynflete Lectures | 3 December 1947 | inconsistent with the principle that physics has to represent a reality in space and time without phantom actions over distances"},{"id":"q-albert-einstein-letter-to-michele-be-9a8096c7","quote":"I consider it quite possible that physics cannot be based on the field concept, i.e., on continuous structures. In that case, nothing remains of my entire castle in the air, gravitation theory included, [and of] the rest of modern physics.","speaker":{"name":"Albert Einstein","role":"reported","sort":"einstein, albert","as_given":"Albert Einstein"},"source":{"work":"letter to Michele Besso, quoted in Bob Doyle, My God, He Plays Dice! (Information Philosopher)","locus":"Doyle, Chapter 38, \"Einstein's Field Theory\" (section \"Castle In The Air\"), p.316-317; Doyle's footnote 2 on this quotation cites \"Pais, 1982, p.467\" (Abraham Pais, \"Subtle is the Lord\"); Doyle prints \"i.e:,\" where this record reads \"i.e.,\"","date":"1954","url":"https://www.informationphilosopher.com/books/einstein/Einstein.pdf"},"restored":"","themes":["physics-and-continuum"],"years":[1954],"embed_text":"Albert Einstein | letter to Michele Besso, quoted in Bob Doyle, My God, He Plays Dice! (Information Philosopher) | Doyle, Chapter 38, \"Einstein's Field Theory\" (section \"Castle In The Air\"), p.316-317; Doyle's footnote 2 on this quotation cites \"Pais, 1982, p.467\" (Abraham Pais, \"Subtle is the Lord\"); Doyle prints \"i.e:,\" where this record reads \"i.e.,\" | 1954 | I consider it quite possible that physics cannot be based on the field concept, i.e., on continuous structures. In that case, nothing remains of my entire castle in the air, gravitation theory included, [and of] the rest of modern physics."},{"id":"q-enrico-fermi-john--studies-of-nonlinear-53b2d28f","quote":"A one-dimensional dynamical system of 64 particles with forces between neighbors containing nonlinear terms has been studied on the Los Alamos computer MANIAC. The nonlinear terms considered are quadratic, cubic, and broken linear types. The results are analyzed into Fourier components and plotted as a function of time. The results show very little, if any, tendency toward equipartition of energy among the degrees of freedom.","speaker":{"name":"Enrico Fermi, John Pasta and Stanislaw Ulam","role":"author","sort":"enrico fermi, john pasta and stanislaw ulam","as_given":"E. Fermi, J. Pasta, S. Ulam (report by); work performed by Fermi, Pasta, Ulam, and M. Tsingou"},"source":{"work":"Studies of Nonlinear Problems, I","locus":"p. [1] (Abstract), report LA-1940","date":"May 1955","url":"https://www.egcharalampidis.com/links/ACC0041.pdf"},"restored":"","themes":["machines"],"years":[1955],"embed_text":"Enrico Fermi, John Pasta and Stanislaw Ulam | Studies of Nonlinear Problems, I | p. [1] (Abstract), report LA-1940 | May 1955 | A one-dimensional dynamical system of 64 particles with forces between neighbors containing nonlinear terms has been studied on the Los Alamos computer MANIAC. The nonlinear terms considered are quadratic, cubic, and broken linear types. The results are analyzed into Fourier components and plotted as a function of time. The results show very little, if any, tendency toward equipartition of energy among the degrees of freedom."},{"id":"q-enrico-fermi-john--studies-of-nonlinear-3799a620","quote":"The last few examples were calculated in 1955. After the untimely death of Professor E. Fermi in November, 1954, the calculations were continued in Los Alamos.","speaker":{"name":"Enrico Fermi, John Pasta and Stanislaw Ulam","role":"author","sort":"enrico fermi, john pasta and stanislaw ulam","as_given":"E. Fermi, J. Pasta, S. Ulam"},"source":{"work":"Studies of Nonlinear Problems, I","locus":"p. [1], end of Abstract","date":"May 1955","url":"https://www.egcharalampidis.com/links/ACC0041.pdf"},"restored":"","themes":["machines"],"years":[1955],"embed_text":"Enrico Fermi, John Pasta and Stanislaw Ulam | Studies of Nonlinear Problems, I | p. [1], end of Abstract | May 1955 | The last few examples were calculated in 1955. After the untimely death of Professor E. Fermi in November, 1954, the calculations were continued in Los Alamos."},{"id":"q-enrico-fermi-john--studies-of-nonlinear-4a64bcdc","quote":"We thank Miss Mary Tsingou for efficient coding of the problems and for running the computations on the Los Alamos MANIAC machine.","speaker":{"name":"Enrico Fermi, John Pasta and Stanislaw Ulam","role":"author","sort":"enrico fermi, john pasta and stanislaw ulam","as_given":"E. Fermi, J. Pasta, S. Ulam (authors of report), crediting M. Tsingou"},"source":{"work":"Studies of Nonlinear Problems, I","locus":"p. [3], footnote","date":"May 1955","url":"https://www.egcharalampidis.com/links/ACC0041.pdf"},"restored":"","themes":["machines"],"years":[1955],"embed_text":"Enrico Fermi, John Pasta and Stanislaw Ulam | Studies of Nonlinear Problems, I | p. [3], footnote | May 1955 | We thank Miss Mary Tsingou for efficient coding of the problems and for running the computations on the Los Alamos MANIAC machine."},{"id":"q-enrico-fermi-john--studies-of-nonlinear-32791488","quote":"Let us say here that the results of our computations show features which were, from the beginning, surprising to us. Instead of a gradual, continuous flow of energy from the first mode to the higher modes, all of the problems show an entirely different behavior. Starting in one problem with a quadratic force and a pure sine wave as the initial position of the string, we indeed observe initially a gradual increase of energy in the higher modes as predicted (e. g., by Rayleigh in an infinitesimal analysis). Mode 2 starts increasing first, followed by mode 3, and so on. Later on, however, this gradual sharing of energy among successive modes ceases. Instead, it is one or the other mode that predominates. For example, mode 2 decides, as it were, to increase rather rapidly at the cost of all other modes and becomes predominant. At one time, it has more energy than all the others put together! Then mode 3 undertakes this role.","speaker":{"name":"Enrico Fermi, John Pasta and Stanislaw Ulam","role":"author","sort":"enrico fermi, john pasta and stanislaw ulam","as_given":"E. Fermi, J. Pasta, S. Ulam"},"source":{"work":"Studies of Nonlinear Problems, I","locus":"pp. [5]–[6]","date":"May 1955","url":"https://www.egcharalampidis.com/links/ACC0041.pdf"},"restored":"","themes":["machines"],"years":[1955],"embed_text":"Enrico Fermi, John Pasta and Stanislaw Ulam | Studies of Nonlinear Problems, I | pp. [5]–[6] | May 1955 | Let us say here that the results of our computations show features which were, from the beginning, surprising to us. Instead of a gradual, continuous flow of energy from the first mode to the higher modes, all of the problems show an entirely different behavior. Starting in one problem with a quadratic force and a pure sine wave as the initial position of the string, we indeed observe initially a gradual increase of energy in the higher modes as predicted (e. g., by Rayleigh in an infinitesimal analysis). Mode 2 starts increasing first, followed by mode 3, and so on. Later on, however, this gradual sharing of energy among successive modes ceases. Instead, it is one or the other mode that predominates. For example, mode 2 decides, as it were, to increase rather rapidly at the cost of all other modes and becomes predominant. At one time, it has more energy than all the others put together! Then mode 3 undertakes this role."},{"id":"q-enrico-fermi-john--studies-of-nonlinear-17d566ac","quote":"The results show very little, if any, tendency toward equipartition of energy among the degrees of freedom.","speaker":{"name":"Enrico Fermi, John Pasta and Stanislaw Ulam","role":"author","sort":"enrico fermi, john pasta and stanislaw ulam","as_given":"Enrico Fermi, John Pasta and Stanislaw Ulam"},"source":{"work":"“Studies of Nonlinear Problems,” Los Alamos report LA-1940","locus":"abstract; in Analogies Between Analogies, p. 139","date":"May 1955"},"restored":"","themes":["monte-carlo-and-automata"],"years":[1955],"embed_text":"Enrico Fermi, John Pasta and Stanislaw Ulam | “Studies of Nonlinear Problems,” Los Alamos report LA-1940 | abstract; in Analogies Between Analogies, p. 139 | May 1955 | The results show very little, if any, tendency toward equipartition of energy among the degrees of freedom."},{"id":"q-f-faltin-n-metropo-a-boolean-analysis-o-31f8d66e","quote":"The notions of binary string and binary symmetric function are introduced, and basic results presented. Boolean algorithms are given for binary addition and multiplication. An analysis of the redundancies involved is straightforward. The examination of carry propagation which arises in the Boolean analysis of functions may lead to a new interpretation of the notion of computational complexity.","speaker":{"name":"F. Faltin, N. Metropolis, B. Ross and Gian-Carlo Rota","role":"author","sort":"f. faltin, n. metropolis, b. ross and gian-carlo rota","as_given":"F. Faltin, N. Metropolis, B. Ross and Gian-Carlo Rota"},"source":{"work":"“A Boolean Analysis of Addition and Multiplication” (published abstract), Studies in Applied Mathematics 56 no. 2, pp. 147–158","locus":"Abstract. DOI 10.1002/sapm1977562147; OSTI ID 6234187","date":"1977","file":"04_ROTA/Boolean_Analysis_1977_OSTI_record.png","url":"https://www.osti.gov/biblio/6234187"},"restored":"","themes":["machines"],"years":[1977],"embed_text":"F. Faltin, N. Metropolis, B. Ross and Gian-Carlo Rota | “A Boolean Analysis of Addition and Multiplication” (published abstract), Studies in Applied Mathematics 56 no. 2, pp. 147–158 | Abstract. DOI 10.1002/sapm1977562147; OSTI ID 6234187 | 1977 | The notions of binary string and binary symmetric function are introduced, and basic results presented. Boolean algorithms are given for binary addition and multiplication. An analysis of the redundancies involved is straightforward. The examination of carry propagation which arises in the Boolean analysis of functions may lead to a new interpretation of the notion of computational complexity."},{"id":"q-enrico-fermi-quoted-in-stanislaw--bb1927b6","quote":"It [the Schrodinger equation] has no business being that good, you know, Stan.","speaker":{"name":"Enrico Fermi","role":"reported","sort":"fermi, enrico","as_given":"Enrico Fermi"},"source":{"work":"quoted in Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), Part III, \"Los Alamos\"","locus":"p. 165","date":"1976 (book); the exchange is dated by Ulam to after the war"},"restored":"","themes":["quantum-formalism"],"years":[1976],"embed_text":"Enrico Fermi | quoted in Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), Part III, \"Los Alamos\" | p. 165 | 1976 (book); the exchange is dated by Ulam to after the war | It [the Schrodinger equation] has no business being that good, you know, Stan."},{"id":"q-enrico-fermi-quoted-in-stanislaw--d8ddc35d","quote":"No, I didn't succeed to my satisfaction in giving a really rational introduction to quantum theory.","speaker":{"name":"Enrico Fermi","role":"reported","sort":"fermi, enrico","as_given":"Enrico Fermi"},"source":{"work":"quoted in Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), Part III, \"Los Alamos\"","locus":"p. 166","date":"1976 (book); reported of the summer following the Frijoles Canyon walk"},"restored":"","themes":["quantum-formalism"],"years":[1976],"embed_text":"Enrico Fermi | quoted in Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner's Sons, 1976), Part III, \"Los Alamos\" | p. 166 | 1976 (book); reported of the summer following the Frijoles Canyon walk | No, I didn't succeed to my satisfaction in giving a really rational introduction to quantum theory."},{"id":"q-richard-feynman-what-is-science-addr-25134e02","quote":"So we went alone for our walk in the woods. But mothers were very powerful in those day's as they are now, and they convinced the other fathers that they had to take their own sons out for walks in the woods. So all fathers took all sons out for walks in the woods one Sunday afternoon. The next day, Monday, we were playing in the fields and this boy said to me, \"See that bird standing on the stump there? What's the name of it?\" I said, \"I haven't got the slightest idea.\" He said, 'It's a brown-throated thrush. Your father doesn't teach you much about science.\" I smiled to myself, because my father had already taught me that [the name] doesn't tell me anything about the bird. He taught me \"See that bird? It's a brown-throated thrush, but in Germany it's called a halsenflugel, and in Chinese they call it a chung ling and even if you know all those names for it, you still know nothing about the bird--you only know something about people; what they call that bird. Now that thrush sings, and teaches its young to fly, and flies so many miles away during the summer across the country, and nobody knows how it finds its way,\" and so forth. There is a difference between the name of the thing and what goes on.","speaker":{"name":"Richard Feynman","role":"author","sort":"feynman, richard","as_given":"Richard Feynman (as recounted by Feynman, quoting his father)"},"source":{"work":"\"What Is Science?\" — address to the National Science Teachers Association, New York City, 1966 (published in The Physics Teacher, Vol. 7, No. 6, 1969, pp.313-320)","locus":"p. 4 of the PDF transcription","date":"1966 (address); 1969 (Physics Teacher publication)","url":"https://profizgl.lu.lv/pluginfile.php/32795/mod_resource/content/0/WHAT_IS_SCIENCE_by_R.Feynman_1966.pdf"},"restored":"","themes":[],"years":[1966,1969],"embed_text":"Richard Feynman | \"What Is Science?\" — address to the National Science Teachers Association, New York City, 1966 (published in The Physics Teacher, Vol. 7, No. 6, 1969, pp.313-320) | p. 4 of the PDF transcription | 1966 (address); 1969 (Physics Teacher publication) | So we went alone for our walk in the woods. But mothers were very powerful in those day's as they are now, and they convinced the other fathers that they had to take their own sons out for walks in the woods. So all fathers took all sons out for walks in the woods one Sunday afternoon. The next day, Monday, we were playing in the fields and this boy said to me, \"See that bird standing on the stump there? What's the name of it?\" I said, \"I haven't got the slightest idea.\" He said, 'It's a brown-throated thrush. Your father doesn't teach you much about science.\" I smiled to myself, because my father had already taught me that [the name] doesn't tell me anything about the bird. He taught me \"See that bird? It's a brown-throated thrush, but in Germany it's called a halsenflugel, and in Chinese they call it a chung ling and even if you know all those names for it, you still know nothing about the bird--you only know something about people; what they call that bird. Now that thrush sings, and teaches its young to fly, and flies so many miles away during the summer across the country, and nobody knows how it finds its way,\" and so forth. There is a difference between the name of the thing and what goes on."},{"id":"q-richard-feynman-the-feynman-lectures-f83725fe","quote":"We can imagine that this complicated array of moving things which constitutes ‘the world’ is something like a great chess game being played by the gods, and we are observers of the game.","speaker":{"name":"Richard Feynman","role":"author","sort":"feynman, richard","as_given":"Richard Feynman"},"source":{"work":"The Feynman Lectures on Physics, Vol. I","locus":"§2-1","date":"1963"},"restored":"","themes":["physics-and-continuum"],"years":[1963],"embed_text":"Richard Feynman | The Feynman Lectures on Physics, Vol. I | §2-1 | 1963 | We can imagine that this complicated array of moving things which constitutes ‘the world’ is something like a great chess game being played by the gods, and we are observers of the game."},{"id":"q-richard-feynman-the-feynman-lectures-7ae67da0","quote":"has in it the heart of quantum mechanics. In reality, it contains the only mystery","speaker":{"name":"Richard Feynman","role":"author","sort":"feynman, richard","as_given":"Richard Feynman"},"source":{"work":"The Feynman Lectures on Physics, Vol. III","locus
