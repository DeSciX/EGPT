 correct an occasional mistake or mispronunciation on my part.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers”","locus":"p. 244","date":"1976"},"restored":"","themes":[],"years":[1976],"embed_text":"Stanislaw Ulam | Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers” | p. 244 | 1976 | By then he was very, very ill. I would sit with him and try to distract him. There was still some scientific curiosity in him; his memory still seemed to work sporadically, and on occasion almost uncannily well. I will never forget the scene a few days before he died. I was reading to him in Greek from his worn copy of Thucydides a story he liked especially about the Athenians’ attack on Melos, and also the speech of Pericles. He remembered enough to correct an occasional mistake or mispronunciation on my part."},{"id":"q-stanislaw-ulam-stanislaw-m-ulam-adv-294c09c4","quote":"Once in my presence when Klari chided him for his great self-confidence and pride in his intellectual achievements, he replied that on the contrary he was full of admiration for the wonders of nature and the evolution of the brain, compared to which all we do is puny and insignificant.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers”","locus":"p. 244","date":"1976"},"restored":"","themes":["brain-and-machine"],"years":[1976],"embed_text":"Stanislaw Ulam | Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers” | p. 244 | 1976 | Once in my presence when Klari chided him for his great self-confidence and pride in his intellectual achievements, he replied that on the contrary he was full of admiration for the wonders of nature and the evolution of the brain, compared to which all we do is puny and insignificant."},{"id":"q-stanislaw-ulam-stanislaw-m-ulam-adv-9a15b73b","quote":"As for myself, I was never greatly impressed by his work on Hilbert space or on continuous geometry. This is a question of taste, and when I was more of a purist myself I made good-natured fun of certain of his involvements in applications. I told him once, “When it comes to the applications of mathematics to dentistry, maybe you’ll stop.”","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers”","locus":"p. 245","date":"1976"},"restored":"","themes":["physics-and-continuum"],"years":[1976],"embed_text":"Stanislaw Ulam | Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers” | p. 245 | 1976 | As for myself, I was never greatly impressed by his work on Hilbert space or on continuous geometry. This is a question of taste, and when I was more of a purist myself I made good-natured fun of certain of his involvements in applications. I told him once, “When it comes to the applications of mathematics to dentistry, maybe you’ll stop.”"},{"id":"q-stanislaw-ulam-stanislaw-m-ulam-adv-5dcfcb93","quote":"Now Banach, Fermi, von Neumann were dead—the three great men whose intellects had impressed me the most. These were sad times indeed.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers”","locus":"p. 245","date":"1976"},"restored":"","themes":["physics-and-continuum"],"years":[1976],"embed_text":"Stanislaw Ulam | Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers” | p. 245 | 1976 | Now Banach, Fermi, von Neumann were dead—the three great men whose intellects had impressed me the most. These were sad times indeed."},{"id":"q-stanislaw-ulam-stanislaw-m-ulam-adv-e2dbb758","quote":"Before he left, Françoise showed him a recent snapshot of Claire on her bicycle. He asked if he could take the photo with him. He walked back to the Lodge through the garden, and watching him through the window I definitely had the feeling that somber and melancholy thoughts were in his head.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers”","locus":"pp. 239–240","date":"1976"},"restored":"","themes":[],"years":[1976],"embed_text":"Stanislaw Ulam | Stanislaw M. Ulam, Adventures of a Mathematician (New York: Charles Scribner’s Sons, 1976), ch. 12, “The Death of Two Pioneers” | pp. 239–240 | 1976 | Before he left, Françoise showed him a recent snapshot of Claire on her bicycle. He asked if he could take the photo with him. He walked back to the Lodge through the garden, and watching him through the window I definitely had the feeling that somber and melancholy thoughts were in his head."},{"id":"q-stanislaw-ulam-ulam-and-rota-discus-f8653863","quote":"One summer before the war when I was returning to the States, Johnny was waiting for me at the pier. His first words were that Godel had shown that the continuum hypothesis was undecidable. This was how I heard for the first time about the existence of undecidable propositions in any formal system. So I said to him, “Oh! That is because he defines what is meant by a set.” Johnny opened his eyes wide and expressed surprise that I had seen right away what was indeed the essential point. He thought I had some supernatural intuition.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Ulam and Rota discuss von Neumann, MacTutor","locus":"Gainesville","date":"January 1974"},"restored":"","themes":["godel"],"years":[1974],"embed_text":"Stanislaw Ulam | Ulam and Rota discuss von Neumann, MacTutor | Gainesville | January 1974 | One summer before the war when I was returning to the States, Johnny was waiting for me at the pier. His first words were that Godel had shown that the continuum hypothesis was undecidable. This was how I heard for the first time about the existence of undecidable propositions in any formal system. So I said to him, “Oh! That is because he defines what is meant by a set.” Johnny opened his eyes wide and expressed surprise that I had seen right away what was indeed the essential point. He thought I had some supernatural intuition."},{"id":"q-stanislaw-ulam-ulam-and-rota-discus-d87c6265","quote":"I asked him whether Godel was not a little afraid that his result was nothing but a sort of super paradox of the existing set theory, merely a diagonal method. In a sense it is a diagonalization. He agreed that this was probably right and that Godel did not quite realise the importance of his discovery because of the fear that it would turn out to be merely another version of the whole series of set-theoretical paradoxes. Of course it was much more than that because he had made it all formal. The other paradoxes were special and dependent on metamathematical considerations that were not truly part of mathematics, whereas his results were. Curious how nervous people can be about their own work when it is the work!","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Ulam and Rota discuss von Neumann, MacTutor","locus":"Gainesville","date":"January 1974"},"restored":"","themes":["godel"],"years":[1974],"embed_text":"Stanislaw Ulam | Ulam and Rota discuss von Neumann, MacTutor | Gainesville | January 1974 | I asked him whether Godel was not a little afraid that his result was nothing but a sort of super paradox of the existing set theory, merely a diagonal method. In a sense it is a diagonalization. He agreed that this was probably right and that Godel did not quite realise the importance of his discovery because of the fear that it would turn out to be merely another version of the whole series of set-theoretical paradoxes. Of course it was much more than that because he had made it all formal. The other paradoxes were special and dependent on metamathematical considerations that were not truly part of mathematics, whereas his results were. Curious how nervous people can be about their own work when it is the work!"},{"id":"q-stanislaw-ulam-ulam-and-rota-discus-f879d83a","quote":"Yes, I know. It was so unexpected at the time, and poor Hilbert was ...","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Ulam and Rota discuss von Neumann, MacTutor","locus":"Gainesville","date":"January 1974"},"restored":"","themes":["godel"],"years":[1974],"embed_text":"Stanislaw Ulam | Ulam and Rota discuss von Neumann, MacTutor | Gainesville | January 1974 | Yes, I know. It was so unexpected at the time, and poor Hilbert was ..."},{"id":"q-stanislaw-ulam-ulam-and-rota-discus-7a0f09e1","quote":"Johnny told me that Godel’s results made him very downcast, not quite despairing but disappointed. You must remember that his work on the axiomatisation of set theory, which was way back in the twenties, constitutes to this day one of the best foundations for set-theoretical mathematics. Basically he believed in Hilbert’s goal of a final and conclusive axiomatisation of mathematics, and yet, in a 1925 paper, in a mysterious flash of intuition, he pointed out the limits of any axiomatic formulation of set theory. That was perhaps a vague forecast of Godel’s result. But it was left to Godel to follow it through, and it has changed the direction of all science.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Ulam and Rota discuss von Neumann, MacTutor","locus":"Gainesville","date":"January 1974"},"restored":"","themes":["godel"],"years":[1974],"embed_text":"Stanislaw Ulam | Ulam and Rota discuss von Neumann, MacTutor | Gainesville | January 1974 | Johnny told me that Godel’s results made him very downcast, not quite despairing but disappointed. You must remember that his work on the axiomatisation of set theory, which was way back in the twenties, constitutes to this day one of the best foundations for set-theoretical mathematics. Basically he believed in Hilbert’s goal of a final and conclusive axiomatisation of mathematics, and yet, in a 1925 paper, in a mysterious flash of intuition, he pointed out the limits of any axiomatic formulation of set theory. That was perhaps a vague forecast of Godel’s result. But it was left to Godel to follow it through, and it has changed the direction of all science."},{"id":"q-stanislaw-ulam-ulam-and-rota-discus-64e3c1e1","quote":"On everything. He was one of the originators, one of the “influencers” of implosion. By the way, you are my most eminent “influencee”; it is a relationship different from teacher-student.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"Ulam and Rota discuss von Neumann, MacTutor","locus":"Gainesville","date":"January 1974"},"restored":"","themes":["influence"],"years":[1974],"embed_text":"Stanislaw Ulam | Ulam and Rota discuss von Neumann, MacTutor | Gainesville | January 1974 | On everything. He was one of the originators, one of the “influencers” of implosion. By the way, you are my most eminent “influencee”; it is a relationship different from teacher-student."},{"id":"q-stanislaw-ulam-quoted-in-gian-carlo-07de1c7d","quote":"When I am alone, I am forced to think things out, and I see so much that I would rather not think about!","speaker":{"name":"Stanislaw Ulam","role":"reported","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"quoted in Gian-Carlo Rota, “The Barrier of Meaning,” Letters in Mathematical Physics 10 (1985), pp. 97-99","locus":"p. 97","date":"20-25 May 1985","file":"04_ROTA/The_Barrier_of_Meaning_Rota.md"},"restored":"","themes":["rota-thought"],"years":[1985],"embed_text":"Stanislaw Ulam | quoted in Gian-Carlo Rota, “The Barrier of Meaning,” Letters in Mathematical Physics 10 (1985), pp. 97-99 | p. 97 | 20-25 May 1985 | When I am alone, I am forced to think things out, and I see so much that I would rather not think about!"},{"id":"q-stanislaw-ulam-quoted-in-gian-carlo-7198a6d1","quote":"Philosophers and logicians, from Duns Scotus in the Twelfth Century to Ludwig Wittgenstein only yesterday, have done a lot of clear thinking about all this stuff. If your friends in AI persist in ignoring their past, they will be condemned to repeat it, at a high cost that will be borne by the taxpayers.","speaker":{"name":"Stanislaw Ulam","role":"reported","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"quoted in Gian-Carlo Rota, “The Barrier of Meaning,” Letters in Mathematical Physics 10:2","locus":"pp. 97–99","date":"address May 1985; printed 1985"},"restored":"","themes":["understanding-and-meaning"],"years":[1985],"embed_text":"Stanislaw Ulam | quoted in Gian-Carlo Rota, “The Barrier of Meaning,” Letters in Mathematical Physics 10:2 | pp. 97–99 | address May 1985; printed 1985 | Philosophers and logicians, from Duns Scotus in the Twelfth Century to Ludwig Wittgenstein only yesterday, have done a lot of clear thinking about all this stuff. If your friends in AI persist in ignoring their past, they will be condemned to repeat it, at a high cost that will be borne by the taxpayers."},{"id":"q-stanislaw-ulam-quoted-in-gian-carlo-4c8e8259","quote":"I now take this object out of my pocket and ask you to look at it. No amount of staring at this object will ever tell you that this is a key, unless you already have some previous familiarity with the way keys are used.","speaker":{"name":"Stanislaw Ulam","role":"reported","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"quoted in Gian-Carlo Rota, “The Barrier of Meaning,” Letters in Mathematical Physics 10:2","locus":"pp. 97–99","date":"address May 1985; printed 1985"},"restored":"","themes":["understanding-and-meaning"],"years":[1985],"embed_text":"Stanislaw Ulam | quoted in Gian-Carlo Rota, “The Barrier of Meaning,” Letters in Mathematical Physics 10:2 | pp. 97–99 | address May 1985; printed 1985 | I now take this object out of my pocket and ask you to look at it. No amount of staring at this object will ever tell you that this is a key, unless you already have some previous familiarity with the way keys are used."},{"id":"q-stanislaw-ulam-quoted-in-gian-carlo-3f4d876c","quote":"Now look at that man passing by in a car. How do you tell that it is not just a man you are seeing, but a passenger?","speaker":{"name":"Stanislaw Ulam","role":"reported","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"quoted in Gian-Carlo Rota, “The Barrier of Meaning,” Letters in Mathematical Physics 10:2","locus":"pp. 97–99","date":"address May 1985; printed 1985"},"restored":"","themes":["understanding-and-meaning"],"years":[1985],"embed_text":"Stanislaw Ulam | quoted in Gian-Carlo Rota, “The Barrier of Meaning,” Letters in Mathematical Physics 10:2 | pp. 97–99 | address May 1985; printed 1985 | Now look at that man passing by in a car. How do you tell that it is not just a man you are seeing, but a passenger?"},{"id":"q-stanislaw-ulam-quoted-in-gian-carlo-a18c9b0f","quote":"When you write down precise definitions for these words, you discover that what you are describing is not an object, but a function, a role that is inextricably tied to some context. Take away the context, and the meaning also disappears.","speaker":{"name":"Stanislaw Ulam","role":"reported","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"quoted in Gian-Carlo Rota, “The Barrier of Meaning,” Letters in Mathematical Physics 10:2","locus":"pp. 97–99","date":"address May 1985; printed 1985"},"restored":"","themes":["understanding-and-meaning"],"years":[1985],"embed_text":"Stanislaw Ulam | quoted in Gian-Carlo Rota, “The Barrier of Meaning,” Letters in Mathematical Physics 10:2 | pp. 97–99 | address May 1985; printed 1985 | When you write down precise definitions for these words, you discover that what you are describing is not an object, but a function, a role that is inextricably tied to some context. Take away the context, and the meaning also disappears."},{"id":"q-stanislaw-ulam-quoted-in-gian-carlo-df2a51c4","quote":"Your friends in AI are now beginning to trumpet the role of contexts, but they are not practising their lesson. They still want to build machines that see by imitating cameras, perhaps with some feedback thrown in. Such an approach is bound to fail, since it starts out with a logical misunderstanding.","speaker":{"name":"Stanislaw Ulam","role":"reported","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"quoted in Gian-Carlo Rota, “The Barrier of Meaning,” Letters in Mathematical Physics 10:2","locus":"pp. 97–99","date":"address May 1985; printed 1985"},"restored":"","themes":["understanding-and-meaning"],"years":[1985],"embed_text":"Stanislaw Ulam | quoted in Gian-Carlo Rota, “The Barrier of Meaning,” Letters in Mathematical Physics 10:2 | pp. 97–99 | address May 1985; printed 1985 | Your friends in AI are now beginning to trumpet the role of contexts, but they are not practising their lesson. They still want to build machines that see by imitating cameras, perhaps with some feedback thrown in. Such an approach is bound to fail, since it starts out with a logical misunderstanding."},{"id":"q-stanislaw-ulam-quoted-in-gian-carlo-0e943acc","quote":"Logic formalizes only very few of the processes by which we actually think… What is it that you see when you see? You see an object as a key, you see a man in a car as a passenger, you see some sheets of paper as a book. It is the word ‘as’ that must be mathematically formalized, on a par with the connectives ‘and’, ‘or’, ‘implies’ and ‘not’…","speaker":{"name":"Stanislaw Ulam","role":"reported","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"quoted in Gian-Carlo Rota, “The Barrier of Meaning,” Letters in Mathematical Physics 10:2","locus":"pp. 97–99","date":"address May 1985; printed 1985"},"restored":"The time has come to enrich formal logic by adding to it some other fundamental notions … that have already been accepted into a formal logic. Until you do that, you will not get very far with your AI problem.","themes":["understanding-and-meaning"],"years":[1985],"embed_text":"Stanislaw Ulam | quoted in Gian-Carlo Rota, “The Barrier of Meaning,” Letters in Mathematical Physics 10:2 | pp. 97–99 | address May 1985; printed 1985 | Logic formalizes only very few of the processes by which we actually think… What is it that you see when you see? You see an object as a key, you see a man in a car as a passenger, you see some sheets of paper as a book. It is the word ‘as’ that must be mathematically formalized, on a par with the connectives ‘and’, ‘or’, ‘implies’ and ‘not’… | The time has come to enrich formal logic by adding to it some other fundamental notions … that have already been accepted into a formal logic. Until you do that, you will not get very far with your AI problem."},{"id":"q-stanislaw-ulam-quoted-in-gian-carlo-11484546","quote":"Around the turn of the century, most mathematicians and physicists probably thought that the common-sense notion of simultaneity of events was an obvious one, and needed no exact explanation. Yet a few years later Einstein came out with his special theory of relativity, which exactly analyzed it. I see no reason why we shouldn’t do with ‘as’ what Einstein did with simultaneity.","speaker":{"name":"Stanislaw Ulam","role":"reported","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"quoted in Gian-Carlo Rota, “The Barrier of Meaning,” Letters in Mathematical Physics 10:2","locus":"pp. 97–99","date":"address May 1985; printed 1985"},"restored":"","themes":["understanding-and-meaning"],"years":[1985],"embed_text":"Stanislaw Ulam | quoted in Gian-Carlo Rota, “The Barrier of Meaning,” Letters in Mathematical Physics 10:2 | pp. 97–99 | address May 1985; printed 1985 | Around the turn of the century, most mathematicians and physicists probably thought that the common-sense notion of simultaneity of events was an obvious one, and needed no exact explanation. Yet a few years later Einstein came out with his special theory of relativity, which exactly analyzed it. I see no reason why we shouldn’t do with ‘as’ what Einstein did with simultaneity."},{"id":"q-stanislaw-ulam-conversations-with-r-73ec327b","quote":"To my mind and to my taste, the most important work he did is what he did when he was getting older, which mathematicians don’t appreciate, namely his speculations on automata, on the brain, and his contributions to computing and to problems in hydrodynamics.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"“Conversations with Rota,” Los Alamos Science, Special Issue No. 15","locus":"p. 304","date":"recorded Gainesville, 1974; printed 1987"},"restored":"","themes":["brain-and-machine"],"years":[1974,1987],"embed_text":"Stanislaw Ulam | “Conversations with Rota,” Los Alamos Science, Special Issue No. 15 | p. 304 | recorded Gainesville, 1974; printed 1987 | To my mind and to my taste, the most important work he did is what he did when he was getting older, which mathematicians don’t appreciate, namely his speculations on automata, on the brain, and his contributions to computing and to problems in hydrodynamics."},{"id":"q-stanislaw-ulam-john-von-neumann-190-a3511ae4","quote":"One conversation centered on the ever accelerating progress of technology and changes in the mode of human life, which gives the appearance of approaching some essential singularity in the history of the race beyond which human affairs, as we know them, could not continue.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"“John von Neumann, 1903–1957,” Bulletin of the American Mathematical Society 64:3, Part 2","locus":"p. 5","date":"May 1958"},"restored":"","themes":["singularity"],"years":[1958],"embed_text":"Stanislaw Ulam | “John von Neumann, 1903–1957,” Bulletin of the American Mathematical Society 64:3, Part 2 | p. 5 | May 1958 | One conversation centered on the ever accelerating progress of technology and changes in the mode of human life, which gives the appearance of approaching some essential singularity in the history of the race beyond which human affairs, as we know them, could not continue."},{"id":"q-stanislaw-ulam-john-von-neumann-190-d7f49cc4","quote":"It was toward the end of his life that he felt sure enough of himself to engage freely and yet painstakingly in the creation of a possible new mathematical discipline. This was to be a combinatorial theory of automata and organisms. His illness and premature death permitted him to make only a beginning.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"“John von Neumann, 1903–1957,” Bulletin of the American Mathematical Society 64:3, Part 2","locus":"p. 8","date":"May 1958"},"restored":"","themes":["brain-and-machine"],"years":[1958],"embed_text":"Stanislaw Ulam | “John von Neumann, 1903–1957,” Bulletin of the American Mathematical Society 64:3, Part 2 | p. 8 | May 1958 | It was toward the end of his life that he felt sure enough of himself to engage freely and yet painstakingly in the creation of a possible new mathematical discipline. This was to be a combinatorial theory of automata and organisms. His illness and premature death permitted him to make only a beginning."},{"id":"q-stanislaw-ulam-john-von-neumann-190-8c84d278","quote":"After the end of the war, he would express sentiments, somewhat similar to remarks reportedly made by Einstein, that the bewildering wealth of nuclear and elementary particle physics make premature any attempt to formulate a general quantum theory of fields, at least for the time being.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"“John von Neumann, 1903–1957,” Bulletin of the American Mathematical Society 64:3, Part 2","locus":"pp. 20–21","date":"May 1958"},"restored":"","themes":["physics-and-continuum"],"years":[1958],"embed_text":"Stanislaw Ulam | “John von Neumann, 1903–1957,” Bulletin of the American Mathematical Society 64:3, Part 2 | pp. 20–21 | May 1958 | After the end of the war, he would express sentiments, somewhat similar to remarks reportedly made by Einstein, that the bewildering wealth of nuclear and elementary particle physics make premature any attempt to formulate a general quantum theory of fields, at least for the time being."},{"id":"q-stanislaw-ulam-john-von-neumann-190-ee25368c","quote":"We decided to look for ways to find, as it were, homomorphic images of the given physical problem in a mathematical schema which could be represented by a system of fictitious ‘particles’ treated by an electronic computer.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"“John von Neumann, 1903–1957,” Bulletin of the American Mathematical Society 64:3, Part 2","locus":"pp. 33–34","date":"May 1958"},"restored":"","themes":["monte-carlo-and-automata"],"years":[1958],"embed_text":"Stanislaw Ulam | “John von Neumann, 1903–1957,” Bulletin of the American Mathematical Society 64:3, Part 2 | pp. 33–34 | May 1958 | We decided to look for ways to find, as it were, homomorphic images of the given physical problem in a mathematical schema which could be represented by a system of fictitious ‘particles’ treated by an electronic computer."},{"id":"q-stanislaw-ulam-john-von-neumann-190-b217c0ed","quote":"He began to work on the theory of computing and planned the work, to remain unfinished, on the theory of automata. It was at the outset of such studies that his interest in the working of the nervous system and the schematized properties of organisms claimed so much of his attention.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"“John von Neumann, 1903–1957,” Bulletin of the American Mathematical Society 64:3, Part 2","locus":"pp. 7–8","date":"May 1958"},"restored":"","themes":["brain-and-machine"],"years":[1958],"embed_text":"Stanislaw Ulam | “John von Neumann, 1903–1957,” Bulletin of the American Mathematical Society 64:3, Part 2 | pp. 7–8 | May 1958 | He began to work on the theory of computing and planned the work, to remain unfinished, on the theory of automata. It was at the outset of such studies that his interest in the working of the nervous system and the schematized properties of organisms claimed so much of his attention."},{"id":"q-stanislaw-ulam-physics-for-mathemat-8801f671","quote":"Mathematicians start with axioms whose validity they don’t question. You might say it is just a game — ‘the great game’ as Hilbert called it… Now to some extent, at least, I would claim that in physics the situation is inverse. Given a lot of facts, let’s call them theorems, we look for axioms, that is to say physical laws, from which they would follow. So physics is an inverse process.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"“Physics for Mathematicians,” Science, Computers, and People: From the Tree of Mathematics, ch. 2","locus":"pp. 13–14","date":"1986"},"restored":"","themes":["physics-and-continuum"],"years":[1986],"embed_text":"Stanislaw Ulam | “Physics for Mathematicians,” Science, Computers, and People: From the Tree of Mathematics, ch. 2 | pp. 13–14 | 1986 | Mathematicians start with axioms whose validity they don’t question. You might say it is just a game — ‘the great game’ as Hilbert called it… Now to some extent, at least, I would claim that in physics the situation is inverse. Given a lot of facts, let’s call them theorems, we look for axioms, that is to say physical laws, from which they would follow. So physics is an inverse process."},{"id":"q-stanislaw-ulam-physics-for-mathemat-dc3e3012","quote":"And in mathematics itself, you could think of such a game: Given some theorems in a certain well-defined notation or algebra, find the underlying axioms. This game has not been played and I’ll tell you why. It is because the idea of algorithm and the formalization of what we call definite equational theory is very new. So mathematicians have never hesitated to create objects of their own. Right now there begins to appear some work which I would consider of this inverse type; perhaps it was stimulated by the existence of computers.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"“Physics for Mathematicians,” Science, Computers, and People: From the Tree of Mathematics, ch. 2","locus":"pp. 13–14","date":"1986"},"restored":"","themes":["physics-and-continuum"],"years":[1986],"embed_text":"Stanislaw Ulam | “Physics for Mathematicians,” Science, Computers, and People: From the Tree of Mathematics, ch. 2 | pp. 13–14 | 1986 | And in mathematics itself, you could think of such a game: Given some theorems in a certain well-defined notation or algebra, find the underlying axioms. This game has not been played and I’ll tell you why. It is because the idea of algorithm and the formalization of what we call definite equational theory is very new. So mathematicians have never hesitated to create objects of their own. Right now there begins to appear some work which I would consider of this inverse type; perhaps it was stimulated by the existence of computers."},{"id":"q-stanislaw-ulam-ulam-and-rota-discus-4dc99484","quote":"Of course he worked, in answer to your question. In fact he was unable to play the role of senior scientist or advisor without being actively engaged, like with computing. Even towards the end of his life, when he was chairman of the Intercontinental Ballistic Missile (ICBM) Committee, a committee established by the President after Sputnik.","speaker":{"name":"Stanislaw Ulam","role":"author","sort":"ulam, stanislaw","as_given":"Stanislaw Ulam"},"source":{"work":"“Ulam and Rota discuss von Neumann,” conversation at Gainesville, Florida; published by MacTutor History of Mathematics, University of St Andrews","locus":"transcript, unpaginated","date":"1974","url":"https://mathshistory.st-andrews.ac.uk/Extras/Ulam_Rota/"},"restored":"","themes":["machines"],"years":[1974],"embed_text":"Stanislaw Ulam | “Ulam and Rota discuss von Neumann,” conversation at Gainesville, Florida; published by MacTutor History of Mathematics, University of St Andrews | transcript, unpaginated | 1974 | Of course he worked, in answer to your question. In fact he was unable to play the role of senior scientist or advisor without being actively engaged, like with computing. Even towards the end of his life, when he was chairman of the Intercontinental Ballistic Missile (ICBM) Committee, a committee established by the President after Sputnik."},{"id":"q-von-foerster-shann-the-redundancy-of-en-b4d28f3c","quote":"Von Foerster: Is there knowledge of redundancy of different languages, or only of English? Shannon: The only work I know of is in English. Von Foerster: What do you expect for the other languages, the same figure or different ones? Shannon: The Zipf curves suggest that the redundancy for other Indo-European languages may be of the same order as that of English.","speaker":{"name":"Von Foerster / Shannon","role":"author","sort":"von foerster / shannon","as_given":"Von Foerster / Shannon"},"source":{"work":"\"The Redundancy of English,\" discussion following Shannon's paper, Transactions of the Seventh Conference on Cybernetics (1951); reprinted in Pias (ed.), The Complete Transactions (diaphanes, 2003/2016)","locus":"original Transactions pagination p.143; Pias Complete Transactions p.261-262","date":"1950-03-23","url":"http://medientheorie.com/doc/shannon_redundancy.pdf"},"restored":"","themes":["macy"],"years":[1950],"embed_text":"Von Foerster / Shannon | \"The Redundancy of English,\" discussion following Shannon's paper, Transactions of the Seventh Conference on Cybernetics (1951); reprinted in Pias (ed.), The Complete Transactions (diaphanes, 2003/2016) | original Transactions pagination p.143; Pias Complete Transactions p.261-262 | 1950-03-23 | Von Foerster: Is there knowledge of redundancy of different languages, or only of English? Shannon: The only work I know of is in English. Von Foerster: What do you expect for the other languages, the same figure or different ones? Shannon: The Zipf curves suggest that the redundancy for other Indo-European languages may be of the same order as that of English."},{"id":"q-john-von-neumann-a-certain-zero-sum-t-82d9315a","quote":"Without further investigation, a direct solution of the problem appears to require n[!] steps, — the testing of each permutation to find the optimal permutations giving the maximum …","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"\"A Certain Zero-Sum Two-Person Game Equivalent to the Optimal Assignment Problem,\" in H. W. Kuhn and A. W. Tucker (eds.), Contributions to the Theory of Games, Volume II, Annals of Mathematics Studies 28 (Princeton University Press, 1953), pp. 5–12","locus":"p. 5, opening paragraph","date":"26 October 1951","url":"https://archive.org/details/dli.ernet.90090"},"restored":"","themes":["machines"],"years":[1951],"embed_text":"John von Neumann | \"A Certain Zero-Sum Two-Person Game Equivalent to the Optimal Assignment Problem,\" in H. W. Kuhn and A. W. Tucker (eds.), Contributions to the Theory of Games, Volume II, Annals of Mathematics Studies 28 (Princeton University Press, 1953), pp. 5–12 | p. 5, opening paragraph | 26 October 1951 | Without further investigation, a direct solution of the problem appears to require n[!] steps, — the testing of each permutation to find the optimal permutations giving the maximum …"},{"id":"q-john-von-neumann-a-certain-zero-sum-t-4ec97ae9","quote":"(The game matrix for this game will be 2n x n². From this it is not difficult to infer how many steps are needed to get significant approximate solutions with the method of G. W. Brown and J. von Neumann. … It turns out that this number is a moderate power of n, i.e., considerably smaller than the \"obvious\" estimate n[!] mentioned earlier.)","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"\"A Certain Zero-Sum Two-Person Game Equivalent to the Optimal Assignment Problem,\" in H. W. Kuhn and A. W. Tucker (eds.), Contributions to the Theory of Games, Volume II, Annals of Mathematics Studies 28 (Princeton University Press, 1953), pp. 5–12","locus":"p. 5, parenthesis","date":"26 October 1951","url":"https://archive.org/details/dli.ernet.90090"},"restored":"[Cf.: \"Contributions to the Theory of Games,\" Annals of Mathematics Studies, No. 24, Princeton University Press, 1950 -- pp. 75-79, especially § 5.]","themes":["machines"],"years":[1951],"embed_text":"John von Neumann | \"A Certain Zero-Sum Two-Person Game Equivalent to the Optimal Assignment Problem,\" in H. W. Kuhn and A. W. Tucker (eds.), Contributions to the Theory of Games, Volume II, Annals of Mathematics Studies 28 (Princeton University Press, 1953), pp. 5–12 | p. 5, parenthesis | 26 October 1951 | (The game matrix for this game will be 2n x n². From this it is not difficult to infer how many steps are needed to get significant approximate solutions with the method of G. W. Brown and J. von Neumann. … It turns out that this number is a moderate power of n, i.e., considerably smaller than the \"obvious\" estimate n[!] mentioned earlier.) | [Cf.: \"Contributions to the Theory of Games,\" Annals of Mathematics Studies, No. 24, Princeton University Press, 1950 -- pp. 75-79, especially § 5.]"},{"id":"q-john-von-neumann-the-general-and-logi-5d3ad054","quote":"All of this re-emphasizes the conclusion that was indicated earlier, that a detailed, highly mathematical, and more specifically analytical, theory of automata and of information is needed.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"\"The General and Logical Theory of Automata,\" in Cerebral Mechanisms in Behavior: The Hixon Symposium (New York: Wiley, 1951); Collected Works Vol. V","locus":"Collected Works Vol. V, p.305-306","date":"1948 (Hixon Symposium); published 1951","url":"https://www.cs.unm.edu/~eschulte/classes/cs591-rpc/data/vonneumann1951-glta.pdf"},"restored":"","themes":["macy"],"years":[1948,1951],"embed_text":"John von Neumann | \"The General and Logical Theory of Automata,\" in Cerebral Mechanisms in Behavior: The Hixon Symposium (New York: Wiley, 1951); Collected Works Vol. V | Collected Works Vol. V, p.305-306 | 1948 (Hixon Symposium); published 1951 | All of this re-emphasizes the conclusion that was indicated earlier, that a detailed, highly mathematical, and more specifically analytical, theory of automata and of information is needed."},{"id":"q-john-von-neumann-the-general-and-logi-23b046f6","quote":"You can increase the safety from error by a reduction of the efficiency of the notation, or, to say it positively, by allowing redundancy of notation. Obviously, the simplest form of achieving safety by redundancy is to use the, per se, quite unsafe digital expansion notation, but to repeat every such message several times. In the case under discussion, nature has obviously resorted to an even more redundant and even safer system.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"\"The General and Logical Theory of Automata,\" in L. A. Jeffress (ed.), Cerebral Mechanisms in Behavior: The Hixon Symposium (New York: Wiley, 1951); paginated here per John von Neumann, Collected Works, Vol. V, ed. A. H. Taub (Macmillan/Pergamon)","locus":"Collected Works Vol. V, pp.308-309","date":"1948 (Hixon Symposium); published 1951","url":"https://www.cs.unm.edu/~eschulte/classes/cs591-rpc/data/vonneumann1951-glta.pdf"},"restored":"","themes":["macy"],"years":[1948,1951],"embed_text":"John von Neumann | \"The General and Logical Theory of Automata,\" in L. A. Jeffress (ed.), Cerebral Mechanisms in Behavior: The Hixon Symposium (New York: Wiley, 1951); paginated here per John von Neumann, Collected Works, Vol. V, ed. A. H. Taub (Macmillan/Pergamon) | Collected Works Vol. V, pp.308-309 | 1948 (Hixon Symposium); published 1951 | You can increase the safety from error by a reduction of the efficiency of the notation, or, to say it positively, by allowing redundancy of notation. Obviously, the simplest form of achieving safety by redundancy is to use the, per se, quite unsafe digital expansion notation, but to repeat every such message several times. In the case under discussion, nature has obviously resorted to an even more redundant and even safer system."},{"id":"q-john-von-neumann-cybernetics-the-macy-4a1e132b","quote":"It is very plausible, indeed, that the underlying mechanism of the nervous system may be best, although somewhat loosely, described as an analogical mechanism. An example from a different field which, however, should not be taken as implying too close a comparison, is this: an electrical computing machine is based on an electric current, which is an analogical concept. ... It seems to me that we do not know at this moment to what extent coded messages are used in the nervous system.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"Cybernetics: The Macy Conferences 1946–1953: The Complete Transactions (Transactions of the Seventh Conference, session 'Digital Notions in the Central Nervous System')","locus":"pp. 176–177 (bracketed reprint pagination [20]–[21])","date":"23–24 March 1950","url":"https://hostb.org/5Z8/Pias,%20Claus%20ed.%20-%20Cybernetics%20The%20Macy%20Conferences%201946-1953%20I%202003.pdf"},"restored":"","themes":["machines"],"years":[1950],"embed_text":"John von Neumann | Cybernetics: The Macy Conferences 1946–1953: The Complete Transactions (Transactions of the Seventh Conference, session 'Digital Notions in the Central Nervous System') | pp. 176–177 (bracketed reprint pagination [20]–[21]) | 23–24 March 1950 | It is very plausible, indeed, that the underlying mechanism of the nervous system may be best, although somewhat loosely, described as an analogical mechanism. An example from a different field which, however, should not be taken as implying too close a comparison, is this: an electrical computing machine is based on an electric current, which is an analogical concept. ... It seems to me that we do not know at this moment to what extent coded messages are used in the nervous system."},{"id":"q-john-von-neumann-discussion-following-8c90fabe","quote":"For neural messages transmitted by sequences of impulses, as far as we can localize the state of the transmitted information at all, it is encoded in the time rate of these impulses. If this is all there is to it, then it is a very imperfect digital system. As far as I know, however, nobody has so far investigated the next plausible vehicle of information: the correlations and time relationships that may exist between trains of impulses that pass through several neural channels concurrently.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"Von Neumann"},"source":{"work":"Discussion following Gerard, \"Some of the Problems Concerning Digital Notions in the Central Nervous System,\" Transactions of the Seventh Conference on Cybernetics (1951); reprinted in Pias (ed.), The Complete Transactions (diaphanes, 2003/2016)","locus":"original Transactions pagination p.20-21; Pias Complete Transactions p.177","date":"1950-03-23","url":"https://hostb.org/116X/Cybernetics.%20The%20Macy%20Conferences%201946-1953.%20The%20Complete%20Transactions%202016.pdf"},"restored":"","themes":["macy"],"years":[1950],"embed_text":"John von Neumann | Discussion following Gerard, \"Some of the Problems Concerning Digital Notions in the Central Nervous System,\" Transactions of the Seventh Conference on Cybernetics (1951); reprinted in Pias (ed.), The Complete Transactions (diaphanes, 2003/2016) | original Transactions pagination p.20-21; Pias Complete Transactions p.177 | 1950-03-23 | For neural messages transmitted by sequences of impulses, as far as we can localize the state of the transmitted information at all, it is encoded in the time rate of these impulses. If this is all there is to it, then it is a very imperfect digital system. As far as I know, however, nobody has so far investigated the next plausible vehicle of information: the correlations and time relationships that may exist between trains of impulses that pass through several neural channels concurrently."},{"id":"q-john-von-neumann-discussion-following-30c50638","quote":"I should like to submit that the following is an acceptable equivalent of what you are saying: There has been a strong temptation to view the neuron as an elementary unit, in the sense in which computing elements, such as electromechanical relays or vacuum tubes, are being used within a computing machine. The entire behavior of a neuron can then be described by a few simple rules regulating the relationship between a moderate number of input and output stimuli. The available evidence, however, is not in favor of this.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"Von Neumann"},"source":{"work":"Discussion following Gerard, \"Some of the Problems Concerning Digital Notions in the Central Nervous System,\" Transactions of the Seventh Conference on Cybernetics (1951); reprinted in Pias (ed.), The Complete Transactions (diaphanes, 2003/2016)","locus":"original Transactions pagination p.23; Pias Complete Transactions p.178-179","date":"1950-03-23","url":"https://hostb.org/116X/Cybernetics.%20The%20Macy%20Conferences%201946-1953.%20The%20Complete%20Transactions%202016.pdf"},"restored":"","themes":["macy"],"years":[1950],"embed_text":"John von Neumann | Discussion following Gerard, \"Some of the Problems Concerning Digital Notions in the Central Nervous System,\" Transactions of the Seventh Conference on Cybernetics (1951); reprinted in Pias (ed.), The Complete Transactions (diaphanes, 2003/2016) | original Transactions pagination p.23; Pias Complete Transactions p.178-179 | 1950-03-23 | I should like to submit that the following is an acceptable equivalent of what you are saying: There has been a strong temptation to view the neuron as an elementary unit, in the sense in which computing elements, such as electromechanical relays or vacuum tubes, are being used within a computing machine. The entire behavior of a neuron can then be described by a few simple rules regulating the relationship between a moderate number of input and output stimuli. The available evidence, however, is not in favor of this."},{"id":"q-john-von-neumann-discussion-following-4963fa7b","quote":"I should like to formulate a »caveat.« I certainly agree with the ideas that Professor Gerard expressed, but there seems to me to be a need of circumscribing some of the terms more precisely. It is very plausible, indeed, that the underlying mechanism of the nervous system may be best, although somewhat loosely, described as an analogical mechanism.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"Von Neumann"},"source":{"work":"Discussion following Ralph W. Gerard, \"Some of the Problems Concerning Digital Notions in the Central Nervous System,\" Transactions of the Seventh Conference on Cybernetics (1951); reprinted in Pias (ed.), The Complete Transactions (diaphanes, 2003/2016)","locus":"original Transactions pagination p.19-20; Pias Complete Transactions p.176-177","date":"1950-03-23","url":"https://hostb.org/116X/Cybernetics.%20The%20Macy%20Conferences%201946-1953.%20The%20Complete%20Transactions%202016.pdf"},"restored":"","themes":["macy"],"years":[1950],"embed_text":"John von Neumann | Discussion following Ralph W. Gerard, \"Some of the Problems Concerning Digital Notions in the Central Nervous System,\" Transactions of the Seventh Conference on Cybernetics (1951); reprinted in Pias (ed.), The Complete Transactions (diaphanes, 2003/2016) | original Transactions pagination p.19-20; Pias Complete Transactions p.176-177 | 1950-03-23 | I should like to formulate a »caveat.« I certainly agree with the ideas that Professor Gerard expressed, but there seems to me to be a need of circumscribing some of the terms more precisely. It is very plausible, indeed, that the underlying mechanism of the nervous system may be best, although somewhat loosely, described as an analogical mechanism."},{"id":"q-john-von-neumann-first-draft-of-a-rep-d2844b0b","quote":"It is worth mentioning, that the neurons of the higher animals are definitely elements in the above sense. They have all-or-none character, that is two states: Quiescent and excited. ... Following W.S. MacCulloch and W. Pitts (\"A logical calculus of the ideas immanent in nervous activity,\" Bull. Math. Biophysics, Vol. 5 (1943), pp. 115–133) we ignore the more complicated aspects of neuron functioning: Thresholds, temporal summation, relative inhibition, changes of the threshold by after-effects of stimulation beyond the synaptic delay, etc. It is, however, convenient to consider occasionally neurons with fixed thresholds 2 and 3, that is, neurons which can be excited only by (simultaneous) stimuli on 2 or 3 excitatory synapses (and none on an inhibitory synapse).","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"First Draft of a Report on the EDVAC","locus":"section 4.2","date":"30 June 1945","url":"https://fab.cba.mit.edu/classes/862.16/notes/computation/vonNeumann-1945.pdf"},"restored":"","themes":["vncodes"],"years":[1945],"embed_text":"John von Neumann | First Draft of a Report on the EDVAC | section 4.2 | 30 June 1945 | It is worth mentioning, that the neurons of the higher animals are definitely elements in the above sense. They have all-or-none character, that is two states: Quiescent and excited. ... Following W.S. MacCulloch and W. Pitts (\"A logical calculus of the ideas immanent in nervous activity,\" Bull. Math. Biophysics, Vol. 5 (1943), pp. 115–133) we ignore the more complicated aspects of neuron functioning: Thresholds, temporal summation, relative inhibition, changes of the threshold by after-effects of stimulation beyond the synaptic delay, etc. It is, however, convenient to consider occasionally neurons with fixed thresholds 2 and 3, that is, neurons which can be excited only by (simultaneous) stimuli on 2 or 3 excitatory synapses (and none on an inhibitory synapse)."},{"id":"q-john-von-neumann-first-draft-of-a-rep-c1f1bd10","quote":"Since we have a strict synchronism of stimuli arriving only at times which are integer multiples of τ, we may disregard phenomena of tiring, facilitation, etc. We also disregard relative inhibition, temporal summation of stimuli, changes of threshold, changes of synapses, etc. In all this we are following the procedure of W.J. MacCulloch and W. Pitts (cf. loc. cit. 4.2). We will also use E-elements with double synaptic delay 2τ...","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"First Draft of a Report on the EDVAC","locus":"section 6.4","date":"30 June 1945","url":"https://fab.cba.mit.edu/classes/862.16/notes/computation/vonNeumann-1945.pdf"},"restored":"","themes":["vncodes"],"years":[1945],"embed_text":"John von Neumann | First Draft of a Report on the EDVAC | section 6.4 | 30 June 1945 | Since we have a strict synchronism of stimuli arriving only at times which are integer multiples of τ, we may disregard phenomena of tiring, facilitation, etc. We also disregard relative inhibition, temporal summation of stimuli, changes of threshold, changes of synapses, etc. In all this we are following the procedure of W.J. MacCulloch and W. Pitts (cf. loc. cit. 4.2). We will also use E-elements with double synaptic delay 2τ..."},{"id":"q-john-von-neumann-letter-to-erwin-schr-fc36702c","quote":"I cannot accept your section 4. completely. I think that the difficulties you hint at are “pseudo-problems”. The “action at distance” in the case under consideration says only that even if there is no dynamical interaction between two systems (e.g. because they are far removed from each other), the systems can display statistical correlations. This is not at all specific for quantum mechanics, it happens classically as well.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"Letter to Erwin Schrödinger, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (AMS/LMS, 2005)","locus":"pp. 211-213; quoted in Rédei’s introductory commentary §5.3","date":"11 April 1936","file":"02_VON_NEUMANN/letters_to_godel/IntroComments_05_Quantum_Mechanics.md"},"restored":"","themes":["letters"],"years":[1936],"embed_text":"John von Neumann | Letter to Erwin Schrödinger, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (AMS/LMS, 2005) | pp. 211-213; quoted in Rédei’s introductory commentary §5.3 | 11 April 1936 | I cannot accept your section 4. completely. I think that the difficulties you hint at are “pseudo-problems”. The “action at distance” in the case under consideration says only that even if there is no dynamical interaction between two systems (e.g. because they are far removed from each other), the systems can display statistical correlations. This is not at all specific for quantum mechanics, it happens classically as well."},{"id":"q-john-von-neumann-letter-to-erwin-schr-8e37c704","quote":"And of course quantum electrodynamics proves that quantum mechanics and the special theory of relativity are compatible “philosophically” -- quantum electrodynamic fails only because of the concrete form of Maxwell’s equations in the vicinity of a charge.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"Letter to Erwin Schrödinger, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (AMS/LMS, 2005)","locus":"pp. 211-213; quoted in Rédei’s introductory commentary §5.4","date":"11 April 1936","file":"02_VON_NEUMANN/letters_to_godel/IntroComments_05_Quantum_Mechanics.md"},"restored":"","themes":["physics-and-continuum"],"years":[1936],"embed_text":"John von Neumann | Letter to Erwin Schrödinger, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (AMS/LMS, 2005) | pp. 211-213; quoted in Rédei’s introductory commentary §5.4 | 11 April 1936 | And of course quantum electrodynamics proves that quantum mechanics and the special theory of relativity are compatible “philosophically” -- quantum electrodynamic fails only because of the concrete form of Maxwell’s equations in the vicinity of a charge."},{"id":"q-john-von-neumann-letter-to-garrett-bi-e517103f","quote":"I would like to make a confession which may seem immoral: I do not believe absolutely in Hilbert space any more. After all, Hilbert space (as far as quantum mechanical things are concerned) was obtained by generalizing Euclidean space, based on the principle of ‘conserving the validity of all formal rules’ … Now we begin to believe that it is not the vectors that matter, but the lattice of all linear (closed) subspaces. Because: 1) The vectors ought to represent the physical states, but they do so redundantly, up to a complex factor, only 2) and besides, the states are merely a derived notion, the primitive (phenomenologically given) notion being the qualities which correspond to the linear closed subspaces.","speaker":{"name":"John von Neumann","role":"reported","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"Letter to Garrett Birkhoff, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (AMS/LMS, 2005); quoted in Miklós Rédei, “Why John von Neumann did not like the Hilbert space formalism of quantum mechanics (and what he liked instead),” Studies in History and Philosophy of Modern Physics 27 no. 4 (1996), pp. 493–510","locus":"p. 59; quoted at Rédei 1996, p. 493","date":"13 November 1935"},"restored":"","themes":["physics-and-continuum"],"years":[1935],"embed_text":"John von Neumann | Letter to Garrett Birkhoff, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (AMS/LMS, 2005); quoted in Miklós Rédei, “Why John von Neumann did not like the Hilbert space formalism of quantum mechanics (and what he liked instead),” Studies in History and Philosophy of Modern Physics 27 no. 4 (1996), pp. 493–510 | p. 59; quoted at Rédei 1996, p. 493 | 13 November 1935 | I would like to make a confession which may seem immoral: I do not believe absolutely in Hilbert space any more. After all, Hilbert space (as far as quantum mechanical things are concerned) was obtained by generalizing Euclidean space, based on the principle of ‘conserving the validity of all formal rules’ … Now we begin to believe that it is not the vectors that matter, but the lattice of all linear (closed) subspaces. Because: 1) The vectors ought to represent the physical states, but they do so redundantly, up to a complex factor, only 2) and besides, the states are merely a derived notion, the primitive (phenomenologically given) notion being the qualities which correspond to the linear closed subspaces."},{"id":"q-john-von-neumann-letter-to-kurt-godel-9e3b97a1","quote":"Übrigens habe ich (mir) neulich eine Methode überlegt, die bei Aussagen, die allein mit Hilfe der Begriffe „nein“, „oder“ (also auch „und“, „folgt“, u.s.w.), „Beweisbar“ aufgebaut sind (etwa von der identischen Wahrheit ausgehend) — die Widerspruch[s]freiheit ist z. B. eine solche Aussage), stets eine endliche Entscheidung der effektiven Beweisbarkeitsfrage ermöglicht. (Natürlich unter Voraussetzung der ω-Widerspruch[s]freiheit.) Vielleicht, interessiert es Sie, oder Sie haben noch nicht daran gedacht, dann kann ich es aufschreiben.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"Letter to Kurt Gödel (German original), in Kurt Gödel, Collected Works, Vol. V: Correspondence H–Z (Oxford, 2003), pp. 340–345","locus":"p. 340, first paragraph","date":"12 January 1931","file":"02_VON_NEUMANN/letters_to_godel/Letter3_Jan12_1931.md","url":"https://archive.org/details/kurt-godel-solomon-feferman-collected-works.-vol.-5.-correspondence-h-z"},"restored":"","themes":["letters"],"years":[1931],"embed_text":"John von Neumann | Letter to Kurt Gödel (German original), in Kurt Gödel, Collected Works, Vol. V: Correspondence H–Z (Oxford, 2003), pp. 340–345 | p. 340, first paragraph | 12 January 1931 | Übrigens habe ich (mir) neulich eine Methode überlegt, die bei Aussagen, die allein mit Hilfe der Begriffe „nein“, „oder“ (also auch „und“, „folgt“, u.s.w.), „Beweisbar“ aufgebaut sind (etwa von der identischen Wahrheit ausgehend) — die Widerspruch[s]freiheit ist z. B. eine solche Aussage), stets eine endliche Entscheidung der effektiven Beweisbarkeitsfrage ermöglicht. (Natürlich unter Voraussetzung der ω-Widerspruch[s]freiheit.) Vielleicht, interessiert es Sie, oder Sie haben noch nicht daran gedacht, dann kann ich es aufschreiben."},{"id":"q-john-von-neumann-letter-to-kurt-godel-920a6921","quote":"Aber es steht doch fest, dass keine einzige solche Konstruktion der genannten Art bekannt ist, die nicht in A formalisierbar ist, und das[s] kein lebender Logiker in der Lage ist, eine solche anzugeben? Oder irre ich, und kennen Sie eine (effektive) intuitionistische arithmetische Konstruktion, deren Formalisierung in A Schwierigkeiten macht? Und sollte dies, zu meiner grössten Überraschung, der Fall sein, so geht doch sicher die Formalisierung in M oder in Z!","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"Letter to Kurt Gödel (German original), in Kurt Gödel, Collected Works, Vol. V: Correspondence H–Z (Oxford, 2003), pp. 340–345","locus":"p. 342","date":"12 January 1931","file":"02_VON_NEUMANN/letters_to_godel/Letter3_Jan12_1931.md","url":"https://archive.org/details/kurt-godel-solomon-feferman-collected-works.-vol.-5.-correspondence-h-z"},"restored":"","themes":["letters"],"years":[1931],"embed_text":"John von Neumann | Letter to Kurt Gödel (German original), in Kurt Gödel, Collected Works, Vol. V: Correspondence H–Z (Oxford, 2003), pp. 340–345 | p. 342 | 12 January 1931 | Aber es steht doch fest, dass keine einzige solche Konstruktion der genannten Art bekannt ist, die nicht in A formalisierbar ist, und das[s] kein lebender Logiker in der Lage ist, eine solche anzugeben? Oder irre ich, und kennen Sie eine (effektive) intuitionistische arithmetische Konstruktion, deren Formalisierung in A Schwierigkeiten macht? Und sollte dies, zu meiner grössten Überraschung, der Fall sein, so geht doch sicher die Formalisierung in M oder in Z!"},{"id":"q-john-von-neumann-letter-to-kurt-godel-d5e98d62","quote":"Incidentally, the other day I developed a method that always allows a finite decision for the effective provability question concerning propositions that are built up solely by means of the concepts “not”, “or” (thus also “and”, “follows”, etc.), [and] “provable” (starting from the identical truth-consistency is for example such a proposition). Perhaps, if it interests you, or you have not yet thought of it, then I can write it up.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"Letter to Kurt Gödel, trans. W. Sieg, in Kurt Gödel, Collected Works, Vol. V","locus":"Berlin","date":"12 January 1931","file":"02_VON_NEUMANN/letters_to_godel/Letter3_Jan12_1931.md"},"restored":"","themes":["letters"],"years":[1931],"embed_text":"John von Neumann | Letter to Kurt Gödel, trans. W. Sieg, in Kurt Gödel, Collected Works, Vol. V | Berlin | 12 January 1931 | Incidentally, the other day I developed a method that always allows a finite decision for the effective provability question concerning propositions that are built up solely by means of the concepts “not”, “or” (thus also “and”, “follows”, etc.), [and] “provable” (starting from the identical truth-consistency is for example such a proposition). Perhaps, if it interests you, or you have not yet thought of it, then I can write it up."},{"id":"q-john-von-neumann-letter-to-kurt-godel-74e2e82d","quote":"I absolutely disagree with your view on the formalizability of intuitionism. Certainly, for every formal system there is, as you proved, another formal one that is (already in arithmetic and the lower functional calculus) stronger. But intuitionism is not affected by that at all.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"Letter to Kurt Gödel, trans. W. Sieg, in Kurt Gödel, Collected Works, Vol. V","locus":"Berlin","date":"12 January 1931","file":"02_VON_NEUMANN/letters_to_godel/Letter3_Jan12_1931.md"},"restored":"","themes":["letters"],"years":[1931],"embed_text":"John von Neumann | Letter to Kurt Gödel, trans. W. Sieg, in Kurt Gödel, Collected Works, Vol. V | Berlin | 12 January 1931 | I absolutely disagree with your view on the formalizability of intuitionism. Certainly, for every formal system there is, as you proved, another formal one that is (already in arithmetic and the lower functional calculus) stronger. But intuitionism is not affected by that at all."},{"id":"q-john-von-neumann-letter-to-kurt-godel-c728d551","quote":"Clearly I cannot prove that every intuitionistically correct construction of arithmetic is formalizable in A or M or even in Z -- for intuitionism is undefined and undefinable. But is it not a fact, that not a single construction of the kind mentioned is known that cannot be formalized in A, and that no living logician is in the position of naming such [a construction]? Or am I wrong, and you know an effective intuitionistic arithmetic construction whose formalization in A creates difficulties? If that, to my utmost surprise, should be the case, then the formalization should certainly work in M or Z!","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"Letter to Kurt Gödel, trans. W. Sieg, in Kurt Gödel, Collected Works, Vol. V","locus":"Berlin","date":"12 January 1931","file":"02_VON_NEUMANN/letters_to_godel/Letter3_Jan12_1931.md"},"restored":"","themes":["letters"],"years":[1931],"embed_text":"John von Neumann | Letter to Kurt Gödel, trans. W. Sieg, in Kurt Gödel, Collected Works, Vol. V | Berlin | 12 January 1931 | Clearly I cannot prove that every intuitionistically correct construction of arithmetic is formalizable in A or M or even in Z -- for intuitionism is undefined and undefinable. But is it not a fact, that not a single construction of the kind mentioned is known that cannot be formalized in A, and that no living logician is in the position of naming such [a construction]? Or am I wrong, and you know an effective intuitionistic arithmetic construction whose formalization in A creates difficulties? If that, to my utmost surprise, should be the case, then the formalization should certainly work in M or Z!"},{"id":"q-john-von-neumann-letter-to-norbert-wi-f4d61bc1","quote":"I need not tell you how much I regret that this means that I cannot join you at Tech, especially since I am sure that without the decisive encouragement that I received from you and from the Tech authorities I would have hardly had the perseverance and the strength of conviction which are the minimum requirements in this project. On the other hand, I hope that we shall work together in the field just the same.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"Letter to Norbert Wiener, 20 November 1945, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (Providence: American Mathematical Society; London Mathematical Society, 2005), \"Letters to N. Wiener\"","locus":"p.277","date":"20 November 1945","file":"02_VON_NEUMANN/von_Neumann_Selected_Letters.pdf"},"restored":"","themes":["cybernetics"],"years":[1945],"embed_text":"John von Neumann | Letter to Norbert Wiener, 20 November 1945, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (Providence: American Mathematical Society; London Mathematical Society, 2005), \"Letters to N. Wiener\" | p.277 | 20 November 1945 | I need not tell you how much I regret that this means that I cannot join you at Tech, especially since I am sure that without the decisive encouragement that I received from you and from the Tech authorities I would have hardly had the perseverance and the strength of conviction which are the minimum requirements in this project. On the other hand, I hope that we shall work together in the field just the same."},{"id":"q-john-von-neumann-letter-to-norbert-wi-e6a7b99d","quote":"Our thoughts - I mean yours and Pitts' and mine - were so far mainly focused on the subject of neurology, and more specifically on the human nervous system, and there primarily on the central nervous system. Thus, in trying to understand the function of automata and the general principles governing them, we selected for prompt action the most complicated object under the sun - literally.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"Letter to Norbert Wiener, 29 November 1946, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (Providence: American Mathematical Society; London Mathematical Society, 2005), \"Letters to N. Wiener\"","locus":"p.278","date":"29 November 1946","file":"02_VON_NEUMANN/von_Neumann_Selected_Letters.pdf"},"restored":"","themes":["cybernetics"],"years":[1946],"embed_text":"John von Neumann | Letter to Norbert Wiener, 29 November 1946, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (Providence: American Mathematical Society; London Mathematical Society, 2005), \"Letters to N. Wiener\" | p.278 | 29 November 1946 | Our thoughts - I mean yours and Pitts' and mine - were so far mainly focused on the subject of neurology, and more specifically on the human nervous system, and there primarily on the central nervous system. Thus, in trying to understand the function of automata and the general principles governing them, we selected for prompt action the most complicated object under the sun - literally."},{"id":"q-john-von-neumann-letter-to-norbert-wi-c9814858","quote":"Besides the system is not even purely digital (i.e. neural): It is intimately connected to a very complex analogy (i.e. humoral or hormonal) system, and, almost every feedback loop goes through both sectors, if not through the \"outside\" world (i.e. the world outside the epidermis or within the digestive system) as well.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"Letter to Norbert Wiener, 29 November 1946, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (Providence: American Mathematical Society; London Mathematical Society, 2005), \"Letters to N. Wiener\"","locus":"p.279","date":"29 November 1946","file":"02_VON_NEUMANN/von_Neumann_Selected_Letters.pdf"},"restored":"","themes":["cybernetics"],"years":[1946],"embed_text":"John von Neumann | Letter to Norbert Wiener, 29 November 1946, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (Providence: American Mathematical Society; London Mathematical Society, 2005), \"Letters to N. Wiener\" | p.279 | 29 November 1946 | Besides the system is not even purely digital (i.e. neural): It is intimately connected to a very complex analogy (i.e. humoral or hormonal) system, and, almost every feedback loop goes through both sectors, if not through the \"outside\" world (i.e. the world outside the epidermis or within the digestive system) as well."},{"id":"q-john-von-neumann-letter-to-norbert-wi-540fa24a","quote":"I feel that we have to turn to simpler systems.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"Letter to Norbert Wiener, 29 November 1946, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (Providence: American Mathematical Society; London Mathematical Society, 2005), \"Letters to N. Wiener\"","locus":"p.279","date":"29 November 1946","file":"02_VON_NEUMANN/von_Neumann_Selected_Letters.pdf"},"restored":"","themes":["cybernetics"],"years":[1946],"embed_text":"John von Neumann | Letter to Norbert Wiener, 29 November 1946, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (Providence: American Mathematical Society; London Mathematical Society, 2005), \"Letters to N. Wiener\" | p.279 | 29 November 1946 | I feel that we have to turn to simpler systems."},{"id":"q-john-von-neumann-letter-to-norbert-wi-b8f80b2a","quote":"Now the less-than-cellular organisms of the virus or bacteriophage type do possess the decisive traits of any living organism: They are self-reproductive and they are able to orient themselves in an unorganized milieu, to move towards food, to appropriate it and to use it. Consequently a \"true\" understanding of these organisms may be the first relevant step forward and possibly the greatest step that may at all be required.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"Letter to Norbert Wiener, 29 November 1946, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (Providence: American Mathematical Society; London Mathematical Society, 2005), \"Letters to N. Wiener\"","locus":"p.280","date":"29 November 1946","file":"02_VON_NEUMANN/von_Neumann_Selected_Letters.pdf"},"restored":"","themes":["cybernetics"],"years":[1946],"embed_text":"John von Neumann | Letter to Norbert Wiener, 29 November 1946, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (Providence: American Mathematical Society; London Mathematical Society, 2005), \"Letters to N. Wiener\" | p.280 | 29 November 1946 | Now the less-than-cellular organisms of the virus or bacteriophage type do possess the decisive traits of any living organism: They are self-reproductive and they are able to orient themselves in an unorganized milieu, to move towards food, to appropriate it and to use it. Consequently a \"true\" understanding of these organisms may be the first relevant step forward and possibly the greatest step that may at all be required."},{"id":"q-john-von-neumann-letter-to-norbert-wi-6e4863d7","quote":"I would, however, put on \"true\" understanding the most stringent interpretation possible: That is, understanding the organism in the exacting sense in which one may want to understand a detailed drawing of a machine - i.e. finding out where every individual nut and bolt is located, etc.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"Letter to Norbert Wiener, 29 November 1946, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (Providence: American Mathematical Society; London Mathematical Society, 2005), \"Letters to N. Wiener\"","locus":"p.280","date":"29 November 1946","file":"02_VON_NEUMANN/von_Neumann_Selected_Letters.pdf"},"restored":"","themes":["cybernetics"],"years":[1946],"embed_text":"John von Neumann | Letter to Norbert Wiener, 29 November 1946, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (Providence: American Mathematical Society; London Mathematical Society, 2005), \"Letters to N. Wiener\" | p.280 | 29 November 1946 | I would, however, put on \"true\" understanding the most stringent interpretation possible: That is, understanding the organism in the exacting sense in which one may want to understand a detailed drawing of a machine - i.e. finding out where every individual nut and bolt is located, etc."},{"id":"q-john-von-neumann-letter-to-norbert-wi-3dc43931","quote":"I hope you will not misinterpret the anti-neurological tirade at the beginning of this letter. Of course I am greatly interested in that approach and I have the greatest respect for the important results that have been obtained in that field, and in our border area with it. I certainly hope that these efforts will continue.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"Letter to Norbert Wiener, 29 November 1946, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (Providence: American Mathematical Society; London Mathematical Society, 2005), \"Letters to N. Wiener\"","locus":"p.282","date":"29 November 1946","file":"02_VON_NEUMANN/von_Neumann_Selected_Letters.pdf"},"restored":"","themes":["cybernetics"],"years":[1946],"embed_text":"John von Neumann | Letter to Norbert Wiener, 29 November 1946, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (Providence: American Mathematical Society; London Mathematical Society, 2005), \"Letters to N. Wiener\" | p.282 | 29 November 1946 | I hope you will not misinterpret the anti-neurological tirade at the beginning of this letter. Of course I am greatly interested in that approach and I have the greatest respect for the important results that have been obtained in that field, and in our border area with it. I certainly hope that these efforts will continue."},{"id":"q-john-von-neumann-letter-to-p-a-m-dira-ad76c57e","quote":"It should be perhaps desirable, to have operators X, Y, Z which have discrete (point) spectra, in order to avoid the difficulties connected with the point electron (in electrodynamics).","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"Letter to P. A. M. Dirac, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (AMS/LMS, 2005)","locus":"quoted in Rédei’s introductory commentary §5.4","date":"27 January 1934","file":"02_VON_NEUMANN/letters_to_godel/IntroComments_05_Quantum_Mechanics.md"},"restored":"","themes":["physics-and-continuum"],"years":[1934],"embed_text":"John von Neumann | Letter to P. A. M. Dirac, in John von Neumann: Selected Letters, ed. Miklós Rédei, History of Mathematics vol. 27 (AMS/LMS, 2005) | quoted in Rédei’s introductory commentary §5.4 | 27 January 1934 | It should be perhaps desirable, to have operators X, Y, Z which have discrete (point) spectra, in order to avoid the difficulties connected with the point electron (in electrodynamics)."},{"id":"q-john-von-neumann-the-computer-and-the-b7b5a9b8","quote":"Lastly, my main aim is actually to bring out a rather different aspect of the matter. I suspect that a deeper mathematical study of the nervous system… will affect our understanding of the aspects of mathematics itself that are involved. In fact, it may alter the way in which we look on mathematics and logics proper. I will try to explain my reasons for this belief later.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"The Computer and the Brain","locus":"Introduction, p. 2","date":"written 1955–56; published posthumously 1958"},"restored":"—‘mathematical’ in the sense outlined above—","themes":["brain-and-machine"],"years":[1955,1958],"embed_text":"John von Neumann | The Computer and the Brain | Introduction, p. 2 | written 1955–56; published posthumously 1958 | Lastly, my main aim is actually to bring out a rather different aspect of the matter. I suspect that a deeper mathematical study of the nervous system… will affect our understanding of the aspects of mathematics itself that are involved. In fact, it may alter the way in which we look on mathematics and logics proper. I will try to explain my reasons for this belief later. | —‘mathematical’ in the sense outlined above—"},{"id":"q-john-von-neumann-the-computer-and-the-1fedd38b","quote":"We do most emphatically not know what type of physical entities are the basic components for the memory in question.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"The Computer and the Brain","locus":"p. 68","date":"written 1955–56; published posthumously 1958"},"restored":"","themes":["brain-and-machine"],"years":[1955,1958],"embed_text":"John von Neumann | The Computer and the Brain | p. 68 | written 1955–56; published posthumously 1958 | We do most emphatically not know what type of physical entities are the basic components for the memory in question."},{"id":"q-john-von-neumann-the-computer-and-the-8b4e3802","quote":"This conclusion was well worth working out just because of, rather than in spite of, its absolute implausibility.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"The Computer and the Brain","locus":"p. 77","date":"written 1955–56; published posthumously 1958"},"restored":"","themes":["brain-and-machine"],"years":[1955,1958],"embed_text":"John von Neumann | The Computer and the Brain | p. 77 | written 1955–56; published posthumously 1958 | This conclusion was well worth working out just because of, rather than in spite of, its absolute implausibility."},{"id":"q-john-von-neumann-the-computer-and-the-a4765fe0","quote":"We have seen how this leads to a lower level of arithmetical precision but to a higher level of logical reliability: a deterioration in arithmetics has been traded for an improvement in logics.","speaker":{"name":"John von Neumann","role":"author","sort":"von neumann, john","as_given":"John von Neumann"},"source":{"work":"The Computer and the Brain","locus":"p. 80","da
